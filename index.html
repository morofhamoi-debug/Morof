{"imports":{

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || innerWidth < 800;

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// ---------- Scene / Camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020206);
scene.fog = new THREE.FogExp2(0x020206, 0.055);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 80);
camera.rotation.order = 'YXZ';
scene.add(camera);

// ---------- Procedural textures ----------
function noiseTex(size, hex, variation, stains=0){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');const base=new THREE.Color(hex);
  const img=x.createImageData(size,size);
  for(let i=0;i<size*size;i++){
    const n=(Math.random()-0.5)*variation;
    img.data[i*4]  =Math.max(0,Math.min(255,(base.r+n)*255));
    img.data[i*4+1]=Math.max(0,Math.min(255,(base.g+n)*255));
    img.data[i*4+2]=Math.max(0,Math.min(255,(base.b+n)*255));
    img.data[i*4+3]=255;
  }
  x.putImageData(img,0,0);
  for(let s=0;s<stains;s++){
    const px=Math.random()*size, py=Math.random()*size, r=30+Math.random()*90;
    const g=x.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,`rgba(0,0,0,${0.08+Math.random()*0.22})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;
  return t;
}
function woodTex(){
  const s=512,c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d');
  x.fillStyle='#1c120a';x.fillRect(0,0,s,s);
  const ph=44;
  for(let y=0;y<s;y+=ph){
    const sh=0.6+Math.random()*0.5;
    x.fillStyle=`rgb(${(46*sh)|0},${(30*sh)|0},${(16*sh)|0})`;
    x.fillRect(0,y,s,ph);
    for(let g=0;g<26;g++){
      const gy=y+Math.random()*ph;
      x.strokeStyle=`rgba(0,0,0,${0.04+Math.random()*0.14})`;
      x.lineWidth=0.4+Math.random();
      x.beginPath();x.moveTo(0,gy);
      for(let px=0;px<=s;px+=18) x.lineTo(px,gy+(Math.random()-0.5)*3);
      x.stroke();
    }
    x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,y+ph-1,s,1);
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;
}

const wallTex = noiseTex(512, 0x4d4740, 0.055, 14);
const baseTex = noiseTex(512, 0x22222a, 0.09, 26);

const wallMat = new THREE.MeshStandardMaterial({map:wallTex, roughness:0.95, metalness:0});
const floorMat = new THREE.MeshStandardMaterial({map:woodTex(), roughness:0.82, metalness:0, side:THREE.DoubleSide});
const ceilMat  = new THREE.MeshStandardMaterial({color:0x1a1a1e, roughness:1, side:THREE.DoubleSide});
const baseFloorMat = new THREE.MeshStandardMaterial({map:baseTex, roughness:1});
const stairMat = new THREE.MeshStandardMaterial({map:woodTex(), roughness:0.9, side:THREE.DoubleSide});
const propMat  = new THREE.MeshStandardMaterial({color:0x1a1410, roughness:0.9});
const darkMat  = new THREE.MeshStandardMaterial({color:0x08080a, roughness:1});

// ---------- Lights ----------
scene.add(new THREE.AmbientLight(0x14141e, 0.6));

// Flashlight
const flashlight = new THREE.SpotLight(0xffdca8, 14, 22, Math.PI/5.2, 0.55, 1.3);
flashlight.castShadow = true;
flashlight.shadow.mapSize.set(isMobile?512:1024, isMobile?512:1024);
flashlight.shadow.camera.near = 0.1;
flashlight.shadow.camera.far = 24;
flashlight.shadow.bias = -0.0008;
camera.add(flashlight, flashlight.target);
flashlight.position.set(0.15,-0.15,0);
flashlight.target.position.set(0,0,-1);
flashlight.visible = true;

// Dim room lights (some flicker)
const flickerLights = [];
function addLight(x,y,z,color,intensity,dist,flicker=0){
  const l=new THREE.PointLight(color,intensity,dist,1.6);
  l.position.set(x,y,z);scene.add(l);
  flickerLights.push({l,base:intensity,flicker});
  return l;
}
addLight(4,2.7,3.5,0xffb070,1.1,7,0.02);     // living
addLight(15,2.7,3.5,0xffb070,0.9,7,0.02);    // kitchen
addLight(5,2.7,11,0xffa860,0.7,7,0.05);      // bedroom
addLight(16,2.7,9,0xffb070,0.6,7,0.35);      // hallway (flickers)
addLight(12,-1.6,11,0x6688ff,0.9,9,0.6);     // basement (heavy flicker)

// ---------- Geometry helpers ----------
const colliders = [];   // {x1,x2,z1,z2, type:'main'|'basement'|'all'}

function boxMesh(w,h,d,mat,uvScale=0.5){
  const geo=new THREE.BoxGeometry(w,h,d);
  const uv=geo.attributes.uv;
  const fs=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++){
    const [su,sv]=fs[f];
    for(let v=0;v<4;v++){
      const i=f*4+v;
      uv.setXY(i, uv.getX(i)*su*uvScale, uv.getY(i)*sv*uvScale);
    }
  }
  uv.needsUpdate=true;
  const m=new THREE.Mesh(geo,mat);
  m.castShadow=true;m.receiveShadow=true;
  return m;
}
function addWall(cx,cy,cz,w,h,d,mat,type){
  const m=boxMesh(w,h,d,mat);
  m.position.set(cx,cy,cz);scene.add(m);
  colliders.push({x1:cx-w/2,x2:cx+w/2,z1:cz-d/2,z2:cz+d/2,type});
  return m;
}
function addFloor(x1,x2,z1,z2,y,mat,uvScale=0.5){
  const w=x2-x1,d=z2-z1;
  const geo=new THREE.PlaneGeometry(w,d);
  const uv=geo.attributes.uv;
  for(let i=0;i<uv.count;i++) uv.setXY(i,uv.getX(i)*w*uvScale,uv.getY(i)*d*uvScale);
  const m=new THREE.Mesh(geo,mat);
  m.rotation.x=-Math.PI/2;
  m.position.set((x1+x2)/2,y,(z1+z2)/2);
  m.receiveShadow=true;
  scene.add(m);
  return m;
}
function addProp(x,y,z,w,h,d,mat,type='main'){
  const m=boxMesh(w,h,d,mat,1);
  m.position.set(x,y,z);scene.add(m);
  colliders.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2,type});
  return m;
}

// ---------- Walls ----------
const T=0.2;
// Perimeter (all floors: -3..3)
addWall(10,0,0.1,   20,6,T,wallMat,'all');
addWall(10,0,14.9,  20,6,T,wallMat,'all');
addWall(0.1,0,7.5,  T,6,15,wallMat,'all');
addWall(19.9,0,7.5, T,6,15,wallMat,'all');

// Main floor interior (0..3, center 1.5)
// Vertical x=10 with door gaps at z 2.5-4.5 and 10-11.5
addWall(10,1.5,1.25,  T,3,2.5,wallMat,'main');
addWall(10,1.5,7.25,  T,3,5.5,wallMat,'main');
addWall(10,1.5,13.25, T,3,3.5,wallMat,'main');
// Horizontal z=7 with door gaps at x 2.5-4.5 and 15-16.5
addWall(1.25,1.5,7,  2.5,3,T,wallMat,'main');
addWall(9.75,1.5,7, 10.5,3,T,wallMat,'main');
addWall(18.25,1.5,7, 3.5,3,T,wallMat,'main');

// Basement walls (-3..0, center -1.5)
addWall(14,-1.5,7, 12,3,T,wallMat,'basement');   // south basement (x 8-20)
addWall(8,-1.5,11, T,3,8,wallMat,'basement');    // west basement (z 7-15)

// ---------- Floors ----------
addFloor(0,10,0,7,0,floorMat);       // living
addFloor(10,20,0,7,0,floorMat);      // kitchen
addFloor(0,10,7,15,0,floorMat);      // bedroom
addFloor(10,14,7,15,0,floorMat);     // hallway (left)
addFloor(14,20,7,11,0,floorMat);     // hallway above stairs
addFloor(8,20,7,15,-3,baseFloorMat); // basement

// Ceiling
addFloor(0,20,0,15,3,ceilMat,0.25);

// ---------- Stairs (ramp) ----------
function makeRamp(x1,x2,z1,z2,yTop1,yTop2,yBot){
  const p=[
    x1,yTop1,z1, x2,yTop2,z1, x2,yTop2,z2,
    x1,yTop1,z1, x2,yTop2,z2, x1,yTop1,z2,
    x1,yBot,z1,  x2,yBot,z2,  x2,yBot,z1,
    x1,yBot,z1,  x1,yBot,z2,  x2,yBot,z2,
    x2,yBot,z1,  x2,yTop2,z1, x2,yTop2,z2,
    x2,yBot,z1,  x2,yTop2,z2, x2,yBot,z2,
    x1,yBot,z1,  x2,yTop2,z1, x2,yBot,z1,
    x1,yBot,z2,  x2,yBot,z2,  x2,yTop2,z2,
  ];
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  const uv=[];
  for(let i=0;i<p.length/3;i++) uv.push(p[i*3]*0.4, p[i*3+2]*0.4);
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,stairMat);
  m.castShadow=true;m.receiveShadow=true;
  scene.add(m);
}
makeRamp(14,20,11,15, -3, 0, -3);

// Decorative step edges
for(let i=1;i<12;i++){
  const x=14+i*0.5;
  const y=-3*(20-x)/6;
  const line=boxMesh(0.04,0.04,4,darkMat,1);
  line.position.set(x,y+0.03,13);
  scene.add(line);
}

// ---------- Props ----------
// Living room
addProp(2.2,0.42,2.2, 2.2,0.84,0.9, propMat);           // sofa
addProp(5,0.32,4, 1.6,0.64,0.9, propMat);               // table
// Kitchen
addProp(15.5,0.45,1.4, 4.2,0.9,1.1, propMat);           // counter
addProp(18.5,0.8,1.0, 0.9,1.6,0.7, propMat);            // fridge
// Bedroom
addProp(4,0.3,11.5, 2.2,0.6,3.2, propMat);              // bed
// Basement
addProp(10,-2.4,9, 1.2,1.2,1.2, propMat,'basement');    // crate
addProp(11.5,-2.65,10, 0.7,0.7,0.7, propMat,'basement');
addProp(9.5,-2.5,13.5, 1,1,1, propMat,'basement');
// Pillar in basement
const pillar=boxMesh(0.5,3,0.5,wallMat,1);
pillar.position.set(13,-1.5,12);scene.add(pillar);
colliders.push({x1:12.75,x2:13.25,z1:11.75,z2:12.25,type:'basement'});

// Bulb in basement (small emissive sphere)
const bulbMat=new THREE.MeshBasicMaterial({color:0x99b8ff});
const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8),bulbMat);
bulb.position.set(12,-1.0,11);scene.add(bulb);

// ---------- Post processing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.55, 0.6, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- Player ----------
const EYE=1.6, RADIUS=0.3;
const player = {
  x:3, z:4.5,
  y:EYE,
  vx:0, vz:0,
  yaw:Math.PI, pitch:0,
};

function groundY(x,z,prev){
  const inStairs = (x>14 && x<20 && z>11 && z<15);
  if(inStairs){
    const sY = -3*(20-x)/6;
    if(prev >= sY-0.55) return sY;
  }
  if(prev < -1.5) return -3;
  return 0;
}

function collides(x,z,level){
  for(const c of colliders){
    if(c.type!=='all' && c.type!==level) continue;
    const cx=Math.max(c.x1,Math.min(x,c.x2));
    const cz=Math.max(c.z1,Math.min(z,c.z2));
    const dx=x-cx,dz=z-cz;
    if(dx*dx+dz*dz < RADIUS*RADIUS) return true;
  }
  return false;
}

// ---------- Input ----------
const keys={};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);

const move={x:0,y:0};
let joyId=null, joyCX=0, joyCY=0;
let lookId=null, lookLast={x:0,y:0};
const joyEl=document.getElementById('joy');
const joyK=document.getElementById('joyK');

const isTouch = 'ontouchstart' in window;
renderer.domElement.addEventListener('click',()=>{
  if(!isTouch && !document.pointerLockElement) renderer.domElement.requestPointerLock();
});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement){
    player.yaw -= e.movementX*0.0022;
    player.pitch -= e.movementY*0.0022;
    player.pitch = Math.max(-1.35,Math.min(1.35,player.pitch));
  }
});

function onTouchStart(e){
  for(const t of e.changedTouches){
    if(t.clientX < innerWidth*0.5 && joyId===null){
      joyId=t.identifier;joyCX=t.clientX;joyCY=t.clientY;
      joyEl.style.display='block';
      joyEl.style.left=joyCX+'px';
      joyEl.style.top=joyCY+'px';
      joyK.style.left='50%';joyK.style.top='50%';
    } else if(t.clientX >= innerWidth*0.5 && lookId===null){
      lookId=t.identifier;lookLast={x:t.clientX,y:t.clientY};
    }
  }
}
function onTouchMove(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      const dx=t.clientX-joyCX, dy=t.clientY-joyCY;
      const max=55, len=Math.hypot(dx,dy);
      const cl=Math.min(1, max/(len||1));
      move.x = dx*cl/max;
      move.y = dy*cl/max;
      joyK.style.left=(50 + dx*cl/max*50)+'%';
      joyK.style.top=(50 + dy*cl/max*50)+'%';
    } else if(t.identifier===lookId){
      const dx=t.clientX-lookLast.x, dy=t.clientY-lookLast.y;
      player.yaw -= dx*0.005;
      player.pitch -= dy*0.005;
      player.pitch = Math.max(-1.35,Math.min(1.35,player.pitch));
      lookLast={x:t.clientX,y:t.clientY};
    }
  }
}
function onTouchEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===joyId){joyId=null;move.x=0;move.y=0;joyEl.style.display='none';}
    if(t.identifier===lookId){lookId=null;}
  }
}
if(isTouch){
  addEventListener('touchstart',onTouchStart,{passive:true});
  addEventListener('touchmove',onTouchMove,{passive:false});
  addEventListener('touchend',onTouchEnd,{passive:true});
  addEventListener('touchcancel',onTouchEnd,{passive:true});
}

// Flashlight toggle
const flashBtn=document.getElementById('flash');
flashBtn.classList.add('on');
function toggleFlash(){
  flashlight.visible=!flashlight.visible;
  flashBtn.classList.toggle('on',flashlight.visible);
}
flashBtn.addEventListener('click',e=>{e.stopPropagation();toggleFlash();});
addEventListener('keydown',e=>{if(e.code==='KeyF')toggleFlash();});

// ---------- Audio (drone) ----------
let audioCtx=null;
function initAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const bs=audioCtx.sampleRate*4;
  const buf=audioCtx.createBuffer(1,bs,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<bs;i++){
    const w=Math.random()*2-1;
    d[i]=(last+0.02*w)/1.02;
    last=d[i];
    d[i]*=3.5;
  }
  const src=audioCtx.createBufferSource();
  src.buffer=buf;src.loop=true;
  const f=audioCtx.createBiquadFilter();
  f.type='lowpass';f.frequency.value=220;
  const g=audioCtx.createGain();g.gain.value=0.045;
  src.connect(f).connect(g).connect(audioCtx.destination);
  src.start();
}

// ---------- Start button ----------
document.getElementById('start').addEventListener('click',()=>{
  initAudio();
  const intro=document.getElementById('intro');
  intro.style.opacity='0';
  setTimeout(()=>intro.style.display='none',1200);
});

// ---------- Main loop ----------
let last=performance.now();
let bobT=0;

function tick(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;

  // Input
  let ix=0, iz=0;
  if(keys['KeyW']||keys['ArrowUp'])   iz+=1;
  if(keys['KeyS']||keys['ArrowDown']) iz-=1;
  if(keys['KeyA']||keys['ArrowLeft']) ix-=1;
  if(keys['KeyD']||keys['ArrowRight'])ix+=1;
  ix += move.x;
  iz += -move.y;
  const il=Math.hypot(ix,iz);
  if(il>1){ix/=il;iz/=il;}

  // Desired velocity
  const sp=2.6;
  const cy=Math.cos(player.yaw), sy=Math.sin(player.yaw);
  const fwdX=-sy, fwdZ=-cy;
  const rgtX=cy,  rgtZ=-sy;
  const dvx=(ix*rgtX+iz*fwdX)*sp;
  const dvz=(ix*rgtZ+iz*fwdZ)*sp;
  const acc=Math.min(1,dt*12);
  player.vx += (dvx-player.vx)*acc;
  player.vz += (dvz-player.vz)*acc;

  // Level
  const level = player.y-EYE > -1.5 ? 'main' : 'basement';

  // Move with collision (X then Z)
  const nx=player.x+player.vx*dt;
  if(!collides(nx,player.z,level)) player.x=nx; else player.vx=0;
  const nz=player.z+player.vz*dt;
  if(!collides(player.x,nz,level)) player.z=nz; else player.vz=0;

  // Ground
  const prevG = player.y-EYE;
  const g = groundY(player.x,player.z,prevG);
  const targetY = g+EYE;
  player.y += (targetY-player.y)*Math.min(1,dt*14);

  // Head bob
  const spd=Math.hypot(player.vx,player.vz);
  if(spd>0.15) bobT += dt*spd*5.5;
  const bob=Math.sin(bobT)*0.03*Math.min(1,spd);

  // Apply to camera
  camera.position.set(player.x, player.y+bob, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  // Flicker lights
  const t=now*0.001;
  for(const f of flickerLights){
    if(f.flicker>0.3){
      f.l.intensity = Math.random()<0.06 ? f.base*0.05 : f.base*(0.7+Math.random()*0.5);
    } else {
      f.l.intensity = f.base*(0.9+Math.sin(t*3+f.base*10)*0.06+Math.random()*f.flicker*2);
    }
  }
  // Bulb emissive flicker
  bulbMat.color.setHex(0x99b8ff).multiplyScalar(0.6+Math.random()*0.4);

  // Render
  composer.render();
}

renderer.setAnimationLoop(tick);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloom.resolution.set(innerWidth,innerHeight);
});
</script>
</body>
</html>
