<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>VIBE — социальная сеть</title>
<style>
/* ============ БАЗА ============ */
:root {
  --bg: #0a0a0f;
  --bg-soft: #12121a;
  --card: rgba(28, 28, 38, 0.75);
  --card-solid: #1c1c26;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --text: #f2f2f7;
  --text-2: rgba(235, 235, 245, 0.65);
  --text-3: rgba(235, 235, 245, 0.35);
  --accent: #6e5cff;
  --accent-2: #b23aff;
  --accent-glow: rgba(110, 92, 255, 0.4);
  --red: #ff3b5c;
  --green: #30d158;
  --gold: #ffd60a;
  --radius: 20px;
  --radius-sm: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-h: 64px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
body {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse 60% 40% at 20% 0%, rgba(110, 92, 255, 0.12), transparent),
    radial-gradient(ellipse 50% 40% at 90% 10%, rgba(178, 58, 255, 0.08), transparent),
    var(--bg);
}
button, input, textarea { font-family: inherit; }

/* ============ ВЕРХНЯЯ ПАНЕЛЬ ============ */
.topbar {
  position: sticky; top: 0; z-index: 50;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  background: rgba(10, 10, 15, 0.75);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.logo {
  font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
  background: linear-gradient(135deg, #6e5cff, #b23aff);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  flex-shrink: 0;
}
.search {
  flex: 1; min-width: 0;
  padding: 9px 14px; border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text); font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.search:focus { border-color: var(--accent); }
.search::placeholder { color: var(--text-3); }

.avatar-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: none; cursor: pointer;
  background: linear-gradient(135deg, #6e5cff, #b23aff);
  color: #fff; font-weight: 800; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.avatar-btn:active { transform: scale(0.9); }

/* ============ СКРОЛЛ ============ */
#feed {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px calc(var(--nav-h) + var(--safe-bottom) + 20px);
  scroll-behavior: smooth;
}
#feed::-webkit-scrollbar { width: 0; }

/* ============ ТАБЫ ============ */
.tabs {
  display: flex; gap: 6px; padding: 0 4px 12px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 8px 16px; border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-2);
  font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
  transition: all 0.2s;
}
.tab.active {
  background: linear-gradient(135deg, #6e5cff, #b23aff);
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 16px var(--accent-glow);
}

/* ============ ПОСТ ============ */
.post {
  margin-bottom: 14px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  overflow: hidden;
  animation: postIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes postIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

.post-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 10px;
}
.post-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px; color: #fff;
}
.post-meta { flex: 1; min-width: 0; }
.post-author {
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 5px;
}
.verified {
  width: 14px; height: 14px;
  background: var(--accent); border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; color: #fff;
}
.post-time { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.post-more {
  width: 28px; height: 28px; border-radius: 50%;
  border: none; background: transparent;
  color: var(--text-3); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.post-text {
  padding: 0 14px 12px;
  font-size: 14.5px; line-height: 1.45;
  white-space: pre-wrap; word-break: break-word;
}
.post-text .tag { color: var(--accent); font-weight: 600; }

.post-media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  overflow: hidden;
}
.post-media iframe {
  width: 100%; height: 100%; border: 0;
  display: block;
}

.post-actions {
  display: flex; align-items: center;
  padding: 10px 6px;
  border-top: 0.5px solid var(--border);
}
.action {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 4px;
  border: none; background: transparent;
  color: var(--text-2); font-size: 13px; font-weight: 600;
  cursor: pointer; border-radius: 12px;
  transition: all 0.18s;
}
.action:active { transform: scale(0.94); }
.action svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.action.liked { color: var(--red); }
.action.liked svg { fill: var(--red); stroke: var(--red); }

/* ============ КОММЕНТАРИИ ============ */
.comments {
  padding: 4px 14px 12px;
  border-top: 0.5px solid var(--border);
  display: none;
}
.comments.open { display: block; animation: commentsIn 0.3s ease; }
@keyframes commentsIn { from { opacity: 0; } to { opacity: 1; } }
.comment {
  display: flex; gap: 10px; padding: 8px 0;
  font-size: 13.5px; line-height: 1.4;
}
.comment-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: #fff;
}
.comment-body { flex: 1; min-width: 0; }
.comment-author { font-weight: 700; font-size: 12.5px; margin-bottom: 2px; }
.comment-text { color: var(--text-2); word-break: break-word; }

.comment-input-row {
  display: flex; gap: 8px; margin-top: 8px;
}
.comment-input {
  flex: 1; min-width: 0;
  padding: 10px 14px; border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text); font-size: 13px;
  outline: none;
}
.comment-input:focus { border-color: var(--accent); }
.comment-send {
  width: 40px; height: 40px; border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #6e5cff, #b23aff);
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.comment-send:active { transform: scale(0.9); }
.comment-send svg { width: 18px; height: 18px; }

/* ============ НИЖНЯЯ НАВИГАЦИЯ ============ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  display: flex; align-items: center; justify-content: space-around;
  background: rgba(15, 15, 22, 0.85);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-top: 0.5px solid var(--border);
}
.nav-btn {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  border: none; background: transparent;
  color: var(--text-3); font-size: 10px; font-weight: 600;
  cursor: pointer; padding: 6px 0;
  transition: color 0.2s;
}
.nav-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; }
.nav-btn.active { color: var(--accent); }
.nav-btn:active { opacity: 0.6; }
.nav-btn.center svg {
  width: 46px; height: 46px; padding: 10px;
  background: linear-gradient(135deg, #6e5cff, #b23aff);
  border-radius: 50%; color: #fff; stroke-width: 2.4;
  box-shadow: 0 4px 18px var(--accent-glow);
  margin-top: -14px;
}

/* ============ МОДАЛКИ ============ */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.28s;
}
.overlay.open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-width: 540px; max-height: 88vh;
  overflow-y: auto;
  background: var(--card-solid);
  border-radius: 24px 24px 0 0;
  border: 1px solid var(--border-strong); border-bottom: none;
  padding: 18px 18px calc(22px + var(--safe-bottom));
  transform: translateY(30px);
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.overlay.open .sheet { transform: translateY(0); }
.handle {
  width: 38px; height: 4px; border-radius: 2px;
  background: var(--text-3); margin: 0 auto 16px;
}
.sheet h3 { font-size: 19px; font-weight: 800; margin-bottom: 14px; }

.field {
  width: 100%; padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text); font-size: 14px;
  outline: none; resize: none;
  margin-bottom: 10px;
}
.field:focus { border-color: var(--accent); }
textarea.field { min-height: 90px; font-family: inherit; }

.url-hint {
  font-size: 12px; color: var(--text-3);
  margin: -4px 0 12px 4px;
  line-height: 1.4;
}
.url-hint b { color: var(--accent); font-weight: 600; }

.btn-primary {
  width: 100%; padding: 15px;
  border: none; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #6e5cff, #b23aff);
  color: #fff; font-size: 15px; font-weight: 800;
  cursor: pointer;
  box-shadow: 0 6px 22px var(--accent-glow);
  transition: transform 0.15s;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.4; pointer-events: none; }

.btn-ghost {
  width: 100%; padding: 14px; margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: transparent; color: var(--text-2);
  font-size: 14px; font-weight: 600; cursor: pointer;
}

/* превью видео в модалке */
.video-preview {
  width: 100%; aspect-ratio: 16/9; border-radius: 14px;
  background: #000; overflow: hidden;
  margin-bottom: 10px; display: none;
}
.video-preview.on { display: block; }
.video-preview iframe { width: 100%; height: 100%; border: 0; }

/* ============ ПРОФИЛЬ ============ */
.profile-head {
  text-align: center;
  padding: 20px 0 24px;
}
.profile-avatar {
  width: 88px; height: 88px; border-radius: 50%;
  margin: 0 auto 12px;
  background: linear-gradient(135deg, #6e5cff, #b23aff);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; font-weight: 900; color: #fff;
  box-shadow: 0 8px 28px var(--accent-glow);
}
.profile-name { font-size: 22px; font-weight: 800; }
.profile-tag { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.profile-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin: 20px 0;
}
.pstat {
  padding: 14px 8px; border-radius: var(--radius-sm);
  background: var(--card); border: 1px solid var(--border);
  text-align: center;
}
.pstat .n { font-size: 20px; font-weight: 800; }
.pstat .l { font-size: 10px; color: var(--text-3); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }

/* ============ УВЕДОМЛЕНИЯ ============ */
.notif {
  display: flex; gap: 12px; padding: 14px;
  border-radius: var(--radius-sm); background: var(--card);
  border: 1px solid var(--border); margin-bottom: 8px;
  animation: postIn 0.35s;
}
.notif-icon {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}

/* ============ ПУСТО ============ */
.empty {
  text-align: center; padding: 60px 20px;
  color: var(--text-3);
}
.empty .e-icon { font-size: 48px; margin-bottom: 12px; }
.empty .e-text { font-size: 14px; line-height: 1.5; }

/* ============ TOAST ============ */
.toasts {
  position: fixed; top: calc(var(--safe-top) + 12px);
  left: 50%; transform: translateX(-50%);
  z-index: 300; display: flex; flex-direction: column; gap: 8px;
  width: calc(100% - 32px); max-width: 400px;
  pointer-events: none;
}
.toast {
  padding: 12px 16px; border-radius: 14px;
  background: rgba(28, 28, 38, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-strong);
  font-size: 13px; font-weight: 600; text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  animation: toastIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-14px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.toast.out { animation: toastOut 0.28s forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px) scale(0.95); } }

@media (min-width: 700px) {
  #feed { max-width: 600px; margin: 0 auto; width: 100%; }
  .bottom-nav { max-width: 600px; left: 50%; transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div class="toasts" id="toasts"></div>

<div class="topbar">
  <div class="logo">VIBE</div>
  <input class="search" id="searchInput" placeholder="🔍 Поиск постов...">
  <button class="avatar-btn" onclick="App.openProfile()">Я</button>
</div>

<div id="feed"></div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-nav="feed">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
    <span>Лента</span>
  </button>
  <button class="nav-btn" data-nav="notifications">
    <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M9 20a3 3 0 006 0"/></svg>
    <span>Активность</span>
  </button>
  <button class="nav-btn center" data-nav="create">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="nav-btn" data-nav="trends">
    <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M21 7v6h-6"/></svg>
    <span>Тренды</span>
  </button>
  <button class="nav-btn" data-nav="me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <span>Профиль</span>
  </button>
</nav>

<div class="overlay" id="overlay" onclick="App.closeSheet(event)">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<script>
/* ============================================================
   КОНФИГ
   ============================================================ */
const CONFIG = {
  version: 2,
  storageKey: 'vibe_save_v2',
  me: { id: 'me', name: 'Ты', handle: '@me', color: '#6e5cff', initial: 'Я' },
};

/* ============================================================
   СТАРТОВЫЕ ДАННЫЕ
   Демо-посты с видео из YouTube (публичные)
   ============================================================ */
function defaultState() {
  return {
    version: CONFIG.version,
    posts: [
      {
        id: 'p1',
        author: { id: 'u1', name: 'Arctic Vibes', handle: '@arcticvibes', color: '#4aa3ff', initial: 'A', verified: true },
        text: 'Полярное сияние над Норвегией 🌌 Невероятное зрелище, обязательно посмотрите в HD #природа #northernlights',
        videoId: 'Cs6Y4mR3vUY',
        videoTitle: 'Northern Lights in 4K',
        createdAt: Date.now() - 3600_000 * 2,
        likes: 1243,
        liked: false,
        comments: [
          { id: 'c1', name: 'Alina', initial: 'A', color: '#ff5e8a', text: 'Невероятно красиво 😍' },
          { id: 'c2', name: 'Max', initial: 'M', color: '#4caf50', text: 'Добавил в закладки' },
        ],
      },
      {
        id: 'p2',
        author: { id: 'u2', name: 'Lo-Fi Room', handle: '@lofiroom', color: '#b23aff', initial: 'L', verified: true },
        text: 'Треки для работы и учёбы. Включай и погружайся 🎧',
        videoId: 'jfKfPfyJRdk',
        videoTitle: 'lofi hip hop radio — beats to relax/study to',
        createdAt: Date.now() - 3600_000 * 8,
        likes: 8921,
        liked: false,
        comments: [],
      },
      {
        id: 'p3',
        author: { id: 'u3', name: 'Space Now', handle: '@spacenow', color: '#ff9f0a', initial: 'S', verified: false },
        text: 'Как выглядит запуск ракеты с борта МКС 🚀 #космос #space',
        videoId: '21X5lGlDOfg',
        videoTitle: 'Rocket Launch from ISS',
        createdAt: Date.now() - 3600_000 * 20,
        likes: 567,
        liked: false,
        comments: [],
      },
      {
        id: 'p4',
        author: { id: 'u4', name: 'Coffee Lab', handle: '@coffeelab', color: '#c98b3a', initial: 'C', verified: false },
        text: 'Как приготовить идеальный латте дома. Сохраняй рецепт ☕️',
        videoId: 'Q4f4rS6vGxE',
        videoTitle: 'Perfect Latte at Home',
        createdAt: Date.now() - 3600_000 * 48,
        likes: 342,
        liked: false,
        comments: [],
      },
      {
        id: 'p5',
        author: { id: 'u5', name: 'Tech Pulse', handle: '@techpulse', color: '#30d158', initial: 'T', verified: true },
        text: 'Обзор нового смартфона. Стоит ли обновляться? 📱 #tech',
        videoId: 'dQw4w9WgXcQ',
        videoTitle: 'Phone Review 2026',
        createdAt: Date.now() - 3600_000 * 72,
        likes: 1892,
        liked: false,
        comments: [],
      },
    ],
    myPosts: [],
    notifications: [
      { id: 'n1', icon: '❤️', color: '#ff3b5c', text: 'Arctic Vibes и ещё 42 оценили ваш пост', time: Date.now() - 600_000 },
      { id: 'n2', icon: '💬', color: '#6e5cff', text: 'Max прокомментировал: «Круто!»', time: Date.now() - 3600_000 },
      { id: 'n3', icon: '👤', color: '#30d158', text: 'Lo-Fi Room подписался на вас', time: Date.now() - 7200_000 },
    ],
    myStats: { likes: 0, posts: 0, followers: 12 },
    currentFilter: 'all',
  };
}

/* ============================================================
   STATE
   ============================================================ */
let S = null;

function save() {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(S)); }
  catch (e) { console.warn('save error', e); toast('⚠️ Не удалось сохранить'); }
}
function load() {
  try {
    const raw = localStorage.getItem(CONFIG.storageKey);
    if (!raw) { S = defaultState(); return; }
    const data = JSON.parse(raw);
    if (data.version !== CONFIG.version) { S = defaultState(); return; }
    S = { ...defaultState(), ...data };
  } catch (e) {
    console.warn('load error', e);
    S = defaultState();
  }
}

/* ============================================================
   ВИДЕО: извлечение YouTube ID из ссылки
   ============================================================ */
function extractYouTubeId(url) {
  if (!url) return null;
  url = url.trim();
  // прямой ID
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/,
    /[?&]v=([a-zA-Z0-9_-]{11})/,
  ];
  for (const re of patterns) {
    const m = url.match(re);
    if (m) return m[1];
  }
  return null;
}

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'только что';
  if (s < 3600) return Math.floor(s / 60) + ' мин';
  if (s < 86400) return Math.floor(s / 3600) + ' ч';
  if (s < 604800) return Math.floor(s / 86400) + ' д';
  return new Date(ts).toLocaleDateString('ru-RU');
}
function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderTextWithTags(text) {
  return esc(text).replace(/#(\w+)/g, '<span class="tag">#$1</span>');
}
function uid(prefix = 'x') { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function toast(msg) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 300);
  }, 2200);
}

/* ============================================================
   РЕНДЕР ЛЕНТЫ
   ============================================================ */
function allPosts() {
  return [...S.myPosts, ...S.posts].sort((a, b) => b.createdAt - a.createdAt);
}

function filteredPosts() {
  let posts = allPosts();
  const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  if (q) {
    posts = posts.filter(p =>
      p.text.toLowerCase().includes(q) ||
      p.author.name.toLowerCase().includes(q) ||
      (p.videoTitle || '').toLowerCase().includes(q)
    );
  }
  if (S.currentFilter === 'video') posts = posts.filter(p => p.videoId);
  if (S.currentFilter === 'text') posts = posts.filter(p => !p.videoId);
  if (S.currentFilter === 'mine') posts = S.myPosts;
  return posts;
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const posts = filteredPosts();

  let html = `
    <div class="tabs">
      <button class="tab ${S.currentFilter === 'all' ? 'active' : ''}" onclick="App.setFilter('all')">Все</button>
      <button class="tab ${S.currentFilter === 'video' ? 'active' : ''}" onclick="App.setFilter('video')">🎬 Видео</button>
      <button class="tab ${S.currentFilter === 'text' ? 'active' : ''}" onclick="App.setFilter('text')">💬 Текст</button>
      <button class="tab ${S.currentFilter === 'mine' ? 'active' : ''}" onclick="App.setFilter('mine')">Мои</button>
    </div>
  `;

  if (!posts.length) {
    html += `<div class="empty"><div class="e-icon">📭</div><div class="e-text">Здесь пока пусто<br>Создайте первый пост!</div></div>`;
    feed.innerHTML = html;
    return;
  }

  html += posts.map(renderPost).join('');
  feed.innerHTML = html;
}

function renderPost(p) {
  const liked = p.liked;
  const comments = p.comments || [];
  const videoBlock = p.videoId ? `
    <div class="post-media">
      <iframe
        src="https://www.youtube.com/embed/${p.videoId}?rel=0&modestbranding=1"
        title="${esc(p.videoTitle || 'video')}"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </div>` : '';

  return `
    <div class="post" data-post="${p.id}">
      <div class="post-head">
        <div class="post-avatar" style="background:${p.author.color}">${p.author.initial}</div>
        <div class="post-meta">
          <div class="post-author">
            ${esc(p.author.name)}
            ${p.author.verified ? '<span class="verified">✓</span>' : ''}
          </div>
          <div class="post-time">${esc(p.author.handle)} · ${timeAgo(p.createdAt)}</div>
        </div>
        <button class="post-more" onclick="App.postMenu('${p.id}')">⋯</button>
      </div>
      <div class="post-text">${renderTextWithTags(p.text)}</div>
      ${videoBlock}
      <div class="post-actions">
        <button class="action ${liked ? 'liked' : ''}" onclick="App.toggleLike('${p.id}')">
          <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 000-7.8z"/></svg>
          <span>${p.likes}</span>
        </button>
        <button class="action" onclick="App.toggleComments('${p.id}')">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.5 8.5 0 01-3.9-.9L3 21l2-4.6A8.4 8.4 0 013 11.5a8.4 8.4 0 019-8.4 8.4 8.4 0 019 8.4z"/></svg>
          <span>${comments.length}</span>
        </button>
        <button class="action" onclick="App.share('${p.id}')">
          <svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>
          <span>Поделиться</span>
        </button>
      </div>
      <div class="comments ${comments.length ? '' : ''}" id="c-${p.id}">
        ${comments.map(c => `
          <div class="comment">
            <div class="comment-avatar" style="background:${c.color}">${c.initial}</div>
            <div class="comment-body">
              <div class="comment-author">${esc(c.name)}</div>
              <div class="comment-text">${esc(c.text)}</div>
            </div>
          </div>
        `).join('')}
        <div class="comment-input-row">
          <input class="comment-input" id="ci-${p.id}" placeholder="Написать комментарий..." onkeydown="if(event.key==='Enter')App.addComment('${p.id}')">
          <button class="comment-send" onclick="App.addComment('${p.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
          </button>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================
   ЛОГИКА
   ============================================================ */
function findPost(id) {
  return S.posts.find(p => p.id === id) || S.myPosts.find(p => p.id === id);
}

function toggleLike(id) {
  const p = findPost(id);
  if (!p) return;
  if (p.liked) { p.likes = Math.max(0, p.likes - 1); p.liked = false; }
  else { p.likes++; p.liked = true; }
  save();
  // локальное обновление кнопки без полной перерисовки (чтобы видео не перезагружалось)
  const postEl = document.querySelector(`[data-post="${id}"]`);
  if (postEl) {
    const btn = postEl.querySelector('.action');
    btn.classList.toggle('liked', p.liked);
    btn.querySelector('span').textContent = p.likes;
  }
}

function toggleComments(id) {
  const el = document.getElementById('c-' + id);
  if (!el) return;
  el.classList.toggle('open');
  if (el.classList.contains('open')) {
    setTimeout(() => document.getElementById('ci-' + id)?.focus(), 200);
  }
}

function addComment(id) {
  const input = document.getElementById('ci-' + id);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const p = findPost(id);
  if (!p) return;
  p.comments = p.comments || [];
  p.comments.push({
    id: uid('c'),
    name: CONFIG.me.name,
    initial: CONFIG.me.initial,
    color: CONFIG.me.color,
    text,
  });
  input.value = '';
  save();
  // Обновляем DOM
  const box = document.getElementById('c-' + id);
  const newC = document.createElement('div');
  newC.className = 'comment';
  newC.innerHTML = `
    <div class="comment-avatar" style="background:${CONFIG.me.color}">${CONFIG.me.initial}</div>
    <div class="comment-body">
      <div class="comment-author">${esc(CONFIG.me.name)}</div>
      <div class="comment-text">${esc(text)}</div>
    </div>`;
  box.insertBefore(newC, box.querySelector('.comment-input-row'));
  // счётчик
  const postEl = document.querySelector(`[data-post="${id}"]`);
  if (postEl) {
    const btns = postEl.querySelectorAll('.action');
    if (btns[1]) btns[1].querySelector('span').textContent = p.comments.length;
  }
}

function share(id) {
  const p = findPost(id);
  if (!p) return;
  const url = p.videoId ? `https://youtu.be/${p.videoId}` : location.href;
  if (navigator.share) {
    navigator.share({ title: p.author.name, text: p.text, url }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url);
    toast('🔗 Ссылка скопирована');
  } else {
    toast('Скопируйте ссылку: ' + url);
  }
}

function postMenu(id) {
  const p = findPost(id);
  if (!p) return;
  const isMine = S.myPosts.some(x => x.id === id);
  showSheet(`
    <h3>Пост</h3>
    <button class="btn-ghost" onclick="App.share('${id}');App.closeSheet();">🔗 Скопировать ссылку</button>
    ${isMine ? `<button class="btn-ghost" style="color:var(--red);" onclick="App.deletePost('${id}')">🗑 Удалить пост</button>` : ''}
    <button class="btn-ghost" onclick="App.closeSheet()">Отмена</button>
  `);
}

function deletePost(id) {
  const idx = S.myPosts.findIndex(p => p.id === id);
  if (idx === -1) return;
  S.myPosts.splice(idx, 1);
  S.myStats.posts = Math.max(0, S.myStats.posts - 1);
  save();
  closeSheetDirect();
  renderFeed();
  toast('Пост удалён');
}

function setFilter(f) {
  S.currentFilter = f;
  save();
  renderFeed();
}

/* ============================================================
   МОДАЛКА: СОЗДАНИЕ ПОСТА
   ============================================================ */
function openCreate() {
  showSheet(`
    <h3>Новый пост</h3>
    <textarea class="field" id="newText" placeholder="Что нового?"></textarea>
    <input class="field" id="newVideo" placeholder="Ссылка на YouTube (необязательно)" oninput="App.previewVideo(this.value)">
    <div class="url-hint">
      Вставьте ссылку на видео с YouTube — например<br>
      <b>https://youtu.be/dQw4w9WgXcQ</b> или <b>https://www.youtube.com/watch?v=dQw4w9WgXcQ</b>
    </div>
    <div class="video-preview" id="videoPreview"></div>
    <button class="btn-primary" id="publishBtn" onclick="App.publishPost()">Опубликовать</button>
    <button class="btn-ghost" onclick="App.closeSheet()">Отмена</button>
  `);
  setTimeout(() => document.getElementById('newText')?.focus(), 300);
}

function previewVideo(url) {
  const box = document.getElementById('videoPreview');
  if (!box) return;
  const id = extractYouTubeId(url);
  if (id) {
    box.classList.add('on');
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1" allowfullscreen></iframe>`;
  } else {
    box.classList.remove('on');
    box.innerHTML = '';
  }
}

function publishPost() {
  const text = document.getElementById('newText')?.value.trim();
  const videoUrl = document.getElementById('newVideo')?.value.trim();
  if (!text && !videoUrl) { toast('⚠️ Добавьте текст или видео'); return; }

  const videoId = videoUrl ? extractYouTubeId(videoUrl) : null;
  if (videoUrl && !videoId) { toast('⚠️ Некорректная ссылка на YouTube'); return; }

  const post = {
    id: uid('mp'),
    author: { ...CONFIG.me, verified: false },
    text: text || '(без текста)',
    videoId: videoId || null,
    videoTitle: videoId ? 'Video' : null,
    createdAt: Date.now(),
    likes: 0,
    liked: false,
    comments: [],
  };

  S.myPosts.unshift(post);
  S.myStats.posts++;
  save();
  closeSheetDirect();
  S.currentFilter = 'all';
  renderFeed();
  toast('✅ Пост опубликован');
  document.getElementById('feed').scrollTop = 0;
}

/* ============================================================
   ПРОФИЛЬ
   ============================================================ */
function openProfile() {
  const myPosts = S.myPosts.length;
  const totalLikes = S.myPosts.reduce((s, p) => s + p.likes, 0);
  showSheet(`
    <div class="profile-head">
      <div class="profile-avatar">Я</div>
      <div class="profile-name">Ты</div>
      <div class="profile-tag">@me</div>
    </div>
    <div class="profile-stats">
      <div class="pstat"><div class="n">${myPosts}</div><div class="l">Постов</div></div>
      <div class="pstat"><div class="n">${totalLikes}</div><div class="l">Лайков</div></div>
      <div class="pstat"><div class="n">${S.myStats.followers}</div><div class="l">Подписчиков</div></div>
    </div>
    <button class="btn-primary" onclick="App.closeSheet();App.setFilter('mine');document.getElementById('feed').scrollTop=0;">Мои посты</button>
    <button class="btn-ghost" onclick="App.openCreate()">➕ Создать пост</button>
    <button class="btn-ghost" style="color:var(--red);" onclick="App.resetAll()">🗑 Сбросить всё</button>
  `);
}

function resetAll() {
  if (!confirm('Удалить все данные и вернуть демо-посты?')) return;
  localStorage.removeItem(CONFIG.storageKey);
  S = defaultState();
  save();
  closeSheetDirect();
  renderFeed();
  toast('🔄 Данные сброшены');
}

/* ============================================================
   УВЕДОМЛЕНИЯ
   ============================================================ */
function openNotifications() {
  const items = S.notifications;
  showSheet(`
    <h3>Активность</h3>
    ${items.length ? items.map(n => `
      <div class="notif">
        <div class="notif-icon" style="background:${n.color}22;color:${n.color};">${n.icon}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;line-height:1.4;">${esc(n.text)}</div>
          <div style="font-size:11px;color:var(--text-3);margin-top:4px;">${timeAgo(n.time)}</div>
        </div>
      </div>
    `).join('') : '<div class="empty"><div class="e-icon">🔔</div><div class="e-text">Пока нет активности</div></div>'}
  `);
}

/* ============================================================
   ТРЕНДЫ
   ============================================================ */
function openTrends() {
  // Топ-5 постов по лайкам
  const top = [...allPosts()].sort((a, b) => b.likes - a.likes).slice(0, 5);
  showSheet(`
    <h3>🔥 В тренде</h3>
    ${top.map((p, i) => `
      <div class="notif" onclick="App.closeSheet();document.getElementById('feed').scrollTop=0;">
        <div class="notif-icon" style="background:linear-gradient(135deg,#6e5cff,#b23aff);color:#fff;font-weight:800;">${i+1}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13.5px;font-weight:600;line-height:1.35;">${esc(p.text.slice(0, 80))}${p.text.length > 80 ? '...' : ''}</div>
          <div style="font-size:11px;color:var(--text-3);margin-top:4px;">${esc(p.author.name)} · ❤️ ${p.likes}</div>
        </div>
      </div>
    `).join('')}
  `);
}

/* ============================================================
   SHEET API
   ============================================================ */
function showSheet(html) {
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeSheet(e) {
  if (e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('open');
}
function closeSheetDirect() {
  document.getElementById('overlay').classList.remove('open');
}

/* ============================================================
   НАВИГАЦИЯ
   ============================================================ */
function setActiveNav(name) {
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === name);
  });
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init() {
  load();
  renderFeed();

  // Нижняя навигация
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const nav = btn.dataset.nav;
      setActiveNav(nav);
      if (nav === 'feed') { S.currentFilter = 'all'; save(); renderFeed(); document.getElementById('feed').scrollTop = 0; }
      else if (nav === 'notifications') openNotifications();
      else if (nav === 'create') { setActiveNav('feed'); openCreate(); }
      else if (nav === 'trends') openTrends();
      else if (nav === 'me') openProfile();
    });
  });

  // Поиск
  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderFeed, 200);
  });
}

/* ============================================================
   API
   ============================================================ */
const App = {
  toggleLike, toggleComments, addComment, share, postMenu, deletePost,
  setFilter, openCreate, previewVideo, publishPost, openProfile, resetAll,
  openNotifications, openTrends, closeSheet, openSheet: showSheet,
};

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
