<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyOS — личная операционная система</title>
<style>
  /* ================= БАЗА ================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  input, textarea, select { user-select: text; }
  svg { display: block; }
  button { font-family: inherit; }

  /* ================= ТЕМЫ ================= */
  body.theme-dark {
    --bg: #000000;
    --fg: #ffffff;
    --panel: #0b0b0b;
    --panel2: #131313;
    --border: #2e2e2e;
    --border-strong: #6b6b6b;
    --hover: #1c1c1c;
    --wall: rgba(255,255,255,.06);
    --shadow: rgba(0,0,0,.85);
  }
  body.theme-light {
    --bg: #ffffff;
    --fg: #000000;
    --panel: #ffffff;
    --panel2: #f4f4f4;
    --border: #cfcfcf;
    --border-strong: #8a8a8a;
    --hover: #ececec;
    --wall: rgba(0,0,0,.08);
    --shadow: rgba(0,0,0,.18);
  }

  /* ================= РАБОЧИЙ СТОЛ ================= */
  #desktop {
    position: fixed;
    left: 0; right: 0; top: 0; bottom: 48px;
    overflow: hidden;
    background-color: var(--bg);
  }
  #desktop.wall-grid {
    background-image:
      linear-gradient(var(--wall) 1px, transparent 1px),
      linear-gradient(90deg, var(--wall) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  #desktop.wall-dots {
    background-image: radial-gradient(var(--wall) 1.2px, transparent 1.2px);
    background-size: 24px 24px;
  }
  #desktop.wall-none { background-image: none; }

  #icons {
    position: absolute;
    inset: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 6px;
  }

  .desk-icon {
    width: 92px;
    padding: 10px 4px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--fg);
    font-size: 12px;
    line-height: 1.2;
    cursor: pointer;
    text-align: center;
    transition: background .12s, border-color .12s;
  }
  .desk-icon:hover { background: var(--hover); border-color: var(--border); }
  .desk-icon:active { transform: scale(.97); }
  .desk-icon svg { width: 34px; height: 34px; }
  .desk-icon span { word-break: break-word; }

  #windowLayer { position: absolute; inset: 0; pointer-events: none; }

  /* ================= ОКНА ================= */
  .window {
    position: absolute;
    display: flex;
    flex-direction: column;
    min-width: 260px;
    min-height: 180px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 14px 44px var(--shadow);
    overflow: hidden;
    pointer-events: auto;
    transition: border-color .15s;
  }
  .window.active { border-color: var(--border-strong); }
  .window.maximized {
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    height: 100% !important;
    border-radius: 0;
    border-left: none;
    border-right: none;
  }
  .window.maximized .resizer { display: none; }

  .titlebar {
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px 0 12px;
    background: var(--panel2);
    border-bottom: 1px solid var(--border);
    cursor: grab;
  }
  .titlebar:active { cursor: grabbing; }
  .tb-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    overflow: hidden;
    white-space: nowrap;
  }
  .tb-left svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .tb-title { overflow: hidden; text-overflow: ellipsis; }
  .tb-right { display: flex; gap: 2px; flex: 0 0 auto; }

  .win-btn {
    width: 30px;
    height: 26px;
    display: grid;
    place-items: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--fg);
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .win-btn svg { width: 13px; height: 13px; }
  .win-btn:hover { background: var(--hover); border-color: var(--border); }
  .win-btn.close:hover { background: #e33b3b; border-color: #e33b3b; color: #fff; }

  .win-body { flex: 1; overflow: auto; position: relative; }

  .resizer {
    position: absolute;
    right: 0; bottom: 0;
    width: 16px; height: 16px;
    cursor: nwse-resize;
    z-index: 5;
  }

  /* ================= ПАНЕЛЬ ЗАДАЧ ================= */
  #taskbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 48px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    z-index: 10000;
  }
  .task-start {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-size: 13px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .task-start svg { width: 18px; height: 18px; }
  .task-start:hover, .task-start.on { background: var(--hover); border-color: var(--border-strong); }

  #tasks {
    flex: 1;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    height: 40px;
    align-items: center;
    scrollbar-width: none;
  }
  #tasks::-webkit-scrollbar { display: none; }

  .task {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    max-width: 190px;
    padding: 0 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-size: 12px;
    cursor: pointer;
    flex: 0 0 auto;
    opacity: .7;
    transition: opacity .12s, background .12s;
  }
  .task svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .task span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task:hover { background: var(--hover); opacity: 1; }
  .task.active { background: var(--hover); border-color: var(--border-strong); opacity: 1; }

  #tray {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 0 12px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .5px;
  }

  /* ================= МЕНЮ ПУСК ================= */
  #startMenu {
    position: fixed;
    left: 8px;
    bottom: 56px;
    width: 300px;
    max-height: 70vh;
    overflow-y: auto;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 14px 44px var(--shadow);
    z-index: 10001;
    display: none;
  }
  #startMenu.open { display: block; animation: pop .13s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .start-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 12px 12px;
    font-size: 14px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .start-head span { font-size: 11px; font-weight: 400; opacity: .55; }

  .start-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--fg);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  .start-item svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .start-item:hover { background: var(--hover); border-color: var(--border); }

  .start-sep { height: 1px; background: var(--border); margin: 8px 4px; }

  /* ================= ОБЩИЕ ЭЛЕМЕНТЫ ================= */
  .btn {
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font-size: 13px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--hover); border-color: var(--border-strong); }
  .btn:active { transform: scale(.97); }

  .inp {
    padding: 7px 10px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .inp:focus { border-color: var(--border-strong); }

  /* ================= КАЛЬКУЛЯТОР ================= */
  .calc { display: flex; flex-direction: column; height: 100%; gap: 10px; padding: 12px; }
  .calc-screen {
    flex: 0 0 auto;
    padding: 10px 14px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: right;
  }
  .calc-expr { font-size: 12px; opacity: .55; min-height: 16px; word-break: break-all; }
  .calc-cur { font-size: 30px; font-weight: 600; word-break: break-all; line-height: 1.25; }
  .calc-pad { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; min-height: 0; }
  .cb {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-size: 16px;
    cursor: pointer;
    transition: background .1s, border-color .1s;
  }
  .cb:hover { background: var(--hover); border-color: var(--border-strong); }
  .cb:active { transform: scale(.95); }
  .cb.op { border-color: var(--border-strong); font-size: 18px; }
  .cb.fn { opacity: .75; font-size: 14px; }
  .cb.eq { border-color: var(--border-strong); border-width: 2px; font-weight: 700; }

  /* ================= БЛОКНОТ ================= */
  .pad { display: flex; flex-direction: column; height: 100%; gap: 10px; padding: 12px; }
  .pad-toolbar { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .pad-status { font-size: 12px; opacity: .55; margin-left: auto; }
  .pad-area {
    flex: 1;
    min-height: 0;
    resize: none;
    padding: 12px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.55;
    outline: none;
  }
  .pad-area:focus { border-color: var(--border-strong); }

  /* ================= ТЕРМИНАЛ ================= */
  .term {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 12px;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  .term-out { flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .term-out .err { opacity: .7; }
  .term-line {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 8px;
    margin-top: 8px;
    border-top: 1px solid var(--border);
  }
  .term-prompt { opacity: .65; white-space: nowrap; }
  .term-in {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: inherit;
    font-size: inherit;
  }

  /* ================= ФАЙЛЫ ================= */
  .files { display: flex; flex-direction: column; height: 100%; gap: 10px; padding: 12px; }
  .files-bar { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .files-path {
    flex: 1;
    font-size: 12px;
    opacity: .65;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .files-main { flex: 1; min-height: 0; display: flex; gap: 10px; }
  .files-list {
    flex: 1 1 55%;
    min-width: 0;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
  }
  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .file-item:hover { background: var(--hover); }
  .file-item svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .fi-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 14px; font-size: 12px; opacity: .5; text-align: center; }
  .files-view {
    flex: 1 1 45%;
    min-width: 0;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }
  .fv-title { font-size: 12px; opacity: .6; margin-bottom: 8px; word-break: break-word; }
  .fv-content {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ================= НАСТРОЙКИ ================= */
  .settings { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
  .set-row { display: flex; flex-direction: column; gap: 8px; }
  .set-row > label { font-size: 12px; opacity: .6; }
  .set-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
  .set-ctrl .btn.on { border-color: var(--border-strong); background: var(--hover); }
  .set-note { font-size: 11px; opacity: .45; }

  /* ================= О СИСТЕМЕ ================= */
  .about { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 20px; text-align: center; }
  .about svg { width: 64px; height: 64px; }
  .about h2 { font-size: 20px; font-weight: 600; }
  .about p { font-size: 13px; opacity: .65; line-height: 1.6; max-width: 320px; }
  .about .ver { font-size: 11px; opacity: .4; }

  /* ================= СКРОЛЛБАРЫ ================= */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
</style>
</head>
<body class="theme-dark">

<div id="desktop" class="wall-grid">
  <div id="icons"></div>
  <div id="windowLayer"></div>
</div>

<div id="taskbar">
  <button id="startBtn" class="task-start" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
    <span>Пуск</span>
  </button>
  <div id="tasks"></div>
  <div id="tray"><div id="clock">--:--:--</div></div>
</div>

<div id="startMenu"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     ИКОНКИ (SVG-контуры)
     ============================================================ */
  var ICONS = {
    folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h3.6l2 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
    note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
    calc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="7.5" y="5.5" width="9" height="3.5" rx="1"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"/></svg>',
    term: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M6 9l3 3-3 3M13 15h5"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg>',
    min: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
    max: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  /* ============================================================
     УТИЛИТЫ
     ============================================================ */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var DEFAULT_SETTINGS = { theme: 'dark', user: 'user', wall: 'grid' };

  function getSettings() {
    try {
      var raw = localStorage.getItem('myos.settings');
      if (!raw) return Object.assign({}, DEFAULT_SETTINGS);
      var parsed = JSON.parse(raw);
      return Object.assign({}, DEFAULT_SETTINGS, parsed);
    } catch (e) {
      return Object.assign({}, DEFAULT_SETTINGS);
    }
  }

  function saveSettings(s) {
    try { localStorage.setItem('myos.settings', JSON.stringify(s)); } catch (e) { /* ignore */ }
  }

  function applySettings(s) {
    document.body.classList.toggle('theme-dark', s.theme === 'dark');
    document.body.classList.toggle('theme-light', s.theme === 'light');
    var d = document.getElementById('desktop');
    d.classList.remove('wall-grid', 'wall-dots', 'wall-none');
    d.classList.add('wall-' + (s.wall || 'grid'));
  }

  /* ============================================================
     ПРИЛОЖЕНИЯ
     ============================================================ */

  /* ---------- КАЛЬКУЛЯТОР ---------- */
  function renderCalc(body) {
    var cur = '0', acc = null, op = null, fresh = true;

    body.innerHTML =
      '<div class="calc">' +
        '<div class="calc-screen">' +
          '<div class="calc-expr"></div>' +
          '<div class="calc-cur">0</div>' +
        '</div>' +
        '<div class="calc-pad">' +
          '<button class="cb fn" data-k="C" type="button">C</button>' +
          '<button class="cb fn" data-k="back" type="button">⌫</button>' +
          '<button class="cb fn" data-k="%" type="button">%</button>' +
          '<button class="cb op" data-k="/" type="button">÷</button>' +

          '<button class="cb" data-k="7" type="button">7</button>' +
          '<button class="cb" data-k="8" type="button">8</button>' +
          '<button class="cb" data-k="9" type="button">9</button>' +
          '<button class="cb op" data-k="*" type="button">×</button>' +

          '<button class="cb" data-k="4" type="button">4</button>' +
          '<button class="cb" data-k="5" type="button">5</button>' +
          '<button class="cb" data-k="6" type="button">6</button>' +
          '<button class="cb op" data-k="-" type="button">−</button>' +

          '<button class="cb" data-k="1" type="button">1</button>' +
          '<button class="cb" data-k="2" type="button">2</button>' +
          '<button class="cb" data-k="3" type="button">3</button>' +
          '<button class="cb op" data-k="+" type="button">+</button>' +

          '<button class="cb fn" data-k="sign" type="button">±</button>' +
          '<button class="cb" data-k="0" type="button">0</button>' +
          '<button class="cb" data-k="." type="button">.</button>' +
          '<button class="cb eq" data-k="=" type="button">=</button>' +
        '</div>' +
      '</div>';

    var curEl = body.querySelector('.calc-cur');
    var exprEl = body.querySelector('.calc-expr');

    function fmt(n) {
      if (typeof n !== 'number' || !isFinite(n)) return 'Ошибка';
      var r = Math.round(n * 1e10) / 1e10;
      var s = String(r);
      if (s.length > 16 && s.indexOf('e') === -1) s = r.toExponential(6);
      return s;
    }

    function sym(o) {
      return o === '*' ? '×' : o === '/' ? '÷' : o === '-' ? '−' : o;
    }

    function compute(a, b, o) {
      if (o === '+') return a + b;
      if (o === '-') return a - b;
      if (o === '*') return a * b;
      if (o === '/') return b === 0 ? null : a / b;
      return b;
    }

    function update() {
      curEl.textContent = cur;
    }

    function setError() {
      cur = 'Ошибка';
      acc = null;
      op = null;
      fresh = true;
      exprEl.textContent = '';
      update();
    }

    function digit(d) {
      if (cur === 'Ошибка') { cur = '0'; acc = null; op = null; fresh = true; }
      if (fresh) {
        cur = (d === '.') ? '0.' : d;
        fresh = false;
      } else {
        if (d === '.' && cur.indexOf('.') !== -1) return;
        var digits = cur.replace('-', '').replace('.', '');
        if (digits.length >= 13 && d !== '.') return;
        cur = (cur === '0' && d !== '.') ? d : (cur + d);
      }
      update();
    }

    function chooseOp(o) {
      if (cur === 'Ошибка') return;
      var val = parseFloat(cur);
      if (op !== null && !fresh) {
        var r = compute(acc, val, op);
        if (r === null || !isFinite(r)) { setError(); return; }
        acc = r;
        cur = fmt(r);
      } else {
        acc = val;
      }
      op = o;
      fresh = true;
      exprEl.textContent = fmt(acc) + ' ' + sym(o);
      update();
    }

    function equals() {
      if (op === null || cur === 'Ошибка') return;
      var val = parseFloat(cur);
      var r = compute(acc, val, op);
      exprEl.textContent = fmt(acc) + ' ' + sym(op) + ' ' + fmt(val) + ' =';
      if (r === null || !isFinite(r)) { setError(); return; }
      cur = fmt(r);
      acc = null;
      op = null;
      fresh = true;
      update();
    }

    function clearAll() {
      cur = '0'; acc = null; op = null; fresh = true;
      exprEl.textContent = '';
      update();
    }

    function backspace() {
      if (cur === 'Ошибка') { clearAll(); return; }
      if (fresh) return;
      cur = cur.slice(0, -1);
      if (cur === '' || cur === '-' ) cur = '0';
      update();
    }

    function percent() {
      if (cur === 'Ошибка') return;
      cur = fmt(parseFloat(cur) / 100);
      fresh = true;
      update();
    }

    function sign() {
      if (cur === 'Ошибка' || cur === '0') return;
      cur = cur.charAt(0) === '-' ? cur.slice(1) : '-' + cur;
      update();
    }

    body.querySelector('.calc-pad').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-k]');
      if (!btn) return;
      var k = btn.getAttribute('data-k');
      if (k >= '0' && k <= '9') { digit(k); return; }
      if (k === '.') { digit('.'); return; }
      if (k === '+' || k === '-' || k === '*' || k === '/') { chooseOp(k); return; }
      if (k === '=') { equals(); return; }
      if (k === 'C') { clearAll(); return; }
      if (k === 'back') { backspace(); return; }
      if (k === '%') { percent(); return; }
      if (k === 'sign') { sign(); return; }
    });

    /* поддержка клавиатуры */
    body.tabIndex = 0;
    body.addEventListener('keydown', function (e) {
      var k = e.key;
      if (k >= '0' && k <= '9') { digit(k); e.preventDefault(); }
      else if (k === '.' || k === ',') { digit('.'); e.preventDefault(); }
      else if (k === '+' || k === '-' || k === '*' || k === '/') { chooseOp(k); e.preventDefault(); }
      else if (k === 'Enter' || k === '=') { equals(); e.preventDefault(); }
      else if (k === 'Backspace') { backspace(); e.preventDefault(); }
      else if (k === 'Escape') { clearAll(); e.preventDefault(); }
      else if (k === '%') { percent(); e.preventDefault(); }
    });
    setTimeout(function () { body.focus(); }, 0);
  }

  /* ---------- ТЕРМИНАЛ ---------- */
  function renderTerminal(body) {
    var s = getSettings();
    var promptText = s.user + '@myos:~$';

    body.innerHTML =
      '<div class="term">' +
        '<div class="term-out"></div>' +
        '<div class="term-line">' +
          '<span class="term-prompt"></span>' +
          '<input class="term-in" type="text" autocomplete="off" spellcheck="false">' +
        '</div>' +
      '</div>';

    var out = body.querySelector('.term-out');
    var input = body.querySelector('.term-in');
    var promptEl = body.querySelector('.term-prompt');
    promptEl.textContent = promptText;

    function print(text, cls) {
      var d = document.createElement('div');
      if (cls) d.className = cls;
      d.textContent = text;
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    }

    print('MyOS Terminal v1.0');
    print('Введите "help" для списка команд.');
    print('');

    function run(raw) {
      var parts = raw.split(/\s+/);
      var cmd = (parts[0] || '').toLowerCase();
      var rest = raw.slice(parts[0].length).trim();

      switch (cmd) {
        case '':
          break;

        case 'help':
          print('Доступные команды:');
          print('  help              — этот список');
          print('  echo <текст>      — вывести текст');
          print('  date              — текущая дата');
          print('  time              — текущее время');
          print('  whoami            — имя пользователя');
          print('  ls                — список приложений');
          print('  open <app>        — открыть приложение');
          print('  theme dark|light  — сменить тему');
          print('  clear             — очистить экран');
          print('  about             — о системе');
          print('Приложения: ' + APP_ORDER.join(', '));
          break;

        case 'echo':
          print(rest);
          break;

        case 'date':
          print(new Date().toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }));
          break;

        case 'time':
          print(new Date().toLocaleTimeString('ru-RU'));
          break;

        case 'whoami':
          print(getSettings().user);
          break;

        case 'ls':
          APP_ORDER.forEach(function (id) { print('  ' + id + '  —  ' + APPS[id].title); });
          break;

        case 'open': {
          var key = (parts[1] || '').toLowerCase();
          if (!key) { print('Использование: open <app>', 'err'); break; }
          if (!APPS[key]) { print('Приложение "' + key + '" не найдено.', 'err'); break; }
          openApp(key);
          print('Запуск: ' + APPS[key].title);
          break;
        }

        case 'theme': {
          var t = (parts[1] || '').toLowerCase();
          if (t !== 'dark' && t !== 'light') { print('Использование: theme dark|light', 'err'); break; }
          var st = getSettings();
          st.theme = t;
          saveSettings(st);
          applySettings(st);
          print('Тема изменена на "' + t + '".');
          break;
        }

        case 'clear':
          out.innerHTML = '';
          break;

        case 'about':
          print('MyOS v1.0 — личная операционная система в браузере.');
          print('Ядро: HTML + CSS + JavaScript. Никаких зависимостей.');
          break;

        default:
          print('Команда не найдена: ' + cmd + '. Введите "help".', 'err');
      }
    }

    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var value = input.value.trim();
      input.value = '';
      print(promptText + ' ' + value);
      run(value);
    });

    setTimeout(function () { input.focus(); }, 0);
    body.addEventListener('click', function (e) {
      if (window.getSelection().toString() === '') input.focus();
      if (e.target === body) input.focus();
    });
  }

  function renderFiles(body) {
    var stack = [FS];

    var pathEl = body.querySelector('.files-path');
    var viewEl = body.querySelector('.files-view');
    var upBtn = body.querySelector('[data-act="up"]');

    function current() { return stack[stack.length - 1]; }

    function render() {
      var dir = current();
      pathEl.textContent = stack.map(function (n) { return n.name; }).join('  /  ');
      upBtn.disabled = stack.length <= 1;
      upBtn.style.opacity = stack.length <= 1 ? '0.4' : '1';
      upBtn.style.cursor = stack.length <= 1 ? 'default' : 'pointer';

      listEl.innerHTML = '';

      if (!dir.children || dir.children.length === 0) {
        var e = document.createElement('div');
        e.className = 'empty';
        e.textContent = 'Папка пуста';
        listEl.appendChild(e);
        return;
      }

      dir.children.forEach(function (item) {
        var row = document.createElement('div');
        row.className = 'file-item';
        row.innerHTML = (item.type === 'dir' ? ICONS.folder : ICONS.file) +
                        '<span class="fi-name">' + escapeHtml(item.name) + '</span>';
        row.addEventListener('click', function () {
          if (item.type === 'dir') {
            stack.push(item);
            viewEl.innerHTML = '<div class="empty">Выбери файл</div>';
            render();
          } else {
            viewEl.innerHTML =
              '<div class="fv-title">' + escapeHtml(item.name) + '</div>' +
              '<pre class="fv-content">' + escapeHtml(item.content || '(пусто)') + '</pre>';
          }
        });
        listEl.appendChild(row);
      });
    }

    upBtn.addEventListener('click', function () {
      if (stack.length > 1) {
        stack.pop();
        viewEl.innerHTML = '<div class="empty">Выбери файл</div>';
        render();
      }
    });

    render();
  }

  /* ============================================================
     РЕЕСТР ПРИЛОЖЕНИЙ
     ============================================================ */
  var APPS = {
    files:    { title: 'Файлы',        icon: ICONS.folder, width: 720, height: 470, render: renderFiles },
    notepad:  { title: 'Блокнот',      icon: ICONS.note,   width: 580, height: 440, render: renderNotepad },
    calc:     { title: 'Калькулятор',  icon: ICONS.calc,   width: 320, height: 460, render: renderCalc },
    terminal: { title: 'Терминал',     icon: ICONS.term,   width: 660, height: 420, render: renderTerminal },
    settings: { title: 'Настройки',    icon: ICONS.gear,   width: 480, height: 430, render: renderSettings },
    about:    { title: 'О системе',    icon: ICONS.info,   width: 440, height: 380, render: renderAbout }
  };

  var APP_ORDER = ['files', 'notepad', 'calc', 'terminal', 'settings', 'about'];

  /* ============================================================
     ОКОННЫЙ МЕНЕДЖЕР
     ============================================================ */
  var windows = [];
  var activeId = null;
  var zCounter = 100;

  var layer = document.getElementById('windowLayer');

  function openApp(appId) {
    var app = APPS[appId];
    if (!app) return;

    var existing = windows.filter(function (w) { return w.appId === appId; })[0];
    if (existing) {
      if (existing.minimized) {
        existing.minimized = false;
        existing.el.style.display = '';
      }
      focusWindow(existing.id);
      return;
    }
    createWindow(appId);
  }

  function createWindow(appId) {
    var app = APPS[appId];
    var id = 'win-' + Date.now() + '-' + Math.floor(Math.random() * 100000);

    var w = Math.min(app.width, Math.max(260, window.innerWidth - 40));
    var h = Math.min(app.height, Math.max(180, window.innerHeight - 100));

    var el = document.createElement('div');
    el.className = 'window';
    el.style.width = w + 'px';
    el.style.height = h + 'px';

    var offset = (windows.length % 6) * 28;
    var left = Math.max(10, Math.round((window.innerWidth - w) / 2) - 80 + offset);
    var top = Math.max(10, Math.round((window.innerHeight - 48 - h) / 2) - 40 + offset);
    el.style.left = left + 'px';
    el.style.top = top + 'px';

    el.innerHTML =
      '<div class="titlebar">' +
        '<div class="tb-left">' + app.icon + '<span class="tb-title">' + escapeHtml(app.title) + '</span></div>' +
        '<div class="tb-right">' +
          '<button class="win-btn" data-act="min" type="button" title="Свернуть">' + ICONS.min + '</button>' +
          '<button class="win-btn" data-act="max" type="button" title="Развернуть">' + ICONS.max + '</button>' +
          '<button class="win-btn close" data-act="close" type="button" title="Закрыть">' + ICONS.close + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="win-body"></div>' +
      '<div class="resizer"></div>';

    layer.appendChild(el);

    var winObj = {
      id: id,
      appId: appId,
      el: el,
      minimized: false,
      maximized: false,
      prevBounds: null
    };
    windows.push(winObj);

    /* --- контент --- */
    var bodyEl = el.querySelector('.win-body');
    try {
      app.render(bodyEl);
    } catch (err) {
      bodyEl.innerHTML = '<div style="padding:16px;font-size:13px;">Ошибка приложения: ' + escapeHtml(err.message) + '</div>';
    }

    /* --- кнопки управления --- */
    el.querySelector('.tb-right').addEventListener('click', function (e) {
      var btn = e.target.closest('.win-btn');
      if (!btn) return;
      var act = btn.getAttribute('data-act');
      if (act === 'min') minimizeWindow(id);
      else if (act === 'max') toggleMaximize(id);
      else if (act === 'close') closeWindow(id);
    });

    /* --- перетаскивание --- */
    var titlebar = el.querySelector('.titlebar');
    titlebar.addEventListener('mousedown', function (e) {
      if (e.target.closest('.win-btn')) return;
      if (winObj.maximized) return;
      if (e.button !== 0) return;
      e.preventDefault();
      focusWindow(id);

      var startX = e.clientX, startY = e.clientY;
      var startL = el.offsetLeft, startT = el.offsetTop;

      function onMove(ev) {
        var nl = startL + (ev.clientX - startX);
        var nt = startT + (ev.clientY - startY);
        var maxL = window.innerWidth - 80;
        var maxT = window.innerHeight - 48 - 36;
        nl = Math.max(-el.offsetWidth + 120, Math.min(maxL, nl));
        nt = Math.max(0, Math.min(maxT, nt));
        el.style.left = nl + 'px';
        el.style.top = nt + 'px';
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    /* --- изменение размера --- */
    var resizer = el.querySelector('.resizer');
    resizer.addEventListener('mousedown', function (e) {
      if (winObj.maximized) return;
      e.preventDefault();
      e.stopPropagation();
      focusWindow(id);

      var startX = e.clientX, startY = e.clientY;
      var startW = el.offsetWidth, startH = el.offsetHeight;

      function onMove(ev) {
        var nw = Math.max(260, startW + (ev.clientX - startX));
        var nh = Math.max(180, startH + (ev.clientY - startY));
        el.style.width = nw + 'px';
        el.style.height = nh + 'px';
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    /* --- фокус по клику --- */
    el.addEventListener('mousedown', function () { focusWindow(id); });

    focusWindow(id);
    renderTasks();
  }

  function focusWindow(id) {
    var w = null;
    for (var i = 0; i < windows.length; i++) {
      if (windows[i].id === id) { w = windows[i]; break; }
    }
    if (!w) return;
    activeId = id;
    zCounter += 1;
    w.el.style.zIndex = String(zCounter);
    windows.forEach(function (x) {
      x.el.classList.toggle('active', x.id === id);
    });
    renderTasks();
  }

  function minimizeWindow(id) {
    var w = null;
    for (var i = 0; i < windows.length; i++) {
      if (windows[i].id === id) { w = windows[i]; break; }
    }
    if (!w) return;
    w.minimized = true;
    w.el.style.display = 'none';
    if (activeId === id) activeId = null;
    renderTasks();
  }

  function toggleMaximize(id) {
    var w = null;
    for (var i = 0; i < windows.length; i++) {
      if (windows[i].id === id) { w = windows[i]; break; }
    }
    if (!w) return;
    var el = w.el;

    if (!w.maximized) {
      w.prevBounds = {
        left: el.style.left,
        top: el.style.top,
        width: el.style.width,
        height: el.style.height
      };
      el.classList.add('maximized');
      w.maximized = true;
    } else {
      el.classList.remove('maximized');
      w.maximized = false;
      if (w.prevBounds) {
        el.style.left = w.prevBounds.left;
        el.style.top = w.prevBounds.top;
        el.style.width = w.prevBounds.width;
        el.style.height = w.prevBounds.height;
      }
    }
    focusWindow(id);
  }

  function closeWindow(id) {
    var idx = -1;
    for (var i = 0; i < windows.length; i++) {
      if (windows[i].id === id) { idx = i; break; }
    }
    if (idx === -1) return;
    var w = windows[idx];
    if (w.el.parentNode) w.el.parentNode.removeChild(w.el);
    windows.splice(idx, 1);
    if (activeId === id) activeId = null;
    renderTasks();
  }

  /* ============================================================
     ПАНЕЛЬ ЗАДАЧ
     ============================================================ */
  var tasksEl = document.getElementById('tasks');

  function renderTasks() {
    tasksEl.innerHTML = '';
    windows.forEach(function (w) {
      var app = APPS[w.appId];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'task' + (w.id === activeId && !w.minimized ? ' active' : '');
      btn.innerHTML = app.icon + '<span>' + escapeHtml(app.title) + '</span>';
      btn.addEventListener('click', function () {
        if (w.minimized) {
          w.minimized = false;
          w.el.style.display = '';
          focusWindow(w.id);
        } else if (w.id === activeId) {
          minimizeWindow(w.id);
        } else {
          focusWindow(w.id);
        }
      });
      tasksEl.appendChild(btn);
    });
  }

  /* ============================================================
     МЕНЮ ПУСК
     ============================================================ */
  var startMenu = document.getElementById('startMenu');
  var startBtn = document.getElementById('startBtn');

  function buildStartMenu() {
    var s = getSettings();
    var html = '<div class="start-head">' + escapeHtml(s.user) + '<span>MyOS v1.0</span></div>';

    APP_ORDER.forEach(function (id) {
      html += '<button class="start-item" data-app="' + id + '" type="button">' +
                APPS[id].icon + '<span>' + escapeHtml(APPS[id].title) + '</span>' +
              '</button>';
    });

    html += '<div class="start-sep"></div>';
    html += '<button class="start-item" data-act="reload" type="button">' +
              ICONS.power + '<span>Перезагрузить оболочку</span>' +
            '</button>';

    startMenu.innerHTML = html;
  }

  startMenu.addEventListener('click', function (e) {
    var appBtn = e.target.closest('[data-app]');
    if (appBtn) {
      openApp(appBtn.getAttribute('data-app'));
      closeStartMenu();
      return;
    }
    var actBtn = e.target.closest('[data-act]');
    if (actBtn && actBtn.getAttribute('data-act') === 'reload') {
      window.location.reload();
    }
  });

  function closeStartMenu() {
    startMenu.classList.remove('open');
    startBtn.classList.remove('on');
  }

  startBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var isOpen = startMenu.classList.contains('open');
    if (isOpen) {
      closeStartMenu();
    } else {
      buildStartMenu();
      startMenu.classList.add('open');
      startBtn.classList.add('on');
    }
  });

  document.addEventListener('click', function (e) {
    if (!startMenu.classList.contains('open')) return;
    if (e.target.closest('#startMenu')) return;
    if (e.target.closest('#startBtn')) return;
    closeStartMenu();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeStartMenu();
  });

  /* ============================================================
     ИКОНКИ РАБОЧЕГО СТОЛА
     ============================================================ */
  function buildDesktopIcons() {
    var cont = document.getElementById('icons');
    cont.innerHTML = '';
    APP_ORDER.forEach(function (id) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'desk-icon';
      btn.innerHTML = APPS[id].icon + '<span>' + escapeHtml(APPS[id].title) + '</span>';
      btn.addEventListener('click', function () { openApp(id); });
      cont.appendChild(btn);
    });
  }

  /* ============================================================
     ЧАСЫ
     ============================================================ */
  var clockEl = document.getElementById('clock');

  function updateClock() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    var ss = String(d.getSeconds()).padStart(2, '0');
    clockEl.textContent = hh + ':' + mm + ':' + ss;
  }

  /* ============================================================
     ПЕРЕСБОРКА UI
     ============================================================ */
  function rebuildUI() {
    buildStartMenu();
    renderTasks();
  }

  /* ============================================================
     СТАРТ
     ============================================================ */
  function init() {
    applySettings(getSettings());
    buildDesktopIcons();
    buildStartMenu();
    updateClock();
    setInterval(updateClock, 1000);
    renderTasks();
  }

  init();

})();
</script>
</body>
</html>
