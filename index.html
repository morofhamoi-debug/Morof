<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyOS — Персональная операционная система</title>
<style>
/* ============================================================
   БАЗА
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;width:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  font-size:14px;line-height:1.4;color:var(--fg);
  background:var(--bg);user-select:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
input,textarea,select,button{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;color:inherit}
svg{display:block;flex:0 0 auto}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-h);background-clip:content-box;border:2px solid transparent}

/* ============================================================
   ТЕМЫ
   ============================================================ */
body.theme-dark{
  --bg:#000;
  --wall:linear-gradient(135deg,#0a0a0f 0%,#131320 45%,#1a1028 100%);
  --fg:#f2f2f5;
  --fg-dim:#9a9aa8;
  --fg-mute:#68687a;
  --panel:rgba(22,22,30,0.72);
  --panel-solid:#16161e;
  --panel-2:#1e1e2a;
  --panel-3:#262634;
  --border:rgba(255,255,255,0.08);
  --border-2:rgba(255,255,255,0.14);
  --border-strong:rgba(255,255,255,0.28);
  --hover:rgba(255,255,255,0.07);
  --active:rgba(255,255,255,0.12);
  --shadow:rgba(0,0,0,0.7);
  --scroll:rgba(255,255,255,0.16);
  --scroll-h:rgba(255,255,255,0.3);
  --accent:#4a8cff;
  --accent-2:#6b9dff;
  --danger:#ff4d5e;
  --success:#3ecf8e;
  --warn:#ffb648;
}
body.theme-light{
  --bg:#f5f5f8;
  --wall:linear-gradient(135deg,#e8eaf0 0%,#f3eef8 50%,#e6ecf7 100%);
  --fg:#16161e;
  --fg-dim:#5a5a6a;
  --fg-mute:#8a8a98;
  --panel:rgba(255,255,255,0.78);
  --panel-solid:#ffffff;
  --panel-2:#f0f0f4;
  --panel-3:#e4e4ec;
  --border:rgba(0,0,0,0.08);
  --border-2:rgba(0,0,0,0.14);
  --border-strong:rgba(0,0,0,0.3);
  --hover:rgba(0,0,0,0.05);
  --active:rgba(0,0,0,0.1);
  --shadow:rgba(0,0,0,0.18);
  --scroll:rgba(0,0,0,0.16);
  --scroll-h:rgba(0,0,0,0.3);
  --accent:#2266dd;
  --accent-2:#4a88f0;
  --danger:#dd2c3c;
  --success:#1fa876;
  --warn:#d98a15;
}

/* ============================================================
   ЭКРАН ЗАГРУЗКИ
   ============================================================ */
#boot{
  position:fixed;inset:0;z-index:99999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;color:#fff;gap:32px;
  transition:opacity .6s ease;
}
#boot.hidden{opacity:0;pointer-events:none}
.boot-logo{width:100px;height:100px;color:#fff;animation:bootPulse 2s ease-in-out infinite}
.boot-logo svg{width:100%;height:100%}
@keyframes bootPulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.boot-brand{font-size:28px;font-weight:200;letter-spacing:14px;padding-left:14px;opacity:.95}
.boot-bar{width:220px;height:3px;background:rgba(255,255,255,0.12);border-radius:2px;overflow:hidden;margin-top:6px}
.boot-bar span{display:block;height:100%;width:0;background:#fff;border-radius:2px;animation:bootFill 2.4s cubic-bezier(.6,.05,.2,1) forwards}
@keyframes bootFill{0%{width:0}60%{width:80%}100%{width:100%}}
.boot-status{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:2px;text-transform:uppercase;margin-top:20px}

/* ============================================================
   ЭКРАН БЛОКИРОВКИ
   ============================================================ */
#lock{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--wall);color:var(--fg);gap:24px;
  transition:opacity .5s ease,transform .5s ease;
  overflow:hidden;
}
#lock.hidden{opacity:0;pointer-events:none;transform:scale(1.05)}
#lock::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(74,140,255,0.15),transparent 60%),
             radial-gradient(circle at 70% 70%,rgba(160,80,255,0.12),transparent 60%);
  pointer-events:none;
}
.lock-time{font-size:96px;font-weight:200;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.lock-date{font-size:16px;opacity:.75;letter-spacing:1px;margin-top:-6px;position:relative;z-index:1}
.lock-user{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  margin-top:40px;cursor:pointer;position:relative;z-index:1;
  transition:transform .2s;
}
.lock-user:hover{transform:translateY(-3px)}
.lock-avatar{
  width:96px;height:96px;border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#a05aff);
  box-shadow:0 8px 32px rgba(74,140,255,0.4);
  font-size:34px;font-weight:600;color:#fff;
}
.lock-name{font-size:18px;font-weight:500}
.lock-hint{font-size:12px;color:var(--fg-dim)}

/* ============================================================
   РАБОЧИЙ СТОЛ
   ============================================================ */
#desktop{
  position:fixed;inset:0 0 52px 0;
  background:var(--wall);
  background-size:cover;background-position:center;
  overflow:hidden;
  transition:opacity .5s ease;
}
#desktop.wall-grid{
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px),
                   var(--wall);
  background-size:48px 48px,48px 48px,cover;
}
#desktop.wall-dots{
  background-image:radial-gradient(rgba(255,255,255,.12) 1.5px,transparent 1.5px),var(--wall);
  background-size:28px 28px,cover;
}
#desktop.wall-aurora{background-image:
  radial-gradient(ellipse at 20% 20%,rgba(74,140,255,.35),transparent 55%),
  radial-gradient(ellipse at 80% 70%,rgba(170,80,255,.3),transparent 55%),
  radial-gradient(ellipse at 50% 100%,rgba(255,80,160,.2),transparent 60%),
  linear-gradient(135deg,#0a0a0f,#131320);}
body.theme-light #desktop.wall-aurora{background-image:
  radial-gradient(ellipse at 20% 20%,rgba(74,140,255,.35),transparent 55%),
  radial-gradient(ellipse at 80% 70%,rgba(170,80,255,.3),transparent 55%),
  linear-gradient(135deg,#e8eaf0,#f3eef8);}
#desktop.wall-none{background-image:none}

#icons{position:absolute;inset:0;padding:16px;pointer-events:none}
.desk-icon{
  position:absolute;width:88px;height:96px;padding:8px 4px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  border:1px solid transparent;border-radius:8px;
  color:#fff;font-size:11.5px;line-height:1.25;text-align:center;
  cursor:pointer;pointer-events:auto;
  transition:background .1s,border-color .1s,transform .1s;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  overflow:hidden;
}
body.theme-light .desk-icon{color:#16161e;text-shadow:0 1px 2px rgba(255,255,255,.7)}
.desk-icon:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
body.theme-light .desk-icon:hover{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.1)}
.desk-icon.selected{background:rgba(74,140,255,.28);border-color:rgba(74,140,255,.65)}
.desk-icon svg{width:38px;height:38px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
body.theme-light .desk-icon svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.desk-icon .lbl{
  width:100%;max-height:32px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-word;
}
.desk-icon .lbl.editing{background:var(--panel-solid);border-radius:3px;padding:1px 2px}

/* Selection box */
#selbox{
  position:absolute;border:1px solid var(--accent);
  background:rgba(74,140,255,.16);pointer-events:none;
  display:none;z-index:5;
}

/* ============================================================
   ОКНА
   ============================================================ */
#windowLayer{position:absolute;inset:0;pointer-events:none}
.window{
  position:absolute;display:flex;flex-direction:column;
  min-width:280px;min-height:180px;
  background:var(--panel-solid);
  border:1px solid var(--border-2);
  border-radius:12px;overflow:hidden;
  box-shadow:0 24px 60px var(--shadow),0 2px 8px rgba(0,0,0,.4);
  pointer-events:auto;
  animation:winOpen .18s cubic-bezier(.2,.9,.3,1.2);
  transition:box-shadow .15s,border-color .15s;
}
@keyframes winOpen{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.window.closing{animation:winClose .14s ease-in forwards}
@keyframes winClose{to{opacity:0;transform:scale(.94)}}
.window.active{border-color:var(--border-strong);box-shadow:0 30px 70px var(--shadow),0 3px 12px rgba(0,0,0,.5)}
.window.maximized{border-radius:0;border-left:none;border-right:none;border-top:none}
.window.minimized{animation:winMin .18s ease forwards}
@keyframes winMin{to{opacity:0;transform:scale(.85) translateY(60px)}}
.window.snapped{transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease}

.titlebar{
  flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 6px 0 14px;
  background:var(--panel-2);border-bottom:1px solid var(--border);
  cursor:grab;
}
.titlebar:active{cursor:grabbing}
.tb-left{display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;min-width:0}
.tb-left svg{width:16px;height:16px;flex:0 0 auto;opacity:.9}
.tb-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;gap:2px;flex:0 0 auto}
.win-btn{
  width:34px;height:28px;display:grid;place-items:center;
  border-radius:6px;color:var(--fg);opacity:.75;
  transition:background .1s,opacity .1s,color .1s;
}
.win-btn svg{width:12px;height:12px}
.win-btn:hover{background:var(--hover);opacity:1}
.win-btn.close:hover{background:var(--danger);color:#fff;opacity:1}
.win-body{flex:1;overflow:auto;position:relative;background:var(--panel-solid)}

.resizer{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5}
.resizer-n{position:absolute;top:0;left:8px;right:8px;height:6px;cursor:ns-resize}
.resizer-s{position:absolute;bottom:0;left:8px;right:8px;height:6px;cursor:ns-resize}
.resizer-w{position:absolute;left:0;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.resizer-e{position:absolute;right:0;top:8px;bottom:8px;width:6px;cursor:ew-resize}

/* Snap preview */
#snapPreview{
  position:absolute;background:rgba(74,140,255,.22);
  border:2px solid var(--accent);border-radius:8px;
  pointer-events:none;display:none;z-index:4;
  transition:all .12s ease;
}

/* ============================================================
   ПАНЕЛЬ ЗАДАЧ
   ============================================================ */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:52px;
  display:flex;align-items:center;gap:6px;padding:0 8px;
  background:var(--panel);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-top:1px solid var(--border);
  z-index:8000;
}

.task-start{
  display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;
  border:1px solid var(--border);border-radius:9px;
  color:var(--fg);font-size:13px;font-weight:500;
  transition:background .12s,border-color .12s;
}
.task-start svg{width:17px;height:17px}
.task-start:hover{background:var(--hover);border-color:var(--border-2)}
.task-start.on{background:var(--active);border-color:var(--border-strong)}

#tasks{
  flex:1;display:flex;gap:6px;align-items:center;
  height:42px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
}
#tasks::-webkit-scrollbar{display:none}

.task{
  position:relative;
  display:flex;align-items:center;gap:8px;
  height:38px;max-width:200px;min-width:38px;
  padding:0 12px;
  border:1px solid var(--border);border-radius:8px;
  font-size:12.5px;cursor:pointer;
  opacity:.75;transition:opacity .12s,background .12s,border-color .12s;
  flex:0 0 auto;
}
.task::after{
  content:'';position:absolute;left:50%;bottom:2px;
  width:4px;height:4px;border-radius:50%;background:var(--accent);
  transform:translateX(-50%) scale(0);transition:transform .18s;
}
.task.active::after{transform:translateX(-50%) scale(1)}
.task svg{width:16px;height:16px;flex:0 0 auto}
.task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task:hover{background:var(--hover);opacity:1;border-color:var(--border-2)}
.task.active{background:var(--hover);border-color:var(--border-2);opacity:1}

#tray{
  display:flex;align-items:center;gap:4px;height:38px;padding:0 4px;
  border:1px solid var(--border);border-radius:8px;
}
.tray-item{
  display:flex;align-items:center;gap:8px;
  height:32px;padding:0 10px;border-radius:6px;
  font-size:12.5px;font-variant-numeric:tabular-nums;
  cursor:pointer;transition:background .12s;
}
.tray-item:hover{background:var(--hover)}
.tray-item svg{width:16px;height:16px;opacity:.85}
#clock{letter-spacing:.3px;font-weight:500}
#dateSmall{font-size:11px;opacity:.6;margin-top:1px}
.tray-clock{display:flex;flex-direction:column;line-height:1.1;align-items:flex-end}

#showDesk{
  width:6px;height:38px;margin-left:4px;border-radius:3px;
  background:var(--border);transition:background .12s;cursor:pointer;
}
#showDesk:hover{background:var(--border-2)}

/* ============================================================
   МЕНЮ ПУСК
   ============================================================ */
#startMenu{
  position:fixed;left:8px;bottom:60px;
  width:520px;max-height:70vh;
  background:var(--panel);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border-2);border-radius:14px;
  box-shadow:0 30px 70px var(--shadow),0 4px 12px rgba(0,0,0,.3);
  z-index:8500;display:none;overflow:hidden;
  flex-direction:column;
}
#startMenu.open{display:flex;animation:menuIn .18s cubic-bezier(.2,.9,.3,1.1)}
@keyframes menuIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

.start-search{
  padding:14px 16px 10px;border-bottom:1px solid var(--border);
}
.start-search input{
  width:100%;height:36px;padding:0 14px;
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:9px;font-size:13px;outline:none;
  transition:border-color .12s;
}
.start-search input:focus{border-color:var(--accent)}

.start-body{display:flex;flex:1;min-height:0}
.start-apps{
  flex:1;padding:12px;overflow-y:auto;
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  align-content:start;
}
.start-app{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 8px;border-radius:9px;
  font-size:12px;text-align:center;color:var(--fg);
  border:1px solid transparent;transition:background .12s,border-color .12s;
  cursor:pointer;
}
.start-app:hover{background:var(--hover);border-color:var(--border)}
.start-app svg{width:30px;height:30px;color:var(--accent-2)}
.start-app span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}

.start-side{
  width:180px;flex:0 0 180px;border-left:1px solid var(--border);
  padding:12px;display:flex;flex-direction:column;gap:2px;
  overflow-y:auto;
}
.start-user{
  display:flex;align-items:center;gap:10px;padding:8px 6px 14px;
  border-bottom:1px solid var(--border);margin-bottom:8px;
}
.start-user .av{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#a05aff);
  display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;
}
.start-user .un{font-size:13px;font-weight:600}
.start-user .ud{font-size:10.5px;opacity:.55}
.start-side-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:7px;font-size:12.5px;
  cursor:pointer;transition:background .12s;
}
.start-side-item:hover{background:var(--hover)}
.start-side-item svg{width:15px;height:15px;opacity:.85}
.start-side-item.danger:hover{background:rgba(255,77,94,.15);color:var(--danger)}
.start-side-item.danger:hover svg{color:var(--danger)}

.start-foot{
  padding:8px 14px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--fg-mute);
}
.start-foot .btns{display:flex;gap:4px}
.start-foot button{
  width:32px;height:32px;display:grid;place-items:center;border-radius:7px;
  color:var(--fg);transition:background .12s;
}
.start-foot button svg{width:15px;height:15px}
.start-foot button:hover{background:var(--hover)}

/* ============================================================
   КОНТЕКСТНОЕ МЕНЮ
   ============================================================ */
#ctxMenu{
  position:fixed;z-index:10000;min-width:210px;
  padding:6px;
  background:var(--panel);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border-2);border-radius:10px;
  box-shadow:0 20px 50px var(--shadow),0 4px 12px rgba(0,0,0,.3);
  display:none;font-size:13px;
  animation:ctxIn .1s ease-out;
}
#ctxMenu.open{display:block}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ctx-item{
  display:flex;align-items:center;gap:12px;
  padding:8px 12px;border-radius:6px;
  cursor:pointer;color:var(--fg);
  transition:background .08s;
}
.ctx-item:hover{background:var(--hover)}
.ctx-item.danger:hover{background:rgba(255,77,94,.18);color:var(--danger)}
.ctx-item.disabled{opacity:.35;pointer-events:none}
.ctx-item svg{width:15px;height:15px;opacity:.85;flex:0 0 auto}
.ctx-item .lbl{flex:1}
.ctx-item .short{font-size:11px;opacity:.5}
.ctx-item .arrow{margin-left:auto;width:11px;height:11px;opacity:.5}
.ctx-sep{height:1px;background:var(--border);margin:5px 8px}
.ctx-sub{position:relative}
.ctx-submenu{
  position:absolute;left:100%;top:-6px;margin-left:2px;
  padding:6px;min-width:170px;
  background:var(--panel);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border-2);border-radius:10px;
  box-shadow:0 20px 50px var(--shadow);
  display:none;
}
.ctx-sub:hover>.ctx-submenu{display:block}

/* ============================================================
   УВЕДОМЛЕНИЯ
   ============================================================ */
#notifs{
  position:fixed;right:14px;bottom:64px;
  display:flex;flex-direction:column;gap:10px;
  z-index:9000;width:320px;pointer-events:none;
}
.notif{
  pointer-events:auto;
  display:flex;gap:12px;padding:14px;
  background:var(--panel);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border-2);border-radius:12px;
  box-shadow:0 20px 50px var(--shadow);
  animation:notifIn .3s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes notifIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.notif.out{animation:notifOut .25s ease-in forwards}
@keyframes notifOut{to{opacity:0;transform:translateX(30px);margin-bottom:-80px}}
.notif-ic{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border-radius:8px;background:var(--panel-3);color:var(--accent-2)}
.notif-ic svg{width:18px;height:18px}
.notif-body{flex:1;min-width:0}
.notif-title{font-size:13px;font-weight:600;margin-bottom:3px}
.notif-text{font-size:12px;opacity:.75;word-break:break-word;line-height:1.4}

/* ============================================================
   ALT-TAB SWITCHER
   ============================================================ */
#switcher{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  padding:18px;background:var(--panel);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border-2);border-radius:14px;
  box-shadow:0 30px 70px var(--shadow);
  display:none;z-index:9500;gap:10px;
}
#switcher.open{display:flex}
.sw-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:16px;border-radius:10px;border:2px solid transparent;
  width:100px;cursor:pointer;transition:background .12s;
}
.sw-item svg{width:38px;height:38px}
.sw-item span{font-size:11px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sw-item.on{background:var(--hover);border-color:var(--accent)}

/* ============================================================
   ОБЩИЕ ЭЛЕМЕНТЫ В ПРИЛОЖЕНИЯХ
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:7px;
  font-size:12.5px;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--panel-3);border-color:var(--border-2)}
.btn:active{transform:scale(.97)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--danger);border-color:rgba(255,77,94,.3)}
.btn.danger:hover{background:rgba(255,77,94,.15)}

.inp{
  padding:7px 11px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:7px;
  font-size:13px;outline:none;color:var(--fg);
  transition:border-color .12s,background .12s;
}
.inp:focus{border-color:var(--accent);background:var(--panel-solid)}

/* ============================================================
   ПРИЛОЖЕНИЯ
   ============================================================ */

/* Файлы */
.files{display:flex;flex-direction:column;height:100%;background:var(--panel-solid)}
.files-bar{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--border);background:var(--panel-2);
}
.files-bar .nav-btn{
  width:30px;height:30px;display:grid;place-items:center;
  border-radius:6px;color:var(--fg);opacity:.75;
}
.files-bar .nav-btn svg{width:15px;height:15px}
.files-bar .nav-btn:hover{background:var(--hover);opacity:1}
.files-bar .nav-btn:disabled{opacity:.25;cursor:default}
.files-bar .nav-btn:disabled:hover{background:none}
.files-path{
  flex:1;font-size:12.5px;padding:6px 12px;
  background:var(--panel-solid);border:1px solid var(--border);
  border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--fg-dim);
}
.files-bar .btn{padding:5px 10px;font-size:12px}
.files-main{flex:1;display:flex;min-height:0}
.files-side{
  width:180px;flex:0 0 180px;border-right:1px solid var(--border);
  padding:8px;overflow-y:auto;background:var(--panel-2);
}
.files-side .sb-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 9px;border-radius:6px;font-size:12.5px;
  cursor:pointer;color:var(--fg-dim);transition:background .12s;
}
.files-side .sb-item svg{width:15px;height:15px}
.files-side .sb-item:hover{background:var(--hover);color:var(--fg)}
.files-side .sb-item.on{background:var(--hover);color:var(--fg)}
.files-list{flex:1;padding:14px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;position:relative}
.files-list.drag-over{background:rgba(74,140,255,.08)}
.files-empty{width:100%;padding:40px;text-align:center;color:var(--fg-mute);font-size:13px}
.f-item{
  width:98px;height:96px;padding:10px 6px 8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  border:1px solid transparent;border-radius:8px;
  text-align:center;font-size:12px;cursor:pointer;
  transition:background .1s,border-color .1s;
}
.f-item:hover{background:var(--hover);border-color:var(--border)}
.f-item.selected{background:rgba(74,140,255,.2);border-color:rgba(74,140,255,.5)}
.f-item svg{width:34px;height:34px;color:var(--accent-2)}
.f-item .fname{
  max-width:100%;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  word-break:break-word;line-height:1.2;
}
.f-item .fname.editing{
  background:var(--panel-solid);border:1px solid var(--accent);
  border-radius:3px;padding:1px 3px;outline:none;cursor:text;
  -webkit-line-clamp:unset;display:block;
}

/* Блокнот */
.pad{display:flex;flex-direction:column;height:100%;background:var(--panel-solid)}
.pad-bar{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-bottom:1px solid var(--border);background:var(--panel-2);
}
.pad-bar .btn{padding:5px 10px;font-size:12px}
.pad-info{margin-left:auto;font-size:11px;opacity:.55;padding-right:4px}
.pad-area{
  flex:1;padding:14px 18px;border:none;outline:none;resize:none;
  background:var(--panel-solid);color:var(--fg);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.6;
}

/* Калькулятор */
.calc{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px;background:var(--panel-solid)}
.calc-scr{
  padding:14px 16px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:10px;
  text-align:right;overflow:hidden;
}
.calc-expr{font-size:12px;color:var(--fg-mute);min-height:16px;word-break:break-all}
.calc-cur{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.1;letter-spacing:-.5px}
.calc-pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-height:0}
.cb{
  background:var(--panel-2);border:1px solid var(--border);border-radius:9px;
  font-size:16px;font-weight:400;color:var(--fg);
  transition:background .1s,transform .05s;
}
.cb:hover{background:var(--panel-3)}
.cb:active{transform:scale(.95)}
.cb.op{color:var(--accent-2);font-size:18px}
.cb.fn{font-size:13px;color:var(--fg-dim)}
.cb.eq{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.cb.eq:hover{background:var(--accent-2);border-color:var(--accent-2)}

/* Терминал */
.term{
  display:flex;flex-direction:column;height:100%;padding:14px;
  background:#0b0b12;color:#e8e8ee;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.55;
}
body.theme-light .term{background:#16161e;color:#e0e0e8}
.term-out{flex:1;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.term-out .err{color:#ff6b7a}
.term-out .ok{color:#4ee6a0}
.term-out .info{color:#6ba8ff}
.term-line{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);margin-top:8px}
.term-prompt{color:#4ee6a0;white-space:nowrap}
.term-in{
  flex:1;background:transparent;border:none;outline:none;
  color:inherit;font-family:inherit;font-size:inherit;
}

/* Настройки */
.set{display:flex;flex-direction:column;gap:2px;padding:8px;background:var(--panel-solid);min-height:100%}
.set-sec{margin-bottom:8px}
.set-sec-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--fg-mute);padding:10px 12px 6px}
.set-item{
  display:flex;align-items:center;gap:14px;
  padding:12px 14px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:9px;margin-bottom:6px;
}
.set-ic{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border-radius:8px;background:var(--panel-3);color:var(--accent-2)}
.set-ic svg{width:17px;height:17px}
.set-txt{flex:1;min-width:0}
.set-txt h4{font-size:13px;font-weight:500;margin-bottom:2px}
.set-txt p{font-size:11.5px;color:var(--fg-mute);word-break:break-word}
.set-ctrl{display:flex;gap:6px;flex-wrap:wrap}
.set-ctrl .btn{padding:5px 10px;font-size:12px}
.set-ctrl .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.set-ctrl input.inp{min-width:120px;height:30px;padding:0 10px;font-size:12px}
.set-ctrl .swatches{display:flex;gap:6px}
.swatch{
  width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .1s;
}
.swatch:hover{transform:scale(1.1)}
.swatch.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel-solid) inset}

/* Paint */
.paint{display:flex;flex-direction:column;height:100%;background:var(--panel-solid)}
.paint-bar{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--panel-2);border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.paint-bar .tool{
  width:30px;height:30px;display:grid;place-items:center;
  border-radius:6px;border:1px solid transparent;color:var(--fg);opacity:.7;
}
.paint-bar .tool svg{width:15px;height:15px}
.paint-bar .tool:hover{background:var(--hover);opacity:1}
.paint-bar .tool.on{background:var(--hover);border-color:var(--accent);opacity:1;color:var(--accent-2)}
.paint-bar .sep{width:1px;height:22px;background:var(--border);margin:0 4px}
.paint-bar .colors{display:flex;gap:4px}
.paint-bar .c{
  width:20px;height:20px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .1s;
}
.paint-bar .c:hover{transform:scale(1.15)}
.paint-bar .c.on{border-color:var(--fg);transform:scale(1.1)}
.paint-bar input[type=range]{width:80px;accent-color:var(--accent)}
.paint-canvas-wrap{flex:1;overflow:auto;background:
  repeating-conic-gradient(#e8e8ee 0 25%,#fff 0 50%) 50%/20px 20px;}
body.theme-dark .paint-canvas-wrap{background:
  repeating-conic-gradient(#1a1a24 0 25%,#22222e 0 50%) 50%/20px 20px;}
.paint-canvas-wrap canvas{display:block;margin:14px;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.4);background:#fff;cursor:crosshair}

/* Minesweeper */
.mines{display:flex;flex-direction:column;height:100%;background:var(--panel-solid);align-items:center;justify-content:center;gap:14px;padding:16px}
.mines-top{display:flex;align-items:center;gap:20px;padding:12px 18px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px}
.mines-top .info{font-size:15px;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
.mines-top .info b{color:var(--accent-2);font-weight:600}
.mines-grid{
  display:grid;gap:2px;padding:6px;
  background:var(--panel-3);border-radius:10px;
}
.ms-cell{
  width:30px;height:30px;display:grid;place-items:center;
  background:var(--panel-2);border:1px solid var(--border);
  border-radius:5px;font-size:14px;font-weight:700;
  font-family:ui-monospace,monospace;
  cursor:pointer;user-select:none;
  transition:background .1s,transform .05s;
}
.ms-cell:hover{background:var(--panel-3)}
.ms-cell:active{transform:scale(.94)}
.ms-cell.open{background:var(--panel-solid);border-color:var(--border);cursor:default}
.ms-cell.flag{color:var(--warn)}
.ms-cell.mine{background:rgba(255,77,94,.3)}
.ms-cell.mine.revealed{background:var(--danger);color:#fff}
.ms-cell.n1{color:#4a8cff}.ms-cell.n2{color:#3ecf8e}.ms-cell.n3{color:#ff4d5e}
.ms-cell.n4{color:#a05aff}.ms-cell.n5{color:#ffb648}.ms-cell.n6{color:#3ecfcf}
.ms-cell.n7{color:#e0e0e8}.ms-cell.n8{color:#8a8a98}
.mines-msg{font-size:15px;font-weight:600;min-height:20px}

/* О системе */
.about{display:flex;flex-direction:column;align-items:center;gap:18px;padding:38px 24px;text-align:center;background:var(--panel-solid)}
.about .logo{
  width:88px;height:88px;display:grid;place-items:center;border-radius:24px;
  background:linear-gradient(135deg,var(--accent),#a05aff);color:#fff;
  box-shadow:0 14px 40px rgba(74,140,255,.4);
}
.about .logo svg{width:48px;height:48px}
.about h2{font-size:24px;font-weight:600;letter-spacing:.5px}
.about p{font-size:13px;color:var(--fg-dim);line-height:1.6;max-width:400px}
.about .ver{font-size:11px;color:var(--fg-mute);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.about .stats{display:flex;gap:24px;margin-top:8px}
.about .stat{text-align:center}
.about .stat b{display:block;font-size:20px;font-weight:600;color:var(--accent-2)}
.about .stat span{font-size:10.5px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:1px}

/* Менеджер задач/Диск */
.manager{padding:14px;background:var(--panel-solid);height:100%;overflow-y:auto}
.manager h3{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--fg)}
.manager table{width:100%;border-collapse:collapse;font-size:12.5px}
.manager th{text-align:left;font-weight:500;color:var(--fg-mute);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:8px 10px;border-bottom:1px solid var(--border)}
.manager td{padding:9px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.manager tr:hover td{background:var(--hover)}
.manager .bar-wrap{width:80px;height:6px;background:var(--panel-3);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.manager .bar{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}

/* Media Player */
.media{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px;background:var(--panel-solid);height:100%;justify-content:center}
.media-art{
  width:180px;height:180px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),#a05aff);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 20px 50px rgba(74,140,255,.4);
  animation:none;
}
.media-art.playing{animation:artSpin 8s linear infinite}
@keyframes artSpin{to{transform:rotate(360deg)}}
.media-art svg{width:72px;height:72px}
.media-title{font-size:16px;font-weight:600}
.media-artist{font-size:12px;color:var(--fg-mute)}
.media-ctrl{display:flex;align-items:center;gap:14px}
.media-ctrl button{
  width:44px;height:44px;border-radius:50%;
  background:var(--panel-2);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--fg);
  transition:background .12s,transform .08s;
}
.media-ctrl button:hover{background:var(--panel-3)}
.media-ctrl button:active{transform:scale(.92)}
.media-ctrl button.play{width:56px;height:56px;background:var(--accent);border-color:var(--accent);color:#fff}
.media-ctrl button.play:hover{background:var(--accent-2)}
.media-ctrl svg{width:18px;height:18px}
.media-ctrl button.play svg{width:22px;height:22px}
.media-keys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px}
.media-keys button{
  padding:8px 14px;background:var(--panel-2);border:1px solid var(--border);
  border-radius:8px;font-size:12.5px;transition:background .12s;
}
.media-keys button:hover{background:var(--panel-3)}
.media-keys button:active{transform:scale(.96)}
.media-keys button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* Календарь (в трее) */
#calPopup{
  position:fixed;right:8px;bottom:60px;
  width:300px;padding:14px;
  background:var(--panel);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--border-2);border-radius:12px;
  box-shadow:0 20px 50px var(--shadow);
  display:none;z-index:8600;
}
#calPopup.open{display:block;animation:menuIn .18s ease-out}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head b{font-size:13px;font-weight:600}
.cal-head button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center}
.cal-head button:hover{background:var(--hover)}
.cal-head button svg{width:13px;height:13px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-grid .cd{
  aspect-ratio:1;display:grid;place-items:center;
  font-size:11.5px;border-radius:6px;color:var(--fg-dim);
  font-variant-numeric:tabular-nums;
}
.cal-grid .hd{color:var(--fg-mute);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.cal-grid .cd.other{opacity:.25}
.cal-grid .cd.today{background:var(--accent);color:#fff;font-weight:600}
.cal-grid .cd:hover:not(.other):not(.hd){background:var(--hover)}

/* Единообразное выделение */
.no-select{user-select:none}
[contenteditable]{outline:none}
</style>
</head>

<script>
(function(){
'use strict';

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function toast(title,text,icon){
  var box=$('#notifs');
  var el=document.createElement('div');
  el.className='notif';
  el.innerHTML=(icon?('<div class="notif-ic">'+icon+'</div>'):'')+
               '<div class="notif-body"><div class="notif-title">'+esc(title)+'</div>'+
               (text?'<div class="notif-text">'+esc(text)+'</div>':'')+'</div>';
  box.appendChild(el);
  setTimeout(function(){
    el.classList.add('out');
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},250);
  },3200);
}

}
function shade(hex,amt){
  var c=hex.replace('#','');
  if(c.length===3) c=c.split('').map(function(x){return x+x}).join('');
  var n=parseInt(c,16);
  var r=Math.min(255,Math.max(0,(n>>16)+amt));
  var g=Math.min(255,Math.max(0,((n>>8)&255)+amt));
  var b=Math.min(255,Math.max(0,(n&255)+amt));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

var DOCS_PATH='Users/user/Documents';

function fsSplit(path){return path.split('/').filter(Boolean)}
function fsResolve(path){
  if(!path) return vfs;
  var parts=fsSplit(path);
  var node=vfs;
  for(var i=0;i<parts.length;i++){
    if(!node||node.type!=='dir'||!node.children) return null;
    node=node.children[parts[i]];
    if(!node) return null;
  }
  return node;
}
function fsParent(path){
  var parts=fsSplit(path);
  var name=parts.pop();
  var parent=parts.length?fsResolve(parts.join('/')):vfs;
  return {parent:parent,name:name};
}
function fsList(path){
  var n=fsResolve(path);
  if(!n||n.type!=='dir') return [];
  var out=[];
  Object.keys(n.children||{}).forEach(function(k){
    out.push(n.children[k]);
  });
  out.sort(function(a,b){
    if(a.type!==b.type) return a.type==='dir'?-1:1;
    return (a.name||'').localeCompare(b.name||'','ru');
  });
  return out;
}
function fsUniqueName(parentPath,base,ext){
  var dir=fsResolve(parentPath);
  if(!dir||dir.type!=='dir') return base;
  var name=ext?(base+ext):base;
  var i=1;
  while(dir.children&&dir.children[name]){
    name=ext?(base+' ('+i+')'+ext):(base+' ('+i+')');
    i++;
  }
  return name;
}
function fsCreate(parentPath,name,type,content){
  var dir=fsResolve(parentPath);
  if(!dir||dir.type!=='dir'){toast('Ошибка','Папка не найдена');return null}
  if(!dir.children) dir.children={};
  if(dir.children[name]){toast('Ошибка','Такое имя уже существует');return null}
  var node={type:type,name:name};
  if(type==='dir') node.children={};
  else node.content=content||'';
  dir.children[name]=node;
  saveFS();
  return node;
}
function fsDelete(path){
  var p=fsParent(path);
  if(!p.parent||!p.parent.children) return false;
  if(!p.parent.children[p.name]) return false;
  delete p.parent.children[p.name];
  saveFS();
  return true;
}
function fsRename(path,newName){
  if(!newName||/[/\\]/.test(newName)) return false;
  var p=fsParent(path);
  if(!p.parent||!p.parent.children) return false;
  if(p.parent.children[newName]){toast('Ошибка','Имя уже занято');return false}
  var node=p.parent.children[p.name];
  if(!node) return false;
  node.name=newName;
  delete p.parent.children[p.name];
  p.parent.children[newName]=node;
  saveFS();
  return true;
}
function fsRead(path){
  var n=fsResolve(path);
  return n&&n.type==='file'?n.content:null;
}
function fsWrite(path,content){
  var n=fsResolve(path);
  if(n&&n.type==='file'){n.content=content;saveFS();return true}
  return false;
}
function fsMove(srcPath,destDir){
  var sp=fsParent(srcPath);
  var node=sp.parent&&sp.parent.children?sp.parent.children[sp.name]:null;
  if(!node) return false;
  var dd=fsResolve(destDir);
  if(!dd||dd.type!=='dir') return false;
  if(!dd.children) dd.children={};
  if(dd.children[node.name]){toast('Ошибка','Файл с таким именем уже есть');return false}
  delete sp.parent.children[sp.name];
  dd.children[node.name]=node;
  saveFS();
  return true;
}

var ctxEl=$('#ctxMenu');
var ctxOpen=false;

function showCtx(items,x,y){
  ctxEl.innerHTML='';
  items.forEach(function(it){
    if(it.sep){var s=document.createElement('div');s.className='ctx-sep';ctxEl.appendChild(s);return;}
    var el=document.createElement('div');
    el.className='ctx-item'+(it.danger?' danger':'')+(it.disabled?' disabled':'');
    el.innerHTML=(it.icon||'')+'<span class="lbl">'+esc(it.label)+'</span>'+
                 (it.shortcut?'<span class="short">'+esc(it.shortcut)+'</span>':'')+
                 (it.sub?('<span class="arrow">'+I.arrowRight+'</span>'):'');
    if(it.sub){
      var sub=document.createElement('div');
      sub.className='ctx-submenu';
      it.sub.forEach(function(s){
        if(s.sep){var s2=document.createElement('div');s2.className='ctx-sep';sub.appendChild(s2);return;}
        var se=document.createElement('div');
        se.className='ctx-item'+(s.danger?' danger':'');
        se.innerHTML=(s.icon||'')+'<span class="lbl">'+esc(s.label)+'</span>';
        se.addEventListener('click',function(e){
          e.stopPropagation();hideCtx();s.action&&s.action();
        });
        sub.appendChild(se);
      });
      el.appendChild(sub);
    } else {
      el.addEventListener('click',function(e){
        e.stopPropagation();
        if(it.disabled) return;
        hideCtx();
        it.action&&it.action();
      });
    }
    ctxEl.appendChild(el);
  });
  ctxEl.classList.add('open');
  var vw=window.innerWidth,vh=window.innerHeight;
  var rect=ctxEl.getBoundingClientRect();
  var w=rect.width,h=rect.height;
  if(x+w>vw-6) x=vw-w-6;
  if(y+h>vh-6) y=vh-h-6;
  ctxEl.style.left=x+'px';
  ctxEl.style.top=y+'px';
  ctxOpen=true;
}
function hideCtx(){ctxEl.classList.remove('open');ctxOpen=false}
document.addEventListener('click',function(){if(ctxOpen)hideCtx()});
document.addEventListener('contextmenu',function(e){
  // Разрешаем дефолт только в полях ввода и textarea
  var t=e.target;
  if(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable) return;
  // Если обработчик не отменил, скрываем дефолт
  if(!t.closest('[data-allow-ctx]')) e.preventDefault();
});
window.addEventListener('blur',hideCtx);
window.addEventListener('resize',hideCtx);

/* ============================================================
   ОКОННЫЙ МЕНЕДЖЕР
   ============================================================ */
var wins=[]; // {id, appId, el, title, icon, minimized, maximized, prevBounds}
var activeWinId=null;
var zTop=100;
var winLayer=$('#windowLayer');
var snapPreview=$('#snapPreview');

function focusWin(id){
  var w=wins.filter(function(x){return x.id===id})[0];
  if(!w) return;
  activeWinId=id;
  zTop++;
  w.el.style.zIndex=zTop;
  wins.forEach(function(x){x.el.classList.toggle('active',x.id===id)});
  renderTasks();
}

function openApp(appId,opts){
  var app=APPS[appId];
  if(!app){toast('Ошибка','Приложение не найдено');return}
  // Синглтон?
  if(app.singleton){
    var existing=wins.filter(function(w){return w.appId===appId})[0];
    if(existing){
      if(existing.minimized){existing.minimized=false;existing.el.style.display='';existing.el.classList.remove('minimized')}
      focusWin(existing.id);
      return existing;
    }
  }
  var w=Math.min(app.width,Math.max(320,window.innerWidth-80));
  var h=Math.min(app.height,Math.max(220,window.innerHeight-140));
  var el=document.createElement('div');
  el.className='window';
  el.style.width=w+'px';
  el.style.height=h+'px';
  var off=(wins.length%7)*26;
  var left=Math.max(20,Math.round((window.innerWidth-w)/2)-60+off);
  var top=Math.max(20,Math.round((window.innerHeight-52-h)/2)-30+off);
  el.style.left=left+'px';
  el.style.top=top+'px';

  var title=app.title;
  if(opts&&opts.title) title=opts.title;

  el.innerHTML=
    '<div class="titlebar">'+
      '<div class="tb-left">'+(app.icon||'')+'<span class="tb-title">'+esc(title)+'</span></div>'+
      '<div class="tb-right">'+
        '<button class="win-btn" data-act="min" type="button" title="Свернуть">'+I.min+'</button>'+
        '<button class="win-btn" data-act="max" type="button" title="Развернуть">'+I.max+'</button>'+
        '<button class="win-btn close" data-act="close" type="button" title="Закрыть">'+I.close+'</button>'+
      '</div>'+
    '</div>'+
    '<div class="win-body"></div>'+
    '<div class="resizer"></div>'+
    '<div class="resizer-n"></div><div class="resizer-s"></div>'+
    '<div class="resizer-w"></div><div class="resizer-e"></div>';

  winLayer.appendChild(el);

  var winObj={
    id:'w_'+uid(),
    appId:appId,
    el:el,
    title:title,
    minimized:false,
    maximized:false,
    prevBounds:null
  };
  wins.push(winObj);

  var body=$('.win-body',el);
  try{app.render(body,winObj,opts||{})}catch(err){
    body.innerHTML='<div style="padding:20px;color:var(--danger);font-size:13px">Ошибка приложения: '+esc(err.message)+'</div>';
    console.error(err);
  }

  // Кнопки окна
  $('.tb-right',el).addEventListener('click',function(e){
    var b=e.target.closest('.win-btn');
    if(!b) return;
    var a=b.getAttribute('data-act');
    if(a==='min') minimizeWin(winObj.id);
    else if(a==='max') toggleMax(winObj.id);
    else if(a==='close') closeWin(winObj.id);
  });

  // Двойной клик по заголовку = maximize
  var tb=$('.titlebar',el);
  tb.addEventListener('dblclick',function(e){
    if(e.target.closest('.win-btn')) return;
    toggleMax(winObj.id);
  });

  // Перетаскивание с прилипанием
  tb.addEventListener('mousedown',function(e){
    if(e.target.closest('.win-btn')) return;
    if(e.button!==0) return;
    e.preventDefault();
    focusWin(winObj.id);

    var sx=e.clientX,sy=e.clientY;
    var ox=el.offsetLeft,oy=el.offsetTop;
    var wasMax=winObj.maximized;
    var startBounds=null;
    if(wasMax){
      // Восстановить при начале drag
      var pct=(e.clientX/window.innerWidth);
      el.classList.remove('maximized');
      el.style.width=winObj.prevBounds?winObj.prevBounds.width:'600px';
      el.style.height=winObj.prevBounds?winObj.prevBounds.height:'400px';
      ox=e.clientX-el.offsetWidth*pct;
      oy=0;
      el.style.left=ox+'px';
      el.style.top=oy+'px';
      winObj.maximized=false;
      sx=e.clientX;sy=e.clientY;
      ox=el.offsetLeft;oy=el.offsetTop;
    }

    var snap=null;
    function onMove(ev){
      var nx=ox+(ev.clientX-sx);
      var ny=oy+(ev.clientY-sy);
      var maxX=window.innerWidth-el.offsetWidth-4;
      var maxY=window.innerHeight-52-el.offsetHeight;
      nx=Math.max(-el.offsetWidth+120,Math.min(maxX,nx));
      ny=Math.max(0,Math.min(maxY,ny));
      el.style.left=nx+'px';
      el.style.top=ny+'px';

      // Snap detection
      var th=18;
      var s=null;
      if(ev.clientY<=th) s='max';
      else if(ev.clientX<=th) s='left';
      else if(ev.clientX>=window.innerWidth-th) s='right';
      if(s!==snap){
        snap=s;
        if(s){
          var rect;
          if(s==='max') rect={left:0,top:0,width:window.innerWidth,height:window.innerHeight-52};
          else if(s==='left') rect={left:0,top:0,width:window.innerWidth/2,height:window.innerHeight-52};
          else rect={left:window.innerWidth/2,top:0,width:window.innerWidth/2,height:window.innerHeight-52};
          snapPreview.style.display='block';
          snapPreview.style.left=rect.left+'px';
          snapPreview.style.top=rect.top+'px';
          snapPreview.style.width=rect.width+'px';
          snapPreview.style.height=rect.height+'px';
        } else {
          snapPreview.style.display='none';
        }
      }
    }
    function onUp(){
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      snapPreview.style.display='none';
      if(snap==='max'){
        if(!winObj.maximized) toggleMax(winObj.id);
      } else if(snap==='left'||snap==='right'){
        if(!winObj.prevBounds){
          winObj.prevBounds={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};
        }
        el.style.left=snap==='left'?'0':(window.innerWidth/2)+'px';
        el.style.top='0';
        el.style.width=(window.innerWidth/2)+'px';
        el.style.height=(window.innerHeight-52)+'px';
        winObj.snapped=snap;
        el.classList.add('snapped');
        setTimeout(function(){el.classList.remove('snapped')},200);
      }
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });

  // Ресайз
  var resizers=[
    ['.resizer','se'],['.resizer-n','n'],['.resizer-s','s'],
    ['.resizer-w','w'],['.resizer-e','e']
  ];
  resizers.forEach(function(pair){
    var r=$(pair[0],el);
    var dir=pair[1];
    r.addEventListener('mousedown',function(e){
      if(winObj.maximized) return;
      e.preventDefault();e.stopPropagation();
      focusWin(winObj.id);
      var sx=e.clientX,sy=e.clientY;
      var sw=el.offsetWidth,sh=el.offsetHeight;
      var sl=el.offsetLeft,st=el.offsetTop;
      function onMove(ev){
        var dx=ev.clientX-sx,dy=ev.clientY-sy;
        var nw=sw,nh=sh,nl=sl,nt=st;
        if(dir.indexOf('e')>-1) nw=Math.max(280,sw+dx);
        if(dir.indexOf('w')>-1){nw=Math.max(280,sw-dx);nl=sl+(sw-nw)}
        if(dir.indexOf('s')>-1) nh=Math.max(180,sh+dy);
        if(dir.indexOf('n')>-1){nh=Math.max(180,sh-dy);nt=st+(sh-nh)}
        el.style.width=nw+'px';el.style.height=nh+'px';
        el.style.left=nl+'px';el.style.top=nt+'px';
      }
      function onUp(){
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
      }
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
  });

  el.addEventListener('mousedown',function(){focusWin(winObj.id)});

  focusWin(winObj.id);
  renderTasks();
  return winObj;
}

function minimizeWin(id){
  var w=wins.filter(function(x){return x.id===id})[0];
  if(!w) return;
  w.minimized=true;
  w.el.style.display='none';
  if(activeWinId===id) activeWinId=null;
  renderTasks();
}

function toggleMax(id){
  var w=wins.filter(function(x){return x.id===id})[0];
  if(!w) return;
  var el=w.el;
  if(!w.maximized){
    w.prevBounds={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};
    el.classList.add('maximized');
    el.style.left='0';el.style.top='0';
    el.style.width='100%';el.style.height='100%';
    w.maximized=true;
    var btn=$('.win-btn[data-act="max"]',el);
    if(btn){btn.innerHTML=I.restore;btn.title='Восстановить'}
  } else {
    el.classList.remove('maximized');
    if(w.prevBounds){
      el.style.left=w.prevBounds.left;el.style.top=w.prevBounds.top;
      el.style.width=w.prevBounds.width;el.style.height=w.prevBounds.height;
    }
    w.maximized=false;
    var btn=$('.win-btn[data-act="max"]',el);
    if(btn){btn.innerHTML=I.max;btn.title='Развернуть'}
  }
  focusWin(id);
}

function closeWin(id){
  var idx=-1;
  for(var i=0;i<wins.length;i++) if(wins[i].id===id){idx=i;break}
  if(idx<0) return;
  var w=wins[idx];
  w.el.classList.add('closing');
  var el=w.el;
  setTimeout(function(){
    if(el.parentNode) el.parentNode.removeChild(el);
  },140);
  wins.splice(idx,1);
  if(activeWinId===id) activeWinId=null;
  renderTasks();
}

function closeAllWins(){
  wins.slice().forEach(function(w){closeWin(w.id)});
}

function setWinTitle(id,title){
  var w=wins.filter(function(x){return x.id===id})[0];
  if(!w) return;
  w.title=title;
  var t=$('.tb-title',w.el);
  if(t) t.textContent=title;
  renderTasks();
}

/* ============================================================
   ПАНЕЛЬ ЗАДАЧ

var tasksEl=$('#tasks');
function renderTasks(){
  tasksEl.innerHTML='';
  wins.forEach(function(w){
    var app=APPS[w.appId];
    var b=document.createElement('button');
    b.type='button';
    b.className='task'+(w.id===activeWinId&&!w.minimized?' active':'');
    b.innerHTML=(app.icon||I.file)+'<span>'+esc(w.title||app.title)+'</span>';
    b.title=w.title||app.title;
    b.addEventListener('click',function(){
      if(w.minimized){w.minimized=false;w.el.style.display='';focusWin(w.id)}
      else if(w.id===activeWinId){minimizeWin(w.id)}
      else focusWin(w.id);
    });
    b.addEventListener('contextmenu',function(e){
      e.preventDefault();e.stopPropagation();
      showCtx([
        {label:'Открыть',icon:I.folder,action:function(){if(w.minimized){w.minimized=false;w.el.style.display=''}focusWin(w.id)}},
        {label:'Свернуть',icon:I.min,action:function(){minimizeWin(w.id)}},
        {label:w.maximized?'Восстановить':'Развернуть',icon:w.maximized?I.restore:I.max,action:function(){toggleMax(w.id)}},
        {sep:true},
        {label:'Закрыть',icon:I.close,danger:true,action:function(){closeWin(w.id)}}
      ],e.clientX,e.clientY);
    });
    tasksEl.appendChild(b);
  });
}

/* ============================================================
   РАБОЧИЙ СТОЛ
   ============================================================ */
var desktopEl=$('#desktop');
var iconsEl=$('#icons');
var selbox=$('#selbox');
var deskPositions={}; // name -> {x,y}
var deskSelected={}; // name -> true

function loadDeskPositions(){
  try{
    var r=localStorage.getItem('myos.deskpos');
    if(r) deskPositions=JSON.parse(r);
  }catch(e){}
}
function saveDeskPositions(){
  try{localStorage.setItem('myos.deskpos',JSON.stringify(deskPositions))}catch(e){}
}
loadDeskPositions();

function renderDesktop(){
  iconsEl.innerHTML='';
  var items=fsList(DESKTOP_PATH);
  var ICON_W=90,ICON_H=100,GAP=6,PAD=16;
  var availH=desktopEl.clientHeight-PAD*2;
  var rows=Math.max(1,Math.floor((availH+GAP)/(ICON_H+GAP)));
  var used={};

  items.forEach(function(item,idx){
    var pos=deskPositions[item.name];
    if(!pos){
      // Находим свободное место
      var found=false;
      for(var c=0;c<20&&!found;c++){
        for(var r=0;r<rows;r++){
          var key=c+','+r;
          if(!used[key]){pos={c:c,r:r};used[key]=true;found=true;break}
        }
      }
      if(!pos) pos={c:0,r:0};
      deskPositions[item.name]=pos;
    } else {
      used[pos.c+','+pos.r]=true;
    }
    var x=PAD+pos.c*(ICON_W+GAP);
    var y=PAD+pos.r*(ICON_H+GAP);
    var el=document.createElement('div');
    el.className='desk-icon'+(deskSelected[item.name]?' selected':'');
    el.style.left=x+'px';
    el.style.top=y+'px';
    el.setAttribute('data-name',item.name);
    el.innerHTML=(item.type==='dir'?I.folder:I.file)+
                 '<span class="lbl">'+esc(item.name)+'</span>';
    el.addEventListener('mousedown',onIconMouseDown);
    el.addEventListener('dblclick',function(){
      if(item.type==='dir'){
        openApp('files',{path:DESKTOP_PATH+'/'+item.name});
      } else {
        openFile(item.name,DESKTOP_PATH);
      }
    });
    el.addEventListener('contextmenu',function(e){
      e.preventDefault();e.stopPropagation();
      selectOnly(item.name);
      showItemCtx(item,DESKTOP_PATH,e.clientX,e.clientY);
    });
    iconsEl.appendChild(el);
  });
  saveDeskPositions();
}

function selectOnly(name){
  deskSelected={};
  if(name) deskSelected[name]=true;
  $$('.desk-icon').forEach(function(el){
    el.classList.toggle('selected',!!deskSelected[el.getAttribute('data-name')]);
  });
}
function clearSel(){
  deskSelected={};
  $$('.desk-icon').forEach(function(el){el.classList.remove('selected')});
}

function openFile(name,dir){
  var path=dir+'/'+name;
  var node=fsResolve(path);
  if(!node) return;
  if(node.type==='dir'){openApp('files',{path:path});return}
  // По расширению
  if(/\.(txt|md|log|ini|json|js|css|html?)$/i.test(name)){
    openApp('notepad',{path:path,title:name});
  } else {
    openApp('notepad',{path:path,title:name});
  }
}

/* Перетаскивание иконок и выделение */
var dragState=null;
function onIconMouseDown(e){
  if(e.button!==0) return;
  var el=e.currentTarget;
  var name=el.getAttribute('data-name');
  if(!deskSelected[name]) selectOnly(name);
  else {
    // Уже выделено - не сбрасываем (для мультидрага)
  }
  var el0=el;
  var sx=e.clientX,sy=e.clientY;
  var moved=false;
  var startPos={left:el0.offsetLeft,top:el0.offsetTop};
  var selBefore=Object.assign({},deskSelected);
  var others=$$('.desk-icon').filter(function(x){return selBefore[x.getAttribute('data-name')]}).map(function(x){
    return {el:x,name:x.getAttribute('data-name'),ox:x.offsetLeft,oy:x.offsetTop};
  });
  function onMove(ev){
    var dx=ev.clientX-sx,dy=ev.clientY-sy;
    if(!moved&&(Math.abs(dx)>4||Math.abs(dy)>4)) moved=true;
    if(!moved) return;
    others.forEach(function(o){
      o.el.style.left=(o.ox+dx)+'px';
      o.el.style.top=(o.oy+dy)+'px';
      o.el.style.opacity=.7;
    });
  }
  function onUp(ev){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    others.forEach(function(o){
      o.el.style.opacity='';
    });
    if(!moved) return;
    // Snap to grid
    var PAD=16,ICON_W=90,ICON_H=100,GAP=6;
    var placed={};
    // Соберём все текущие позиции
    $$('.desk-icon').forEach(function(x){
      var n=x.getAttribute('data-name');
      if(selBefore[n]) return;
      var c=Math.round((x.offsetLeft-PAD)/(ICON_W+GAP));
      var r=Math.round((x.offsetTop-PAD)/(ICON_H+GAP));
      placed[c+','+r]=n;
    });
    others.forEach(function(o){
      var c=Math.round((o.el.offsetLeft-PAD)/(ICON_W+GAP));
      var r=Math.round((o.el.offsetTop-PAD)/(ICON_H+GAP));
      c=Math.max(0,c);r=Math.max(0,r);
      while(placed[c+','+r]){c++}
      placed[c+','+r]=o.name;
      o.el.style.left=(PAD+c*(ICON_W+GAP))+'px';
      o.el.style.top=(PAD+r*(ICON_H+GAP))+'px';
      deskPositions[o.name]={c:c,r:r};
    });
    saveDeskPositions();
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

/* Выделение рамкой по пустому месту */
desktopEl.addEventListener('mousedown',function(e){
  if(e.target!==desktopEl&&e.target!==iconsEl) return;
  if(e.button!==0) return;
  var sx=e.clientX,sy=e.clientY;
  var rect0=desktopEl.getBoundingClientRect();
  var box={x1:sx-rect0.left,y1:sy-rect0.top,x2:sx-rect0.left,y2:sy-rect0.top};
  var moved=false;
  clearSel();
  function update(ev){
    var x=ev.clientX-rect0.left,y=ev.clientY-rect0.top;
    if(!moved&&(Math.abs(x-sx)>4||Math.abs(y-sy)>4)) moved=true;
    if(!moved) return;
    box.x2=x;box.y2=y;
    var l=Math.min(box.x1,box.x2),t=Math.min(box.y1,box.y2);
    var w=Math.abs(box.x2-box.x1),h=Math.abs(box.y2-box.y1);
    selbox.style.display='block';
    selbox.style.left=l+'px';selbox.style.top=t+'px';
    selbox.style.width=w+'px';selbox.style.height=h+'px';
    // Отметим попадающие иконки
    deskSelected={};
    $$('.desk-icon').forEach(function(el){
      var eL=el.offsetLeft,eT=el.offsetTop,eR=eL+el.offsetWidth,eB=eT+el.offsetHeight;
      var hit=eR>l&&eL<l+w&&eB>t&&eT<t+h;
      if(hit) deskSelected[el.getAttribute('data-name')]=true;
      el.classList.toggle('selected',hit);
    });
  }
  function onUp(){
    document.removeEventListener('mousemove',update);
    document.removeEventListener('mouseup',onUp);
    selbox.style.display='none';
  }
  document.addEventListener('mousemove',update);
  document.addEventListener('mouseup',onUp);
});

function createOnDesktop(kind){
  var name,type='file',content='';
  if(kind==='dir'){name=fsUniqueName(DESKTOP_PATH,'Новая папка');type='dir'}
  else if(kind==='file'){name=fsUniqueName(DESKTOP_PATH,'Новый текстовый документ','.txt');content=''}
  else if(kind==='note'){name=fsUniqueName(DESKTOP_PATH,'Заметка','.txt');content=''}
  var node=fsCreate(DESKTOP_PATH,name,type,content);
  if(!node) return;
  renderDesktop();
  // Начинаем переименование через небольшую задержку
  setTimeout(function(){startIconRename(name)},180);
  toast(kind==='dir'?'Папка создана':'Файл создан',name);
}

function startIconRename(name){
  var el=$$('.desk-icon').filter(function(x){return x.getAttribute('data-name')===name})[0];
  if(!el) return;
  var lbl=$('.lbl',el);
  var oldName=name;
  lbl.classList.add('editing');
  lbl.contentEditable='true';
  lbl.textContent=oldName;
  var sel=window.getSelection();
  var range=document.createRange();
  range.selectNodeContents(lbl);
  sel.removeAllRanges();sel.addRange(range);
  // Выделить имя без расширения
  try{
    var txt=lbl.textContent;
    var dot=txt.lastIndexOf('.');
    if(dot>0){
      range.setStart(lbl.firstChild,0);
      range.setEnd(lbl.firstChild,dot);
      sel.removeAllRanges();sel.addRange(range);
    }
  }catch(e){}
  lbl.focus();

  function finish(commit){
    lbl.contentEditable='false';
    lbl.classList.remove('editing');
    var newName=lbl.textContent.trim();
    if(commit&&newName&&newName!==oldName){
      if(fsRename(DESKTOP_PATH+'/'+oldName,newName)){
        if(deskPositions[oldName]){deskPositions[newName]=deskPositions[oldName];delete deskPositions[oldName];saveDeskPositions()}
        if(deskSelected[oldName]){deskSelected[newName]=true;delete deskSelected[oldName]}
      }
    }
    renderDesktop();
  }
  lbl.addEventListener('blur',function(){finish(true)},{once:true});
  lbl.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){ev.preventDefault();lbl.blur()}
    else if(ev.key==='Escape'){lbl.textContent=oldName;lbl.blur()}
    ev.stopPropagation();
  });
}

function renameItem(el,oldName,dir,cb){
  var lbl=$('.fname',el);
  if(!lbl) return;
  lbl.classList.add('editing');
  lbl.contentEditable='true';
  lbl.textContent=oldName;
  var range=document.createRange();
  range.selectNodeContents(lbl);
  var sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  lbl.focus();
  function done(commit){
    lbl.contentEditable='false';
    lbl.classList.remove('editing');
    var nn=lbl.textContent.trim();
    if(commit&&nn&&nn!==oldName){
      fsRename(dir+'/'+oldName,nn);
    }
    cb&&cb();
  }
  lbl.addEventListener('blur',function(){done(true)},{once:true});
  lbl.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();lbl.blur()}
    else if(e.key==='Escape'){lbl.textContent=oldName;lbl.blur()}
    e.stopPropagation();
  });
}

      if(path) setWinTitle(win.id,fileName+' — Блокнот');

APPS.calc={
  title:'Калькулятор',icon:I.calc,width:340,height:520,singleton:true,
  render:function(body,win,opts){
    var cur='0',acc=null,op=null,fresh=true;

    body.innerHTML=
      '<div class="calc">'+
        '<div class="calc-scr">'+
          '<div class="calc-expr"></div>'+
          '<div class="calc-cur">0</div>'+
        '</div>'+
        '<div class="calc-pad">'+
          '<button class="cb fn" data-k="C" type="button">C</button>'+
          '<button class="cb fn" data-k="back" type="button">⌫</button>'+
          '<button class="cb fn" data-k="%" type="button">%</button>'+
          '<button class="cb op" data-k="/" type="button">÷</button>'+
          '<button class="cb" data-k="7" type="button">7</button>'+
          '<button class="cb" data-k="8" type="button">8</button>'+
          '<button class="cb" data-k="9" type="button">9</button>'+
          '<button class="cb op" data-k="*" type="button">×</button>'+
          '<button class="cb" data-k="4" type="button">4</button>'+
          '<button class="cb" data-k="5" type="button">5</button>'+
          '<button class="cb" data-k="6" type="button">6</button>'+
          '<button class="cb op" data-k="-" type="button">−</button>'+
          '<button class="cb" data-k="1" type="button">1</button>'+
          '<button class="cb" data-k="2" type="button">2</button>'+
          '<button class="cb" data-k="3" type="button">3</button>'+
          '<button class="cb op" data-k="+" type="button">+</button>'+
          '<button class="cb fn" data-k="sign" type="button">±</button>'+
          '<button class="cb" data-k="0" type="button">0</button>'+
          '<button class="cb" data-k="." type="button">.</button>'+
          '<button class="cb eq" data-k="=" type="button">=</button>'+
        '</div>'+
      '</div>';

    var curEl=$('.calc-cur',body);
    var exprEl=$('.calc-expr',body);

    function fmt(n){
      if(typeof n!=='number'||!isFinite(n)) return 'Ошибка';
      var r=Math.round(n*1e12)/1e12;
      var s=String(r);
      if(s.replace('-','').replace('.','').length>14) s=r.toExponential(8);
      return s;
    }
    function sym(o){return o==='*'?'×':o==='/'?'÷':o==='-'?'−':o}
    function upd(){curEl.textContent=cur}
    function compute(a,b,o){
      if(o==='+') return a+b;
      if(o==='-') return a-b;
      if(o==='*') return a*b;
      if(o==='/') return b===0?null:a/b;
      return b;
    }
    function err(){cur='Ошибка';acc=null;op=null;fresh=true;exprEl.textContent='';upd()}
    function digit(d){
      if(cur==='Ошибка'){cur='0';acc=null;op=null;fresh=true}
      if(fresh){cur=(d==='.')?'0.':d;fresh=false}
      else{
        if(d==='.'&&cur.indexOf('.')!==-1) return;
        var digits=cur.replace('-','').replace('.','');
        if(digits.length>=13&&d!=='.') return;
        cur=(cur==='0'&&d!=='.')?d:(cur+d);
      }
      upd();
    }
    function chooseOp(o){
      if(cur==='Ошибка') return;
      var v=parseFloat(cur);
      if(op!==null&&!fresh){
        var r=compute(acc,v,op);
        if(r===null||!isFinite(r)){err();return}
        acc=r;cur=fmt(r);
      } else acc=v;
      op=o;fresh=true;
      exprEl.textContent=fmt(acc)+' '+sym(o);
      upd();
    }
    function equals(){
      if(op===null||cur==='Ошибка') return;
      var v=parseFloat(cur);
      var r=compute(acc,v,op);
      exprEl.textContent=fmt(acc)+' '+sym(op)+' '+fmt(v)+' =';
      if(r===null||!isFinite(r)){err();return}
      cur=fmt(r);acc=null;op=null;fresh=true;upd();
    }
    function clearAll(){cur='0';acc=null;op=null;fresh=true;exprEl.textContent='';upd()}
    function back(){
      if(cur==='Ошибка'){clearAll();return}
      if(fresh) return;
      cur=cur.slice(0,-1);
      if(cur===''||cur==='-') cur='0';
      upd();
    }
    function percent(){
      if(cur==='Ошибка') return;
      cur=fmt(parseFloat(cur)/100);fresh=true;upd();
    }
    function sign(){
      if(cur==='Ошибка'||cur==='0') return;
      cur=cur.charAt(0)==='-'?cur.slice(1):'-'+cur;
      upd();
    }

    $('.calc-pad',body).addEventListener('click',function(e){
      var b=e.target.closest('[data-k]');
      if(!b) return;
      var k=b.getAttribute('data-k');
      if(k>='0'&&k<='9') digit(k);
      else if(k==='.') digit('.');
      else if(k==='+'||k==='-'||k==='*'||k==='/') chooseOp(k);
      else if(k==='=') equals();
      else if(k==='C') clearAll();
      else if(k==='back') back();
      else if(k==='%') percent();
      else if(k==='sign') sign();
    });

    body.tabIndex=0;
    body.addEventListener('keydown',function(e){
      var k=e.key;
      if(k>='0'&&k<='9'){digit(k);e.preventDefault()}
      else if(k==='.'||k===','){digit('.');e.preventDefault()}
      else if(k==='+'||k==='-'||k==='*'||k==='/'){chooseOp(k);e.preventDefault()}
      else if(k==='Enter'||k==='='){equals();e.preventDefault()}
      else if(k==='Backspace'){back();e.preventDefault()}
      else if(k==='Escape'){clearAll();e.preventDefault()}
      else if(k==='%'){percent();e.preventDefault()}
    });
    setTimeout(function(){body.focus()},50);
  }
};

APPS.terminal={
  title:'Терминал',icon:I.term,width:720,height:480,
  render:function(body,win,opts){
    var user=settings.user||'user';
    var cwd='Users/user';
    function promptStr(){return user+'@myos:'+(cwd==='Users/user'?'~':cwd.split('/').pop())+'$'}

    body.innerHTML=
      '<div class="term">'+
        '<div class="term-out"></div>'+
        '<div class="term-line">'+
          '<span class="term-prompt"></span>'+
          '<input class="term-in" type="text" autocomplete="off" spellcheck="false">'+
        '</div>'+
      '</div>';

    var out=$('.term-out',body);
    var input=$('.term-in',body);
    var promptEl=$('.term-prompt',body);
    promptEl.textContent=promptStr();

    function print(text,cls){
      var d=document.createElement('div');
      if(cls) d.className=cls;
      d.textContent=text==null?'':String(text);
      out.appendChild(d);
      out.scrollTop=out.scrollHeight;
    }

    print('MyOS Terminal v1.0');
    print('Наберите "help" для списка команд.','info');
    print('');

    var cmdHist=[],histIdx=-1;

    function run(raw){
      var parts=raw.trim().split(/\s+/);
      var cmd=(parts[0]||'').toLowerCase();
      var args=parts.slice(1);

      switch(cmd){
        case '': break;
        case 'help':
          print('Доступные команды:');
          print('  help              — этот список');
          print('  echo <текст>      — вывести текст');
          print('  date              — текущая дата');
          print('  time              — текущее время');
          print('  whoami            — имя пользователя');
          print('  pwd               — текущая папка');
          print('  ls                — содержимое папки');
          print('  cd <path>         — перейти в папку');
          print('  cat <file>        — вывести файл');
          print('  mkdir <name>      — создать папку');
          print('  touch <name>      — создать файл');
          print('  rm <name>         — удалить');
          print('  open <app>        — запустить приложение');
          print('  apps              — список приложений');
          print('  theme dark|light  — сменить тему');
          print('  clear             — очистить экран');
          print('  about             — о системе');
          break;
        case 'echo': print(args.join(' ')); break;
        case 'date': print(new Date().toLocaleDateString('ru-RU',{weekday:'long',year:'numeric',month:'long',day:'numeric'})); break;
        case 'time': print(new Date().toLocaleTimeString('ru-RU')); break;
        case 'whoami': print(user); break;
        case 'pwd': print('/'+cwd); break;
        case 'ls': {
          var items=fsList(cwd);
          if(items.length===0){print('(пусто)');break}
          items.forEach(function(it){
            print('  '+(it.type==='dir'?'[+] ':'    ')+it.name+(it.type==='dir'?'/':''));
          });
          break;
        }
        case 'cd': {
          var t=args[0]||'~';
          var np;
          if(t==='~') np='Users/user';
          else if(t==='..'){var p=cwd.split('/');p.pop();np=p.join('/')}
          else if(t==='/') np='';
          else if(t.charAt(0)==='/') np=t.slice(1);
          else np=(cwd?cwd+'/':'')+t;
          var n=fsResolve(np);
          if(!n||n.type!=='dir'){print('Папка не найдена: '+t,'err');break}
          cwd=np;
          promptEl.textContent=promptStr();
          break;
        }
        case 'cat': {
          if(!args[0]){print('Использование: cat <файл>','err');break}
          var f=fsResolve((cwd?cwd+'/':'')+args[0]);
          if(!f||f.type!=='file'){print('Файл не найден','err');break}
          print(f.content||'(пусто)');
          break;
        }
        case 'mkdir': {
          if(!args[0]){print('Использование: mkdir <имя>','err');break}
          var name=fsUniqueName(cwd,args[0]);
          if(fsCreate(cwd,name,'dir')) print('Папка создана: '+name,'ok');
          break;
        }
        case 'touch': {
          if(!args[0]){print('Использование: touch <имя>','err');break}
          var name=fsUniqueName(cwd,args[0]);
          if(fsCreate(cwd,name,'file','')) print('Файл создан: '+name,'ok');
          break;
        }
        case 'rm': {
          if(!args[0]){print('Использование: rm <имя>','err');break}
          if(fsDelete((cwd?cwd+'/':'')+args[0])) print('Удалено','ok');
          else print('Не найдено','err');
          break;
        }
        case 'apps':
          Object.keys(APPS).forEach(function(k){print('  '+k+'  —  '+APPS[k].title)});
          break;
        case 'open': {
          var k=(args[0]||'').toLowerCase();
          if(!k){print('Использование: open <app>','err');break}
          if(!APPS[k]){print('Приложение "'+k+'" не найдено. Введите "apps"','err');break}
          openApp(k);
          print('Запуск: '+APPS[k].title,'info');
          break;
        }
        case 'theme': {
          var t=(args[0]||'').toLowerCase();
          if(t!=='dark'&&t!=='light'){print('Использование: theme dark|light','err');break}
          settings.theme=t;saveSettings();applySettings();
          print('Тема: '+t,'ok');
          break;
        }
        case 'clear': out.innerHTML=''; break;
        case 'about':
          print('MyOS v1.0 — персональная ОС в браузере.');
          print('HTML + CSS + JavaScript. Никаких зависимостей.');
          break;
        default:
          print('Команда не найдена: '+cmd+'. Введите "help".','err');
      }
    }

    input.addEventListener('keydown',function(e){
      if(e.key==='Enter'){
        var v=input.value;
        if(v.trim()){
          cmdHist.unshift(v);
          if(cmdHist.length>50) cmdHist.pop();
        }
        histIdx=-1;
        input.value='';
        print(promptStr()+' '+v);
        run(v);
      } else if(e.key==='ArrowUp'){
        e.preventDefault();
        if(histIdx<cmdHist.length-1){histIdx++;input.value=cmdHist[histIdx]}
      } else if(e.key==='ArrowDown'){
        e.preventDefault();
        if(histIdx>0){histIdx--;input.value=cmdHist[histIdx]}
        else if(histIdx===0){histIdx=-1;input.value=''}
      }
    });
    setTimeout(function(){input.focus()},80);
    body.addEventListener('click',function(e){
      if(window.getSelection().toString()===''&&e.target===body) input.focus();
    });
  }
};

APPS.paint={
  title:'Paint',icon:I.brush,width:760,height:560,
  render:function(body,win){
    body.innerHTML=
      '<div class="paint">'+
        '<div class="paint-bar">'+
          '<button class="tool on" data-tool="brush" title="Кисть">'+I.brush+'</button>'+
          '<button class="tool" data-tool="eraser" title="Ластик">'+I.eraser+'</button>'+
          '<button class="tool" data-tool="line" title="Линия">'+I.line+'</button>'+
          '<button class="tool" data-tool="rect" title="Прямоугольник">'+I.rect+'</button>'+
          '<button class="tool" data-tool="circle" title="Круг">'+I.circle+'</button>'+
          '<div class="sep"></div>'+
          '<div class="colors"></div>'+
          '<div class="sep"></div>'+
          '<input type="range" min="1" max="30" value="4" id="paintSize">'+
          '<div class="sep"></div>'+
          '<button class="tool" data-act="undo" title="Отменить">'+I.undo+'</button>'+
          '<button class="tool" data-act="clear" title="Очистить">'+I.trash2+'</button>'+
          '<button class="tool" data-act="save" title="Сохранить в Файлы">'+I.ext+'</button>'+
        '</div>'+
        '<div class="paint-canvas-wrap"><canvas width="800" height="500"></canvas></div>'+
      '</div>';

    var canvas=$('canvas',body);
    var ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.lineCap='round';
    ctx.lineJoin='round';

    var colors=['#000000','#ffffff','#ff4d5e','#4a8cff','#3ecf8e','#ffb648','#a05aff','#3ecfcf','#e0538a','#8a8a98'];
    var colorsEl=$('.colors',body);
    colors.forEach(function(c,i){
      var d=document.createElement('div');
      d.className='c'+(i===0?' on':'');
      d.style.background=c;
      d.addEventListener('click',function(){
        $$('.c',colorsEl).forEach(function(x){x.classList.remove('on')});
        d.classList.add('on');ctx.strokeStyle=c;ctx.fillStyle=c;
      });
      colorsEl.appendChild(d);
    });
    ctx.strokeStyle='#000';
    ctx.fillStyle='#000';

    var tool='brush';
    var drawing=false;
    var sx=0,sy=0;
    var snapshot=null;
    var undoStack=[];

    function pushUndo(){
      undoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
      if(undoStack.length>30) undoStack.shift();
    }

    $$('[data-tool]',body).forEach(function(b){
      b.addEventListener('click',function(){
        $$('[data-tool]',body).forEach(function(x){x.classList.remove('on')});
        b.classList.add('on');
        tool=b.getAttribute('data-tool');
      });
    });

    var sizeInput=$('#paintSize',body);
    function getSize(){return parseInt(sizeInput.value,10)}
    ctx.lineWidth=getSize();
    sizeInput.addEventListener('input',function(){ctx.lineWidth=getSize()});

    function pos(e){
      var r=canvas.getBoundingClientRect();
      return {x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)};
    }

    canvas.addEventListener('mousedown',function(e){
      pushUndo();
      drawing=true;
      var p=pos(e);
      sx=p.x;sy=p.y;
      ctx.beginPath();ctx.moveTo(sx,sy);
      if(tool==='brush'||tool==='eraser'){
        ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';
        ctx.strokeStyle=tool==='eraser'?'rgba(0,0,0,1)':($('.c.on',colorsEl)?getComputedStyle($('.c.on',colorsEl)).backgroundColor:'#000');
        ctx.lineWidth=tool==='eraser'?getSize()*3:getSize();
      }
      snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);
    });
    canvas.addEventListener('mousemove',function(e){
      if(!drawing) return;
      var p=pos(e);
      if(tool==='brush'||tool==='eraser'){
        ctx.lineTo(p.x,p.y);ctx.stroke();
      } else if(tool==='line'||tool==='rect'||tool==='circle'){
        ctx.putImageData(snapshot,0,0);
        ctx.beginPath();
        if(tool==='line'){ctx.moveTo(sx,sy);ctx.lineTo(p.x,p.y);ctx.stroke()}
        else if(tool==='rect'){ctx.strokeRect(sx,sy,p.x-sx,p.y-sy)}
        else{
          var r=Math.hypot(p.x-sx,p.y-sy);
          ctx.arc(sx,sy,r,0,Math.PI*2);ctx.stroke();
        }
      }
    });
    canvas.addEventListener('mouseup',function(){
      drawing=false;
      ctx.globalCompositeOperation='source-over';
      ctx.lineWidth=getSize();
    });
    canvas.addEventListener('mouseleave',function(){drawing=false});

    $('[data-act="undo"]',body).addEventListener('click',function(){
      if(undoStack.length){ctx.putImageData(undoStack.pop(),0,0)}
    });
    $('[data-act="clear"]',body).addEventListener('click',function(){
      pushUndo();
      ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    });
    $('[data-act="save"]',body).addEventListener('click',function(){
      var name=prompt('Имя файла:','рисунок.txt');
      if(!name) return;
      if(!/\./.test(name)) name+='.txt';
      // Сохраняем как текстовое описание (canvas → dataURL не влезет)
      fsCreate(PICS_PATH,name,'file','[Рисунок сохранён из Paint]');
      toast('Рисунок сохранён',name);
    });
  }
};
