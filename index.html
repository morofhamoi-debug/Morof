<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================================
   0. БАЗОВАЯ ИНИЦИАЛИЗАЦИЯ
   ========================================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x93aec7);
scene.fog = new THREE.Fog(0x93aec7, 55, 160);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.08, 400);
camera.position.set(21, 13, 24);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 1.5);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 0.6;
controls.maxDistance = 90;
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =========================================================================
   1. КОНСТАНТЫ ПЛАНИРОВКИ
   ========================================================================= */
const HX = 8.0, HZ = 6.0;          // половина габаритов по X и Z
const EXT = 0.35, INT = 0.15;      // толщина наружных и внутренних стен
const H1 = 3.0;                    // высота 1 этажа
const SLAB = 0.30;                 // толщина межэтажного перекрытия
const F2 = H1 + SLAB;              // 3.30 — уровень пола 2 этажа
const H2 = 3.0;                    // высота 2 этажа
const ROOFY = F2 + H2;             // 6.30 — уровень карниза

const IX = HX - EXT;               // 7.65 — внутренняя грань наружной стены по X
const IZ = HZ - EXT;               // 5.65 — внутренняя грань наружной стены по Z
const WX = HX - EXT / 2;           // 7.825 — осевая линия наружной стены по X
const WZ = HZ - EXT / 2;           // 5.825 — осевая линия наружной стены по Z

/* Лестница: подъём вдоль +Z */
const ST_X0 = 6.20, ST_X1 = 7.65;         // ширина пролёта
const ST_Z0 = -1.00;                       // начало (низ)
const ST_STEPS = 15;
const ST_RISE = 3.30 / ST_STEPS;           // 0.22
const ST_RUN = 4.40 / ST_STEPS;            // 0.2933
const ST_ZTOP = ST_Z0 + ST_STEPS * ST_RUN; // 3.40

/* =========================================================================
   2. ПСЕВДОСЛУЧАЙНОСТЬ (детерминированная)
   ========================================================================= */
let _seed = 987654321;
function rnd() { _seed = (_seed * 1664525 + 1013904223) % 4294967296; return _seed / 4294967296; }
function rrange(a, b) { return a + (b - a) * rnd(); }

/* =========================================================================
   3. МАТЕРИАЛЫ
   ========================================================================= */
const M = {
  // архитектура
  extWall:   new THREE.MeshStandardMaterial({ color: 0xb5a288, roughness: 0.97 }),
  extWall2:  new THREE.MeshStandardMaterial({ color: 0xa89478, roughness: 0.97 }),
  brick:     new THREE.MeshStandardMaterial({ color: 0x8b5a45, roughness: 0.96 }),
  stone:     new THREE.MeshStandardMaterial({ color: 0x827b6d, roughness: 0.95 }),
  intWall:   new THREE.MeshStandardMaterial({ color: 0xd7cdbb, roughness: 0.96 }),
  intWall2:  new THREE.MeshStandardMaterial({ color: 0xc9bfae, roughness: 0.96 }),
  ceiling:   new THREE.MeshStandardMaterial({ color: 0xe9e4da, roughness: 1.0 }),
  skirt:     new THREE.MeshStandardMaterial({ color: 0x6b5238, roughness: 0.7 }),

  // полы
  woodFloor: new THREE.MeshStandardMaterial({ color: 0x6d4a2e, roughness: 0.72 }),
  woodFloor2:new THREE.MeshStandardMaterial({ color: 0x7a5636, roughness: 0.72 }),
  tileFloor: new THREE.MeshStandardMaterial({ color: 0xa89f90, roughness: 0.45 }),
  tileWC:    new THREE.MeshStandardMaterial({ color: 0xbfd0cf, roughness: 0.35 }),
  stoneFloor:new THREE.MeshStandardMaterial({ color: 0x8d867a, roughness: 0.85 }),

  // дерево
  woodDark:  new THREE.MeshStandardMaterial({ color: 0x452e1d, roughness: 0.68 }),
  woodMid:   new THREE.MeshStandardMaterial({ color: 0x7a5333, roughness: 0.72 }),
  woodLight: new THREE.MeshStandardMaterial({ color: 0xa9804f, roughness: 0.78 }),
  woodPale:  new THREE.MeshStandardMaterial({ color: 0xc0a078, roughness: 0.8 }),

  // металл / стекло
  metal:     new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 0.33, metalness: 0.86 }),
  metalDark: new THREE.MeshStandardMaterial({ color: 0x4c5157, roughness: 0.45, metalness: 0.75 }),
  glass:     new THREE.MeshPhysicalMaterial({ color: 0xcfe3ee, roughness: 0.06, metalness: 0, transmission: 0.85,
                                              transparent: true, opacity: 0.35, side: THREE.DoubleSide }),

  // текстиль
  fabricGreen: new THREE.MeshStandardMaterial({ color: 0x4e5d4a, roughness: 0.95 }),
  fabricBeige: new THREE.MeshStandardMaterial({ color: 0xa9997d, roughness: 0.95 }),
  fabricRed:   new THREE.MeshStandardMaterial({ color: 0x7b3a33, roughness: 0.95 }),
  fabricBlue:  new THREE.MeshStandardMaterial({ color: 0x43566e, roughness: 0.95 }),
  cushion:     new THREE.MeshStandardMaterial({ color: 0x8a7f6a, roughness: 0.98 }),
  linen:       new THREE.MeshStandardMaterial({ color: 0xe8e3d6, roughness: 0.98 }),
  blanket1:    new THREE.MeshStandardMaterial({ color: 0x6d5b46, roughness: 0.98 }),
  blanket2:    new THREE.MeshStandardMaterial({ color: 0x556070, roughness: 0.98 }),
  rug1:        new THREE.MeshStandardMaterial({ color: 0x6b4a3c, roughness: 1.0 }),
  rug2:        new THREE.MeshStandardMaterial({ color: 0x4c5a58, roughness: 1.0 }),
  curtain:     new THREE.MeshStandardMaterial({ color: 0xb9a68a, roughness: 1.0, side: THREE.DoubleSide }),

  // прочее
  white:     new THREE.MeshStandardMaterial({ color: 0xefece4, roughness: 0.6 }),
  porcelain: new THREE.MeshStandardMaterial({ color: 0xf3f1ec, roughness: 0.22 }),
  lampShade: new THREE.MeshStandardMaterial({ color: 0xd9c9a4, roughness: 0.85, side: THREE.DoubleSide }),
  bulb:      new THREE.MeshBasicMaterial({ color: 0xfff2d6 }),
  tvScreen:  new THREE.MeshStandardMaterial({ color: 0x141a1c, roughness: 0.25, metalness: 0.4 }),
  plant:     new THREE.MeshStandardMaterial({ color: 0x3f6b34, roughness: 0.95 }),
  soil:      new THREE.MeshStandardMaterial({ color: 0x35281c, roughness: 1.0 }),
  paper:     new THREE.MeshStandardMaterial({ color: 0xe6dfc9, roughness: 1.0 }),
  grass:     new THREE.MeshStandardMaterial({ color: 0x4a6a37, roughness: 1.0 }),
  dirt:      new THREE.MeshStandardMaterial({ color: 0x6a5a45, roughness: 1.0 }),
  roofMat:   new THREE.MeshStandardMaterial({ color: 0x5d4a3c, roughness: 0.92, side: THREE.DoubleSide }),
  gableMat:  new THREE.MeshStandardMaterial({ color: 0xa89478, roughness: 0.97, side: THREE.DoubleSide })
};

/* =========================================================================
   4. ГЕОМЕТРИЯ-КЭШ И БАЗОВЫЕ ХЕЛПЕРЫ
   ========================================================================= */
const _geoCache = new Map();
function boxGeo(w, h, d) {
  const k = w.toFixed(3) + '|' + h.toFixed(3) + '|' + d.toFixed(3);
  let g = _geoCache.get(k);
  if (!g) { g = new THREE.BoxGeometry(w, h, d); _geoCache.set(k, g); }
  return g;
}

function addBox(w, h, d, mat, x, y, z, ry, parent) {
  const mesh = new THREE.Mesh(boxGeo(w, h, d), mat);
  mesh.position.set(x, y, z);
  if (ry) mesh.rotation.y = ry;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  (parent || scene).add(mesh);
  return mesh;
}

function addCyl(rt, rb, h, seg, mat, x, y, z, parent) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  (parent || scene).add(mesh);
  return mesh;
}

function mkGroup(x, y, z, ry) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  if (ry) g.rotation.y = ry;
  scene.add(g);
  return g;
}

/* -------------------------------------------------------------------------
   buildWall — строит стену с проёмами (двери, окна, арки)
   axis : 'x' — стена идёт вдоль X на координате z = at
          'z' — стена идёт вдоль Z на координате x = at
   openings: [{start, end, bottom, top}]
   ------------------------------------------------------------------------- */
function buildWall(axis, at, from, to, y0, y1, th, openings, material, skirt) {
  const mat = material || M.intWall;
  const ops = (openings || []).slice().sort((a, b) => a.start - b.start);
  const parts = [];
  let cur = from;
  for (const o of ops) {
    if (o.start > cur + 0.0005) parts.push({ a: cur, b: o.start, y0, y1 });
    if (o.bottom > y0 + 0.0005) parts.push({ a: o.start, b: o.end, y0, y1: o.bottom });
    if (o.top < y1 - 0.0005)    parts.push({ a: o.start, b: o.end, y0: o.top, y1 });
    cur = Math.max(cur, o.end);
  }
  if (cur < to - 0.0005) parts.push({ a: cur, b: to, y0, y1 });

  for (const p of parts) {
    const len = p.b - p.a;
    const h = p.y1 - p.y0;
    if (len <= 0.002 || h <= 0.002) continue;
    const cx = axis === 'x' ? (p.a + p.b) / 2 : at;
    const cz = axis === 'x' ? at : (p.a + p.b) / 2;
    const sx = axis === 'x' ? len : th;
    const sz = axis === 'x' ? th : len;
    addBox(sx, h, sz, mat, cx, p.y0 + h / 2, cz);
  }

  if (skirt) {
    const len = to - from, cx = (from + to) / 2, off = th / 2 + 0.013;
    for (const s of [-1, 1]) {
      if (axis === 'x') addBox(len, 0.12, 0.026, M.skirt, cx, y0 + 0.06, at + s * off);
      else              addBox(0.026, 0.12, len, M.skirt, at + s * off, y0 + 0.06, cx);
    }
  }
}

/* -------------------------------------------------------------------------
   addWindow — оконная коробка, рама, переплёт, стекло, подоконник
   ------------------------------------------------------------------------- */
function addWindow(axis, at, from, to, yb, yt, th) {
  const w = to - from, h = yt - yb;
  const cx = axis === 'x' ? (from + to) / 2 : at;
  const cz = axis === 'x' ? at : (from + to) / 2;
  const g = mkGroup(cx, yb, cz, axis === 'z' ? Math.PI / 2 : 0);

  const t = 0.07, dd = th * 0.55;
  // коробка
  addBox(w + 0.10, t, th + 0.02, M.woodLight, 0, t / 2 - 0.005, 0, 0, g);
  addBox(w + 0.10, t, th + 0.02, M.woodLight, 0, h - t / 2 + 0.005, 0, 0, g);
  addBox(t, h + 0.06, th + 0.02, M.woodLight, -w / 2 - 0.015, h / 2, 0, 0, g);
  addBox(t, h + 0.06, th + 0.02, M.woodLight,  w / 2 + 0.015, h / 2, 0, 0, g);
  // переплёт
  addBox(0.05, h - 0.12, dd, M.woodLight, 0, h / 2, 0, 0, g);
  addBox(w - 0.12, 0.05, dd, M.woodLight, 0, h / 2, 0, 0, g);
  // стекло
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.06, h - 0.06), M.glass);
  glass.position.set(0, h / 2, 0);
  glass.renderOrder = 1;
  g.add(glass);
  // подоконник
  addBox(w + 0.26, 0.06, th * 1.55, M.woodLight, 0, -0.035, 0, 0, g);
  return g;
}

/* -------------------------------------------------------------------------
   addDoor — дверная коробка + полотно (приоткрытое) + ручка
   angle — угол открытия в радианах
   ------------------------------------------------------------------------- */
function addDoor(axis, at, from, to, y0, y1, th, angle, hingeLeft, matDoor) {
  const w = to - from, h = y1 - y0;
  const cx = axis === 'x' ? (from + to) / 2 : at;
  const cz = axis === 'x' ? at : (from + to) / 2;
  const g = mkGroup(cx, y0, cz, axis === 'z' ? Math.PI / 2 : 0);
  const dm = matDoor || M.woodMid;

  // коробка
  addBox(w + 0.14, 0.09, th + 0.04, M.woodDark, 0, h + 0.045, 0, 0, g);
  addBox(0.07, h, th + 0.04, M.woodDark, -w / 2 - 0.035, h / 2, 0, 0, g);
  addBox(0.07, h, th + 0.04, M.woodDark,  w / 2 + 0.035, h / 2, 0, 0, g);

  // полотно (шарнир слева или справа)
  const hx = hingeLeft ? -w / 2 : w / 2;
  const pivot = new THREE.Group();
  pivot.position.set(hx, 0, 0);
  pivot.rotation.y = (hingeLeft ? 1 : -1) * (angle || 0);
  g.add(pivot);

  const panel = addBox(w - 0.05, h - 0.06, 0.045, dm, (hingeLeft ? 1 : -1) * (w - 0.05) / 2, (h - 0.06) / 2, 0, 0, pivot);
  // филёнки
  addBox(w - 0.22, h * 0.32, 0.02, M.woodDark, (hingeLeft ? 1 : -1) * (w - 0.05) / 2, h * 0.68, 0.032, 0, pivot);
  addBox(w - 0.22, h * 0.32, 0.02, M.woodDark, (hingeLeft ? 1 : -1) * (w - 0.05) / 2, h * 0.26, 0.032, 0, pivot);
  // ручка
  addCyl(0.022, 0.022, 0.09, 10, M.metal,
    (hingeLeft ? 1 : -1) * (w - 0.18), h * 0.46, 0.05, pivot).rotation.x = Math.PI / 2;
  return g;
}

/* =========================================================================
   5. ЗЕМЛЯ, ДОРОЖКА, ОКРУЖЕНИЕ
   ========================================================================= */
(function ground() {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(220, 220, 1, 1), M.grass);
  g.rotation.x = -Math.PI / 2;
  g.position.y = -0.02;
  g.receiveShadow = true;
  scene.add(g);

  // подсыпка/фундаментная отмостка
  addBox(HX * 2 + 2.4, 0.22, HZ * 2 + 2.4, M.stone, 0, -0.11, 0);

  // дорожка к входу
  addBox(2.4, 0.06, 9, M.dirt, 0, 0.015, 10.6);

  // грунт у фасада
  for (let i = 0; i < 6; i++) {
    const px = rrange(-7, 7), pz = rrange(7.2, 10.5);
    addBox(rrange(0.8, 2.0), 0.04, rrange(0.6, 1.6), M.dirt, px, 0.02, pz);
  }

  // пара кустов
  function bush(x, z, s) {
    const gg = mkGroup(x, 0, z, rrange(0, 6.28));
    for (let i = 0; i < 4; i++) {
      const r = rrange(0.35, 0.6) * s;
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), M.plant);
      m.position.set(rrange(-0.4, 0.4) * s, rrange(0.3, 0.7) * s, rrange(-0.4, 0.4) * s);
      m.castShadow = true;
      gg.add(m);
    }
  }
  bush(-9.6, 6.9, 1.0);
  bush(9.4, 6.6, 0.9);
  bush(-9.9, -6.4, 1.1);
  bush(9.8, -5.8, 0.8);
})();

/* =========================================================================
   6. НАРУЖНЫЕ СТЕНЫ (оба этажа сразу, с проёмами)
   ========================================================================= */
(function exteriorWalls() {
  const mat = M.extWall;

  /* --- Южный фасад (z = +WZ) --- */
  buildWall('x', WZ, -HX, HX, 0, ROOFY, EXT, [
    // 1 этаж
    { start: -0.68, end: 0.68, bottom: 0.00, top: 2.28 },  // входная дверь
    { start:  1.30, end: 2.35, bottom: 0.95, top: 2.40 },  // прихожая
    { start: -6.60, end: -5.20, bottom: 0.95, top: 2.40 }, // кабинет
    { start:  3.60, end: 4.40, bottom: 1.55, top: 2.40 },  // санузел
    { start:  6.20, end: 7.30, bottom: 0.95, top: 2.40 },  // лестничный холл
    // 2 этаж
    { start: -6.60, end: -5.20, bottom: 4.20, top: 5.70 }, // кабинет 2 эт.
    { start: -2.25, end: -0.95, bottom: 4.20, top: 5.70 }, // спальня 3
    { start:  1.35, end: 2.70, bottom: 4.20, top: 5.70 },  // спальня 3
    { start:  4.40, end: 5.10, bottom: 4.60, top: 5.70 },  // коридор-ответвление
    { start:  6.20, end: 7.30, bottom: 4.20, top: 5.70 }   // лестничная площадка
  ], mat);

  /* --- Северный фасад (z = -WZ) --- */
  buildWall('x', -WZ, -HX, HX, 0, ROOFY, EXT, [
    // 1 этаж
    { start: -6.60, end: -5.10, bottom: 0.95, top: 2.45 }, // гостиная 1
    { start: -4.10, end: -2.60, bottom: 0.95, top: 2.45 }, // гостиная 2
    { start:  0.40, end: 2.00, bottom: 1.15, top: 2.45 },  // кухня (над мойкой)
    { start:  2.80, end: 3.70, bottom: 1.15, top: 2.45 },  // кухня 2
    { start:  5.20, end: 6.80, bottom: 0.95, top: 2.45 },  // столовая
    // 2 этаж
    { start: -6.60, end: -5.20, bottom: 4.20, top: 5.70 }, // спальня 1
    { start: -2.90, end: -1.70, bottom: 4.60, top: 5.70 }, // коридор A
    { start:  3.40, end: 4.90, bottom: 4.20, top: 5.70 },  // спальня 2
    { start:  6.00, end: 7.50, bottom: 4.20, top: 5.70 }   // спальня 2
  ], mat);

  /* --- Западный фасад (x = -WX) --- */
  buildWall('z', -WX, -HZ, HZ, 0, ROOFY, EXT, [
    { start: -4.60, end: -3.20, bottom: 0.95, top: 2.45 }, // гостиная
    { start: -1.60, end: -0.20, bottom: 0.95, top: 2.45 }, // гостиная
    { start:  3.70, end: 5.00, bottom: 0.95, top: 2.45 },  // кабинет
    { start: -4.60, end: -3.20, bottom: 4.20, top: 5.70 }, // спальня 1
    { start:  0.70, end: 2.30, bottom: 4.60, top: 5.70 },  // коридор 2 эт.
    { start:  3.60, end: 4.90, bottom: 4.20, top: 5.70 }   // кабинет 2 эт.
  ], mat);

  /* --- Восточный фасад (x = +WX) --- */
  buildWall('z', WX, -HZ, HZ, 0, ROOFY, EXT, [
    { start: -4.60, end: -3.20, bottom: 0.95, top: 2.45 }, // столовая
    { start: -0.20, end: 1.00, bottom: 0.95, top: 2.45 },  // лестничный холл
    { start:  3.40, end: 4.60, bottom: 0.95, top: 2.45 },  // лестничный холл
    { start: -4.60, end: -3.20, bottom: 4.20, top: 5.70 }, // спальня 2
    { start:  3.90, end: 5.10, bottom: 4.20, top: 5.70 }   // площадка
  ], mat);

  /* --- Цоколь (пояс по низу фасада) --- */
  const baseMat = M.brick;
  addBox(HX * 2 + 0.14, 0.55, HZ * 2 + 0.14, baseMat, 0, 0.275, 0);
  // кирпичные вставки по углам
  [[-HX, -HZ], [-HX, HZ], [HX, -HZ], [HX, HZ]].forEach(([x, z]) => {
    addBox(0.9, ROOFY, 0.9, M.brick, x * 0.965, ROOFY / 2, z * 0.965);
  });
})();

/* =========================================================================
   7. ОКНА, ДВЕРИ, КРЫЛЬЦО, ФАСАДНЫЕ ДЕТАЛИ
   ========================================================================= */
(function facadeDetails() {
  // Окна 1 этажа
  addWindow('x', WZ,  1.30,  2.35, 0.95, 2.40, EXT);
  addWindow('x', WZ, -6.60, -5.20, 0.95, 2.40, EXT);
  addWindow('x', WZ,  3.60,  4.40, 1.55, 2.40, EXT);
  addWindow('x', WZ,  6.20,  7.30, 0.95, 2.40, EXT);
  addWindow('x', -WZ, -6.60, -5.10, 0.95, 2.45, EXT);
  addWindow('x', -WZ, -4.10, -2.60, 0.95, 2.45, EXT);
  addWindow('x', -WZ,  0.40,  2.00, 1.15, 2.45, EXT);
  addWindow('x', -WZ,  2.80,  3.70, 1.15, 2.45, EXT);

(function staircase() {
  const woodStep = M.woodMid, woodSide = M.woodDark;
  const stepW = ST_X1 - ST_X0, cx = (ST_X0 + ST_X1) / 2;

  for (let i = 0; i < ST_STEPS; i++) {
    const h = (i + 1) * ST_RISE;
    const zc = ST_Z0 + (i + 0.5) * ST_RUN;
    // тело ступени
    addBox(stepW, h, ST_RUN, i % 2 === 0 ? woodStep : M.woodLight, cx, h / 2, zc);
    // проступь с небольшим свесом
    addBox(stepW + 0.04, 0.045, ST_RUN + 0.045, M.woodLight, cx, h + 0.022, zc);
  }

  // Нижняя площадка перед лестницей
  addBox(stepW + 0.10, 0.10, 0.5, M.woodDark, cx, 0.05, ST_Z0 - 0.25);

  // Боковая обшивка (открытая сторона — западная)
  const totalRise = ST_STEPS * ST_RISE;
  const slopeLen = Math.sqrt(totalRise * totalRise + (ST_STEPS * ST_RUN) ** 2);
  const ang = Math.atan2(totalRise, ST_STEPS * ST_RUN);
  const side = addBox(0.07, 0.62, slopeLen, woodSide, ST_X0 - 0.035, totalRise / 2 - 0.02, ST_Z0 + ST_STEPS * ST_RUN / 2);
  side.rotation.x = -ang;
  const side2 = addBox(0.07, 0.62, slopeLen, woodSide, ST_X1 + 0.035, totalRise / 2 - 0.02, ST_Z0 + ST_STEPS * ST_RUN / 2);
  side2.rotation.x = -ang;

  // Перила (западная сторона)
  const railX = ST_X0 - 0.10;
  const postCount = 8;
  for (let i = 0; i <= postCount; i++) {
    const t = i / postCount;
    const z = ST_Z0 + t * ST_STEPS * ST_RUN;
    const yBase = t * totalRise;
    addBox(0.075, 0.95, 0.075, woodSide, railX, yBase + 0.475, z);
  }
  // поручень
  const handrail = addBox(0.11, 0.11, slopeLen + 0.3, woodStep, railX, totalRise / 2 + 0.97, ST_Z0 + ST_STEPS * ST_RUN / 2);
  handrail.rotation.x = -ang;

  // Верхняя площадка (переход на 2 этаж)
  addBox(stepW + 0.10, 0.06, 0.35, M.woodFloor2, cx, F2 + 0.03, ST_ZTOP + 0.16);

  /* --- Помещение под лестницей --- */
  const cy0 = 0, cy1 = 2.35;
  addBox(0.10, cy1, 1.15, M.woodDark, 5.95, cy1 / 2, 2.85);
  addBox(1.55, cy1, 0.10, M.woodDark, 6.70, cy1 / 2, 2.30);
  addBox(1.55, 0.10, 1.15, M.woodDark, 6.70, cy1, 2.85);
  // дверца
  addDoor('x', 2.30, 6.05, 6.95, 0, 2.00, INT, 0.35, true, M.woodDark);
})();

  const eaveY = ROOFY;
  const ridgeY = ROOFY + 2.25;
  const zEave = HZ + overZ;              // 6.62
  const halfSpan = zEave;                // от конька (z=0) до карниза
  const slope = Math.sqrt(halfSpan * halfSpan + (ridgeY - eaveY) ** 2);
  const ang = Math.atan2(ridgeY - eaveY, halfSpan);
  const roofLen = HX * 2 + overX * 2;    // 17.1

  // Северный скат
  const n = new THREE.Mesh(new THREE.PlaneGeometry(roofLen, slope), M.roofMat);
  n.position.set(0, (eaveY + ridgeY) / 2, -halfSpan / 2);
  n.rotation.x = -ang;
  n.castShadow = true; n.receiveShadow = true;
  roofGroup.add(n);

  // Южный скат
  const s = new THREE.Mesh(new THREE.PlaneGeometry(roofLen, slope), M.roofMat);
  s.position.set(0, (eaveY + ridgeY) / 2, halfSpan / 2);
  s.rotation.x = ang;
  s.castShadow = true; s.receiveShadow = true;
  roofGroup.add(s);

  // Фронтоны (треугольники на торцах)
  function gable(x) {
    const geo = new THREE.BufferGeometry();
    const v = new Float32Array([
      x, eaveY, -HZ,
      x, eaveY,  HZ,
      x, ridgeY, 0
    ]);
    geo.setAttribute('position', new THREE.BufferAttribute(v, 3));
    geo.setIndex([0, 1, 2]);
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, M.gableMat);
    m.castShadow = true; m.receiveShadow = true;
    roofGroup.add(m);
  }
  gable(-WX);
  gable( WX);

  // Конёк
  addBox(roofLen, 0.14, 0.24, M.woodDark, 0, ridgeY + 0.04, 0, 0, roofGroup);

  // Карнизные доски
  addBox(roofLen, 0.16, 0.30, M.woodDark, 0, eaveY - 0.06, -zEave, 0, roofGroup);
  addBox(roofLen, 0.16, 0.30, M.woodDark, 0, eaveY - 0.06,  zEave, 0, roofGroup);

  // Стропила (декоративные, снизу)
  for (let i = -8; i <= 8; i += 1.6) {
    addBox(0.10, 0.10, halfSpan, M.woodDark, i, eaveY + (ridgeY - eaveY) / 2 - 0.18, -halfSpan / 2, 0, roofGroup)
      .rotation.x = -ang;
    addBox(0.10, 0.10, halfSpan, M.woodDark, i, eaveY + (ridgeY - eaveY) / 2 - 0.18, halfSpan / 2, 0, roofGroup)
      .rotation.x = ang;
  }
})();

/* --- Книжный шкаф --- */
function makeBookshelf(x, z, ry, w, h, d, shelfCount) {
  const g = mkGroup(x, 0, z, ry);
  addBox(w, h, 0.04, M.woodDark, 0, h / 2, -d / 2, 0, g);   // задняя стенка
  addBox(0.06, h, d, M.woodMid, -w / 2 + 0.03, h / 2, 0, 0, g);
  addBox(0.06, h, d, M.woodMid,  w / 2 - 0.03, h / 2, 0, 0, g);
  addBox(w, 0.06, d, M.woodMid, 0, h - 0.03, 0, 0, g);
  addBox(w, 0.08, d, M.woodMid, 0, 0.04, 0, 0, g);
  const n = shelfCount || 4;
  const bookColors = [0x8c4a3a, 0x3a5a7c, 0x6a7a3a, 0x7a5a2a, 0x4a4a6a, 0x8a7a4a, 0x5a3a3a];
  for (let s = 1; s < n; s++) {
    const y = (h / n) * s;
    addBox(w - 0.10, 0.045, d - 0.02, M.woodLight, 0, y, 0, 0, g);
    // книги
    let bx = -w / 2 + 0.10;
    while (bx < w / 2 - 0.12) {
      const bw = rrange(0.035, 0.075);
      const bh = rrange(0.20, 0.30);
      const col = bookColors[(rnd() * bookColors.length) | 0];
      const bk = addBox(bw, bh, d - 0.10, new THREE.MeshStandardMaterial({ color: col, roughness: 0.9 }),
        bx + bw / 2, y + 0.025 + bh / 2, 0, 0, g);
      if (rnd() < 0.12) bk.rotation.z = 0.18;
      bx += bw + 0.008;
    }
  }
  return g;
}

  addCyl(0.20 * s, 0.15 * s, 0.30 * s, 12, new THREE.MeshStandardMaterial({ color: 0x9a5a3a, roughness: 0.9 }), 0, 0.15 * s, 0, g);
  addCyl(0.19 * s, 0.19 * s, 0.03 * s, 12, M.soil, 0, 0.30 * s, 0, g);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const len = rrange(0.4, 0.75) * s;
    const leaf = addBox(0.05 * s, len, 0.16 * s, M.plant,
      Math.cos(a) * 0.12 * s, 0.30 * s + len / 2, Math.sin(a) * 0.12 * s, a, g);
    leaf.rotation.z = rrange(-0.3, 0.3);
  }
  return g;
}

/* --- Кухонный гарнитур --- */
function makeCabinetRun(cx, cz, len, ry, withTop) {
  const g = mkGroup(cx, 0, cz, ry);
  const d = 0.60, h = 0.90;
  addBox(len, h, d, M.woodMid, 0, h / 2, 0, 0, g);
  const doors = Math.max(1, Math.round(len / 0.55));
  const dw = len / doors;
  for (let i = 0; i < doors; i++) {
    const x = -len / 2 + dw * (i + 0.5);
    addBox(dw - 0.04, h - 0.12, 0.03, M.woodLight, x, h / 2, d / 2 + 0.018, 0, g);
    addCyl(0.014, 0.014, 0.11, 8, M.metal, x + dw / 2 - 0.06, h / 2 + 0.18, d / 2 + 0.05, g).rotation.z = Math.PI / 2;
  }
  if (withTop !== false) addBox(len + 0.04, 0.055, d + 0.04, M.woodPale, 0, h + 0.028, 0, 0, g);
  // цоколь
  addBox(len, 0.10, d - 0.06, M.woodDark, 0, 0.05, 0, 0, g);
  return g;
}

/* --- Зеркало настенное --- */
function makeMirror(x, y, z, ry, w, h) {
  const g = mkGroup(x, y, z, ry);
  addBox(w + 0.12, h + 0.12, 0.05, M.woodDark, 0, 0, 0, 0, g);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ color: 0xb9ccd6, roughness: 0.08, metalness: 0.9 }));
  m.position.set(0, 0, 0.035); g.add(m);
  return g;
}

/* --- Настенные часы --- */
function makeClock(x, y, z, ry) {
  const g = mkGroup(x, y, z, ry);
  addCyl(0.24, 0.24, 0.07, 20, M.woodDark, 0, 0, 0, g).rotation.x = Math.PI / 2;
  addCyl(0.20, 0.20, 0.02, 20, M.paper, 0, 0, 0.045, g).rotation.x = Math.PI / 2;
  addBox(0.012, 0.15, 0.01, M.metalDark, 0, 0.06, 0.055, 0, g);
  addBox(0.10, 0.012, 0.01, M.metalDark, 0.04, 0, 0.055, 0, g);
  return g;
}

/* --- Картина --- */
function makePainting(x, y, z, ry, w, h, col) {
  const g = mkGroup(x, y, z, ry);
  addBox(w + 0.10, h + 0.10, 0.05, M.woodDark, 0, 0, 0, 0, g);
  const c = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ color: col || 0x7a6a52, roughness: 0.95 }));
  c.position.set(0, 0, 0.032); g.add(c);
  return g;
}

/* --- Шторы --- */
function makeCurtains(axis, at, from, to, yb, yt) {
  const w = to - from, h = yt - yb;
  const cx = axis === 'x' ? (from + to) / 2 : at;
  const cz = axis === 'x' ? at : (from + to) / 2;
  const g = mkGroup(cx, yb, cz, axis === 'z' ? Math.PI / 2 : 0);
  addBox(w + 0.4, 0.06, 0.06, M.woodDark, 0, h + 0.14, 0.16, 0, g);   // карниз
  addBox(0.24, h + 0.10, 0.04, M.curtain, -w / 2 - 0.06, h / 2, 0.16, 0, g);
  addBox(0.24, h + 0.10, 0.04, M.curtain,  w / 2 + 0.06, h / 2, 0.16, 0, g);
  return g;
}

/* --- Светильник потолочный --- */
function makeCeilingLamp(x, y, z, color, intensity, dist, noLight) {
  const g = mkGroup(x, y, z, 0);
  addBox(0.06, 0.22, 0.06, M.metalDark, 0, -0.11, 0, 0, g);
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.26, 0.22, 16, 1, true), M.lampShade);
  shade.position.set(0, -0.30, 0); shade.castShadow = true; g.add(shade);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), M.bulb);
  b.position.set(0, -0.34, 0); g.add(b);
  if (!noLight) {
    const l = new THREE.PointLight(color || 0xffd9a0, intensity || 22, dist || 13, 2);
    l.position.set(x, y - 0.40, z);
    scene.add(l);
  }
  return g;
}

/* --- Бра --- */
function makeSconce(x, y, z, ry, intensity) {
  const g = mkGroup(x, y, z, ry);
  addBox(0.10, 0.16, 0.08, M.metalDark, 0, 0, 0, 0, g);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.17, 12, 1, true), M.lampShade);
  shade.position.set(0, 0.13, 0.07); shade.rotation.x = -0.5; g.add(shade);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), M.bulb);
  b.position.set(0, 0.10, 0.09); g.add(b);
  const l = new THREE.PointLight(0xffc98a, intensity || 8, 7, 2);
  l.position.set(x + Math.sin(ry) * 0.2, y + 0.1, z + Math.cos(ry) * 0.2);
  scene.add(l);
  return g;
}

/* --- Свеча (декор) --- */
function makeCandle(x, y, z, parent) {
  const g = new THREE.Group(); g.position.set(x, y, z);
  (parent || scene).add(g);
  addCyl(0.035, 0.035, 0.14, 10, M.white, 0, 0.07, 0, g);
  const f = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.06, 8), new THREE.MeshBasicMaterial({ color: 0xffb84d }));
  f.position.set(0, 0.17, 0); g.add(f);
  return g;
}

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'r') { showRoof = !showRoof; roofGroup.visible = showRoof; }
  if (k === 'c') { showCeilings = !showCeilings; ceilingGroup.visible = showCeilings; }
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
