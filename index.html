<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Тёмный Дом</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family: 'Courier New', monospace; }
  canvas { display:block; }

  #overlay {
    position:fixed; inset:0; z-index:10; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, rgba(25,14,8,0.92), rgba(0,0,0,0.99));
    color:#c9b48a; text-align:center; padding:20px;
    transition: opacity .3s;
    touch-action: none;
  }
  #overlay h1 {
    font-size: clamp(28px, 6vw, 54px);
    letter-spacing: 8px; margin-bottom: 18px;
    text-shadow: 0 0 24px rgba(255,80,20,0.5), 0 0 4px #000;
    color:#e0c48a;
  }
  #overlay p { font-size: 15px; line-height: 2.0; opacity: 0.85; }
  #overlay .key { color:#ffb347; font-weight:bold; }
  #overlay .hint {
    margin-top: 30px; font-size: 13px; opacity: 0.55;
    animation: pulse 1.8s infinite; letter-spacing: 2px;
  }
  @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.9} }

  #hud {
    position:fixed; bottom:14px; left:16px; z-index:5; pointer-events:none;
    color:#8a7a5a; font-size:12px; letter-spacing:1px;
    text-shadow:0 0 8px #000;
  }
  body.mobile #hud {
    top: calc(14px + env(safe-area-inset-top, 0px));
    bottom: auto;
    font-size: 11px;
    left: 16px;
  }
  #crosshair {
    position:fixed; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    background:rgba(255,255,255,0.30); border-radius:50%; z-index:5; pointer-events:none;
    box-shadow: 0 0 6px rgba(0,0,0,0.8);
  }
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:4;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 25%, rgba(0,0,0,0.92) 100%);
  }
  #damage {
    position:fixed; inset:0; pointer-events:none; z-index:3;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(30,0,0,0.35) 100%);
    mix-blend-mode: multiply;
  }
  #grain {
    position:fixed; inset:0; pointer-events:none; z-index:2;
    opacity:0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
  }

  /* ===== МОБИЛЬНЫЕ КОНТРОЛЫ ===== */
  #mobile-controls {
    position: fixed; inset: 0; z-index: 8;
    pointer-events: none; display: none;
  }
  #mobile-controls.active { display: block; }

  #move-zone {
    position: absolute; left: 0; top: 0;
    width: 45%; height: 100%;
    pointer-events: auto; touch-action: none;
  }
  #look-zone {
    position: absolute; right: 0; top: 0;
    width: 55%; height: 100%;
    pointer-events: auto; touch-action: none;
  }

  #joystick {
    position: fixed;
    width: 130px; height: 130px;
    margin-left: -65px; margin-top: -65px;
    border-radius: 50%;
    border: 2px solid rgba(200, 180, 140, 0.35);
    background: radial-gradient(circle, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.4) 100%);
    display: none;
    z-index: 9;
    pointer-events: none;
    box-shadow: 0 0 24px rgba(0,0,0,0.55) inset;
  }
  #joystick-stick {
    position: absolute;
    left: 50%; top: 50%;
    width: 56px; height: 56px;
    margin-left: -28px; margin-top: -28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(240, 220, 180, 0.6), rgba(160, 130, 90, 0.35));
    border: 2px solid rgba(220, 200, 160, 0.7);
    box-shadow: 0 0 14px rgba(255, 200, 120, 0.25);
    pointer-events: none;
  }

  #flashlight-btn {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px));
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(18, 14, 10, 0.6);
    border: 2px solid rgba(120, 100, 70, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 12;
    pointer-events: auto;
    touch-action: none;
    color: #6a5a3a;
    box-shadow: 0 0 16px rgba(0,0,0,0.6);
    transition: background 0.15s, box-shadow 0.15s, color 0.15s, border-color 0.15s, transform 0.08s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #flashlight-btn.active {
    display: flex;
  }
  #flashlight-btn svg {
    width: 34px;
    height: 34px;
    display: block;
  }
  #flashlight-btn.on {
    color: #ffd27a;
    background: rgba(50, 35, 15, 0.78);
    border-color: rgba(255, 200, 120, 0.7);
    box-shadow: 0 0 22px rgba(255, 180, 80, 0.55), 0 0 8px rgba(255, 200, 120, 0.4) inset;
  }
  #flashlight-btn:active {
    transform: scale(0.93);
  }
</style>
</head>
<body>

<div id="overlay">
  <h1>ТЁМНЫЙ ДОМ</h1>
  <p id="overlay-help">
    <span class="key">W A S D</span> — движение<br>
    <span class="key">МЫШЬ</span> — осмотреться<br>
    <span class="key">SHIFT</span> — бежать<br>
    <span class="key">F</span> — фонарик вкл / выкл<br>
    <span class="key">ESC</span> — пауза
  </p>
  <p class="hint">НАЖМИТЕ, ЧТОБЫ ВОЙТИ В ДОМ</p>
</div>

<div id="vignette"></div>
<div id="damage"></div>
<div id="grain"></div>
<div id="crosshair"></div>
<div id="hud">ФОНАРИК: ВКЛ &nbsp;|&nbsp; ЭТАЖ: 1</div>

<!-- Мобильные контролы -->
<div id="mobile-controls">
  <div id="move-zone"></div>
  <div id="look-zone"></div>
</div>
<div id="joystick"><div id="joystick-stick"></div></div>

<!-- Кнопка фонарика (SVG-контур) -->
<div id="flashlight-btn" aria-label="Фонарик">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 5 L17 5 L15 9 L15 20 L9 20 L9 9 Z"/>
    <line x1="9" y1="12.5" x2="15" y2="12.5"/>
    <line x1="9" y1="16.5" x2="15" y2="16.5"/>
    <line x1="8" y1="3" x2="6.5" y2="1.5"/>
    <line x1="12" y1="3" x2="12" y2="1"/>
    <line x1="16" y1="3" x2="17.5" y2="1.5"/>
  </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ТЁМНЫЙ ДОМ — мрачная хоррор-прогулка по двухэтажному дому
   + Мобильные контролы / кнопка фонарика / мерцание без фонаря
   ============================================================ */

// ---------- ОПРЕДЕЛЕНИЕ МОБИЛЬНОГО УСТРОЙСТВА ----------
const isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform));
if (isMobile) document.body.classList.add('mobile');

// ---------- ОСНОВНЫЕ КОНСТАНТЫ ДОМА ----------
const T        = 0.30;
const F1       = 3.20;
const SLAB_B   = 2.90;
const F2       = 6.40;
const STAIR    = { x1: 5.20, x2: 7.80, z1: 1.0, z2: 7.0, h: F1 };

// ---------- СЦЕНА ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020304);
scene.fog = new THREE.FogExp2(0x020304, 0.062);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 200);
camera.rotation.order = 'YXZ';
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

/* ============================================================
   ПРОЦЕДУРНЫЕ ТЕКСТУРЫ (генерируются на canvas)
   ============================================================ */
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function makeTex(w, h, drawFn, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  drawFn(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = maxAniso;
  t.encoding = THREE.sRGBEncoding;
  return t;
}

function addNoise(ctx, w, h, amount) {
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * amount;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);
}

// --- ТЁМНЫЕ ОБОИ С УЗОРОМ (для внутренних стен) ---
function drawWallpaper(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0,    '#463125');
  g.addColorStop(0.45, '#39271c');
  g.addColorStop(1,    '#2b1d14');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  for (let x = 0; x < w; x += 32) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(x, 0, 2, h);
    ctx.fillStyle = 'rgba(120,80,50,0.05)';
    ctx.fillRect(x + 2, 0, 1, h);
  }

  const cell = 64;
  for (let y = 0; y < h; y += cell) {
    for (let x = 0; x < w; x += cell) {
      const off = ((y / cell) % 2) * (cell / 2);
      ctx.save();
      ctx.translate(x + off, y);

      ctx.strokeStyle = 'rgba(110, 70, 45, 0.55)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(cell/2, 8);
      ctx.lineTo(cell-8, cell/2);
      ctx.lineTo(cell/2, cell-8);
      ctx.lineTo(8, cell/2);
      ctx.closePath();
      ctx.stroke();

      ctx.strokeStyle = 'rgba(140, 95, 60, 0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cell/2, 18);
      ctx.lineTo(cell-18, cell/2);
      ctx.lineTo(cell/2, cell-18);
      ctx.lineTo(18, cell/2);
      ctx.closePath();
      ctx.stroke();

      ctx.fillStyle = 'rgba(160, 110, 65, 0.4)';
      ctx.beginPath();
      ctx.arc(cell/2, cell/2, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(90, 55, 35, 0.35)';
      for (let a = 0; a < 4; a++) {
        const ax = (a % 2) * cell;
        const ay = Math.floor(a / 2) * cell;
        ctx.beginPath();
        ctx.ellipse(ax, ay, 8, 3, Math.PI/4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  for (let i = 0; i < 40; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = 15 + Math.random() * 70;
    const rad = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = Math.random() > 0.5;
    rad.addColorStop(0, dark
      ? `rgba(15, 10, 8, ${0.15 + Math.random()*0.25})`
      : `rgba(90, 60, 35, ${0.08 + Math.random()*0.12})`);
    rad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rad;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  for (let i = 0; i < 15; i++) {
    const x = Math.random() * w;
    const len = 40 + Math.random() * 180;
    const grad = ctx.createLinearGradient(x, 0, x, len);
    grad.addColorStop(0, 'rgba(10, 8, 6, 0.5)');
    grad.addColorStop(1, 'rgba(10, 8, 6, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x, 0, 2 + Math.random() * 3, len);
  }

  addNoise(ctx, w, h, 22);
}

// --- ГРЯЗНАЯ ШТУКАТУРКА / БЕТОН (для внешних стен) ---
function drawConcrete(ctx, w, h) {
  ctx.fillStyle = '#332f2a';
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 80; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = 20 + Math.random() * 100;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = Math.random() > 0.5;
    g.addColorStop(0, dark
      ? `rgba(10, 10, 10, ${0.2 + Math.random()*0.3})`
      : `rgba(70, 65, 55, ${0.1 + Math.random()*0.2})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
  for (let i = 0; i < 10; i++) {
    ctx.lineWidth = 0.5 + Math.random() * 1.2;
    ctx.beginPath();
    let x = Math.random() * w;
    let y = Math.random() * h;
    ctx.moveTo(x, y);
    const segs = 8 + Math.floor(Math.random() * 12);
    for (let s = 0; s < segs; s++) {
      x += (Math.random() - 0.5) * 40;
      y += (Math.random() - 0.5) * 40;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  for (let i = 0; i < 25; i++) {
    const x = Math.random() * w;
    const len = 30 + Math.random() * 120;
    const grad = ctx.createLinearGradient(x, 0, x, len);
    grad.addColorStop(0, 'rgba(5, 5, 5, 0.55)');
    grad.addColorStop(1, 'rgba(5, 5, 5, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x, 0, 2 + Math.random() * 4, len);
  }

  addNoise(ctx, w, h, 45);
}

// --- ДЕРЕВЯННЫЙ ПОЛ (тёмные доски) ---
function drawWoodFloor(ctx, w, h) {
  ctx.fillStyle = '#1e140d';
  ctx.fillRect(0, 0, w, h);

  const plankH = 48;
  for (let y = 0; y < h; y += plankH) {
    const shade = 25 + Math.random() * 25;
    ctx.fillStyle = `rgb(${shade + 15}, ${shade + 2}, ${shade - 6})`;
    ctx.fillRect(0, y, w, plankH - 2);

    for (let i = 0; i < 30; i++) {
      ctx.strokeStyle = `rgba(0, 0, 0, ${0.04 + Math.random() * 0.16})`;
      ctx.lineWidth = 0.4 + Math.random() * 1.0;
      ctx.beginPath();
      const gy = y + Math.random() * plankH;
      ctx.moveTo(0, gy);
      for (let x = 0; x < w; x += 16) {
        ctx.lineTo(x, gy + Math.sin(x * 0.06 + y * 0.1) * 2 + (Math.random() - 0.5) * 2);
      }
      ctx.stroke();
    }

    for (let i = 0; i < 6; i++) {
      ctx.strokeStyle = `rgba(110, 70, 40, ${0.04 + Math.random() * 0.08})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      const gy = y + Math.random() * plankH;
      ctx.moveTo(0, gy);
      for (let x = 0; x < w; x += 20) {
        ctx.lineTo(x, gy + Math.sin(x * 0.05 + y) * 2);
      }
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(0, y + plankH - 2, w, 2);

    const offset = Math.random() * 200;
    for (let x = offset; x < w; x += 130 + Math.random() * 160) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(x, y, 2, plankH);
    }
  }

  for (let i = 0; i < 25; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = 20 + Math.random() * 60;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0, 0, 0, ${0.15 + Math.random() * 0.25})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  addNoise(ctx, w, h, 18);
}

// --- ПОТОЛОК / ПЕРЕКРЫТИЕ (пятна, трещины) ---
function drawCeiling(ctx, w, h) {
  ctx.fillStyle = '#2a2620';
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 90; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = 15 + Math.random() * 90;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = Math.random() > 0.45;
    g.addColorStop(0, dark
      ? `rgba(8, 6, 4, ${0.2 + Math.random()*0.35})`
      : `rgba(80, 65, 45, ${0.08 + Math.random()*0.15})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
  for (let i = 0; i < 12; i++) {
    ctx.lineWidth = 0.5 + Math.random() * 1.3;
    ctx.beginPath();
    let x = Math.random() * w;
    let y = Math.random() * h;
    ctx.moveTo(x, y);
    for (let s = 0; s < 10 + Math.floor(Math.random() * 10); s++) {
      x += (Math.random() - 0.5) * 35;
      y += (Math.random() - 0.5) * 35;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  addNoise(ctx, w, h, 28);
}

// --- МЕБЕЛЬНОЕ ДЕРЕВО (плотное, тёмное) ---
function drawFurnitureWood(ctx, w, h) {
  ctx.fillStyle = '#2a1a10';
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 60; i++) {
    ctx.strokeStyle = `rgba(0, 0, 0, ${0.05 + Math.random() * 0.2})`;
    ctx.lineWidth = 0.5 + Math.random() * 1.5;
    ctx.beginPath();
    const y = Math.random() * h;
    ctx.moveTo(0, y);
    for (let x = 0; x < w; x += 12) {
      ctx.lineTo(x, y + Math.sin(x * 0.1 + i) * 2 + (Math.random()-0.5)*1.5);
    }
    ctx.stroke();
  }

  for (let i = 0; i < 8; i++) {
    ctx.strokeStyle = `rgba(120, 75, 40, ${0.1 + Math.random() * 0.1})`;
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    const y = Math.random() * h;
    ctx.moveTo(0, y);
    for (let x = 0; x < w; x += 16) {
      ctx.lineTo(x, y + Math.sin(x * 0.08 + i) * 2);
    }
    ctx.stroke();
  }

  addNoise(ctx, w, h, 16);
}

// --- ТЁМНЫЙ МЕТАЛЛ (с потёртостями) ---
function drawMetal(ctx, w, h) {
  ctx.fillStyle = '#3a3a40';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 120; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 5 + Math.random() * 40;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = Math.random() > 0.5;
    g.addColorStop(0, dark ? 'rgba(0,0,0,0.35)' : 'rgba(120,110,100,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  addNoise(ctx, w, h, 25);
}

// --- ПЛИТКА (для ванной/кухни) ---
function drawTile(ctx, w, h) {
  ctx.fillStyle = '#1a1a18';
  ctx.fillRect(0, 0, w, h);
  const s = 64;
  for (let y = 0; y < h; y += s) {
    for (let x = 0; x < w; x += s) {
      const shade = 45 + Math.random() * 25;
      ctx.fillStyle = `rgb(${shade}, ${shade - 3}, ${shade - 8})`;
      ctx.fillRect(x + 2, y + 2, s - 4, s - 4);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x, y, s, 2);
      ctx.fillRect(x, y, 2, s);
    }
  }
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 10 + Math.random() * 40;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${0.2 + Math.random()*0.3})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;

function addCollider(minX, maxX, minZ, maxZ, minY, maxY) {
  colliders.push({ minX, maxX, minZ, maxZ, minY, maxY });
}

function box(w, h, d, mat, x, y, z, collide = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  if (collide) addCollider(x - w / 2, x + w / 2, z - d / 2, z + d / 2, y, y + h);
  return m;
}

function wallX(x1, x2, z, y0, y1, mat = matWall, collide = true) {
  if (x2 - x1 <= 0 || y1 - y0 <= 0) return;
  box(x2 - x1, y1 - y0, T, mat, (x1 + x2) / 2, y0, z, collide);
}
function wallZ(z1, z2, x, y0, y1, mat = matWall, collide = true) {
  if (z2 - z1 <= 0 || y1 - y0 <= 0) return;
  box(T, y1 - y0, z2 - z1, mat, x, y0, (z1 + z2) / 2, collide);
}

    phase: Math.random() * 100,
    speed: 2.5 + Math.random() * 5.0
  });
  return l;
}

// ---- Мышь / Pointer Lock (ПК) ----
let pointerLocked = false;
let gameActive = false;
let started = false;

function requestLock() {
  if (pointerLocked) return;
  try {
    const p = renderer.domElement.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  } catch (e) {
    console.warn('Не удалось захватить мышь:', e);
  }
}

document.addEventListener('pointerlockerror', () => {
  console.warn('Pointer Lock недоступен — подожди секунду и кликни снова');
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = (document.pointerLockElement === renderer.domElement);
  if (!isMobile) {
    gameActive = pointerLocked;
    overlay.style.display = pointerLocked ? 'none' : 'flex';
  }
});

document.addEventListener('mousemove', (e) => {
  if (!pointerLocked || isMobile) return;
  const sens = 0.0022;
  player.yaw   -= e.movementX * sens;
  player.pitch -= e.movementY * sens;
  const lim = Math.PI / 2 - 0.02;
  player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
});

// ---- Запуск игры ----
function startGame() {
  if (isMobile) {
    if (gameActive) return;
    gameActive = true;
    started = true;
    overlay.style.display = 'none';
    document.getElementById('mobile-controls').classList.add('active');
    flBtnEl.classList.add('active');
  } else {
    requestLock();
  }
}

overlay.addEventListener('click', startGame);
overlay.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startGame();
}, { passive: false });

renderer.domElement.addEventListener('click', () => {
  if (!isMobile && !pointerLocked) requestLock();
});

const moveZoneEl = document.getElementById('move-zone');
const lookZoneEl = document.getElementById('look-zone');
const joystickEl = document.getElementById('joystick');
const joystickStick = document.getElementById('joystick-stick');

const JOY_RADIUS = 65;
const moveVec = { x: 0, y: 0 };   // x: вправо (+), y: вниз (+). Вверх = -y → вперёд.

let moveTouchId = null;
const moveTouchOrigin = { x: 0, y: 0 };

let lookTouchId = null;
const lookTouchLast = { x: 0, y: 0 };

// --- Левый стик (движение) ---
moveZoneEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (moveTouchId !== null) return;
  const t = e.changedTouches[0];
  moveTouchId = t.identifier;
  moveTouchOrigin.x = t.clientX;
  moveTouchOrigin.y = t.clientY;
  joystickEl.style.left = t.clientX + 'px';
  joystickEl.style.top  = t.clientY + 'px';
  joystickEl.style.display = 'block';
  joystickStick.style.transform = 'translate(0px, 0px)';
}, { passive: false });

moveZoneEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== moveTouchId) continue;
    let dx = t.clientX - moveTouchOrigin.x;
    let dy = t.clientY - moveTouchOrigin.y;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_RADIUS) {
      dx = dx / dist * JOY_RADIUS;
      dy = dy / dist * JOY_RADIUS;
    }
    moveVec.x = dx / JOY_RADIUS;
    moveVec.y = dy / JOY_RADIUS;
    joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
  }
}, { passive: false });

function endMoveTouch(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== moveTouchId) continue;
    moveTouchId = null;
    moveVec.x = 0;
    moveVec.y = 0;
    joystickEl.style.display = 'none';
  }
}
moveZoneEl.addEventListener('touchend', endMoveTouch);
moveZoneEl.addEventListener('touchcancel', endMoveTouch);

// --- Правая зона (обзор) ---
lookZoneEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (lookTouchId !== null) return;
  const t = e.changedTouches[0];
  lookTouchId = t.identifier;
  lookTouchLast.x = t.clientX;
  lookTouchLast.y = t.clientY;
}, { passive: false });

lookZoneEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== lookTouchId) continue;
    const dx = t.clientX - lookTouchLast.x;
    const dy = t.clientY - lookTouchLast.y;
    lookTouchLast.x = t.clientX;
    lookTouchLast.y = t.clientY;
    const sens = 0.0045;
    player.yaw   -= dx * sens;
    player.pitch -= dy * sens;
    const lim = Math.PI / 2 - 0.02;
    player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
  }
}, { passive: false });

function endLookTouch(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== lookTouchId) continue;
    lookTouchId = null;
  }
}
lookZoneEl.addEventListener('touchend', endLookTouch);
lookZoneEl.addEventListener('touchcancel', endLookTouch);

// --- Кнопка фонарика ---
let lastFlTouch = 0;
flBtnEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  e.stopPropagation();
  lastFlTouch = Date.now();
  setFlashlight(!flashlightOn);
}, { passive: false });
flBtnEl.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (Date.now() - lastFlTouch < 500) return; // защита от двойного срабатывания
  setFlashlight(!flashlightOn);
});

/* ============================================================
   ФИЗИКА
   ============================================================ */
function getGroundHeight(x, z, feetY) {
  let best = -Infinity;
  const limit = feetY + 0.62;

  for (let i = 0; i < floorRects.length; i++) {
    const r = floorRects[i];
    if (x >= r.minX && x <= r.maxX && z >= r.minZ && z <= r.maxZ) {
      if (r.y <= limit && r.y > best) best = r.y;
    }
  }

  if (x >= STAIR.x1 && x <= STAIR.x2 && z >= STAIR.z1 && z <= STAIR.z2) {
    const t = (z - STAIR.z1) / (STAIR.z2 - STAIR.z1);
    const y = Math.min(1, Math.max(0, t)) * STAIR.h;
    if (y <= limit && y > best) best = y;
  }

  return best === -Infinity ? 0 : best;
}

function resolveCollisions(pos, feetY) {
  const r = PLAYER_RADIUS;
  const pMinY = feetY + 0.22;
  const pMaxY = feetY + 1.72;

  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (pMaxY < c.minY || pMinY > c.maxY) continue;

    const cx = Math.max(c.minX, Math.min(pos.x, c.maxX));
    const cz = Math.max(c.minZ, Math.min(pos.z, c.maxZ));
    const dx = pos.x - cx;
    const dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;

    if (d2 > r * r) continue;

    if (d2 > 1e-8) {
      const d = Math.sqrt(d2);
      const push = (r - d) / d;
      pos.x += dx * push;
      pos.z += dz * push;
    } else {
      const left  = pos.x - c.minX;
      const right = c.maxX - pos.x;
      const back  = pos.z - c.minZ;
      const front = c.maxZ - pos.z;
      const m = Math.min(left, right, back, front);
      if (m === left)       pos.x = c.minX - r;
      else if (m === right) pos.x = c.maxX + r;
      else if (m === back)  pos.z = c.minZ - r;
      else                  pos.z = c.maxZ + r;
    }
  }
}

function updatePlayer(dt) {
  // Бег: Shift на ПК или почти полное отклонение стика на мобиле
  const touchMag = Math.hypot(moveVec.x, moveVec.y);
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'] || (isMobile && touchMag > 0.88);
  const speed = sprint ? 5.2 : 2.7;

  // Объединяем клавиатуру и тач
  let fwd    = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0) - moveVec.y;
  let strafe = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0) + moveVec.x;

  let dx = 0, dz = 0;
  const mag = Math.hypot(fwd, strafe);
  if (mag > 0.001) {
    const sy = Math.sin(player.yaw);
    const cy = Math.cos(player.yaw);
    const nx = (-sy * fwd + cy * strafe) / mag;
    const nz = (-cy * fwd - sy * strafe) / mag;
    const speedMul = Math.min(1, mag); // аналоговое управление для стика
    dx = nx * speedMul;
    dz = nz * speedMul;
  }

  const totalDist = speed * dt;
  const substeps = Math.max(1, Math.ceil(totalDist / 0.12));
  const stepDist = totalDist / substeps;

  for (let s = 0; s < substeps; s++) {
    player.pos.x += dx * stepDist;
    player.pos.z += dz * stepDist;
    resolveCollisions(player.pos, player.feetY);
  }

  player.vy -= GRAVITY * dt;
  player.feetY += player.vy * dt;

  const g = getGroundHeight(player.pos.x, player.pos.z, player.feetY);
  if (player.feetY <= g) {
    player.feetY = g;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  if (player.feetY < -5) {
    player.pos.set(2.0, 0, -5.0);
    player.feetY = 0;
    player.vy = 0;
  }

  const moving = (fwd !== 0 || strafe !== 0) && player.onGround;
  const targetBob = moving ? (sprint ? 1.5 : 1.0) : 0.0;
  player.bobAmount += (targetBob - player.bobAmount) * Math.min(1, dt * 8);

  if (moving) player.bobTime += dt * (sprint ? 13 : 9);

  const bobY = Math.sin(player.bobTime * 2) * 0.030 * player.bobAmount;
  const bobX = Math.cos(player.bobTime) * 0.018 * player.bobAmount;

  camera.position.set(
    player.pos.x + bobX * Math.cos(player.yaw),
    player.feetY + EYE_HEIGHT + bobY,
    player.pos.z - bobX * Math.sin(player.yaw)
  );
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
  camera.rotation.z = Math.cos(player.bobTime) * 0.006 * player.bobAmount;
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD() {
  const floor = player.feetY > F1 - 0.6 ? 2 : 1;
  hudEl.textContent = `ФОНАРИК: ${flashlightOn ? 'ВКЛ' : 'ВЫКЛ'}  |  ЭТАЖ: ${floor}`;
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  let dt = clock.getDelta();
  if (dt > 0.05) dt = 0.05;
  elapsed += dt;

  if (gameActive) {
    updatePlayer(dt);
  } else {
    camera.position.set(player.pos.x, player.feetY + EYE_HEIGHT, player.pos.z);
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
  }

  // Мерцание лампочек
  for (let i = 0; i < flickerLights.length; i++) {
    const f = flickerLights[i];
    const t = elapsed * f.speed + f.phase;
    let n = 0.62
          + 0.26 * Math.sin(t * 1.7)
          + 0.14 * Math.sin(t * 5.3 + 1.1)
          + 0.08 * Math.sin(t * 13.7);
    if (Math.sin(t * 0.9 + f.phase) > 0.985) n *= 0.12;
    n = Math.max(0.0, n);

    f.light.intensity = f.base * n;
    f.bulb.material.color.setRGB(
      0.6 + 0.4 * n, 0.5 + 0.4 * n, 0.35 + 0.4 * n
    );
  }

  // ----- ФОНАРИК: дрожание луча -----
  if (flashlightOn) {
    const jitter = 0.012 * Math.sin(elapsed * 7.3) + 0.008 * Math.sin(elapsed * 17.1);
    flashlight.position.x = 0.18 + jitter;
    flashlight.position.y = -0.12 + jitter * 0.7;
    flFill.position.x = 0.25 + jitter;
  }

  // ----- СВЕТ ПРИ ВЫКЛЮЧЕННОМ ФОНАРИКЕ -----
  // Тускло, чуть ярче чем обычно, и мерцает (как будто глаза привыкли к темноте).
  if (!flashlightOn) {
    const t = elapsed;
    let flick = 0.82
      + 0.14 * Math.sin(t * 2.7)
      + 0.09 * Math.sin(t * 7.1 + 1.7)
      + 0.06 * Math.sin(t * 17.3 + 0.4);
    // редкие «просадки»
    if (Math.sin(t * 0.63 + 1.3) > 0.965) flick *= 0.55;
    flick = Math.max(0.30, flick);

    ambient.intensity = 0.36 * flick;   // было 0.22
    hemi.intensity    = 0.24 * flick;   // было 0.14
    ambient.color.setHex(0x1a2338);
    hemi.color.setHex(0x1a2338);
  } else {
    ambient.intensity = 0.22;
    hemi.intensity    = 0.14;
    ambient.color.setHex(0x141c2c);
    hemi.color.setHex(0x151c2c);
  }

  updateHUD();
  renderer.render(scene, camera);
}

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   АДАПТАЦИЯ ТЕКСТА ПОД МОБИЛЬНЫЙ
   ============================================================ */
if (isMobile) {
  document.getElementById('overlay-help').innerHTML = `
    <span class="key">ЛЕВАЯ ПОЛОВИНА</span> — стик движения<br>
    <span class="key">ПРАВАЯ ПОЛОВИНА</span> — осмотреться<br>
    <span class="key">КНОПКА ↖</span> — фонарик вкл / выкл
  `;
}

/* ============================================================
   СТАРТ
   ============================================================ */
setFlashlight(true);
updateHUD();
animate();
</script>
