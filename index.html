<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тёмный Дом</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family: 'Courier New', monospace; }
  canvas { display:block; }

  #overlay {
    position:fixed; inset:0; z-index:10; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, rgba(35,22,10,0.9), rgba(0,0,0,0.99));
    color:#c9b48a; text-align:center; padding:20px;
    transition: opacity .3s;
  }
  #overlay h1 {
    font-size: clamp(28px, 6vw, 54px);
    letter-spacing: 8px; margin-bottom: 18px;
    text-shadow: 0 0 24px rgba(255,140,0,0.55), 0 0 4px #000;
    color:#e0c48a;
  }
  #overlay p { font-size: 15px; line-height: 2.0; opacity: 0.85; }
  #overlay .key { color:#ffb347; font-weight:bold; }
  #overlay .hint {
    margin-top: 30px; font-size: 13px; opacity: 0.55;
    animation: pulse 1.8s infinite; letter-spacing: 2px;
  }
  @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.9} }

  #hud {
    position:fixed; bottom:14px; left:16px; z-index:5; pointer-events:none;
    color:#8a7a5a; font-size:12px; letter-spacing:1px;
    text-shadow:0 0 8px #000;
  }
  #crosshair {
    position:fixed; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    background:rgba(255,255,255,0.30); border-radius:50%; z-index:5; pointer-events:none;
    box-shadow: 0 0 6px rgba(0,0,0,0.8);
  }
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:4;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85) 100%);
  }
  #damage {
    position:fixed; inset:0; pointer-events:none; z-index:3;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(30,0,0,0.35) 100%);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>

<div id="overlay">
  <h1>ТЁМНЫЙ ДОМ</h1>
  <p>
    <span class="key">W A S D</span> — движение<br>
    <span class="key">МЫШЬ</span> — осмотреться<br>
    <span class="key">SHIFT</span> — бежать<br>
    <span class="key">F</span> — фонарик вкл / выкл<br>
    <span class="key">ESC</span> — пауза
  </p>
  <p class="hint">НАЖМИТЕ, ЧТОБЫ ВОЙТИ В ДОМ</p>
</div>

<div id="vignette"></div>
<div id="damage"></div>
<div id="crosshair"></div>
<div id="hud">ФОНАРИК: ВКЛ &nbsp;|&nbsp; ЭТАЖ: 1</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ТЁМНЫЙ ДОМ — хоррор-прогулка по двухэтажному дому
   ============================================================ */

// ---------- ОСНОВНЫЕ КОНСТАНТЫ ДОМА ----------
const T        = 0.30;
const F1       = 3.20;
const SLAB_B   = 2.90;
const F2       = 6.40;
const STAIR    = { x1: 5.20, x2: 7.80, z1: 1.0, z2: 7.0, h: F1 };

// ---------- СЦЕНА ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030406);
scene.fog = new THREE.FogExp2(0x030406, 0.052);

const camera = new THREE.PerspectiveCamera(74, innerWidth / innerHeight, 0.05, 200);
camera.rotation.order = 'YXZ';
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// ---------- МАТЕРИАЛЫ ----------
const matWallOuter = new THREE.MeshStandardMaterial({ color: 0x585349, roughness: 1.0, metalness: 0.0 });
const matWall      = new THREE.MeshStandardMaterial({ color: 0x8a8274, roughness: 0.97, metalness: 0.0 });
const matSlab      = new THREE.MeshStandardMaterial({ color: 0x3d332a, roughness: 0.95 });
const matWood      = new THREE.MeshStandardMaterial({ color: 0x63432a, roughness: 0.88 });
const matWoodDark  = new THREE.MeshStandardMaterial({ color: 0x3a2718, roughness: 0.9 });
const matDark      = new THREE.MeshStandardMaterial({ color: 0x1e1b18, roughness: 0.85 });
const matFabric    = new THREE.MeshStandardMaterial({ color: 0x35283a, roughness: 1.0 });
const matMetal     = new THREE.MeshStandardMaterial({ color: 0x55555c, roughness: 0.45, metalness: 0.7 });
const matWhite     = new THREE.MeshStandardMaterial({ color: 0xb9b6a8, roughness: 0.7 });
const matStone     = new THREE.MeshStandardMaterial({ color: 0x4a453e, roughness: 1.0 });

// ---------- СИСТЕМЫ КОЛЛИЗИЙ ----------
const colliders = [];
const floorRects = [];

function addCollider(minX, maxX, minZ, maxZ, minY, maxY) {
  colliders.push({ minX, maxX, minZ, maxZ, minY, maxY });
}

function box(w, h, d, mat, x, y, z, collide = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  if (collide) addCollider(x - w / 2, x + w / 2, z - d / 2, z + d / 2, y, y + h);
  return m;
}

function wallX(x1, x2, z, y0, y1, mat = matWall, collide = true) {
  if (x2 - x1 <= 0 || y1 - y0 <= 0) return;
  box(x2 - x1, y1 - y0, T, mat, (x1 + x2) / 2, y0, z, collide);
}
function wallZ(z1, z2, x, y0, y1, mat = matWall, collide = true) {
  if (z2 - z1 <= 0 || y1 - y0 <= 0) return;
  box(T, y1 - y0, z2 - z1, mat, x, y0, (z1 + z2) / 2, collide);
}

/* ============================================================
   ГЕОМЕТРИЯ ДОМА
   ============================================================ */

// ---------- ПОЛ 1 ЭТАЖА ----------
floorRects.push({ minX: -10, maxX: 10, minZ: -8, maxZ: 8, y: 0 });
const groundMesh = new THREE.Mesh(new THREE.BoxGeometry(20.4, 0.4, 16.4), matWoodDark);
groundMesh.position.set(0, -0.2, 0);
groundMesh.receiveShadow = true;
scene.add(groundMesh);

// ---------- ВНЕШНИЕ СТЕНЫ 1 ЭТАЖА ----------
wallX(-10, 1, -8, 0, F1, matWallOuter);
wallX(3, 10, -8, 0, F1, matWallOuter);
wallX(1, 3, -8, 2.20, F1, matWallOuter, false);
wallX(-10, 6, 8, 0, F1, matWallOuter);
wallX(8, 10, 8, 0, F1, matWallOuter);
wallX(6, 8, 8, 2.20, F1, matWallOuter, false);
wallZ(-8, 8, -10, 0, F1, matWallOuter);
wallZ(-8, 8,  10, 0, F1, matWallOuter);

// ---------- ВНУТРЕННИЕ СТЕНЫ 1 ЭТАЖА ----------
wallZ(-8, -6, 0, 0, F1);
wallZ(-4.5, 2, 0, 0, F1);
wallZ(3.5, 8, 0, 0, F1);
wallZ(-6, -4.5, 0, 2.20, F1, matWall, false);
wallZ(2, 3.5, 0, 2.20, F1, matWall, false);

wallX(-10, -3, 0, 0, F1);
wallX(-1.5, 0, 0, 0, F1);
wallX(-3, -1.5, 0, 2.20, F1, matWall, false);

wallZ(-8, -6, 4, 0, F1);
wallZ(-4.5, 0, 4, 0, F1);
wallZ(-6, -4.5, 4, 2.20, F1, matWall, false);

wallX(4, 10, 0, 0, F1);

// ---------- МЕЖЭТАЖНОЕ ПЕРЕКРЫТИЕ ----------
function slab(x1, x2, z1, z2) {
  box(x2 - x1, F1 - SLAB_B, z2 - z1, matSlab, (x1 + x2) / 2, SLAB_B, (z1 + z2) / 2, false);
  floorRects.push({ minX: x1, maxX: x2, minZ: z1, maxZ: z2, y: F1 });
}
slab(-10, 5, -8, 8);
slab(5, 8, -8, 1);
slab(5, 8, 7, 8);
slab(8, 10, -8, 8);

// ---------- ВНЕШНИЕ СТЕНЫ 2 ЭТАЖА ----------
wallX(-10, 10, -8, F1, F2, matWallOuter);
wallX(-10, 10,  8, F1, F2, matWallOuter);
wallZ(-8, 8, -10, F1, F2, matWallOuter);
wallZ(-8, 8,  10, F1, F2, matWallOuter);

// ---------- ВНУТРЕННИЕ СТЕНЫ 2 ЭТАЖА ----------
wallZ(-8, -6, 0, F1, F2);
wallZ(-4.5, 2, 0, F1, F2);
wallZ(3.5, 8, 0, F1, F2);
wallZ(-6, -4.5, 0, F1 + 2.20, F2, matWall, false);
wallZ(2, 3.5, 0, F1 + 2.20, F2, matWall, false);

wallX(-10, -3, 0, F1, F2);
wallX(-1.5, 0, 0, F1, F2);
wallX(-3, -1.5, 0, F1 + 2.20, F2, matWall, false);

wallZ(-8, -6, 4, F1, F2);
wallZ(-4.5, 0, 4, F1, F2);
wallZ(-6, -4.5, 4, F1 + 2.20, F2, matWall, false);

wallX(4, 4.5, 0, F1, F2);
wallX(6, 10, 0, F1, F2);
wallX(4.5, 6, 0, F1 + 2.20, F2, matWall, false);

// ---------- ЛЕСТНИЦА ----------
wallZ(STAIR.z1, STAIR.z2, 5, 0, F1, matWall);
wallZ(STAIR.z1, STAIR.z2, 8, 0, F1, matWall);

wallZ(STAIR.z1, STAIR.z2, 5, F1, F1 + 1.0, matWoodDark);
wallZ(STAIR.z1, STAIR.z2, 8, F1, F1 + 1.0, matWoodDark);
wallX(5, 8, STAIR.z1, F1, F1 + 1.0, matWoodDark);

const STEPS = 16;
const stepD = (STAIR.z2 - STAIR.z1) / STEPS;
const stepH = STAIR.h / STEPS;
for (let i = 0; i < STEPS; i++) {
  const zA = STAIR.z1 + i * stepD;
  const topY = (i + 1) * stepH;
  box(STAIR.x2 - STAIR.x1, topY, stepD, matWood,
      (STAIR.x1 + STAIR.x2) / 2, 0, zA + stepD / 2, false);
}
for (let i = 0; i < STEPS; i++) {
  const zA = STAIR.z1 + i * stepD + stepD;
  const topY = (i + 1) * stepH;
  const edge = new THREE.Mesh(
    new THREE.BoxGeometry(STAIR.x2 - STAIR.x1, 0.02, 0.03),
    new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: 1.0 })
  );
  edge.position.set((STAIR.x1 + STAIR.x2) / 2, topY + 0.01, zA - 0.015);
  edge.receiveShadow = true;
  scene.add(edge);
}

// ---------- ПОТОЛОК 2 ЭТАЖА ----------
box(20, 0.35, 16, matWallOuter, 0, F2, 0, false);

/* ============================================================
   МЕБЕЛЬ И ДЕКОР
   ============================================================ */

// ГОСТИНАЯ
box(3.2, 0.45, 1.15, matFabric, -6, 0, -6.5);
box(3.2, 0.55, 0.25, matFabric, -6, 0.45, -7.0);
box(0.25, 0.55, 1.15, matFabric, -7.7, 0.45, -6.5);
box(0.25, 0.55, 1.15, matFabric, -4.3, 0.45, -6.5);
box(1.6, 0.42, 0.9, matWood, -6, 0, -4.2);
box(0.06, 0.42, 0.06, matDark, -6.7, 0, -3.8, false);
box(0.06, 0.42, 0.06, matDark, -5.3, 0, -3.8, false);
box(2.6, 0.5, 0.5, matDark, -6, 0, -0.55);
box(1.7, 0.95, 0.08, matDark, -6, 0.5, -0.50);
box(0.5, 2.0, 1.8, matWood, -9.6, 0, -5);
box(0.4, 0.35, 0.35, matWoodDark, -9.6, 0.7, -5.6, false);
box(0.4, 0.35, 0.35, matWoodDark, -9.6, 0.7, -5.0, false);
box(0.4, 0.35, 0.35, matWoodDark, -9.6, 0.7, -4.4, false);
box(3.0, 0.03, 2.0, matFabric, -6, 0.001, -5.4, false);

// КУХНЯ
box(0.7, 0.9, 4.0, matWood, -9.5, 0, 4);
box(0.66, 0.06, 3.9, matStone, -9.5, 0.9, 4, false);
box(0.85, 1.9, 0.85, matMetal, -9.4, 0, 7.2);
box(1.8, 0.75, 1.0, matWood, -5, 0, 4);
box(0.45, 0.9, 0.45, matWood, -5, 0, 2.9);
box(0.45, 0.9, 0.45, matWood, -5, 0, 5.1);
box(0.6, 0.15, 0.5, matMetal, -9.5, 0.96, 2.6, false);

// КЛАДОВАЯ
box(0.5, 2.2, 3.0, matWood, 9.55, 0, -4);
box(0.45, 0.06, 2.9, matWoodDark, 9.55, 1.1, -4, false);
box(0.9, 0.9, 0.9, matWood, 6.0, 0, -6.2);
box(0.8, 0.8, 0.8, matWood, 6.1, 0.9, -6.1);
box(0.7, 0.7, 0.7, matWood, 5.4, 0, -4.5);
box(1.2, 1.0, 0.6, matWoodDark, 9.5, 0, -1.2);

// СПАЛЬНЯ 1
box(1.5, 0.5, 2.1, matWood, -8.5, F1, -6);
box(1.4, 0.28, 2.0, matWhite, -8.5, F1 + 0.5, -6);
box(1.0, 0.16, 0.42, matWhite, -8.5, F1 + 0.78, -6.8);
box(1.6, 2.2, 0.6, matWood, -3, F1, -7.5);
box(0.5, 0.55, 0.5, matWood, -7.4, F1, -7.2);
box(1.4, 0.8, 0.7, matWood, -2.5, F1, -2.5);

// СПАЛЬНЯ 2
box(1.5, 0.5, 2.1, matWood, -8.5, F1, 5);
box(1.4, 0.28, 2.0, matWhite, -8.5, F1 + 0.5, 5);
box(1.0, 0.16, 0.42, matWhite, -8.5, F1 + 0.78, 4.2);
box(1.6, 2.2, 0.6, matWood, -3, F1, 7.5);
box(1.4, 0.75, 0.7, matWood, -8.5, F1, 1.4);
box(0.5, 0.55, 0.5, matWood, -4.5, F1, 1.0);

// ВАННАЯ
box(1.7, 0.6, 0.9, matWhite, 8.4, F1, -7.2);
box(0.6, 0.2, 0.45, matWhite, 5.0, F1 + 0.85, -7.4);
box(0.5, 0.85, 0.4, matWhite, 5.0, F1, -7.4);

/* ============================================================
   СВЕТ
   ============================================================ */

scene.add(new THREE.AmbientLight(0x1b2434, 0.30));
const hemi = new THREE.HemisphereLight(0x1a2436, 0x060606, 0.18);
scene.add(hemi);

const flickerLights = [];
function addRoomLight(x, y, z, color, intensity, distance) {
  const l = new THREE.PointLight(color, intensity, distance, 2);
  l.position.set(x, y, z);
  scene.add(l);

  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.07, 8, 8),
    new THREE.MeshBasicMaterial({ color: color })
  );
  bulb.position.set(x, y, z);
  scene.add(bulb);

  flickerLights.push({
    light: l, base: intensity, bulb: bulb,
    phase: Math.random() * 100,
    speed: 2.5 + Math.random() * 5.0
  });
  return l;
}

addRoomLight(-5.5, 2.55, -4.0, 0xff9a4a, 0.55, 9);
addRoomLight(-5.5, 2.55,  4.5, 0xffc07a, 0.42, 8);
addRoomLight( 2.0, 2.55, -3.0, 0x6f8fbf, 0.30, 9);
addRoomLight( 2.0, 2.55,  4.0, 0x6f8fbf, 0.28, 9);
addRoomLight( 6.8, 2.55, -4.5, 0x8a7a5a, 0.22, 7);
addRoomLight(-5.5, F1 + 2.55, -4.0, 0xff9a4a, 0.45, 9);
addRoomLight(-5.5, F1 + 2.55,  4.5, 0xff9a4a, 0.40, 9);
addRoomLight( 2.0, F1 + 2.55,  0.0, 0x6f8fbf, 0.28, 9);
addRoomLight( 7.5, F1 + 2.55, -4.0, 0x88a0b8, 0.30, 7);

/* ============================================================
   ФОНАРИК
   ============================================================ */
const flashlight = new THREE.SpotLight(0xfff0cf, 3.2, 34, Math.PI / 7.2, 0.42, 1.35);
flashlight.castShadow = true;
flashlight.shadow.mapSize.set(1024, 1024);
flashlight.shadow.camera.near = 0.15;
flashlight.shadow.camera.far = 40;
flashlight.shadow.bias = -0.0009;
flashlight.position.set(0.18, -0.12, 0.0);
camera.add(flashlight);

const flTarget = new THREE.Object3D();
flTarget.position.set(0.10, -0.10, -3.0);
camera.add(flTarget);
flashlight.target = flTarget;

const flFill = new THREE.PointLight(0xffe3b8, 0.85, 4.0, 2);
flFill.position.set(0.25, -0.15, -0.35);
camera.add(flFill);

const handGroup = new THREE.Group();
handGroup.position.set(0.30, -0.24, -0.42);
handGroup.rotation.set(-0.06, 0.05, 0.0);
camera.add(handGroup);

const flBody = new THREE.Mesh(new THREE.CylinderGeometry(0.033, 0.042, 0.22, 14), matMetal);
flBody.rotation.x = Math.PI / 2;
flBody.castShadow = false;
handGroup.add(flBody);

const flHead = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.05, 0.11, 14), matMetal);
flHead.rotation.x = Math.PI / 2;
flHead.position.z = -0.155;
handGroup.add(flHead);

const flGrip = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.09, 14), matDark);
flGrip.rotation.x = Math.PI / 2;
flGrip.position.z = 0.055;
handGroup.add(flGrip);

const flLensMat = new THREE.MeshBasicMaterial({ color: 0xfff3d0 });
const flLens = new THREE.Mesh(new THREE.CircleGeometry(0.062, 16), flLensMat);
flLens.position.z = -0.212;
flLens.rotation.y = Math.PI;
handGroup.add(flLens);

const handMat = new THREE.MeshStandardMaterial({ color: 0x6b5744, roughness: 1.0 });
const handMesh = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.10, 0.20), handMat);
handMesh.position.set(0.005, -0.035, 0.09);
handGroup.add(handMesh);

let flashlightOn = true;

function setFlashlight(on) {
  flashlightOn = on;
  flashlight.visible = on;
  flFill.visible = on;
  flLensMat.color.setHex(on ? 0xfff3d0 : 0x2a2620);
  updateHUD();
}

/* ============================================================
   ИГРОК
   ============================================================ */
const player = {
  pos: new THREE.Vector3(2.0, 0, -5.0),
  feetY: 0,
  yaw: Math.PI,
  pitch: 0,
  vy: 0,
  onGround: true,
  bobTime: 0,
  bobAmount: 0
};

const PLAYER_RADIUS = 0.34;
const EYE_HEIGHT    = 1.68;
const GRAVITY       = 24.0;

/* ============================================================
   ВВОД
   ============================================================ */
const keys = {};
const overlay = document.getElementById('overlay');
const hudEl = document.getElementById('hud');

document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyF') setFlashlight(!flashlightOn);
});
document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
});

let pointerLocked = false;

// === ИСПРАВЛЕНО: клик работает и по оверлею, и по канвасу ===
function requestLock() {
  if (pointerLocked) return;
  try {
    const p = renderer.domElement.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  } catch (e) {
    console.warn('Не удалось захватить мышь:', e);
  }
}

overlay.addEventListener('click', requestLock);
renderer.domElement.addEventListener('click', requestLock);

document.addEventListener('pointerlockerror', () => {
  console.warn('Pointer Lock недоступен — подожди секунду и кликни снова');
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = (document.pointerLockElement === renderer.domElement);
  overlay.style.display = pointerLocked ? 'none' : 'flex';
});

document.addEventListener('mousemove', (e) => {
  if (!pointerLocked) return;
  const sens = 0.0022;
  player.yaw   -= e.movementX * sens;
  player.pitch -= e.movementY * sens;
  const lim = Math.PI / 2 - 0.02;
  player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
});

/* ============================================================
   ФИЗИКА
   ============================================================ */
function getGroundHeight(x, z, feetY) {
  let best = -Infinity;
  const limit = feetY + 0.62;

  for (let i = 0; i < floorRects.length; i++) {
    const r = floorRects[i];
    if (x >= r.minX && x <= r.maxX && z >= r.minZ && z <= r.maxZ) {
      if (r.y <= limit && r.y > best) best = r.y;
    }
  }

  if (x >= STAIR.x1 && x <= STAIR.x2 && z >= STAIR.z1 && z <= STAIR.z2) {
    const t = (z - STAIR.z1) / (STAIR.z2 - STAIR.z1);
    const y = Math.min(1, Math.max(0, t)) * STAIR.h;
    if (y <= limit && y > best) best = y;
  }

  return best === -Infinity ? 0 : best;
}

function resolveCollisions(pos, feetY) {
  const r = PLAYER_RADIUS;
  const pMinY = feetY + 0.22;
  const pMaxY = feetY + 1.72;

  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (pMaxY < c.minY || pMinY > c.maxY) continue;

    const cx = Math.max(c.minX, Math.min(pos.x, c.maxX));
    const cz = Math.max(c.minZ, Math.min(pos.z, c.maxZ));
    const dx = pos.x - cx;
    const dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;

    if (d2 > r * r) continue;

    if (d2 > 1e-8) {
      const d = Math.sqrt(d2);
      const push = (r - d) / d;
      pos.x += dx * push;
      pos.z += dz * push;
    } else {
      const left  = pos.x - c.minX;
      const right = c.maxX - pos.x;
      const back  = pos.z - c.minZ;
      const front = c.maxZ - pos.z;
      const m = Math.min(left, right, back, front);
      if (m === left)       pos.x = c.minX - r;
      else if (m === right) pos.x = c.maxX + r;
      else if (m === back)  pos.z = c.minZ - r;
      else                  pos.z = c.maxZ + r;
    }
  }
}

function updatePlayer(dt) {
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = sprint ? 5.2 : 2.7;

  const fwd    = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
  const strafe = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);

  let dx = 0, dz = 0;
  if (fwd !== 0 || strafe !== 0) {
    const sy = Math.sin(player.yaw);
    const cy = Math.cos(player.yaw);
    dx = -sy * fwd + cy * strafe;
    dz = -cy * fwd - sy * strafe;
    const len = Math.hypot(dx, dz);
    dx /= len; dz /= len;
  }

  const totalDist = speed * dt;
  const substeps = Math.max(1, Math.ceil(totalDist / 0.12));
  const stepDist = totalDist / substeps;

  for (let s = 0; s < substeps; s++) {
    player.pos.x += dx * stepDist;
    player.pos.z += dz * stepDist;
    resolveCollisions(player.pos, player.feetY);
  }

  player.vy -= GRAVITY * dt;
  player.feetY += player.vy * dt;

  const g = getGroundHeight(player.pos.x, player.pos.z, player.feetY);
  if (player.feetY <= g) {
    player.feetY = g;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  if (player.feetY < -5) {
    player.pos.set(2.0, 0, -5.0);
    player.feetY = 0;
    player.vy = 0;
  }

  const moving = (fwd !== 0 || strafe !== 0) && player.onGround;
  const targetBob = moving ? (sprint ? 1.5 : 1.0) : 0.0;
  player.bobAmount += (targetBob - player.bobAmount) * Math.min(1, dt * 8);

  if (moving) player.bobTime += dt * (sprint ? 13 : 9);

  const bobY = Math.sin(player.bobTime * 2) * 0.030 * player.bobAmount;
  const bobX = Math.cos(player.bobTime) * 0.018 * player.bobAmount;

  camera.position.set(
    player.pos.x + bobX * Math.cos(player.yaw),
    player.feetY + EYE_HEIGHT + bobY,
    player.pos.z - bobX * Math.sin(player.yaw)
  );
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
  camera.rotation.z = Math.cos(player.bobTime) * 0.006 * player.bobAmount;
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD() {
  const floor = player.feetY > F1 - 0.6 ? 2 : 1;
  hudEl.textContent = `ФОНАРИК: ${flashlightOn ? 'ВКЛ' : 'ВЫКЛ'}  |  ЭТАЖ: ${floor}`;
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);

  let dt = clock.getDelta();
  if (dt > 0.05) dt = 0.05;
  elapsed += dt;

  if (pointerLocked) {
    updatePlayer(dt);
  } else {
    camera.position.set(player.pos.x, player.feetY + EYE_HEIGHT, player.pos.z);
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
  }

  for (let i = 0; i < flickerLights.length; i++) {
    const f = flickerLights[i];
    const t = elapsed * f.speed + f.phase;
    let n = 0.62
          + 0.26 * Math.sin(t * 1.7)
          + 0.14 * Math.sin(t * 5.3 + 1.1)
          + 0.08 * Math.sin(t * 13.7);
    if (Math.sin(t * 0.9 + f.phase) > 0.985) n *= 0.12;
    n = Math.max(0.0, n);

    f.light.intensity = f.base * n;
    f.bulb.material.color.setRGB(
      0.6 + 0.4 * n, 0.5 + 0.4 * n, 0.35 + 0.4 * n
    );
  }

  if (flashlightOn) {
    const jitter = 0.012 * Math.sin(elapsed * 7.3) + 0.008 * Math.sin(elapsed * 17.1);
    flashlight.position.x = 0.18 + jitter;
    flashlight.position.y = -0.12 + jitter * 0.7;
    flFill.position.x = 0.25 + jitter;
  }

  updateHUD();
  renderer.render(scene, camera);
}

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   СТАРТ
   ============================================================ */
setFlashlight(true);
updateHUD();
animate();
</script>
</body>
</html>
