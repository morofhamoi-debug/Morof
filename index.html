<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0. БАЗОВЫЕ КОНСТАНТЫ ДОМА
   ============================================================ */
const X0 = -8, X1 = 8;          // ширина дома (16 м)
const Z0 = -6, Z1 = 6;          // глубина дома (12 м)
const H1 = 3.0;                 // высота 1-го этажа
const SLAB = 0.25;              // толщина межэтажного перекрытия
const F2 = H1 + SLAB;           // 3.25 — уровень пола 2-го этажа
const H2 = 3.0;                 // высота 2-го этажа
const ROOF = F2 + H2;           // 6.25 — уровень потолка 2-го этажа
const EXT = 0.30;               // толщина наружных стен
const INT = 0.14;               // толщина внутренних перегородок

/* ============================================================
   1. РЕНДЕРЕР / СЦЕНА / КАМЕРА
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x232a33);
scene.fog = new THREE.Fog(0x232a33, 55, 170);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 500);
camera.position.set(22, 15, 26);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 3;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.515;
controls.update();

/* ============================================================
   2. ПРОЦЕДУРНЫЕ ТЕКСТУРЫ
   ============================================================ */
function makeTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

function plasterTex(tint = '#d9d3c6', grime = 0.05) {
  return makeTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = tint;
    ctx.fillRect(0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 22;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    ctx.putImageData(img, 0, 0);
    for (let i = 0; i < 70; i++) {
      ctx.fillStyle = `rgba(120,104,80,${Math.random() * grime})`;
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 42 + 8, 0, 6.3);
      ctx.fill();
    }
    // тонкие трещины
    ctx.strokeStyle = 'rgba(88,78,64,0.20)';
    for (let i = 0; i < 7; i++) {
      ctx.lineWidth = 0.6 + Math.random() * 0.9;
      let x = Math.random() * w, y = Math.random() * h;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let s = 0; s < 9; s++) {
        x += (Math.random() - 0.5) * 34;
        y += (Math.random() - 0.5) * 34;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // потёртости
    for (let i = 0; i < 30; i++) {
      ctx.fillStyle = `rgba(255,250,240,${Math.random() * 0.05})`;
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 20 + 4, 0, 6.3);
      ctx.fill();
    }
  }, 1, 1);
}

function woodTex(baseR = 104, baseG = 70, baseB = 42, rows = 8) {
  return makeTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = `rgb(${baseR * 0.7 | 0},${baseG * 0.7 | 0},${baseB * 0.7 | 0})`;
    ctx.fillRect(0, 0, w, h);
    const rh = h / rows;
    for (let r = 0; r < rows; r++) {
      const y = r * rh;
      const off = (r % 2) * (w / 3);
      for (let px = -w; px < w * 2; px += w / 2.5) {
        const v = 0.82 + Math.random() * 0.36;
        ctx.fillStyle = `rgb(${baseR * v | 0},${baseG * v | 0},${baseB * v | 0})`;
        ctx.fillRect(px + off, y, w / 2.5 - 2, rh - 2);
      }
      for (let g = 0; g < 16; g++) {
        ctx.strokeStyle = `rgba(0,0,0,${0.03 + Math.random() * 0.06})`;
        ctx.lineWidth = 1;
        const gy = y + Math.random() * rh;
        ctx.beginPath();
        ctx.moveTo(0, gy);
        for (let x = 0; x <= w; x += w / 10) ctx.lineTo(x, gy + (Math.random() - 0.5) * 3.2);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.34)';
      ctx.fillRect(0, y + rh - 2, w, 2);
    }
    // царапины и потёртости
    for (let i = 0; i < 90; i++) {
      ctx.fillStyle = `rgba(255,240,215,${Math.random() * 0.035})`;
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 12 + 1, 0, 6.3);
      ctx.fill();
    }
  }, 1, 1);
}

function tileTex(colR = 196, colG = 200, colB = 202, gapCol = '#7e8488', n = 4) {
  return makeTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = gapCol;
    ctx.fillRect(0, 0, w, h);
    const s = w / n;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const v = 0.90 + Math.random() * 0.18;
        ctx.fillStyle = `rgb(${colR * v | 0},${colG * v | 0},${colB * v | 0})`;
        ctx.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
      }
    }
    for (let i = 0; i < 160; i++) {
      ctx.fillStyle = `rgba(72,72,66,${Math.random() * 0.05})`;
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 11 + 1, 0, 6.3);
      ctx.fill();
    }
  }, 1, 1);
}

function carpetTex(color = '#6b3f3a') {
  return makeTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 40;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    ctx.putImageData(img, 0, 0);
    ctx.strokeStyle = 'rgba(230,215,190,0.18)';
    ctx.lineWidth = 5;
    ctx.strokeRect(14, 14, w - 28, h - 28);
    ctx.lineWidth = 2;
    ctx.strokeRect(26, 26, w - 52, h - 52);
  }, 1, 1);
}

function roofTex() {
  return makeTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#3a3330';
    ctx.fillRect(0, 0, w, h);
    const rows = 10, rh = h / rows;
    for (let r = 0; r < rows; r++) {
      const y = r * rh;
      const off = (r % 2) * 14;
      for (let x = -30; x < w + 30; x += 28) {
        const v = 0.78 + Math.random() * 0.34;
        ctx.fillStyle = `rgb(${72 * v | 0},${64 * v | 0},${60 * v | 0})`;
        ctx.fillRect(x + off, y + 1, 26, rh - 2);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.42)';
      ctx.fillRect(0, y + rh - 2, w, 2);
    }
  }, 1, 1);
}

/* ============================================================
   3. МАТЕРИАЛЫ
   ============================================================ */
const texPlaster = plasterTex('#d9d3c6', 0.055);
const texPlasterExt = plasterTex('#b9ac97', 0.085);
const texWoodFloor = woodTex(112, 76, 46, 8);
const texWoodFloor2 = woodTex(96, 66, 42, 10);
const texTileKitchen = tileTex(198, 192, 178, '#8a8579', 4);
const texTileBath = tileTex(176, 190, 196, '#7c878c', 6);
const texCarpet = carpetTex('#6d4038');
const texCarpet2 = carpetTex('#3f4a52');
const texRoof = roofTex();

const matWall      = new THREE.MeshStandardMaterial({ map: texPlaster, roughness: 0.96, metalness: 0.0 });
const matWallExt   = new THREE.MeshStandardMaterial({ map: texPlasterExt, roughness: 0.97, metalness: 0.0 });
const matFloorWood = new THREE.MeshStandardMaterial({ map: texWoodFloor, roughness: 0.68, metalness: 0.0 });
const matFloorWood2= new THREE.MeshStandardMaterial({ map: texWoodFloor2, roughness: 0.72, metalness: 0.0 });
const matFloorTile = new THREE.MeshStandardMaterial({ map: texTileKitchen, roughness: 0.42, metalness: 0.03 });
const matFloorBath = new THREE.MeshStandardMaterial({ map: texTileBath, roughness: 0.34, metalness: 0.05 });
const matCarpet    = new THREE.MeshStandardMaterial({ map: texCarpet, roughness: 1.0 });
const matCarpet2   = new THREE.MeshStandardMaterial({ map: texCarpet2, roughness: 1.0 });
const matRoof      = new THREE.MeshStandardMaterial({ map: texRoof, roughness: 0.88, metalness: 0.03 });

const matWoodDark  = new THREE.MeshStandardMaterial({ color: 0x4a3220, roughness: 0.62, metalness: 0.04 });
const matWoodMid   = new THREE.MeshStandardMaterial({ color: 0x6b4a2e, roughness: 0.66, metalness: 0.03 });
const matWoodLight = new THREE.MeshStandardMaterial({ color: 0x9a7850, roughness: 0.7, metalness: 0.0 });
const matTrim      = new THREE.MeshStandardMaterial({ color: 0xe4ded1, roughness: 0.72 });
const matDoor      = new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 0.58, metalness: 0.03 });
const matDoorDark  = new THREE.MeshStandardMaterial({ color: 0x5d4229, roughness: 0.6 });
const matMetal     = new THREE.MeshStandardMaterial({ color: 0x8a8d91, roughness: 0.35, metalness: 0.85 });
const matMetalDark = new THREE.MeshStandardMaterial({ color: 0x3e4247, roughness: 0.45, metalness: 0.7 });
const matGlass     = new THREE.MeshPhysicalMaterial({
  color: 0xcfe0e8, roughness: 0.06, metalness: 0.0,
  transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false
});
const matWindowFrame = new THREE.MeshStandardMaterial({ color: 0xd8d2c4, roughness: 0.7 });
const matFabricSofa  = new THREE.MeshStandardMaterial({ color: 0x5a4a3c, roughness: 0.96 });
const matFabricChair = new THREE.MeshStandardMaterial({ color: 0x6a5140, roughness: 0.96 });
const matFabricBlue  = new THREE.MeshStandardMaterial({ color: 0x3d4a58, roughness: 0.95 });
const matSheet       = new THREE.MeshStandardMaterial({ color: 0xe8e4da, roughness: 0.9 });
const matBlanket     = new THREE.MeshStandardMaterial({ color: 0x7a4a3a, roughness: 0.95 });
const matBlanket2    = new THREE.MeshStandardMaterial({ color: 0x445a63, roughness: 0.95 });
const matStone       = new THREE.MeshStandardMaterial({ color: 0x6d6a63, roughness: 0.95 });
const matPorcelain   = new THREE.MeshStandardMaterial({ color: 0xf2f4f3, roughness: 0.22, metalness: 0.02 });
const matPaper       = new THREE.MeshStandardMaterial({ color: 0xd8cfb8, roughness: 0.95 });
const matLampGlow    = new THREE.MeshStandardMaterial({
  color: 0xfff4d8, emissive: 0xffd9a0, emissiveIntensity: 2.6, roughness: 0.4
});
const matLampGlow2   = new THREE.MeshStandardMaterial({
  color: 0xe8f2ff, emissive: 0xa8ccff, emissiveIntensity: 2.0, roughness: 0.4
});
const matCanvasArt   = new THREE.MeshStandardMaterial({ color: 0x8a7a5e, roughness: 0.9 });
const matGround      = new THREE.MeshStandardMaterial({ color: 0x3a4030, roughness: 1.0 });
const matPath        = new THREE.MeshStandardMaterial({ color: 0x6a6157, roughness: 1.0 });
const matFoliage     = new THREE.MeshStandardMaterial({ color: 0x2f4429, roughness: 1.0 });
const matTrunk       = new THREE.MeshStandardMaterial({ color: 0x3a2b1e, roughness: 1.0 });

/* ============================================================
   4. ГЕОМЕТРИЯ-ХЕЛПЕРЫ
   ============================================================ */
const geoCache = new Map();
function boxGeo(w, h, d) {
  const k = w.toFixed(3) + '|' + h.toFixed(3) + '|' + d.toFixed(3);
  let g = geoCache.get(k);
  if (!g) { g = new THREE.BoxGeometry(w, h, d); geoCache.set(k, g); }
  return g;
}

// Бокс с UV, отмасштабированными под реальный размер (для стен/полов)
function uvBox(w, h, d, s = 0.36) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const a = uv.array;
  for (let f = 0; f < 6; f++) {
    let sw, sh;
    if (f === 0 || f === 1)      { sw = d; sh = h; }   // ±X
    else if (f === 2 || f === 3) { sw = w; sh = d; }   // ±Y
    else                         { sw = w; sh = h; }   // ±Z
    for (let v = 0; v < 4; v++) {
      const i = (f * 4 + v) * 2;
      a[i]     *= sw * s;
      a[i + 1] *= sh * s;
    }
  }
  uv.needsUpdate = true;
  return g;
}

function addBox(parent, w, h, d, mat, x, y, z, ry = 0, rx = 0, rz = 0) {
  const m = new THREE.Mesh(boxGeo(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function addTexBox(parent, w, h, d, mat, x, y, z, ry = 0, s = 0.36) {
  const m = new THREE.Mesh(uvBox(w, h, d, s), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ---------- СТЕНА С ПРОЁМАМИ ----------
   x1,z1 -> x2,z2 : линия стены
   openings: [{from, width, bottom, top, type}] — from отсчитывается от (x1,z1)  */
function buildWall(parent, x1, z1, x2, z2, opts = {}) {
  const {
    y0 = 0, height = H1, thickness = INT,
    openings = [], material = matWall, uvScale = 0.36, solidMat = null
  } = opts;

  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  if (len < 1e-4) return null;
  const ang = Math.atan2(dz, dx);

  const g = new THREE.Group();
  g.position.set((x1 + x2) / 2, y0, (z1 + z2) / 2);
  g.rotation.y = -ang;
  parent.add(g);

  const piece = (from, to, yb, yt) => {
    const w = to - from, hgt = yt - yb;
    if (w <= 0.002 || hgt <= 0.002) return;
    const m = new THREE.Mesh(uvBox(w, hgt, thickness, uvScale), solidMat || material);
    m.position.set(-len / 2 + (from + to) / 2, (yb + yt) / 2, 0);
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
  };

  const ops = openings.slice().sort((a, b) => a.from - b.from);
  let cursor = 0;
  for (const op of ops) {
    const b = op.bottom ?? 0;
    const t = op.top ?? height;
    piece(cursor, op.from, 0, height);
    if (b > 0) piece(op.from, op.from + op.width, 0, b);
    if (t < height) piece(op.from, op.from + op.width, t, height);
    cursor = op.from + op.width;
  }
  piece(cursor, len, 0, height);

  return { group: g, len, ang, x1, z1, dx, dz };
}

/* ---------- ОКНО ---------- */
function addWindow(parent, cx, cz, ry, w, h, sill, yBase = 0) {
  const g = new THREE.Group();
  g.position.set(cx, yBase, cz);
  g.rotation.y = ry;
  parent.add(g);

  const t = 0.07, fr = matWindowFrame;
  addBox(g, w, t, 0.24, fr, 0, sill + h - t / 2, 0);
  addBox(g, w, t, 0.24, fr, 0, sill + t / 2, 0);

  addBox(g, t, h, 0.24, fr,  w / 2 - t / 2, sill + h / 2, 0);
  // импосты
  addBox(g, 0.045, h - 0.1, 0.13, fr, 0, sill + h / 2, 0);
  addBox(g, w - 0.1, 0.045, 0.13, fr, 0, sill + h / 2, 0);
  // стекло
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.1, h -
