<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Номера РФ — Полная коллекция</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{
  font-family:'Manrope',sans-serif;
  background:#040a08;color:#fff;min-height:100vh;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(circle at 15% 15%, rgba(16,185,129,.18), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(45,212,160,.12), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(6,78,59,.15), transparent 60%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(45,212,160,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(45,212,160,.035) 1px, transparent 1px);
  background-size:60px 60px;pointer-events:none;
  -webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
  mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
  z-index:0;
}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* HERO */
.hero{text-align:center;padding:48px 20px 12px}
.hero-badge{
  display:inline-block;padding:7px 18px;border-radius:100px;
  background:rgba(45,212,160,.08);border:1px solid rgba(45,212,160,.28);
  color:#2dd4a0;font-size:11px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;margin-bottom:18px;backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(45,212,160,.15);
}
.hero h1{
  font-size:clamp(28px,5vw,52px);font-weight:800;
  line-height:1.05;letter-spacing:-.025em;margin-bottom:14px;
}
.hero h1 span{
  background:linear-gradient(120deg,#2dd4a0 0%,#10b981 50%,#5eead4 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px rgba(45,212,160,.35));
}
.hero p{
  color:rgba(255,255,255,.5);font-size:14px;
  max-width:560px;margin:0 auto;line-height:1.6;font-weight:400;
}

/* CAROUSEL */
.carousel{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:14px 0 0}
.carousel-viewport{
  position:relative;width:100%;height:560px;overflow:hidden;
  perspective:1600px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);
}
.track{position:absolute;inset:0}
.card{
  position:absolute;top:50%;left:50%;
  width:min(400px,78vw);
  transform:translate(-50%,-50%) translateX(var(--x,0)) scale(var(--scale,1));
  opacity:var(--opacity,1);
  transition:transform .75s cubic-bezier(.25,.8,.25,1),
             opacity .75s ease,
             filter .75s ease;
  will-change:transform,opacity;
  z-index:var(--z,1);
  perspective:1200px;
}
.card.card-enter{opacity:0 !important}
.card-inner{
  position:relative;display:flex;flex-direction:column;gap:22px;
  padding:30px;border-radius:28px;
  background:linear-gradient(160deg, rgba(22,40,34,.75), rgba(8,18,15,.9));
  border:1px solid rgba(45,212,160,.14);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:
    0 30px 60px -20px rgba(0,0,0,.85),
    0 0 0 1px rgba(255,255,255,.03) inset,
    0 1px 0 rgba(255,255,255,.05) inset;
  transition:transform .35s cubic-bezier(.25,.8,.25,1),
             border-color .35s ease, box-shadow .35s ease;
  transform-style:preserve-3d;
}
.card.is-active .card-inner{
  border-color:rgba(45,212,160,.4);
  box-shadow:
    0 30px 60px -20px rgba(0,0,0,.85),
    0 0 50px -8px rgba(45,212,160,.45),
    0 0 0 1px rgba(45,212,160,.18) inset,
    0 1px 0 rgba(255,255,255,.06) inset;
}
.card:hover{z-index:200!important}
.card:hover .card-inner{
  transform:perspective(1200px) rotateY(-4deg) rotateX(3deg) translateY(-10px) scale(1.02);
}
.card:not(.is-active){filter:blur(var(--blur,0px))}

/* PLATE */
.plate-wrap{
  border-radius:14px;overflow:hidden;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.5);
  transform:translateZ(20px);
}
.plate-svg{display:block;width:100%;height:auto}
.plate-char{font-family:'Manrope',sans-serif;font-size:68px;font-weight:800;fill:#0a0a0a;letter-spacing:-1px}
.plate-region{font-family:'Manrope',sans-serif;font-size:34px;font-weight:700;fill:#0a0a0a}
.plate-rus{font-family:'Manrope',sans-serif;font-size:19px;font-weight:700;fill:#0a0a0a;letter-spacing:.5px}

/* BANKNOTE */
.banknote{
  position:relative;width:100%;aspect-ratio:420/200;
  border-radius:18px;overflow:hidden;
  box-shadow:
    0 18px 40px -12px rgba(0,0,0,.9),
    0 0 0 1px rgba(45,212,160,.18),
    0 0 30px -6px rgba(45,212,160,.25);
  transform:translateZ(10px);
  transition:box-shadow .35s ease;
}
.card.is-active .banknote{
  box-shadow:
    0 18px 40px -12px rgba(0,0,0,.9),
    0 0 0 1px rgba(45,212,160,.4),
    0 0 50px -6px rgba(45,212,160,.5);
}
.banknote-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bn-top{font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;fill:rgba(45,212,160,.7)}
.bn-denom{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;fill:rgba(255,255,255,.45)}
.bn-symbol{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;fill:rgba(45,212,160,.65)}
.bn-rub{font-family:'Manrope',sans-serif;font-size:9px;font-weight:600;letter-spacing:3px;fill:rgba(45,212,160,.5)}
.bn-serial{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:500;fill:rgba(255,255,255,.35)}

/* PRICE */
.price-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
  pointer-events:none;text-align:center;padding:0 12px;
}
.price-label{
  font-size:10px;letter-spacing:4px;text-transform:uppercase;
  color:rgba(45,212,160,.85);font-weight:700;
  text-shadow:0 0 12px rgba(45,212,160,.5);
}
.price-value{
  display:flex;align-items:baseline;gap:5px;
  font-family:'JetBrains Mono',monospace;font-weight:800;color:#fff;
  line-height:1;letter-spacing:-1px;
  text-shadow:0 2px 24px rgba(45,212,160,.7), 0 0 12px rgba(45,212,160,.4);
}
.price-value .num{font-size:clamp(26px,6.5vw,38px)}
.price-value .cur{font-size:clamp(16px,4.5vw,24px);color:#2dd4a0}
.card.is-active .price-value{animation:pricePulse 2.6s ease-in-out infinite}
@keyframes pricePulse{
  0%,100%{text-shadow:0 2px 24px rgba(45,212,160,.7),0 0 12px rgba(45,212,160,.4)}
  50%{text-shadow:0 2px 36px rgba(45,212,160,1),0 0 24px rgba(45,212,160,.8)}
}

/* SHIMMER */
.shimmer{position:absolute;inset:0;border-radius:18px;overflow:hidden;pointer-events:none}
.shimmer::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);
  transform:translateX(-110%);
  animation:shimmerMove 4s ease-in-out infinite;
}
.card:hover .shimmer::before{animation-duration:1.4s}
@keyframes shimmerMove{
  0%,100%{transform:translateX(-110%)}
  55%{transform:translateX(110%)}
}
.card:hover .banknote{animation:wobble .7s ease-in-out}
@keyframes wobble{
  0%,100%{transform:translateZ(10px) rotate(0)}
  25%{transform:translateZ(10px) rotate(-1.4deg)}
  75%{transform:translateZ(10px) rotate(1.4deg)}
}

/* NAV */
.nav-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  width:56px;height:56px;border-radius:50%;
  background:rgba(18,32,27,.7);
  border:1px solid rgba(45,212,160,.3);
  color:#2dd4a0;font-size:26px;font-weight:400;
  cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:all .3s cubic-bezier(.25,.8,.25,1);
  z-index:300;display:flex;align-items:center;justify-content:center;
  line-height:1;padding-bottom:4px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.8);
}
.nav-btn:hover{
  background:rgba(45,212,160,.15);
  border-color:rgba(45,212,160,.7);
  box-shadow:0 0 36px rgba(45,212,160,.5);
  transform:translateY(-50%) scale(1.1);
}
.nav-btn:active{transform:translateY(-50%) scale(.96)}
.nav-btn:disabled{opacity:.25;cursor:not-allowed}
.nav-btn.prev{left:max(16px,4vw)}
.nav-btn.next{right:max(16px,4vw)}

/* COUNTER */
.counter{
  display:flex;justify-content:center;align-items:center;gap:12px;
  padding:24px 20px 6px;position:relative;z-index:5;flex-wrap:wrap;
}
.counter-pill{
  display:inline-flex;align-items:center;gap:10px;
  padding:10px 22px;border-radius:100px;
  background:rgba(18,32,27,.65);
  border:1px solid rgba(45,212,160,.22);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 24px -8px rgba(0,0,0,.7), 0 0 24px -8px rgba(45,212,160,.3);
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;
  letter-spacing:.5px;
}
.counter-pill .label{
  font-family:'Manrope',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;color:rgba(45,212,160,.7);
}
.counter-pill .cur{color:#fff;font-weight:700}
.counter-pill .sep{color:rgba(255,255,255,.25)}
.counter-pill .total{color:rgba(255,255,255,.45)}

/* PROGRESS */
.progress{
  position:relative;width:min(360px,70vw);height:3px;
  background:rgba(255,255,255,.08);border-radius:100px;
  margin:8px auto 0;overflow:hidden;
}
.progress-fill{
  position:absolute;inset:0;width:0;
  background:linear-gradient(90deg,#2dd4a0,#10b981,#5eead4);
  border-radius:100px;
  box-shadow:0 0 14px rgba(45,212,160,.8);
  transition:width .75s cubic-bezier(.25,.8,.25,1);
}

/* HINT */
.hint{
  text-align:center;color:rgba(255,255,255,.22);
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  padding:22px 0 36px;font-weight:600;
}

/* RESPONSIVE */
@media (max-width:640px){
  .hero{padding:32px 16px 8px}
  .hero-badge{font-size:10px;padding:6px 14px;letter-spacing:2px}
  .carousel-viewport{height:470px}
  .card-inner{padding:22px;gap:16px;border-radius:22px}
  .nav-btn{width:46px;height:46px;font-size:22px}
  .nav-btn.prev{left:8px}
  .nav-btn.next{right:8px}
  .counter-pill{font-size:11px;padding:8px 16px;gap:7px}
  .counter-pill .label{font-size:9px;letter-spacing:2px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="bn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4433"/>
      <stop offset="45%" stop-color="#0f6b4e"/>
      <stop offset="100%" stop-color="#073326"/>
    </linearGradient>
    <linearGradient id="bn-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4a0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4a0" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#2dd4a0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bn-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2dd4a0" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#2dd4a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bn-lines" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#2dd4a0" stroke-width=".4" opacity=".18"/>
    </pattern>
    <pattern id="bn-dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r=".8" fill="#2dd4a0" opacity=".18"/>
    </pattern>
  </defs>
</svg>

<div class="app">
  <header class="hero">
    <div class="hero-badge">Полная коллекция • 309 млн номеров</div>
    <h1>Все номера <span>России</span></h1>
    <p>Полный перебор государственных регистрационных знаков РФ: все буквы, все цифры, все регионы</p>
  </header>

  <div class="carousel" id="carousel">
    <button class="nav-btn prev" id="prevBtn" aria-label="Назад">‹</button>
    <div class="carousel-viewport" id="viewport">
      <div class="track" id="track"></div>
    </div>
    <button class="nav-btn next" id="nextBtn" aria-label="Вперёд">›</button>
  </div>

  <div class="counter">
    <div class="counter-pill">
      <span class="label">Номер</span>
      <span class="cur" id="counterCur">1</span>
      <span class="sep">из</span>
      <span class="total" id="counterTotal">—</span>
    </div>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="hint">← → / свайп / автопрокрутка</div>
</div>

<script>
(function(){
  'use strict';

  /* ============================================================
     ДАННЫЕ: буквы и регионы РФ
     ============================================================ */
  const LETTERS = ['А','В','Е','К','М','Н','О','Р','С','Т','У','Х']; // 12 разрешённых

  const REGIONS = (() => {
    const arr = [];
    for (let i = 1; i <= 99; i++) arr.push(String(i).padStart(2, '0'));
    [102, 103, 116, 121, 123].forEach(n => arr.push(String(n)));
    for (let i = 125; i <= 199; i++) arr.push(String(i));
    return arr;
  })();

  const L = LETTERS.length;                 // 12
  const D = 999;                            // 001..999
  const R = REGIONS.length;                 // 179
  const PER_REGION = L * D * L * L;         // 1 726 272
  const TOTAL = PER_REGION * R;             // ≈ 309 002 688

  /* ============================================================
     ПОЛУЧЕНИЕ НОМЕРА ПО ИНДЕКСУ
     ============================================================ */
  function plateAt(idx) {
    const regionIdx = Math.floor(idx / PER_REGION);
    let rem = idx % PER_REGION;
    const l1 = Math.floor(rem / (D * L * L));
    rem %= (D * L * L);
    const d  = Math.floor(rem / (L * L)) + 1;
    rem %= (L * L);
    const l2 = Math.floor(rem / L);
    const l3 = rem % L;
    return {
      l1: LETTERS[l1],
      d:  String(d).padStart(3, '0'),
      l2: LETTERS[l2],
      l3: LETTERS[l3],
      region: REGIONS[regionIdx]
    };
  }

  /* ============================================================
     ЦЕНА (детерминированная, 5 000 – 500 000 ₽)
     ============================================================ */
  function priceFor(p) {
    let price = 5000;
    const { d, l1, l2, l3, region } = p;

    // цифры
    if (d === '001' || d === '777' || d === '999')          price += 340000;
    else if (d === '111' || d === '222' || d === '333' ||
             d === '444' || d === '555' || d === '888')      price += 260000;
    else if (d === '666')                                    price += 150000;
    else if (d[0] === d[1] && d[1] === d[2])                 price += 240000;
    else if (d === '100' || d === '200' || d === '300' ||
             d === '400' || d === '500' || d === '600' ||
             d === '700' || d === '800' || d === '900')      price += 90000;
    else if (d[1] === d[2])                                  price += 22000;
    else if (d[0] === d[1])                                  price += 14000;

    // буквы
    if (l1 === l2 && l2 === l3)                              price += 80000;
    else if (l1 === l2 || l2 === l3 || l1 === l3)            price += 25000;

    // регион
    if (region === '77' || region === '99' || region === '97' ||
        region === '177' || region === '199' || region === '197')
      price += 40000;
    else if (region === '50' || region === '150' || region === '90' ||
             region === '190' || region === '750')
      price += 18000;
    else if (region === '98' || region === '178' || region === '198')
      price += 8000;

    if (price > 500000) price = 500000;
    return price;
  }

  /* ============================================================
     SVG: номерной знак
     ============================================================ */
  function plateSVG(p) {
    return `
      <svg viewBox="0 0 520 112" class="plate-svg" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="514" height="106" rx="14" fill="#f6f6f2" stroke="#0a0a0a" stroke-width="6"/>
        <rect x="7" y="7" width="506" height="98" rx="11" fill="none" stroke="#0a0a0a" stroke-width="1.5" opacity=".35"/>
        <line x1="396" y1="12" x2="396" y2="100" stroke="#0a0a0a" stroke-width="3"/>
        <text x="24" y="82" class="plate-char">${p.l1}</text>
        <text x="94" y="82" class="plate-char">${p.d[0]}</text>
        <text x="154" y="82" class="plate-char">${p.d[1]}</text>
        <text x="214" y="82" class="plate-char">${p.d[2]}</text>
        <text x="284" y="82" class="plate-char">${p.l2}</text>
        <text x="344" y="82" class="plate-char">${p.l3}</text>
        <text x="458" y="52" text-anchor="middle" class="plate-region">${p.region}</text>
        <g transform="translate(416,76)">
          <rect x="0" y="0" width="28" height="5" fill="#ffffff"/>
          <rect x="0" y="5" width="28" height="5" fill="#0039a6"/>
          <rect x="0" y="10" width="28" height="5" fill="#d52b1e"/>
          <rect x="0" y="0" width="28" height="15" fill="none" stroke="#0a0a0a" stroke-width=".9"/>
        </g>
        <text x="472" y="92" text-anchor="middle" class="plate-rus">RUS</text>
      </svg>`;
  }

  /* ============================================================
     SVG: купюра (статичная — рендерится один раз)
     ============================================================ */
  const BANKNOTE_HTML = `
    <svg viewBox="0 0 420 200" class="banknote-svg" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="420" height="200" rx="18" fill="url(#bn-grad)"/>
      <rect x="0" y="0" width="420" height="200" rx="18" fill="url(#bn-lines)"/>
      <rect x="0" y="0" width="420" height="200" rx="18" fill="url(#bn-dots)"/>
      <ellipse cx="210" cy="100" rx="210" ry="100" fill="url(#bn-glow)"/>
      <rect x="8" y="8" width="404" height="184" rx="12" fill="none" stroke="#2dd4a0" stroke-width="1.3" opacity=".45"/>
      <rect x="15" y="15" width="390" height="170" rx="8" fill="none" stroke="#2dd4a0" stroke-width=".6" opacity=".28"/>
      <circle cx="32" cy="32" r="5" fill="none" stroke="#2dd4a0" stroke-width=".9" opacity=".55"/>
      <circle cx="388" cy="32" r="5" fill="none" stroke="#2dd4a0" stroke-width=".9" opacity=".55"/>
      <circle cx="32" cy="168" r="5" fill="none" stroke="#2dd4a0" stroke-width=".9" opacity=".55"/>
      <circle cx="388" cy="168" r="5" fill="none" stroke="#2dd4a0" stroke-width=".9" opacity=".55"/>
      <text x="210" y="34" text-anchor="middle" class="bn-top">БИЛЕТ БАНКА РОССИИ</text>
      <text x="34" y="62" class="bn-denom">1000</text>
      <text x="386" y="62" text-anchor="end" class="bn-denom">1000</text>
      <circle cx="210" cy="100" r="78" fill="none" stroke="#2dd4a0" stroke-width=".5" opacity=".14"/>
      <circle cx="210" cy="100" r="62" fill="none" stroke="#2dd4a0" stroke-width=".5" opacity=".14"/>
      <circle cx="210" cy="100" r="46" fill="none" stroke="#2dd4a0" stroke-width=".5" opacity=".14"/>
      <rect x="140" y="98" width="140" height="1" fill="url(#bn-shine)" opacity=".7"/>
      <text x="34" y="186" class="bn-symbol">₽</text>
      <text x="210" y="186" text-anchor="middle" class="bn-rub">РУБЛЕЙ</text>
      <text x="386" y="186" text-anchor="end" class="bn-serial">АА 1234567</text>
    </svg>`;

  /* ============================================================
     DOM
     ============================================================ */
  const track       = document.getElementById('track');
  const viewport    = document.getElementById('viewport');
  const carousel    = document.getElementById('carousel');
  const prevBtn     = document.getElementById('prevBtn');
  const nextBtn     = document.getElementById('nextBtn');
  const counterCur  = document.getElementById('counterCur');
  const counterTot  = document.getElementById('counterTotal');
  const progressFill= document.getElementById('progressFill');

  const VISIBLE = 3;              // карточек слева и справа от активной
  const cardsByIndex = new Map(); // idx -> element
  let active = 0;
  let step = 400;                 // будет вычислено
  let autoplayTimer = null;

  counterTot.textContent = fmtNum(TOTAL);

  /* ============================================================
     УТИЛИТЫ
     ============================================================ */
  function fmtNum(n){
    return n.toLocaleString('ru-RU').replace(/\u00A0/g,'\u202F');
  }
  function fmtPrice(n){
    return n.toLocaleString('ru-RU').replace(/\u00A0/g,'\u2009');
  }
  function computeStep(){
    const cw = Math.min(400, window.innerWidth * 0.78);
    step = cw * 0.88;
  }

  /* ============================================================
     СОЗДАНИЕ КАРТОЧКИ
     ============================================================ */
  function createCardFor(idx){
    const p = plateAt(idx);
    const price = priceFor(p);

    const el = document.createElement('div');
    el.className = 'card card-enter';
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="card-inner">
        <div class="plate-wrap">${plateSVG(p)}</div>
        <div class="banknote">
          ${BANKNOTE_HTML}
          <div class="price-overlay">
            <div class="price-label">Цена</div>
            <div class="price-value">
              <span class="num">${fmtPrice(price)}</span>
              <span class="cur">₽</span>
            </div>
          </div>
          <div class="shimmer"></div>
        </div>
      </div>`;

    // снимаем класс "вход" на следующем кадре для плавного появления
    requestAnimationFrame(() => {
      requestAnimationFrame(() => el.classList.remove('card-enter'));
    });
    return el;
  }

  /* ============================================================
     РЕНДЕР
     ============================================================ */
  function render(){
    const minI = Math.max(0, active - VISIBLE);
    const maxI = Math.min(TOTAL - 1, active + VISIBLE);

    // удаляем карточки вне диапазона
    for (const [i, card] of cardsByIndex) {
      if (i < minI || i > maxI) {
        card.remove();
        cardsByIndex.delete(i);
      }
    }

    // создаём недостающие
    for (let i = minI; i <= maxI; i++) {
      if (!cardsByIndex.has(i)) {
        const c = createCardFor(i);
        cardsByIndex.set(i, c);
        track.appendChild(c);
      }
    }

    // обновляем позиции
    for (const [i, card] of cardsByIndex) {
      const off = i - active;
      const abs = Math.abs(off);
      const x = off * step;
      const scale = Math.max(0.62, 1 - abs * 0.14);
      const opacity = abs > 3 ? 0 : Math.max(0.15, 1 - abs * 0.32);
      const blur = Math.min(abs * 1.4, 4.5);

      card.style.setProperty('--x', x + 'px');
      card.style.setProperty('--scale', scale);
      card.style.setProperty('--opacity', opacity);
      card.style.setProperty('--blur', blur + 'px');
      card.style.setProperty('--z', 100 - abs);
      card.classList.toggle('is-active', i === active);
    }

    // counter + progress
    counterCur.textContent = fmtNum(active + 1);
    progressFill.style.width = ((active + 1) / TOTAL * 100) + '%';

    prevBtn.disabled = (active === 0);
    nextBtn.disabled = (active === TOTAL - 1);
  }

  /* ============================================================
     НАВИГАЦИЯ
     ============================================================ */
  function jumpTo(newActive){
    newActive = Math.max(0, Math.min(TOTAL - 1, newActive));
    // если скачок слишком большой — полностью пересобираем сцену
    if (Math.abs(newActive - active) > VISIBLE) {
      for (const [, card] of cardsByIndex) card.remove();
      cardsByIndex.clear();
    }
    active = newActive;
    render();
  }
  function next(){ jumpTo(active + 1); }
  function prev(){ jumpTo(active - 1); }

  /* ============================================================
     АВТОПРОКРУТКА
     ============================================================ */
  function startAutoplay(){
    stopAutoplay();
    autoplayTimer = setInterval(() => {
      if (active >= TOTAL - 1) jumpTo(0);
      else next();
    }, 3400);
  }
  function stopAutoplay(){
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  carousel.addEventListener('mouseenter', stopAutoplay);
  carousel.addEventListener('mouseleave', startAutoplay);

  /* ============================================================
     КНОПКИ + КЛАВИАТУРА
     ============================================================ */
  nextBtn.addEventListener('click', () => { next(); });
  prevBtn.addEventListener('click', () => { prev(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft')  { prev(); stopAutoplay(); startAutoplay(); }
    if (e.key === 'ArrowRight') { next(); stopAutoplay(); startAutoplay(); }
  });

  /* ============================================================
     СВАЙП
     ============================================================ */
  let tx = 0, ty = 0, swiping = false;
  viewport.addEventListener('touchstart', (e) => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    swiping = true;
    stopAutoplay();
  }, { passive: true });
  viewport.addEventListener('touchmove', (e) => {
    if (!swiping) return;
    const dx = Math.abs(e.touches[0].clientX - tx);
    const dy = Math.abs(e.touches[0].clientY - ty);
    if (dx > dy) e.preventDefault();
  }, { passive: false });
  viewport.addEventListener('touchend', (e) => {
    if (!swiping) return;
    swiping = false;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 45) { dx > 0 ? prev() : next(); }
    startAutoplay();
  });

  /* ============================================================
     RESIZE
     ============================================================ */
  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { computeStep(); render(); }, 100);
  });

  /* ============================================================
     ИНИЦИАЛИЗАЦИЯ
     ============================================================ */
  computeStep();
  render();
  startAutoplay();
})();
</script>
</body>
</html>
