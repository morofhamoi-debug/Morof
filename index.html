<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Тёмный Дом</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family: 'Courier New', monospace; }
  canvas { display:block; }

  #overlay {
    position:fixed; inset:0; z-index:10; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, rgba(25,14,8,0.92), rgba(0,0,0,0.99));
    color:#c9b48a; text-align:center; padding:20px;
    transition: opacity .3s;
    touch-action: none;
  }
  #overlay h1 {
    font-size: clamp(28px, 6vw, 54px);
    letter-spacing: 8px; margin-bottom: 18px;
    text-shadow: 0 0 24px rgba(255,80,20,0.5), 0 0 4px #000;
    color:#e0c48a;
  }
  #overlay p { font-size: 15px; line-height: 2.0; opacity: 0.85; }
  #overlay .key { color:#ffb347; font-weight:bold; }
  #overlay .hint {
    margin-top: 30px; font-size: 13px; opacity: 0.55;
    animation: pulse 1.8s infinite; letter-spacing: 2px;
  }
  @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.9} }

  #hud {
    position:fixed; bottom:14px; left:16px; z-index:5; pointer-events:none;
    color:#8a7a5a; font-size:12px; letter-spacing:1px;
    text-shadow:0 0 8px #000;
  }
  body.mobile #hud {
    top: calc(14px + env(safe-area-inset-top, 0px));
    bottom: auto; font-size: 11px; left: 16px;
  }
  #crosshair {
    position:fixed; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    background:rgba(255,255,255,0.30); border-radius:50%; z-index:5; pointer-events:none;
    box-shadow: 0 0 6px rgba(0,0,0,0.8);
  }
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:4;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 25%, rgba(0,0,0,0.92) 100%);
  }
  #damage {
    position:fixed; inset:0; pointer-events:none; z-index:3;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(30,0,0,0.35) 100%);
    mix-blend-mode: multiply;
  }
  #grain {
    position:fixed; inset:0; pointer-events:none; z-index:2;
    opacity:0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
  }

  #mobile-controls { position: fixed; inset: 0; z-index: 8; pointer-events: none; display: none; }
  #mobile-controls.active { display: block; }
  #move-zone { position: absolute; left: 0; top: 0; width: 45%; height: 100%; pointer-events: auto; touch-action: none; }
  #look-zone { position: absolute; right: 0; top: 0; width: 55%; height: 100%; pointer-events: auto; touch-action: none; }
  #joystick {
    position: fixed; width: 130px; height: 130px;
    margin-left: -65px; margin-top: -65px; border-radius: 50%;
    border: 2px solid rgba(200, 180, 140, 0.35);
    background: radial-gradient(circle, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.4) 100%);
    display: none; z-index: 9; pointer-events: none;
    box-shadow: 0 0 24px rgba(0,0,0,0.55) inset;
  }
  #joystick-stick {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px; margin-left: -28px; margin-top: -28px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(240, 220, 180, 0.6), rgba(160, 130, 90, 0.35));
    border: 2px solid rgba(220, 200, 160, 0.7);
    box-shadow: 0 0 14px rgba(255, 200, 120, 0.25);
    pointer-events: none;
  }
  #flashlight-btn {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px));
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(18, 14, 10, 0.6);
    border: 2px solid rgba(120, 100, 70, 0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 12; pointer-events: auto; touch-action: none;
    color: #6a5a3a; box-shadow: 0 0 16px rgba(0,0,0,0.6);
    transition: background 0.15s, box-shadow 0.15s, color 0.15s, border-color 0.15s, transform 0.08s;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #flashlight-btn.active { display: flex; }
  #flashlight-btn svg { width: 34px; height: 34px; display: block; }
  #flashlight-btn.on {
    color: #ffd27a; background: rgba(50, 35, 15, 0.78);
    border-color: rgba(255, 200, 120, 0.7);
    box-shadow: 0 0 22px rgba(255, 180, 80, 0.55), 0 0 8px rgba(255, 200, 120, 0.4) inset;
  }
  #flashlight-btn:active { transform: scale(0.93); }
</style>
</head>
<body>

<div id="overlay">
  <h1>ТЁМНЫЙ ДОМ</h1>
  <p id="overlay-help">
    <span class="key">W A S D</span> — движение<br>
    <span class="key">МЫШЬ</span> — осмотреться<br>
    <span class="key">SHIFT</span> — бежать<br>
    <span class="key">F</span> — фонарик вкл / выкл<br>
    <span class="key">ESC</span> — пауза
  </p>
  <p class="hint" id="overlay-hint">НАЖМИТЕ, ЧТОБЫ ВОЙТИ В ДОМ</p>
</div>

<div id="vignette"></div>
<div id="damage"></div>
<div id="grain"></div>
<div id="crosshair"></div>
<div id="hud">ФОНАРИК: ВКЛ &nbsp;|&nbsp; ЭТАЖ: 1</div>

<div id="mobile-controls">
  <div id="move-zone"></div>
  <div id="look-zone"></div>
</div>
<div id="joystick"><div id="joystick-stick"></div></div>

<div id="flashlight-btn" aria-label="Фонарик">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 5 L17 5 L15 9 L15 20 L9 20 L9 9 Z"/>
    <line x1="9" y1="12.5" x2="15" y2="12.5"/>
    <line x1="9" y1="16.5" x2="15" y2="16.5"/>
    <line x1="8" y1="3" x2="6.5" y2="1.5"/>
    <line x1="12" y1="3" x2="12" y2="1"/>
    <line x1="16" y1="3" x2="17.5" y2="1.5"/>
  </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ТЁМНЫЙ ДОМ — реалистичная мебель, все предметы
   ============================================================ */

const isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform));
if (isMobile) document.body.classList.add('mobile');

// ---------- ОСНОВНЫЕ КОНСТАНТЫ ----------
const T        = 0.30;
const F1       = 3.20;
const SLAB_B   = 2.90;
const F2       = 6.40;
const STAIR    = { x1: 5.20, x2: 7.80, z1: 1.0, z2: 7.0, h: F1 };

// ---------- СЦЕНА ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020304);
scene.fog = new THREE.FogExp2(0x020304, 0.062);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 200);
camera.rotation.order = 'YXZ';
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

/* ============================================================
   ТЕКСТУРЫ
   ============================================================ */
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function makeTex(w, h, drawFn, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  drawFn(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = maxAniso;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function addNoise(ctx, w, h, amount) {
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * amount;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);
}

function drawWallpaper(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#463125'); g.addColorStop(0.45, '#39271c'); g.addColorStop(1, '#2b1d14');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 32) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(x, 0, 2, h);
    ctx.fillStyle = 'rgba(120,80,50,0.05)'; ctx.fillRect(x + 2, 0, 1, h);
  }
  const cell = 64;
  for (let y = 0; y < h; y += cell) for (let x = 0; x < w; x += cell) {
    const off = ((y / cell) % 2) * (cell / 2);
    ctx.save(); ctx.translate(x + off, y);
    ctx.strokeStyle = 'rgba(110,70,45,0.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cell/2,8); ctx.lineTo(cell-8,cell/2); ctx.lineTo(cell/2,cell-8); ctx.lineTo(8,cell/2); ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = 'rgba(140,95,60,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cell/2,18); ctx.lineTo(cell-18,cell/2); ctx.lineTo(cell/2,cell-18); ctx.lineTo(18,cell/2); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(160,110,65,0.4)'; ctx.beginPath(); ctx.arc(cell/2,cell/2,3.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  for (let i = 0; i < 40; i++) {
    const x = Math.random()*w, y = Math.random()*h, r = 15 + Math.random()*70;
    const rad = ctx.createRadialGradient(x,y,0,x,y,r);
    rad.addColorStop(0, Math.random()>0.5?`rgba(15,10,8,${0.15+Math.random()*0.25})`:`rgba(90,60,35,${0.08+Math.random()*0.12})`);
    rad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rad; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  addNoise(ctx, w, h, 22);
}

function drawConcrete(ctx, w, h) {
  ctx.fillStyle = '#332f2a'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 80; i++) {
    const x = Math.random()*w, y = Math.random()*h, r = 20 + Math.random()*100;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, Math.random()>0.5?`rgba(10,10,10,${0.2+Math.random()*0.3})`:`rgba(70,65,55,${0.1+Math.random()*0.2})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  addNoise(ctx, w, h, 45);
}

function drawWoodFloor(ctx, w, h) {
  ctx.fillStyle = '#1e140d'; ctx.fillRect(0, 0, w, h);
  const plankH = 48;
  for (let y = 0; y < h; y += plankH) {
    const shade = 25 + Math.random() * 25;
    ctx.fillStyle = `rgb(${shade+15}, ${shade+2}, ${shade-6})`;
    ctx.fillRect(0, y, w, plankH - 2);
    for (let i = 0; i < 30; i++) {
      ctx.strokeStyle = `rgba(0,0,0,${0.04+Math.random()*0.16})`;
      ctx.lineWidth = 0.4 + Math.random()*1.0;
      ctx.beginPath(); const gy = y + Math.random()*plankH; ctx.moveTo(0, gy);
      for (let x = 0; x < w; x += 16) ctx.lineTo(x, gy + Math.sin(x*0.06 + y*0.1)*2 + (Math.random()-0.5)*2);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, y + plankH - 2, w, 2);
  }
  addNoise(ctx, w, h, 18);
}

function drawCeiling(ctx, w, h) {
  ctx.fillStyle = '#2a2620'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    const x = Math.random()*w, y = Math.random()*h, r = 15 + Math.random()*90;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, Math.random()>0.45?`rgba(8,6,4,${0.2+Math.random()*0.35})`:`rgba(80,65,45,${0.08+Math.random()*0.15})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  addNoise(ctx, w, h, 28);
}

function drawFurnitureWood(ctx, w, h) {
  ctx.fillStyle = '#2a1a10'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) {
    ctx.strokeStyle = `rgba(0,0,0,${0.05+Math.random()*0.2})`;
    ctx.lineWidth = 0.5 + Math.random()*1.5;
    ctx.beginPath(); const y = Math.random()*h; ctx.moveTo(0, y);
    for (let x = 0; x < w; x += 12) ctx.lineTo(x, y + Math.sin(x*0.1 + i)*2 + (Math.random()-0.5)*1.5);
    ctx.stroke();
  }
  addNoise(ctx, w, h, 16);
}

function drawMetal(ctx, w, h) {
  ctx.fillStyle = '#3a3a40'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 120; i++) {
    const x = Math.random()*w, y = Math.random()*h, r = 5 + Math.random()*40;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, Math.random()>0.5?'rgba(0,0,0,0.35)':'rgba(120,110,100,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  addNoise(ctx, w, h, 25);
}

function drawTile(ctx, w, h) {
  ctx.fillStyle = '#1a1a18'; ctx.fillRect(0, 0, w, h);
  const s = 64;
  for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) {
    const shade = 45 + Math.random()*25;
    ctx.fillStyle = `rgb(${shade}, ${shade-3}, ${shade-8})`;
    ctx.fillRect(x+2, y+2, s-4, s-4);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x, y, s, 2); ctx.fillRect(x, y, 2, s);
  }
  addNoise(ctx, w, h, 20);
}

// Тканевая текстура (для мягкой мебели)
function drawFabric(ctx, w, h) {
  ctx.fillStyle = '#3a2a32'; ctx.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) {
    const n = Math.random() * 40;
    ctx.fillStyle = `rgba(${60+n}, ${45+n}, ${55+n}, 0.5)`;
    ctx.fillRect(x, y, 2, 2);
  }
  addNoise(ctx, w, h, 25);
}

// Кожа
function drawLeather(ctx, w, h) {
  ctx.fillStyle = '#2a1a1a'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 200; i++) {
    const x = Math.random()*w, y = Math.random()*h, r = 3 + Math.random()*10;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, `rgba(${50+Math.random()*30}, ${30+Math.random()*20}, ${25+Math.random()*20}, 0.3)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  addNoise(ctx, w, h, 12);
}

// Мрамор / гранит для столешниц
function drawMarble(ctx, w, h) {
  ctx.fillStyle = '#1c1c1e'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 12; i++) {
    ctx.strokeStyle = `rgba(${90+Math.random()*40}, ${85+Math.random()*35}, ${80+Math.random()*30}, 0.35)`;
    ctx.lineWidth = 0.5 + Math.random()*1.5;
    ctx.beginPath(); let x = Math.random()*w, y = Math.random()*h; ctx.moveTo(x,y);
    for (let s = 0; s < 20; s++) { x += (Math.random()-0.5)*40; y += (Math.random()-0.5)*40; ctx.lineTo(x,y); }
    ctx.stroke();
  }
  addNoise(ctx, w, h, 15);
}

const texWallpaper = makeTex(512, 512, drawWallpaper, 2, 1);
const texConcrete  = makeTex(512, 512, drawConcrete,  3, 2);
const texFloor     = makeTex(512, 512, drawWoodFloor, 6, 5);
const texCeiling   = makeTex(512, 512, drawCeiling,   3, 3);
const texWood      = makeTex(256, 256, drawFurnitureWood, 1, 1);
const texMetal     = makeTex(256, 256, drawMetal, 1, 1);
const texTile      = makeTex(256, 256, drawTile, 1, 1);
const texFabric    = makeTex(128, 128, drawFabric, 3, 3);
const texLeather   = makeTex(128, 128, drawLeather, 3, 3);
const texMarble    = makeTex(256, 256, drawMarble, 1, 1);

/* ============================================================
   МАТЕРИАЛЫ
   ============================================================ */
const matWallOuter = new THREE.MeshStandardMaterial({ map: texConcrete, bumpMap: texConcrete, bumpScale: 0.04, color: 0x9a9088, roughness: 1.0 });
const matWall      = new THREE.MeshStandardMaterial({ map: texWallpaper, bumpMap: texWallpaper, bumpScale: 0.025, color: 0xb8a890, roughness: 0.97 });
const matSlab      = new THREE.MeshStandardMaterial({ map: texCeiling, bumpMap: texCeiling, bumpScale: 0.03, color: 0x9a8f80, roughness: 0.98 });
const matWood      = new THREE.MeshStandardMaterial({ map: texWood, bumpMap: texWood, bumpScale: 0.02, color: 0xb0a090, roughness: 0.75 });
const matWoodDark  = new THREE.MeshStandardMaterial({ map: texFloor, bumpMap: texFloor, bumpScale: 0.025, color: 0x7a6a5a, roughness: 0.85 });
const matWoodDeep  = new THREE.MeshStandardMaterial({ map: texWood, bumpMap: texWood, bumpScale: 0.02, color: 0x5a3a20, roughness: 0.6 });
const matWoodOak   = new THREE.MeshStandardMaterial({ map: texWood, bumpMap: texWood, bumpScale: 0.02, color: 0x8a6a3a, roughness: 0.65 });
const matDark      = new THREE.MeshStandardMaterial({ map: texWood, bumpMap: texWood, bumpScale: 0.02, color: 0x3a3030, roughness: 0.9 });
const matMetal     = new THREE.MeshStandardMaterial({ map: texMetal, bumpMap: texMetal, bumpScale: 0.01, color: 0x8a8a92, roughness: 0.5, metalness: 0.65 });
const matChrome    = new THREE.MeshStandardMaterial({ color: 0xccd0d8, roughness: 0.15, metalness: 0.95 });
const matHandle    = new THREE.MeshStandardMaterial({ color: 0xb0b4bc, roughness: 0.3, metalness: 0.85 });
const matWhite     = new THREE.MeshStandardMaterial({ map: texTile, bumpMap: texTile, bumpScale: 0.015, color: 0xc0bdb0, roughness: 0.65 });
const matPorcelain = new THREE.MeshStandardMaterial({ color: 0xe8e6e0, roughness: 0.15, metalness: 0.05 });
const matStone     = new THREE.MeshStandardMaterial({ map: texTile, bumpMap: texTile, bumpScale: 0.02, color: 0x807870, roughness: 0.95 });
const matCountertop= new THREE.MeshStandardMaterial({ map: texMarble, bumpMap: texMarble, bumpScale: 0.005, color: 0x9a9a9e, roughness: 0.25, metalness: 0.15 });
const matGlass     = new THREE.MeshStandardMaterial({ color: 0x0a0e14, roughness: 0.05, metalness: 0.5 });
const matTVScreen  = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.03, metalness: 0.3, emissive: 0x050510 });
const matFridge    = new THREE.MeshStandardMaterial({ color: 0xc8c8cc, roughness: 0.35, metalness: 0.4 });
const matStove     = new THREE.MeshStandardMaterial({ color: 0x303034, roughness: 0.4, metalness: 0.5 });
const matFabric    = new THREE.MeshStandardMaterial({ map: texFabric, bumpMap: texFabric, bumpScale: 0.005, color: 0x4a3a48, roughness: 1.0 });
const matFabric2   = new THREE.MeshStandardMaterial({ map: texFabric, bumpMap: texFabric, bumpScale: 0.005, color: 0x3a4a5a, roughness: 1.0 });
const matFabric3   = new THREE.MeshStandardMaterial({ map: texFabric, bumpMap: texFabric, bumpScale: 0.005, color: 0x5a4a2a, roughness: 1.0 });
const matLeather   = new THREE.MeshStandardMaterial({ map: texLeather, bumpMap: texLeather, bumpScale: 0.003, color: 0x4a2a20, roughness: 0.55 });
const matPillow    = new THREE.MeshStandardMaterial({ map: texFabric, color: 0x8a7a5a, roughness: 0.95 });
const matBlanket   = new THREE.MeshStandardMaterial({ map: texFabric, color: 0x4a2a3a, roughness: 0.95 });
const matSheet     = new THREE.MeshStandardMaterial({ color: 0xc8c0b0, roughness: 0.9 });
const matMattress  = new THREE.MeshStandardMaterial({ color: 0xd8d0c0, roughness: 0.9 });
const matRug       = new THREE.MeshStandardMaterial({ map: texFabric, color: 0x401818, roughness: 1.0 });
const matRug2      = new THREE.MeshStandardMaterial({ map: texFabric, color: 0x1a2030, roughness: 1.0 });
const matLampShade = new THREE.MeshStandardMaterial({ color: 0xd8b888, roughness: 0.85, side: THREE.DoubleSide, emissive: 0x3a2010, emissiveIntensity: 0.5 });

const colliders = [];

function addCollider(minX, maxX, minZ, maxZ, minY, maxY) {
  colliders.push({ minX, maxX, minZ, maxZ, minY, maxY });
}

function box(w, h, d, mat, x, y, z, collide = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  if (collide) addCollider(x - w/2, x + w/2, z - d/2, z + d/2, y, y + h);
  return m;
}

function cyl(rt, rb, h, mat, x, y, z, seg = 12) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y + h/2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

function wallX(x1, x2, z, y0, y1, mat = matWall, collide = true) {
  if (x2 - x1 <= 0 || y1 - y0 <= 0) return;
  box(x2 - x1, y1 - y0, T, mat, (x1 + x2) / 2, y0, z, collide);
}
function wallZ(z1, z2, x, y0, y1, mat = matWall, collide = true) {
  if (z2 - z1 <= 0 || y1 - y0 <= 0) return;
  box(T, y1 - y0, z2 - z1, mat, x, y0, (z1 + z2) / 2, collide);
}

// ============ ДИВАН ============
function buildSofa(x, z, w, d, fabricMat, seatMat) {
  const legH = 0.12;
  const seatY = legH + 0.18;
  const armW = 0.22;
  const armH = 0.55;
  const backH = 0.65;
  const backT = 0.22;
  const innerW = w - armW * 2;

  // Ножки (4 угла)
  const legR = 0.04;
  for (const [lx, lz] of [[-w/2 + 0.10, -d/2 + 0.10], [w/2 - 0.10, -d/2 + 0.10],
                          [-w/2 + 0.10,  d/2 - 0.10], [w/2 - 0.10,  d/2 - 0.10]]) {
    cyl(legR, legR * 1.1, legH, matWoodDeep, x + lx, 0, z + lz, 8);
  }
  // Основание (каркас)
  box(w, 0.22, d, fabricMat, x, legH, z, false);
  // Сиденье (подушки)
  const seatDepth = d - backT - 0.05;
  const nSeats = Math.max(2, Math.round(innerW / 0.8));
  const seatW = innerW / nSeats;
  for (let i = 0; i < nSeats; i++) {
    const sx = x - innerW/2 + seatW * (i + 0.5);
    box(seatW - 0.03, 0.14, seatDepth - 0.03, seatMat, sx, seatY, z + backT/2 + 0.02, false);
    // Мягкая кромка спереди
    box(seatW - 0.03, 0.06, 0.03, seatMat, sx, seatY + 0.10, z + backT/2 + seatDepth - 0.04, false);
  }
  // Подлокотники (левая и правая)
  for (const side of [-1, 1]) {
    const ax = x + side * (w/2 - armW/2);
    box(armW, armH - legH, d, fabricMat, ax, legH, z, false);
    // Верхняя скруглённая часть подлокотника
    box(armW - 0.02, 0.06, d - 0.02, fabricMat, ax, legH + armH - legH, z, false);
  }
  // Спинка
  box(w, backH, backT, fabricMat, x, legH + 0.22, z - d/2 + backT/2, false);
  // Верх спинки — скругление
  box(w - 0.02, 0.06, backT - 0.02, fabricMat, x, legH + 0.22 + backH, z - d/2 + backT/2, false);
  // Подушки спинки
  for (let i = 0; i < nSeats; i++) {
    const sx = x - innerW/2 + seatW * (i + 0.5);
    box(seatW - 0.08, 0.42, 0.14, seatMat, sx, seatY + 0.20, z - d/2 + backT + 0.08, false);
  }
  // Декоративные подушки
  box(0.4, 0.36, 0.14, matPillow, x - innerW/2 + 0.25, seatY + 0.20, z - d/2 + backT + 0.08, false);
  box(0.4, 0.36, 0.14, matPillow, x + innerW/2 - 0.25, seatY + 0.20, z - d/2 + backT + 0.08, false);

  addCollider(x - w/2, x + w/2, z - d/2, z + d/2, 0, armH + legH + 0.05);
}

  const w = 0.9, d = 0.9;

}

// ============ ТУМБА / КОМОД ============
function buildDresser(x, z, w, h, d, drawers, mat = matWood) {
  const legH = 0.10;
  // Ножки
  for (const [lx, lz] of [[-w/2 + 0.06, -d/2 + 0.06], [w/2 - 0.06, -d/2 + 0.06],
                          [-w/2 + 0.06,  d/2 - 0.06], [w/2 - 0.06,  d/2 - 0.06]]) {
    cyl(0.025, 0.03, legH, matWoodDeep, x + lx, 0, z + lz, 6);
  }
  // Корпус
  box(w, h - legH, d, mat, x, legH, z, false);
  // Верхняя крышка (немного шире)
  box(w + 0.04, 0.03, d + 0.04, matWoodOak, x, h, z, false);
  // Ящики или дверцы
  const innerH = h - legH - 0.06;
  const drawerH = innerH / drawers;
  for (let i = 0; i < drawers; i++) {
    const dy = legH + 0.03 + i * drawerH;
    // Фасад ящика
    box(w - 0.10, drawerH - 0.03, 0.02, matWoodOak, x, dy + 0.015, z + d/2 + 0.005, false);
    // Ручка
    box(0.14, 0.018, 0.02, matHandle, x, dy + drawerH/2, z + d/2 + 0.03, false);
  }
  addCollider(x - w/2, x + w/2, z - d/2, z + d/2, 0, h);
}

function buildBookshelf(x, y0, z, w, h, d, facing) {
  // facing: 'z+' (передняя стенка +Z), 'z-' (перед -Z), 'x+' , 'x-'
  const shelfT = 0.03;
  const sideT = 0.05;
  const dir = facing === 'z+' ? 1 : facing === 'z-' ? -1 : 0;
  const dirX = facing === 'x+' ? 1 : facing === 'x-' ? -1 : 0;
  // Боковые панели
  if (dir !== 0) {
    box(sideT, h, d, matWood, x - w/2 + sideT/2, y0, z, false);
    box(sideT, h, d, matWood, x + w/2 - sideT/2, y0, z, false);
    // Задняя панель
    box(w, h, 0.02, matWoodDeep, x, y0, z - dir * (d/2 - 0.01), false);
    // Верх и низ
    box(w, 0.04, d, matWoodOak, x, y0, z, false);
    box(w, 0.04, d, matWoodOak, x, y0 + h - 0.04, z, false);
    // Полки
    const shelfCount = Math.max(2, Math.floor(h / 0.42));
    const shelfStep = (h - 0.08) / shelfCount;
    for (let s = 1; s < shelfCount; s++) {
      box(w - 0.10, shelfT, d - 0.05, matWoodOak, x, y0 + s * shelfStep, z, false);
    }
    // Книги на полках
    for (let s = 0; s < shelfCount; s++) {
      const sy = y0 + 0.04 + s * shelfStep + shelfT;
      const books = 4 + Math.floor(Math.random() * 5);
      let bx = x - (w - 0.20) / 2;
      for (let b = 0; b < books; b++) {
        const bw = 0.03 + Math.random() * 0.03;
        const bh = 0.20 + Math.random() * 0.16;
        const bmat = matBookMats[Math.floor(Math.random() * matBookMats.length)];
        box(bw, bh, d - 0.12, bmat, bx + bw/2, sy, z, false);
        bx += bw + 0.005;
        if (bx > x + (w - 0.20) / 2 - 0.05) break;
      }
    }
  } else if (dirX !== 0) {
    box(w, h, sideT, matWood, x, y0, z - d/2 + sideT/2, false);
    box(w, h, sideT, matWood, x, y0, z + d/2 - sideT/2, false);
    box(w, h, 0.02, matWoodDeep, x - dirX * (w/2 - 0.01), y0, z, false);
    box(w, 0.04, d, matWoodOak, x, y0, z, false);
    box(w, 0.04, d, matWoodOak, x, y0 + h - 0.04, z, false);
    const shelfCount = Math.max(2, Math.floor(h / 0.42));
    const shelfStep = (h - 0.08) / shelfCount;
    for (let s = 1; s < shelfCount; s++) {
      box(w - 0.05, shelfT, d - 0.10, matWoodOak, x, y0 + s * shelfStep, z, false);
    }
    for (let s = 0; s < shelfCount; s++) {
      const sy = y0 + 0.04 + s * shelfStep + shelfT;
      const books = 4 + Math.floor(Math.random() * 5);
      let bz = z - (d - 0.20) / 2;
      for (let b = 0; b < books; b++) {
        const bw = 0.03 + Math.random() * 0.03;
        const bh = 0.20 + Math.random() * 0.16;
        const bmat = matBookMats[Math.floor(Math.random() * matBookMats.length)];
        box(w - 0.12, bh, bw, bmat, x, sy, bz + bw/2, false);
        bz += bw + 0.005;
        if (bz > z + (d - 0.20) / 2 - 0.05) break;
      }
    }
  }
  addCollider(x - w/2, x + w/2, z - d/2, z + d/2, y0, y0 + h);
}

// ============ ТЕЛЕВИЗОР ============
function buildTV(x, y, z, w, h, facing) {
  // facing: 'z-' — экран смотрит в -Z (на юг)
  const bezelT = 0.02;
  const screenDepth = 0.05;
  const dir = facing === 'z-' ? -1 : facing === 'z+' ? 1 : 0;
  // Корпус / рамка
  box(w, h, screenDepth, matDark, x, y, z, false);
  // Экран
  const screenZ = z + dir * (screenDepth/2 + 0.001);
  box(w - bezelT*2, h - bezelT*2, 0.005, matTVScreen, x, y + bezelT, screenZ, false);
  // Подставка (если на тумбе)
  // Ножка
  box(0.08, 0.06, 0.08, matDark, x, y - 0.06, z, false);
  box(0.5, 0.03, 0.20, matDark, x, y - 0.09, z, false);
}

// ============ ТВ-ТУМБА ============
function buildTVStand(x, z, w, h, d) {
  const legH = 0.10;
  for (const [lx, lz] of [[-w/2 + 0.08, -d/2 + 0.06], [w/2 - 0.08, -d/2 + 0.06],
                          [-w/2 + 0.08,  d/2 - 0.06], [w/2 - 0.08,  d/2 - 0.06]]) {
    cyl(0.025, 0.03, legH, matWoodDeep, x + lx, 0, z + lz, 6);
  }
  box(w, h - legH, d, matWood, x, legH, z, false);
  box(w + 0.03, 0.03, d + 0.03, matWoodOak, x, h, z, false);
  // Две дверцы
  const doorW = (w - 0.08) / 2;
  box(doorW, h - legH - 0.06, 0.02, matWoodOak, x - doorW/2 - 0.01, legH + 0.03, z + d/2 + 0.005, false);
  box(doorW, h - legH - 0.06, 0.02, matWoodOak, x + doorW/2 + 0.01, legH + 0.03, z + d/2 + 0.005, false);
  box(0.02, 0.12, 0.02, matHandle, x - 0.03, h/2, z + d/2 + 0.03, false);
  box(0.02, 0.12, 0.02, matHandle, x + 0.03, h/2, z + d/2 + 0.03, false);
  addCollider(x - w/2, x + w/2, z - d/2, z + d/2, 0, h);
}

// ============ КУХОННАЯ ТУМБА (нижняя секция) ============
function buildBaseCabinet(x, z, w, h, d, sections, facing) {
  const legH = 0.10;
  const dir = facing === 'z+' ? 1 : facing === 'z-' ? -1 : facing === 'x+' ? 1 : -1;
  // Цоколь
  box(w - 0.04, legH, d - 0.04, matWoodDeep, x, 0, z, false);
  // Корпус
  box(w, h - legH, d, matWood, x, legH, z, false);
  // Столешница
  box(w + 0.04, 0.05, d + 0.04, matCountertop, x, h, z, false);

  // Фасады (дверцы/ящики)
  const secW = w / sections;
  for (let i = 0; i < sections; i++) {
    const sx = x - w/2 + secW * (i + 0.5);
    const isDrawer = (i === 0);
    if (isDrawer) {
      // 2 ящика
      box(secW - 0.04, (h - legH - 0.10) / 2 - 0.03, 0.02, matWoodOak, sx, legH + 0.03, z + dir * (d/2 + 0.005), false);
      box(secW - 0.04, (h - legH - 0.10) / 2 - 0.03, 0.02, matWoodOak, sx, legH + (h - legH - 0.10)/2 + 0.06, z + dir * (d/2 + 0.005), false);
      box(0.14, 0.018, 0.02, matHandle, sx, legH + 0.10, z + dir * (d/2 + 0.03), false);
      box(0.14, 0.018, 0.02, matHandle, sx, h - 0.10, z + dir * (d/2 + 0.03), false);
    } else {
      // Дверца
      box(secW - 0.04, h - legH - 0.06, 0.02, matWoodOak, sx, legH + 0.03, z + dir * (d/2 + 0.005), false);
      box(0.02, 0.10, 0.02, matHandle, sx - dir * 0.01, legH + 0.30, z + dir * (d/2 + 0.03), false);
    }
  }
  addCollider(x - w/2, x + w/2, z - d/2, z + d/2, 0, h + 0.05);
}

// ============ ВЕРХНИЙ ШКАФ ============
function buildUpperCabinet(x, y, z, w, h, d, facing) {
  const dir = facing === 'z+' ? 1 : facing === 'z-' ? -1 : facing === 'x+' ? 1 : -1;
  box(w, h, d, matWood, x, y, z, false);
  // Двери
  const doorW = (w - 0.06) / 2;
  box(doorW, h - 0.08, 0.02, matWoodOak, x - doorW/2 - 0.01, y + 0.04, z + dir * (d/2 + 0.005), false);
  box(doorW, h - 0.08, 0.02, matWoodOak, x + doorW/2 + 0.01, y + 0.04, z + dir * (d/2 + 0.005), false);
  box(0.02, 0.10, 0.02, matHandle, x - 0.03, y + h/2 - 0.05, z + dir * (d/2 + 0.03), false);
  box(0.02, 0.10, 0.02, matHandle, x + 0.03, y + h/2 - 0.05, z + dir * (d/2 + 0.03), false);
  addCollider(x - w/2, x + w/2, z - d/2, z + d/2, y, y + h);
}

// ============ ХОЛОДИЛЬНИК ============
function buildFridge(x, z, facing) {
  const w = 0.72, h = 1.85, d = 0.72;
  const dir = facing === 'z+' ? 1 : facing === 'z-' ? -1 : facing === 'x+' ? 1 : -1;
  // Корпус
  box(w, h, d, matFridge, x, 0, z, false);
  // Верхняя морозилка — дверь
  const freezH = 0.55;
  box(w - 0.02, freezH - 0.02, 0.02, matFridge, x, h - freezH + 0.01, z + dir * (d/2 + 0.005), false);
  // Основное отделение — дверь
  box(w - 0.02, h - freezH - 0.10, 0.02, matFridge, x, 0.05, z + dir * (d/2 + 0.005), false);
  // Разделительная линия
  box(w, 0.01, 0.005, matDark, x, h - freezH, z + dir * (d/2 + 0.006), false);
  // Ручки
  box(0.03, 0.30, 0.03, matHandle, x - dir * 0.15, h - freezH + 0.10, z + dir * (d/2 + 0.04), false);
  box(0.03, 0.40, 0.03, matHandle, x - dir * 0.15, 0.55, z + dir * (d/2 + 0.04), false);
  addCollider(x - w/2, x + w/2, z - d/2, z + d/2, 0, h);
}

// ============ ПЛИТА С ВАРОЧНОЙ ПОВЕРХНОСТЬЮ ============
function buildStove(x, z, facing) {
  const w = 0.62, h = 0.90, d = 0.62;
  const dir = facing === 'z+' ? 1 : facing === 'z-' ? -1 : facing === 'x+' ? 1 : -1;
  // Корпус
  box(w, h - 0.05, d, matStove, x, 0, z, false);
  // Духовка (стекло)
  box(w - 0.10, h - 0.30, 0.02, matGlass, x, 0.06, z + dir * (d/2 + 0.005), false);
  // Ручка духовки
  box(w - 0.15, 0.03, 0.04, matChrome, x, h - 0.25, z + dir * (d/2 + 0.04), false);
  // Панель управления
  box(w, 0.10, 0.02, matDark, x, h - 0.10, z + dir * (d/2 + 0.005), false);
  // Ручки-крутилки
  for (let i = 0; i < 4; i++) {
    const kx = x - w/2 + 0.10 + i * (w - 0.20) / 3;
    const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.03, 8), matChrome);
    knob.rotation.x = Math.PI / 2;
    knob.position.set(kx, h - 0.05, z + dir * (d/2 + 0.02));
    scene.add(knob);
  }
  // Варочная поверхность
  box(w, 0.04, d, matStove, x, h - 0.05, z, false);
  // 4 конфорки
  for (const [dx, dz] of [[-0.15, -0.15], [0.15, -0.15], [-0.15, 0.15], [0.15, 0.15]]) {
    const burner = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.01, 16), matDark);
    burner.position.set(x + dx, h + 0.005, z + dz);
    scene.add(burner);
  }
  addCollider(x - w/2, x + w/2, z - d/2, z + d/2, 0, h);
}

// ============ РАКОВИНА ============
function buildSink(x, y, z, facing) {
  // x — центр раковины, y — высота столешницы
  const basinW = 0.5, basinD = 0.4, basinDepth = 0.18;
  const dir = facing === 'z+' ? 1 : facing === 'z-' ? -1 : facing === 'x+' ? 1 : -1;
  // Внешний блок (стоит на столешнице или врезан)
  box(basinW, 0.06, basinD, matPorcelain, x, y, z, false);
  // Углубление (имитация)
  box(basinW - 0.06, 0.02, basinD - 0.06, matMetal, x, y + 0.02, z, false);
  // Слив
  const drain = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.005, 8), matDark);
  drain.position.set(x, y + 0.03, z);
  scene.add(drain);
  // Смеситель
  cyl(0.018, 0.018, 0.16, matChrome, x, y + 0.06, z - dir * (basinD/2 - 0.06), 8);
  // Изогнутая часть крана
  const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.14, 8), matChrome);
  spout.rotation.x = Math.PI / 2;
  spout.position.set(x, y + 0.22, z - dir * (basinD/2 - 0.06) + dir * 0.07);
  scene.add(spout);
  // Ручки
  const handle1 = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.06, 6), matChrome);
  handle1.position.set(x - 0.05, y + 0.20, z - dir * (basinD/2 - 0.06));
  scene.add(handle1);
  const handle2 = handle1.clone();
  handle2.position.x = x + 0.05;
  scene.add(handle2);
}

// ============ УНИТАЗ ============
function buildToilet(x, y0, z, facing) {
  const dir = facing === 'z+' ? 1 : facing === 'z-' ? -1 : facing === 'x+' ? 1 : -1;
  // Бачок
  box(0.42, 0.50, 0.20, matPorcelain, x, y0, z + dir * 0.20, false);
  // Крышка бачка
  box(0.46, 0.04, 0.24, matPorcelain, x, y0 + 0.50, z + dir * 0.20, false);
  // Кнопка смыва
  box(0.06, 0.02, 0.06, matChrome, x, y0 + 0.54, z + dir * 0.20, false);
  // Основание / ножка
  box(0.25, y0 + 0.30, 0.22, matPorcelain, x, 0, z + dir * 0.02, false);
  // Чаша
  const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.18, 0.20, 16), matPorcelain);
  bowl.position.set(x, y0 + 0.30, z - dir * 0.08);
  bowl.castShadow = true; bowl.receiveShadow = true;
  scene.add(bowl);
  // Сиденье
  const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.04, 16), matPorcelain);
  seat.position.set(x, y0 + 0.42, z - dir * 0.08);
  scene.add(seat);
  // Крышка
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.02, 16), matPorcelain);
  lid.position.set(x, y0 + 0.45, z - dir * 0.08);
  scene.add(lid);
  addCollider(x - 0.22, x + 0.22, z - dir * 0.10 - 0.25, z - dir * 0.10 + 0.25, y0, y0 + 0.55);
}

// ============ ВАННА ============
function buildBathtub(x, y0, z, w, d) {
  // Внешняя оболочка
  box(w, 0.55, d, matPorcelain, x, y0, z, false);
  // Внутренняя ванна (имитация через более тёмный блок)
  box(w - 0.15, 0.02, d - 0.15, matMetal, x, y0 + 0.50, z, false);
  // Ручка слива
  box(0.04, 0.04, 0.04, matChrome, x, y0 + 0.54, z + d/2 - 0.10, false);
  // Ножки или плинтус
  box(w - 0.05, 0.10, d - 0.05, matPorcelain, x, 0, z, false);
  // Смеситель в изголовье
  cyl(0.02, 0.02, 0.20, matChrome, x - w/2 + 0.20, y0 + 0.54, z - d/2 + 0.10, 8);
  addCollider(x - w/2, x + w/2, z - d/2, z + d/2, y0, y0 + 0.55);
}

// ============ ТОРШЕР ============
function buildFloorLamp(x, z, colorHex, intensity, y0 = 0) {
  // Тяжёлое основание
  cyl(0.18, 0.20, 0.03, matDark, x, y0, z, 16);
  // Стойка
  cyl(0.02, 0.02, 1.50, matChrome, x, y0 + 0.03, z, 8);
  // Абажур (сужается вверх)
  const shadeY = y0 + 1.50;
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.30, 20, 1, true), matLampShade);
  shade.position.set(x, shadeY + 0.15, z);
  shade.castShadow = true;
  scene.add(shade);
  // Верхний диск абажура
  const shadeTop = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.01, 20), matLampShade);
  shadeTop.position.set(x, shadeY + 0.30, z);
  scene.add(shadeTop);
  // Лампочка
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), matBulb);
  bulb.position.set(x, shadeY + 0.16, z);
  scene.add(bulb);
  // Свет
  const l = new THREE.PointLight(colorHex, intensity, 6.5, 2);
  l.position.set(x, shadeY + 0.15, z);
  scene.add(l);
  flickerLights.push({ light: l, base: intensity, bulb, phase: Math.random()*100, speed: 1.4 + Math.random()*3 });
  addCollider(x - 0.20, x + 0.20, z - 0.20, z + 0.20, y0, y0 + 1.6);
}

// ============ НАСТОЛЬНАЯ ЛАМПА ============
function buildTableLamp(x, y0, z, colorHex, intensity) {
  // Основание
  cyl(0.07, 0.09, 0.03, matDark, x, y0, z, 12);
  // Стойка
  cyl(0.012, 0.012, 0.24, matChrome, x, y0 + 0.03, z, 6);
  // Абажур
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.16, 16, 1, true), matLampShade);

// ============ РАСТЕНИЕ ============
function buildPlant(x, z, scale = 1, y0 = 0) {
  // Горшок (сужается вниз)
  cyl(0.20 * scale, 0.15 * scale, 0.30 * scale, matPot, x, y0, z, 12);
  // Верхний бортик горшка
  cyl(0.21 * scale, 0.21 * scale, 0.03 * scale, matPot, x, y0 + 0.30 * scale, z, 12);
  // Земля
  cyl(0.18 * scale, 0.18 * scale, 0.02 * scale, matDark, x, y0 + 0.31 * scale, z, 12);
  // Стебель
  cyl(0.02 * scale, 0.02 * scale, 0.5 * scale, matPlant, x, y0 + 0.33 * scale, z, 6);
  // Листья (несколько шаров)
  const leafMat = matPlant;
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const r = 0.14 * scale;
    const ly = y0 + (0.55 + Math.random() * 0.30) * scale;
    const lx = x + Math.cos(angle) * r;
    const lz = z + Math.sin(angle) * r;
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.13 * scale, 8, 6), leafMat);
    leaf.scale.set(1, 1.3, 1);
    leaf.position.set(lx, ly, lz);
    leaf.castShadow = true;
    scene.add(leaf);
  }
  // Центральный шар листвы
  const center = new THREE.Mesh(new THREE.SphereGeometry(0.15 * scale, 8, 6), leafMat);
  center.position.set(x, y0 + 0.75 * scale, z);
  center.castShadow = true;
  scene.add(center);

  addCollider(x - 0.20 * scale, x + 0.20 * scale, z - 0.20 * scale, z + 0.20 * scale, y0, y0 + 0.5 * scale);
}

// ============ КАРТИНА ============
function buildPainting(x, y, z, w, h, facing, matContent) {
  const dir = facing === 'z+' ? 1 : facing === 'z-' ? -1 : facing === 'x+' ? 1 : -1;
  if (dir !== 0) {
    // Картина на стене, перпендикулярной оси Z
    // Рама
    box(w, h, 0.04, matWoodDeep, x, y - h/2, z, false);
    // Паспарту
    box(w - 0.10, h - 0.10, 0.005, matContent || matPaper, x, y - h/2 + 0.05, z + dir * 0.025, false);
    // Мазки кисти
    box(w*0.5, h*0.35, 0.003, matBookMats[0], x - w*0.15, y - h/2 + h*0.55, z + dir * 0.032, false);
    box(w*0.35, h*0.4, 0.003, matBookMats[2], x + w*0.15, y - h/2 + h*0.35, z + dir * 0.032, false);
  } else {
    box(0.04, h, w, matWoodDeep, x, y - h/2, z, false);
    box(0.005, h - 0.10, w - 0.10, matContent || matPaper, x + (facing === 'x+' ? 0.025 : -0.025), y - h/2 + 0.05, z, false);
    box(0.003, h*0.35, w*0.5, matBookMats[0], x + (facing === 'x+' ? 0.032 : -0.032), y - h/2 + h*0.55, z - w*0.15, false);
  }
}

// ============ ЧАСЫ ============
function buildClock(x, y, z, facing) {
  const dir = facing === 'z+' ? 1 : facing === 'z-' ? -1 : facing === 'x+' ? 1 : -1;
  const radius = 0.18;
  if (dir !== 0) {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.05, 20), matDark);
    body.rotation.x = Math.PI / 2;
    body.position.set(x, y, z); body.castShadow = true; scene.add(body);
    const face = new THREE.Mesh(new THREE.CircleGeometry(radius - 0.02, 20), matClockFace);
    face.position.set(x, y, z + dir * 0.026); scene.add(face);
    // Стрелки
    const hourHand = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.09, 0.003), matDark);
    hourHand.position.set(x, y + 0.035, z + dir * 0.028); scene.add(hourHand);
    const minHand = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.13, 0.003), matDark);
    minHand.position.set(x, y + 0.05, z + dir * 0.028); scene.add(minHand);
  } else {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.05, 20), matDark);
    body.rotation.z = Math.PI / 2;
    body.position.set(x, y, z); body.castShadow = true; scene.add(body);
    const face = new THREE.Mesh(new THREE.CircleGeometry(radius - 0.02, 20), matClockFace);
    face.rotation.y = dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    face.position.set(x + dir * 0.026, y, z); scene.add(face);
    const hourHand = new THREE.Mesh(new THREE.BoxGeometry(0.003, 0.09, 0.012), matDark);
    hourHand.position.set(x + dir * 0.028, y + 0.035, z); scene.add(hourHand);
    const minHand = new THREE.Mesh(new THREE.BoxGeometry(0.003, 0.13, 0.008), matDark);
    minHand.position.set(x + dir * 0.028, y + 0.05, z); scene.add(minHand);
  }
}

// ============ КОВЁР ============
function buildRug(x, z, w, d, mat, y0 = 0) {
  box(w, 0.012, d, mat, x, y0 + 0.002, z, false);

let pointerLocked = false;
let gameActive = false;

function requestLock() {
  if (pointerLocked) return;
  try {
    const p = renderer.domElement.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  } catch (e) {}
}
document.addEventListener('pointerlockchange', () => {
  pointerLocked = (document.pointerLockElement === renderer.domElement);
  if (!isMobile) {
    gameActive = pointerLocked;
    overlay.style.display = pointerLocked ? 'none' : 'flex';
  }
});
document.addEventListener('mousemove', (e) => {
  if (!pointerLocked || isMobile) return;
  const sens = 0.0022;
  player.yaw   -= e.movementX * sens;
  player.pitch -= e.movementY * sens;
  const lim = Math.PI / 2 - 0.02;
  player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
});

function startGame() {
  if (isMobile) {
    if (gameActive) return;
    gameActive = true;
    overlay.style.display = 'none';
    document.getElementById('mobile-controls').classList.add('active');
    flBtnEl.classList.add('active');
  } else {
    requestLock();
  }
}
overlay.addEventListener('click', startGame);
overlay.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); }, { passive: false });
renderer.domElement.addEventListener('click', () => {
  if (!isMobile && !pointerLocked) requestLock();
});

   МОБИЛЬНЫЕ КОНТРОЛЫ
   ============================================================ */
const moveZoneEl = document.getElementById('move-zone');
const lookZoneEl = document.getElementById('look-zone');
const joystickEl = document.getElementById('joystick');
const joystickStick = document.getElementById('joystick-stick');

const JOY_RADIUS = 65;
const moveVec = { x: 0, y: 0 };
let moveTouchId = null;
const moveTouchOrigin = { x: 0, y: 0 };
let lookTouchId = null;
const lookTouchLast = { x: 0, y: 0 };

moveZoneEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (moveTouchId !== null) return;
  const t = e.changedTouches[0];
  moveTouchId = t.identifier;
  moveTouchOrigin.x = t.clientX;
  moveTouchOrigin.y = t.clientY;
  joystickEl.style.left = t.clientX + 'px';
  joystickEl.style.top  = t.clientY + 'px';
  joystickEl.style.display = 'block';
  joystickStick.style.transform = 'translate(0px, 0px)';
}, { passive: false });
moveZoneEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== moveTouchId) continue;
    let dx = t.clientX - moveTouchOrigin.x;
    let dy = t.clientY - moveTouchOrigin.y;
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_RADIUS) { dx = dx / dist * JOY_RADIUS; dy = dy / dist * JOY_RADIUS; }
    moveVec.x = dx / JOY_RADIUS;
    moveVec.y = dy / JOY_RADIUS;
    joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
  }
}, { passive: false });
function endMoveTouch(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== moveTouchId) continue;
    moveTouchId = null;
    moveVec.x = 0;
    moveVec.y = 0;
    joystickEl.style.display = 'none';
  }
}
moveZoneEl.addEventListener('touchend', endMoveTouch);
moveZoneEl.addEventListener('touchcancel', endMoveTouch);

lookZoneEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (lookTouchId !== null) return;
  const t = e.changedTouches[0];
  lookTouchId = t.identifier;
  lookTouchLast.x = t.clientX;
  lookTouchLast.y = t.clientY;
}, { passive: false });
lookZoneEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== lookTouchId) continue;
    const dx = t.clientX - lookTouchLast.x;
    const dy = t.clientY - lookTouchLast.y;
    lookTouchLast.x = t.clientX;
    lookTouchLast.y = t.clientY;
    const sens = 0.0045;
    player.yaw   -= dx * sens;
    player.pitch -= dy * sens;
    const lim = Math.PI / 2 - 0.02;
    player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
  }
}, { passive: false });
function endLookTouch(e) {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (t.identifier !== lookTouchId) continue;
    lookTouchId = null;
  }
}
lookZoneEl.addEventListener('touchend', endLookTouch);
lookZoneEl.addEventListener('touchcancel', endLookTouch);

let lastFlTouch = 0;
flBtnEl.addEventListener('touchstart', (e) => {
  e.preventDefault(); e.stopPropagation();
  lastFlTouch = Date.now();
  setFlashlight(!flashlightOn);
}, { passive: false });
flBtnEl.addEventListener('click', (e) => {
  e.preventDefault(); e.stopPropagation();
  if (Date.now() - lastFlTouch < 500) return;
  setFlashlight(!flashlightOn);
});

/* ============================================================
   ФИЗИКА
   ============================================================ */
function getGroundHeight(x, z, feetY) {
  let best = -Infinity;
  const limit = feetY + 0.62;
  for (let i = 0; i < floorRects.length; i++) {
    const r = floorRects[i];
    if (x >= r.minX && x <= r.maxX && z >= r.minZ && z <= r.maxZ) {
      if (r.y <= limit && r.y > best) best = r.y;
    }
  }
  if (x >= STAIR.x1 && x <= STAIR.x2 && z >= STAIR.z1 && z <= STAIR.z2) {
    const t = (z - STAIR.z1) / (STAIR.z2 - STAIR.z1);
    const y = Math.min(1, Math.max(0, t)) * STAIR.h;
    if (y <= limit && y > best) best = y;
  }
  return best === -Infinity ? 0 : best;
}
function resolveCollisions(pos, feetY) {
  const r = PLAYER_RADIUS;
  const pMinY = feetY + 0.22;
  const pMaxY = feetY + 1.72;
  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (pMaxY < c.minY || pMinY > c.maxY) continue;
    const cx = Math.max(c.minX, Math.min(pos.x, c.maxX));
    const cz = Math.max(c.minZ, Math.min(pos.z, c.maxZ));
    const dx = pos.x - cx;
    const dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 > r * r) continue;
    if (d2 > 1e-8) {
      const d = Math.sqrt(d2);
      const push = (r - d) / d;
      pos.x += dx * push;
      pos.z += dz * push;
    } else {
      const left  = pos.x - c.minX;
      const right = c.maxX - pos.x;
      const back  = pos.z - c.minZ;
      const front = c.maxZ - pos.z;
      const m = Math.min(left, right, back, front);
      if (m === left)       pos.x = c.minX - r;
      else if (m === right) pos.x = c.maxX + r;
      else if (m === back)  pos.z = c.minZ - r;
      else                  pos.z = c.maxZ + r;
    }
  }
}
function updatePlayer(dt) {
  const touchMag = Math.hypot(moveVec.x, moveVec.y);
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'] || (isMobile && touchMag > 0.88);
  const speed = sprint ? 5.2 : 2.7;
  let fwd    = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0) - moveVec.y;
  let strafe = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0) + moveVec.x;
  let dx = 0, dz = 0;
  const mag = Math.hypot(fwd, strafe);
  if (mag > 0.001) {
    const sy = Math.sin(player.yaw);
    const cy = Math.cos(player.yaw);
    const nx = (-sy * fwd + cy * strafe) / mag;
    const nz = (-cy * fwd - sy * strafe) / mag;
    const speedMul = Math.min(1, mag);
    dx = nx * speedMul;
    dz = nz * speedMul;
  }
  const totalDist = speed * dt;
  const substeps = Math.max(1, Math.ceil(totalDist / 0.12));
  const stepDist = totalDist / substeps;
  for (let s = 0; s < substeps; s++) {
    player.pos.x += dx * stepDist;
    player.pos.z += dz * stepDist;
    resolveCollisions(player.pos, player.feetY);
  }
  player.vy -= GRAVITY * dt;
  player.feetY += player.vy * dt;
  const g = getGroundHeight(player.pos.x, player.pos.z, player.feetY);
  if (player.feetY <= g) { player.feetY = g; player.vy = 0; player.onGround = true; }
  else { player.onGround = false; }
  if (player.feetY < -5) {
    player.pos.set(2.0, 0, -5.0);
    player.feetY = 0;
    player.vy = 0;
  }
  const moving = (fwd !== 0 || strafe !== 0) && player.onGround;
  const targetBob = moving ? (sprint ? 1.5 : 1.0) : 0.0;
  player.bobAmount += (targetBob - player.bobAmount) * Math.min(1, dt * 8);
  if (moving) player.bobTime += dt * (sprint ? 13 : 9);
  const bobY = Math.sin(player.bobTime * 2) * 0.030 * player.bobAmount;
  const bobX = Math.cos(player.bobTime) * 0.018 * player.bobAmount;
  camera.position.set(
    player.pos.x + bobX * Math.cos(player.yaw),
    player.feetY + EYE_HEIGHT + bobY,
    player.pos.z - bobX * Math.sin(player.yaw)
  );
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
  camera.rotation.z = Math.cos(player.bobTime) * 0.006 * player.bobAmount;
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD() {
  const floor = player.feetY > F1 - 0.6 ? 2 : 1;
  hudEl.textContent = `ФОНАРИК: ${flashlightOn ? 'ВКЛ' : 'ВЫКЛ'}  |  ЭТАЖ: ${floor}`;
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  let dt = clock.getDelta();
  if (dt > 0.05) dt = 0.05;
  elapsed += dt;

  if (gameActive) updatePlayer(dt);
  else {
    camera.position.set(player.pos.x, player.feetY + EYE_HEIGHT, player.pos.z);
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
  }

  for (let i = 0; i < flickerLights.length; i++) {
    const f = flickerLights[i];
    const t = elapsed * f.speed + f.phase;
    let n = 0.62
          + 0.26 * Math.sin(t * 1.7)
          + 0.14 * Math.sin(t * 5.3 + 1.1)
          + 0.08 * Math.sin(t * 13.7);
    if (Math.sin(t * 0.9 + f.phase) > 0.985) n *= 0.12;
    n = Math.max(0.0, n);
    f.light.intensity = f.base * n;
    if (f.bulb.material) f.bulb.material.color.setRGB(0.6 + 0.4 * n, 0.5 + 0.4 * n, 0.35 + 0.4 * n);
  }

  if (flashlightOn) {
    const jitter = 0.012 * Math.sin(elapsed * 7.3) + 0.008 * Math.sin(elapsed * 17.1);
    flashlight.position.x = 0.18 + jitter;
    flashlight.position.y = -0.12 + jitter * 0.7;
    flFill.position.x = 0.25 + jitter;
  }

  const t = elapsed;
  if (flashlightOn) {
    ambient.intensity = 0.32;
    hemi.intensity    = 0.20;
    ambient.color.setHex(0x1a2234);
    hemi.color.setHex(0x1a2234);
    const haloFlick = 0.92 + 0.05 * Math.sin(t * 3.1) + 0.03 * Math.sin(t * 9.7 + 1.4);
    playerHalo.intensity = 0.60 * haloFlick;
    playerHalo.distance  = 6.5;
    playerHalo.color.setHex(0x9aa4be);
  } else {
    let flick = 0.95
      + 0.10 * Math.sin(t * 2.4)
      + 0.06 * Math.sin(t * 6.9 + 1.7)
      + 0.04 * Math.sin(t * 16.3 + 0.4);
    if (Math.sin(t * 0.63 + 1.3) > 0.965) flick *= 0.62;
    flick = Math.max(0.55, flick);
    ambient.intensity = 0.72 * flick;
    hemi.intensity    = 0.52 * flick;
    ambient.color.setHex(0x243048);
    hemi.color.setHex(0x243048);
    const haloFlick = 0.95 + 0.08 * Math.sin(t * 2.1) + 0.05 * Math.sin(t * 5.7 + 0.9);
    playerHalo.intensity = 0.88 * haloFlick;
    playerHalo.distance  = 7.0;
    playerHalo.color.setHex(0xa898b0);
    if (Math.sin(t * 0.55 + 2.1) > 0.965) playerHalo.intensity *= 0.55;
  }

  updateHUD();
  renderer.render(scene, camera);
}

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   МОБИЛЬНЫЙ ТЕКСТ
   ============================================================ */
if (isMobile) {
  document.getElementById('overlay-help').innerHTML = `
    <span class="key">ЛЕВАЯ ПОЛОВИНА</span> — стик движения<br>
    <span class="key">ПРАВАЯ ПОЛОВИНА</span> — осмотреться<br>
    <span class="key">КНОПКА ↖</span> — фонарик вкл / выкл
  `;
  document.getElementById('overlay-hint').textContent = 'КОСНИТЕСЬ ЭКРАНА, ЧТОБЫ ВОЙТИ';
}

/* ============================================================
   СТАРТ
   ============================================================ */
setFlashlight(true);
updateHUD();
animate();
</script>
</body>
</html>
