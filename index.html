<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Тёмный Дом</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New', monospace; }
  canvas { display:block; cursor:crosshair; }
  #overlay { position:fixed; inset:0; z-index:10; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, rgba(25,14,8,0.92), rgba(0,0,0,0.99));
    color:#c9b48a; text-align:center; padding:20px; transition: opacity .3s; touch-action: none; }
  #overlay h1 { font-size: clamp(28px, 6vw, 54px); letter-spacing: 8px; margin-bottom: 18px;
    text-shadow: 0 0 24px rgba(255,80,20,0.5), 0 0 4px #000; color:#e0c48a; }
  #overlay p { font-size: 15px; line-height: 2.0; opacity: 0.85; }
  #overlay .key { color:#ffb347; font-weight:bold; }
  #overlay .hint { margin-top: 30px; font-size: 13px; opacity: 0.55; animation: pulse 1.8s infinite; letter-spacing: 2px; }
  @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.9} }
  #hud { position:fixed; bottom:14px; left:16px; z-index:5; pointer-events:none;
    color:#8a7a5a; font-size:12px; letter-spacing:1px; text-shadow:0 0 8px #000; }
  body.mobile #hud { top: calc(14px + env(safe-area-inset-top, 0px)); bottom: auto; font-size: 11px; left: 16px; }
  #crosshair { position:fixed; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    background:rgba(255,255,255,0.30); border-radius:50%; z-index:5; pointer-events:none; box-shadow: 0 0 6px rgba(0,0,0,0.8); transition: background .2s, transform .2s; }
  #crosshair.active { background: rgba(255,200,120,0.95); transform: scale(1.8); box-shadow: 0 0 12px rgba(255,180,80,0.9); }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:4;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 25%, rgba(0,0,0,0.92) 100%); }
  #damage { position:fixed; inset:0; pointer-events:none; z-index:3;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(30,0,0,0.35) 100%); mix-blend-mode: multiply; }
  #grain { position:fixed; inset:0; pointer-events:none; z-index:2; opacity:0.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>"); }
  #interact-hint { position:fixed; left:50%; top:56%; transform:translateX(-50%);
    color:#ffd27a; font-size:14px; z-index:6; pointer-events:none; opacity:0;
    transition: opacity .2s; text-shadow: 0 0 8px #000, 0 0 4px #000; letter-spacing: 2px;
    background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 4px; border: 1px solid rgba(255,200,120,0.35); }
  #interact-hint.show { opacity: 1; }
  #tv-ui { position:fixed; inset:0; z-index:20; display:none; pointer-events:none; }
  #tv-ui.active { display: block; }
  #tv-exit { position: fixed; top: 20px; right: 20px; padding: 10px 20px;
    background: rgba(30,20,15,0.85); color:#ffd27a; border: 1px solid rgba(255,200,120,0.5);
    border-radius: 6px; cursor: pointer; pointer-events: auto; font-family: 'Courier New', monospace;
    font-size: 14px; letter-spacing: 1px; }
  #tv-exit:hover { background: rgba(60,40,25,0.95); }
  #mobile-controls { position: fixed; inset: 0; z-index: 8; pointer-events: none; display: none; }
  #mobile-controls.active { display: block; }
  #move-zone { position: absolute; left: 0; top: 0; width: 45%; height: 100%; pointer-events: auto; touch-action: none; }
  #look-zone { position: absolute; right: 0; top: 0; width: 55%; height: 100%; pointer-events: auto; touch-action: none; }
  #joystick { position: fixed; width: 130px; height: 130px; margin-left: -65px; margin-top: -65px; border-radius: 50%;
    border: 2px solid rgba(200, 180, 140, 0.35);
    background: radial-gradient(circle, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.4) 100%);
    display: none; z-index: 9; pointer-events: none; box-shadow: 0 0 24px rgba(0,0,0,0.55) inset; }
  #joystick-stick { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
    margin-left: -28px; margin-top: -28px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(240, 220, 180, 0.6), rgba(160, 130, 90, 0.35));
    border: 2px solid rgba(220, 200, 160, 0.7); box-shadow: 0 0 14px rgba(255, 200, 120, 0.25); pointer-events: none; }
  #flashlight-btn { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px));
    width: 58px; height: 58px; border-radius: 50%; background: rgba(18, 14, 10, 0.6);
    border: 2px solid rgba(120, 100, 70, 0.5); display: none; align-items: center; justify-content: center;
    z-index: 12; pointer-events: auto; touch-action: none; color: #6a5a3a; box-shadow: 0 0 16px rgba(0,0,0,0.6);
    transition: all 0.15s; -webkit-tap-highlight-color: transparent; user-select: none; }
  #flashlight-btn.active { display: flex; }
  #flashlight-btn svg { width: 34px; height: 34px; display: block; }
  #flashlight-btn.on { color: #ffd27a; background: rgba(50, 35, 15, 0.78);
    border-color: rgba(255, 200, 120, 0.7);
    box-shadow: 0 0 22px rgba(255, 180, 80, 0.55), 0 0 8px rgba(255, 200, 120, 0.4) inset; }
  #flashlight-btn:active { transform: scale(0.93); }
  #action-btn { position: fixed; bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    right: calc(30px + env(safe-area-inset-right, 0px));
    width: 70px; height: 70px; border-radius: 50%; background: rgba(80, 60, 30, 0.55);
    border: 2px solid rgba(255, 200, 120, 0.6); display: none; align-items: center; justify-content: center;
    z-index: 12; pointer-events: auto; color: #ffd27a;
    box-shadow: 0 0 20px rgba(255, 180, 80, 0.4); font-size: 11px; font-weight: bold;
    letter-spacing: 1px; -webkit-tap-highlight-color: transparent; user-select: none; text-align:center; line-height:1.2;}
  #action-btn.active { display: flex; }
  #action-btn:active { transform: scale(0.92); background: rgba(120, 90, 40, 0.7); }
</style>
</head>
<body>

<div id="overlay">
  <h1>ТЁМНЫЙ ДОМ</h1>
  <p id="overlay-help">
    <span class="key">W A S D</span> — движение<br>
    <span class="key">МЫШЬ</span> — осмотреться<br>
    <span class="key">SHIFT</span> — бежать<br>
    <span class="key">F</span> — фонарик вкл / выкл<br>
    <span class="key">E / ЛКМ</span> — взаимодействие<br>
    <span class="key">ESC</span> — пауза
  </p>
  <p class="hint" id="overlay-hint">НАЖМИТЕ, ЧТОБЫ ВОЙТИ В ДОМ</p>
</div>
<div id="vignette"></div>
<div id="damage"></div>
<div id="grain"></div>
<div id="crosshair"></div>
<div id="interact-hint"></div>
<div id="hud">ФОНАРИК: ВКЛ &nbsp;|&nbsp; ЭТАЖ: 1</div>
<div id="tv-ui">
  <div id="tv-exit">← ВЫЙТИ (ESC)</div>
</div>
<div id="mobile-controls">
  <div id="move-zone"></div>
  <div id="look-zone"></div>
</div>
<div id="joystick"><div id="joystick-stick"></div></div>
<div id="flashlight-btn" aria-label="Фонарик">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 5 L17 5 L15 9 L15 20 L9 20 L9 9 Z"/>
    <line x1="9" y1="12.5" x2="15" y2="12.5"/>
    <line x1="9" y1="16.5" x2="15" y2="16.5"/>
    <line x1="8" y1="3" x2="6.5" y2="1.5"/>
    <line x1="12" y1="3" x2="12" y2="1"/>
    <line x1="16" y1="3" x2="17.5" y2="1.5"/>
  </svg>
</div>
<div id="action-btn">ДЕЙСТВИЕ</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ТЁМНЫЙ ДОМ — свет в комнатах ×2, исправленные дверцы
   ============================================================ */

const isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform));
if (isMobile) document.body.classList.add('mobile');

const T = 0.30, F1 = 3.20, SLAB_B = 2.90, F2 = 6.40;
const STAIR = { x1: 5.20, x2: 7.80, z1: 1.0, z2: 7.0, h: F1 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020304);
scene.fog = new THREE.FogExp2(0x020304, 0.055);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 200);
camera.rotation.order = 'YXZ';
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

/* ============================================================
   ТЕКСТУРЫ
   ============================================================ */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function makeTex(w, h, drawFn, rx = 1, ry = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  drawFn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = maxAniso;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function addNoise(ctx, w, h, amount) {
  const img = ctx.getImageData(0,0,w,h); const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * amount;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);
}
function drawWallpaper(ctx, w, h) {
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#463125'); g.addColorStop(0.45,'#39271c'); g.addColorStop(1,'#2b1d14');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  for (let x = 0; x < w; x += 32) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(x,0,2,h);
    ctx.fillStyle = 'rgba(120,80,50,0.05)'; ctx.fillRect(x+2,0,1,h);
  }
  const cell = 64;
  for (let y = 0; y < h; y += cell) for (let x = 0; x < w; x += cell) {
    const off = ((y/cell)%2)*(cell/2);
    ctx.save(); ctx.translate(x+off,y);
    ctx.strokeStyle = 'rgba(110,70,45,0.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cell/2,8); ctx.lineTo(cell-8,cell/2); ctx.lineTo(cell/2,cell-8); ctx.lineTo(8,cell/2); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = 'rgba(160,110,65,0.4)'; ctx.beginPath(); ctx.arc(cell/2,cell/2,3.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  addNoise(ctx, w, h, 22);
}
function drawConcrete(ctx, w, h) {
  ctx.fillStyle = '#332f2a'; ctx.fillRect(0,0,w,h);
  for (let i = 0; i < 60; i++) {
    const x = Math.random()*w, y = Math.random()*h, r = 20 + Math.random()*100;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, Math.random()>0.5?`rgba(10,10,10,${0.2+Math.random()*0.3})`:`rgba(70,65,55,${0.1+Math.random()*0.2})`);
    g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  addNoise(ctx, w, h, 45);
}
function drawWoodFloor(ctx, w, h) {
  ctx.fillStyle = '#1e140d'; ctx.fillRect(0,0,w,h);
  const plankH = 48;
  for (let y = 0; y < h; y += plankH) {
    const shade = 25 + Math.random()*25;
    ctx.fillStyle = `rgb(${shade+15},${shade+2},${shade-6})`;
    ctx.fillRect(0,y,w,plankH-2);
    for (let i = 0; i < 20; i++) {
      ctx.strokeStyle = `rgba(0,0,0,${0.04+Math.random()*0.16})`; ctx.lineWidth = 0.4 + Math.random();
      ctx.beginPath(); const gy = y + Math.random()*plankH; ctx.moveTo(0,gy);
      for (let x = 0; x < w; x += 16) ctx.lineTo(x, gy + Math.sin(x*0.06 + y*0.1)*2);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,y+plankH-2,w,2);
  }
  addNoise(ctx, w, h, 18);
}
function drawCeiling(ctx, w, h) {
  ctx.fillStyle = '#2a2620'; ctx.fillRect(0,0,w,h);
  for (let i = 0; i < 60; i++) {
    const x = Math.random()*w, y = Math.random()*h, r = 15 + Math.random()*90;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, Math.random()>0.45?`rgba(8,6,4,${0.2+Math.random()*0.35})`:`rgba(80,65,45,${0.08+Math.random()*0.15})`);
    g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  addNoise(ctx, w, h, 28);
}
function drawFurnitureWood(ctx, w, h) {
  ctx.fillStyle = '#2a1a10'; ctx.fillRect(0,0,w,h);
  for (let i = 0; i < 50; i++) {
    ctx.strokeStyle = `rgba(0,0,0,${0.05+Math.random()*0.2})`; ctx.lineWidth = 0.5 + Math.random()*1.5;
    ctx.beginPath(); const y = Math.random()*h; ctx.moveTo(0,y);
    for (let x = 0; x < w; x += 12) ctx.lineTo(x, y + Math.sin(x*0.1 + i)*2);
    ctx.stroke();
  }
  addNoise(ctx, w, h, 16);
}
function drawMetal(ctx, w, h) {
  ctx.fillStyle = '#3a3a40'; ctx.fillRect(0,0,w,h);
  for (let i = 0; i < 80; i++) {
    const x = Math.random()*w, y = Math.random()*h, r = 5 + Math.random()*40;
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, Math.random()>0.5?'rgba(0,0,0,0.35)':'rgba(120,110,100,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  addNoise(ctx, w, h, 25);
}
function drawTile(ctx, w, h) {
  ctx.fillStyle = '#1a1a18'; ctx.fillRect(0,0,w,h);
  const s = 64;
  for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) {
    const shade = 45 + Math.random()*25;
    ctx.fillStyle = `rgb(${shade},${shade-3},${shade-8})`; ctx.fillRect(x+2,y+2,s-4,s-4);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x,y,s,2); ctx.fillRect(x,y,2,s);
  }
  addNoise(ctx, w, h, 20);
}
function drawFabric(ctx, w, h) {
  ctx.fillStyle = '#3a2a32'; ctx.fillRect(0,0,w,h);
  for (let y = 0; y < h; y += 3) for (let x = 0; x < w; x += 3) {
    const n = Math.random()*40;
    ctx.fillStyle = `rgba(${60+n},${45+n},${55+n},0.5)`; ctx.fillRect(x,y,2,2);
  }
  addNoise(ctx, w, h, 25);
}
function drawMarble(ctx, w, h) {
  ctx.fillStyle = '#1c1c1e'; ctx.fillRect(0,0,w,h);
  for (let i = 0; i < 12; i++) {
    ctx.strokeStyle = `rgba(${90+Math.random()*40},${85+Math.random()*35},${80+Math.random()*30},0.35)`;
    ctx.lineWidth = 0.5 + Math.random()*1.5;
    ctx.beginPath(); let x = Math.random()*w, y = Math.random()*h; ctx.moveTo(x,y);
    for (let s = 0; s < 20; s++) { x += (Math.random()-0.5)*40; y += (Math.random()-0.5)*40; ctx.lineTo(x,y); }
    ctx.stroke();
  }
  addNoise(ctx, w, h, 15);
}

const texWallpaper = makeTex(512, 512, drawWallpaper, 2, 1);
const texConcrete  = makeTex(512, 512, drawConcrete,  3, 2);
const texFloor     = makeTex(512, 512, drawWoodFloor, 6, 5);
const texCeiling   = makeTex(512, 512, drawCeiling,   3, 3);
const texWood      = makeTex(256, 256, drawFurnitureWood, 1, 1);
const texMetal     = makeTex(256, 256, drawMetal, 1, 1);
const texTile      = makeTex(256, 256, drawTile, 1, 1);
const texFabric    = makeTex(128, 128, drawFabric, 3, 3);
const texMarble    = makeTex(256, 256, drawMarble, 1, 1);

/* ============================================================
   МАТЕРИАЛЫ
   ============================================================ */
const matWallOuter = new THREE.MeshStandardMaterial({ map: texConcrete, bumpMap: texConcrete, bumpScale: 0.04, color: 0x9a9088, roughness: 1.0 });
const matWall      = new THREE.MeshStandardMaterial({ map: texWallpaper, bumpMap: texWallpaper, bumpScale: 0.025, color: 0xb8a890, roughness: 0.97 });
const matSlab      = new THREE.MeshStandardMaterial({ map: texCeiling, bumpMap: texCeiling, bumpScale: 0.03, color: 0x9a8f80, roughness: 0.98 });
const matWood      = new THREE.MeshStandardMaterial({ map: texWood, bumpMap: texWood, bumpScale: 0.02, color: 0xb0a090, roughness: 0.75 });
const matWoodDark  = new THREE.MeshStandardMaterial({ map: texFloor, bumpMap: texFloor, bumpScale: 0.025, color: 0x7a6a5a, roughness: 0.85 });
const matWoodDeep  = new THREE.MeshStandardMaterial({ map: texWood, bumpMap: texWood, bumpScale: 0.02, color: 0x5a3a20, roughness: 0.6 });
const matWoodOak   = new THREE.MeshStandardMaterial({ map: texWood, bumpMap: texWood, bumpScale: 0.02, color: 0x8a6a3a, roughness: 0.65 });
const matDark      = new THREE.MeshStandardMaterial({ map: texWood, bumpMap: texWood, bumpScale: 0.02, color: 0x3a3030, roughness: 0.9 });
const matMetal     = new THREE.MeshStandardMaterial({ map: texMetal, bumpMap: texMetal, bumpScale: 0.01, color: 0x8a8a92, roughness: 0.5, metalness: 0.65 });
const matChrome    = new THREE.MeshStandardMaterial({ color: 0xccd0d8, roughness: 0.15, metalness: 0.95 });
const matHandle    = new THREE.MeshStandardMaterial({ color: 0xb0b4bc, roughness: 0.3, metalness: 0.85 });
const matWhite     = new THREE.MeshStandardMaterial({ map: texTile, bumpMap: texTile, bumpScale: 0.015, color: 0xc0bdb0, roughness: 0.65 });
const matPorcelain = new THREE.MeshStandardMaterial({ color: 0xe8e6e0, roughness: 0.15, metalness: 0.05 });
const matCountertop= new THREE.MeshStandardMaterial({ map: texMarble, bumpMap: texMarble, bumpScale: 0.005, color: 0x9a9a9e, roughness: 0.25, metalness: 0.15 });
const matGlass     = new THREE.MeshStandardMaterial({ color: 0x0a0e14, roughness: 0.05, metalness: 0.5 });
const matTVScreenOff = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.15, metalness: 0.35 });
const matTVScreenOn  = new THREE.MeshStandardMaterial({ color: 0x1a3a5a, roughness: 0.05, metalness: 0.1, emissive: 0x4a7ab0, emissiveIntensity: 1.4 });
const matFridge    = new THREE.MeshStandardMaterial({ color: 0xc8c8cc, roughness: 0.35, metalness: 0.4 });
const matStove     = new THREE.MeshStandardMaterial({ color: 0x303034, roughness: 0.4, metalness: 0.5 });
const matFabric    = new THREE.MeshStandardMaterial({ map: texFabric, bumpMap: texFabric, bumpScale: 0.005, color: 0x4a3a48, roughness: 1.0 });
const matFabric2   = new THREE.MeshStandardMaterial({ map: texFabric, bumpMap: texFabric, bumpScale: 0.005, color: 0x3a4a5a, roughness: 1.0 });
const matFabric3   = new THREE.MeshStandardMaterial({ map: texFabric, bumpMap: texFabric, bumpScale: 0.005, color: 0x5a4a2a, roughness: 1.0 });
const matPillow    = new THREE.MeshStandardMaterial({ map: texFabric, color: 0x8a7a5a, roughness: 0.95 });
const matBlanket   = new THREE.MeshStandardMaterial({ map: texFabric, color: 0x4a2a3a, roughness: 0.95 });
const matSheet     = new THREE.MeshStandardMaterial({ color: 0xc8c0b0, roughness: 0.9 });
const matMattress  = new THREE.MeshStandardMaterial({ color: 0xd8d0c0, roughness: 0.9 });
const matRug       = new THREE.MeshStandardMaterial({ map: texFabric, color: 0x401818, roughness: 1.0 });
const matRug2      = new THREE.MeshStandardMaterial({ map: texFabric, color: 0x1a2030, roughness: 1.0 });
const matLampShade = new THREE.MeshStandardMaterial({ color: 0xd8b888, roughness: 0.85, side: THREE.DoubleSide, emissive: 0x3a2010, emissiveIntensity: 0.5 });
const matBulb      = new THREE.MeshBasicMaterial({ color: 0xffe8b0 });
const matPlant     = new THREE.MeshStandardMaterial({ color: 0x1e4a1e, roughness: 1.0 });
const matPot       = new THREE.MeshStandardMaterial({ color: 0x6a3a1a, roughness: 0.8 });

const colliders = [];

function addCollider(minX, maxX, minZ, maxZ, minY, maxY) {
  colliders.push({ minX, maxX, minZ, maxZ, minY, maxY });
}
function box(w, h, d, mat, x, y, z, collide = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h/2, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  if (collide) addCollider(x - w/2, x + w/2, z - d/2, z + d/2, y, y + h);
  return m;
}
function cyl(rt, rb, h, mat, x, y, z, seg = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y + h/2, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}
function sphere(r, mat, x, y, z, seg = 16) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}
function torus(R, r, mat, x, y, z, seg = 24, ringSeg = 12) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(R, r, ringSeg, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}
function rbox(w, h, d, r, mat, x, y, z, collide = true) {
  const g = new THREE.Group();
  const mainW = w - 2*r, mainD = d - 2*r;
  const main = new THREE.Mesh(new THREE.BoxGeometry(mainW, h, d), mat);
  main.castShadow = true; main.receiveShadow = true;
  g.add(main);
  const main2 = new THREE.Mesh(new THREE.BoxGeometry(w, h, mainD), mat);
  main2.castShadow = true; main2.receiveShadow = true;
  g.add(main2);
  for (const cx of [-mainW/2, mainW/2]) for (const cz of [-mainD/2, mainD/2]) {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 8), mat);
    c.position.set(cx, 0, cz);
    c.castShadow = true; c.receiveShadow = true;
    g.add(c);
  }
  g.position.set(x, y + h/2, z);
  scene.add(g);
  if (collide) addCollider(x - w/2, x + w/2, z - d/2, z + d/2, y, y + h);
  return g;
}

/* ---- Локальная система координат ---- */
function localToWorld(cx, cz, lx, lz, facing) {
  switch (facing) {
    case 'z+': return { x: cx + lx, z: cz + lz };
    case 'z-': return { x: cx - lx, z: cz - lz };
    case 'x+': return { x: cx + lz, z: cz - lx };
    case 'x-': return { x: cx - lz, z: cz + lx };
    default:   return { x: cx + lx, z: cz + lz };
  }
}
function rotDims(lw, ld, facing) {
  const horiz = (facing === 'x+' || facing === 'x-');
  return { w: horiz ? ld : lw, d: horiz ? lw : ld };
}
function lbox(lw, lh, ld, lx, ly, lz, mat, cx, cz, facing, collide) {
  const p = localToWorld(cx, cz, lx, lz, facing);
  const rd = rotDims(lw, ld, facing);
  return box(rd.w, lh, rd.d, mat, p.x, ly, p.z, collide);
}
function lcyl(r, h, lx, ly, lz, mat, cx, cz, facing, seg) {
  const p = localToWorld(cx, cz, lx, lz, facing);
  return cyl(r, r, h, mat, p.x, ly, p.z, seg);
}
function lCollider(cx, cz, lw, ld, ly, lh, facing) {
  const rd = rotDims(lw, ld, facing);
  addCollider(cx - rd.w/2, cx + rd.w/2, cz - rd.d/2, cz + rd.d/2, ly, ly + lh);
}

/* ★ Единый угол разворота мебели в мире */
function facingAngle(facing) {
  return facing === 'z+' ? 0 : facing === 'z-' ? Math.PI :
         facing === 'x+' ? Math.PI/2 : -Math.PI/2;
}

/* ============================================================
   ИНТЕРАКТИВНАЯ СИСТЕМА
   ============================================================ */
const interactives = [];
const doorAnims = [];
const raycaster = new THREE.Raycaster();
const rayNDC = new THREE.Vector2(0, 0);

function registerInteractive(mesh, label, onAction) {
  mesh.userData.interactive = true;
  mesh.userData.label = label;
  mesh.userData.onAction = onAction;
  interactives.push(mesh);
}

let currentHovered = null;

function checkReach() {
  raycaster.setFromCamera(rayNDC, camera);
  raycaster.far = 3.5;
  const hits = raycaster.intersectObjects(interactives, true);
  let found = null;
  if (hits.length > 0) {
    let o = hits[0].object;
    while (o && !o.userData.interactive) o = o.parent;
    if (o && o.userData.interactive) found = o;
  }
  if (found !== currentHovered) {
    currentHovered = found;
    const ch = document.getElementById('crosshair');
    const hint = document.getElementById('interact-hint');
    if (found) {
      ch.classList.add('active');
      hint.textContent = found.userData.label || 'Взаимодействовать';
      hint.classList.add('show');
    } else {
      ch.classList.remove('active');
      hint.classList.remove('show');
    }
  }
}

function triggerInteraction() {
  if (currentHovered && currentHovered.userData.onAction) {
    currentHovered.userData.onAction(currentHovered);
  }
}

function buildSofa(cx, cz, w, d, fabricMat, seatMat, facing = 'z+') {
  const legH = 0.13, seatY = legH + 0.16;
  const armW = 0.24, armH = 0.58;
  const backH = 0.70, backT = 0.24;
  const innerW = w - armW * 2;

  for (const [lx, lz] of [[-w/2+0.12, -d/2+0.12], [w/2-0.12, -d/2+0.12],
                          [-w/2+0.12,  d/2-0.12], [w/2-0.12,  d/2-0.12]]) {
    const p = localToWorld(cx, cz, lx, 0, lz, facing);
    cyl(0.035, 0.045, 0.11, matWoodDeep, p.x, 0, p.z, 12);
    cyl(0.05, 0.05, 0.02, matWoodDeep, p.x, 0.11, p.z, 12);
  }
  lbox(w, 0.20, d, 0, legH, 0, fabricMat, cx, cz, facing, false);
  const seatDepth = d - backT - 0.05;
  const nSeats = Math.max(2, Math.round(innerW / 0.8));
  const seatW = innerW / nSeats;
  const seatZ = backT/2 + 0.03;
  for (let i = 0; i < nSeats; i++) {
    const sx = -innerW/2 + seatW * (i + 0.5);
    lbox(seatW - 0.04, 0.15, seatDepth - 0.04, sx, seatY, seatZ, seatMat, cx, cz, facing, false);
    lbox(seatW - 0.06, 0.03, seatDepth - 0.06, sx, seatY + 0.15, seatZ, seatMat, cx, cz, facing, false);
  }
  for (const side of [-1, 1]) {
    const ax = side * (w/2 - armW/2);
    lbox(armW, armH - legH, d, ax, legH, 0, fabricMat, cx, cz, facing, false);
    lbox(armW - 0.01, 0.06, d - 0.02, ax, legH + armH - legH, 0, fabricMat, cx, cz, facing, false);
    lbox(armW - 0.02, 0.04, d - 0.05, ax, legH + armH - legH + 0.06, 0, fabricMat, cx, cz, facing, false);
  }
  const backZ = -d/2 + backT/2;
  lbox(w, backH, backT, 0, legH + 0.20, backZ, fabricMat, cx, cz, facing, false);
  lbox(w - 0.02, 0.06, backT - 0.02, 0, legH + 0.20 + backH, backZ, fabricMat, cx, cz, facing, false);
  lbox(w - 0.04, 0.03, backT - 0.05, 0, legH + 0.20 + backH + 0.06, backZ, fabricMat, cx, cz, facing, false);
  const cushionZ = -d/2 + backT + 0.08;
  for (let i = 0; i < nSeats; i++) {
    const sx = -innerW/2 + seatW * (i + 0.5);
    lbox(seatW - 0.10, 0.44, 0.16, sx, seatY + 0.18, cushionZ, seatMat, cx, cz, facing, false);
  }
  lbox(0.42, 0.38, 0.16, -innerW/2 + 0.26, seatY + 0.18, cushionZ, matPillow, cx, cz, facing, false);
  lbox(0.42, 0.38, 0.16,  innerW/2 - 0.26, seatY + 0.18, cushionZ, matPillow, cx, cz, facing, false);
  lCollider(cx, cz, w, d, 0, armH + legH + 0.05, facing);
}
function buildArmchair(x, z, fabricMat, seatMat, facing = 'z+') {
  buildSofa(x, z, 0.95, 0.95, fabricMat, seatMat, facing);
}

/* ★ КОМОД — дверцы/ящики лицом к "facing" */
function buildDresser(cx, cz, w, h, d, drawers, mat = matWood, facing = 'z+') {
  const legH = 0.11;
  for (const [lx, lz] of [[-w/2+0.07, -d/2+0.07], [w/2-0.07, -d/2+0.07],
                          [-w/2+0.07,  d/2-0.07], [w/2-0.07,  d/2-0.07]]) {
    const p = localToWorld(cx, cz, lx, 0, lz, facing);
    cyl(0.025, 0.035, legH, matWoodDeep, p.x, 0, p.z, 10);
  }
  lbox(w, h - legH, d, 0, legH, 0, mat, cx, cz, facing, false);
  lbox(w + 0.05, 0.035, d + 0.05, 0, h, 0, matWoodOak, cx, cz, facing, false);
  lbox(w + 0.02, 0.015, d + 0.02, 0, h - 0.015, 0, matWoodDeep, cx, cz, facing, false);
  const innerH = h - legH - 0.05;
  const drawerH = innerH / drawers;
  const frontZ = d/2 + 0.008;

  // ★ ЕДИНЫЙ ПРАВИЛЬНЫЙ УГОЛ
  const angle = facingAngle(facing);

  for (let i = 0; i < drawers; i++) {
    const dy = legH + 0.02 + i * drawerH;
    const drawerGroup = new THREE.Group();
    const p = localToWorld(cx, cz, 0, 0, frontZ, facing);
    drawerGroup.position.set(p.x, dy, p.z);
    drawerGroup.rotation.y = angle;
    const facade = new THREE.Mesh(new THREE.BoxGeometry(w - 0.10, drawerH - 0.04, 0.025), matWoodOak);
    facade.position.set(0, drawerH/2 - 0.02, 0);
    facade.castShadow = true; facade.receiveShadow = true;
    drawerGroup.add(facade);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.018, 0.03), matHandle);
    handle.position.set(0, drawerH/2 - 0.02, 0.02);
    handle.castShadow = true;
    drawerGroup.add(handle);
    scene.add(drawerGroup);
    const closedZ = 0, openZ = 0.20;
    const st = { group: drawerGroup, axis: 'z', closed: closedZ, open: openZ, current: closedZ, target: closedZ, speed: 3.5, openState: false };
    doorAnims.push(st);
    facade.userData.slideAnim = st;
    registerInteractive(facade, 'Открыть ящик', (obj) => {
      const anim = obj.userData.slideAnim;
      anim.openState = !anim.openState;
      anim.target = anim.openState ? anim.open : anim.closed;
    });
  }
  lCollider(cx, cz, w, d, 0, h, facing);
}
function buildNightstand(x, z, mat = matWood, facing = 'z+') {
  buildDresser(x, z, 0.55, 0.58, 0.42, 2, mat, facing);
}

/* ★ ШКАФ — дверцы лицом к "facing", открываются НАРУЖУ */
function buildWardrobe(cx, cz, w, h, d, mat = matWood, facing = 'z+') {
  lbox(w - 0.05, 0.09, d - 0.05, 0, 0, 0, matWoodDeep, cx, cz, facing, false);
  lbox(w, h - 0.09, d, 0, 0.09, 0, mat, cx, cz, facing, false);
  lbox(w + 0.07, 0.07, d + 0.07, 0, h, 0, matWoodDeep, cx, cz, facing, false);
  lbox(w + 0.04, 0.02, d + 0.04, 0, h - 0.02, 0, matWoodOak, cx, cz, facing, false);

  const doorW = (w - 0.04) / 2;
  const doorH = h - 0.22;
  const doorT = 0.028;
  const frontZ = d/2 + doorT/2 + 0.003;

  // ★ ЕДИНЫЙ ПРАВИЛЬНЫЙ УГОЛ
  const angle = facingAngle(facing);

  for (const side of [-1, 1]) {
    const hingeX = side * (w/2 - 0.02);
    const p = localToWorld(cx, cz, hingeX, 0, frontZ, facing);
    const pivot = new THREE.Group();
    pivot.position.set(p.x, 0.11, p.z);
    pivot.rotation.y = angle;
    scene.add(pivot);
    const innerX = -side * (doorW/2);
    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(doorW - 0.005, doorH, doorT), matWoodOak);
    doorMesh.position.set(innerX, doorH/2, 0);
    doorMesh.castShadow = true; doorMesh.receiveShadow = true;
    pivot.add(doorMesh);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.16, 0.028), matHandle);
    handle.position.set(innerX + side * (doorW/2 - 0.06), doorH/2, 0.025);
    handle.castShadow = true;
    pivot.add(handle);
    const closedAngle = 0;
    // ★ ИСПРАВЛЕНО: положительный множитель — дверь открывается НАРУЖУ
    const openAngle = side * (Math.PI / 2.4);
    const st = { group: pivot, axis: 'rotY', closed: closedAngle, open: openAngle, current: closedAngle, target: closedAngle, speed: 3.5, openState: false };
    doorAnims.push(st);
    doorMesh.userData.doorAnim = st;
    handle.userData.doorAnim = st;
    registerInteractive(doorMesh, 'Открыть дверцу', (obj) => {
      const anim = obj.userData.doorAnim;
      anim.openState = !anim.openState;
      anim.target = anim.openState ? anim.open : anim.closed;
    });
    registerInteractive(handle, 'Открыть дверцу', (obj) => {
      const anim = obj.userData.doorAnim;
      anim.openState = !anim.openState;
      anim.target = anim.openState ? anim.open : anim.closed;
    });
  }

  lbox(w - 0.14, 0.025, d - 0.10, 0, 0.5, 0, matWoodOak, cx, cz, facing, false);
  lbox(w - 0.14, 0.025, d - 0.10, 0, 1.1, 0, matWoodOak, cx, cz, facing, false);
  lbox(w - 0.14, 0.025, d - 0.10, 0, 1.7, 0, matWoodOak, cx, cz, facing, false);

  lCollider(cx, cz, w, d, 0, h, facing);
}

function buildBed(cx, cz, mat = matWood, facing = 'z+') {
  const bedW = 1.55, bedL = 2.05;
  const frameH = 0.33, mattressH = 0.24;
  const headZ = -bedL/2 - 0.04;
  const footZ = bedL/2 + 0.05;

  lbox(bedW + 0.06, frameH, bedL + 0.06, 0, 0, 0, matWoodOak, cx, cz, facing, false);
  lbox(bedW, 0.08, bedL, 0, 0.05, 0, matWoodDeep, cx, cz, facing, false);
  lbox(bedW + 0.08, 1.05, 0.09, 0, 0, headZ, matWoodOak, cx, cz, facing, false);
  for (let i = 0; i < 7; i++) {

  lbox(w - 0.09, 0.035, 0.02, 0, legH - 0.07,  d/2 - 0.045, matWoodDeep, cx, cz, facing, false);
  lbox(0.02, 0.035, d - 0.09, -w/2 + 0.045, legH - 0.07, 0, matWoodDeep, cx, cz, facing, false);
  lbox(0.02, 0.035, d - 0.09,  w/2 - 0.045, legH - 0.07, 0, matWoodDeep, cx, cz, facing, false);

function buildBookshelf(cx, cz, w, h, d, facing, y0 = 0) {
  const shelfT = 0.028, sideT = 0.045;
  lbox(sideT, h, d, -w/2 + sideT/2, y0, 0, matWood, cx, cz, facing, false);
  lbox(sideT, h, d,  w/2 - sideT/2, y0, 0, matWood, cx, cz, facing, false);
  lbox(w, h, 0.018, 0, y0, -d/2 + 0.009, matWoodDeep, cx, cz, facing, false);
  lbox(w, 0.04, d, 0, y0, 0, matWoodOak, cx, cz, facing, false);
  lbox(w, 0.04, d, 0, y0 + h - 0.04, 0, matWoodOak, cx, cz, facing, false);
  lbox(w + 0.04, 0.03, d + 0.04, 0, y0 + h, 0, matWoodDeep, cx, cz, facing, false);
  const shelfCount = Math.max(2, Math.floor(h / 0.42));
  const shelfStep = (h - 0.08) / shelfCount;
  for (let s = 1; s < shelfCount; s++) {
    lbox(w - 0.10, shelfT, d - 0.05, 0, y0 + s * shelfStep, 0, matWoodOak, cx, cz, facing, false);
  }
  for (let s = 0; s < shelfCount; s++) {
    const sy = y0 + 0.04 + s * shelfStep + shelfT;
    const books = 4 + Math.floor(Math.random() * 5);
    let bx = -w/2 + 0.10;
    for (let b = 0; b < books; b++) {
      const bw = 0.03 + Math.random() * 0.03;
      const bh = 0.20 + Math.random() * 0.16;
      const bmat = matBookMats[Math.floor(Math.random() * matBookMats.length)];
      lbox(bw, bh, d - 0.12, bx + bw/2, sy, 0, bmat, cx, cz, facing, false);
      bx += bw + 0.005;
      if (bx > w/2 - 0.10) break;
    }
  }
  lCollider(cx, cz, w, d, y0, h, facing);
}

/* ★ ТВ-ТУМБА — дверцы открываются НАРУЖУ */
function buildTVStand(cx, cz, w, h, d, facing = 'z+') {
  const legH = 0.11;
  for (const [lx, lz] of [[-w/2+0.09, -d/2+0.07], [w/2-0.09, -d/2+0.07],
                          [-w/2+0.09,  d/2-0.07], [w/2-0.09,  d/2-0.07]]) {
    const p = localToWorld(cx, cz, lx, 0, lz, facing);
    cyl(0.026, 0.034, legH, matWoodDeep, p.x, 0, p.z, 10);
  }
  lbox(w, h - legH, d, 0, legH, 0, matWood, cx, cz, facing, false);
  lbox(w + 0.03, 0.035, d + 0.03, 0, h, 0, matWoodOak, cx, cz, facing, false);

  const doorW = (w - 0.08) / 2;
  const doorH = h - legH - 0.08;
  const doorT = 0.022;
  const frontZ = d/2 + doorT/2 + 0.003;
  const angle = facingAngle(facing);

  for (const side of [-1, 1]) {
    const hingeX = side * (w/2 - 0.02);
    const p = localToWorld(cx, cz, hingeX, 0, frontZ, facing);
    const pivot = new THREE.Group();
    pivot.position.set(p.x, legH + 0.02, p.z);
    pivot.rotation.y = angle;
    scene.add(pivot);
    const innerX = -side * (doorW/2);
    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(doorW - 0.005, doorH, doorT), matWoodOak);
    doorMesh.position.set(innerX, doorH/2, 0);
    doorMesh.castShadow = true; doorMesh.receiveShadow = true;
    pivot.add(doorMesh);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.14, 0.026), matHandle);
    handle.position.set(innerX + side * (doorW/2 - 0.05), doorH/2, 0.02);
    handle.castShadow = true;
    pivot.add(handle);
    const closedAngle = 0;
    const openAngle = side * (Math.PI / 2.4);
    const st = { group: pivot, axis: 'rotY', closed: closedAngle, open: openAngle, current: closedAngle, target: closedAngle, speed: 3.5, openState: false };
    doorAnims.push(st);
    doorMesh.userData.doorAnim = st;
    handle.userData.doorAnim = st;
    registerInteractive(doorMesh, 'Открыть дверцу', (obj) => {
      const anim = obj.userData.doorAnim;
      anim.openState = !anim.openState;
      anim.target = anim.openState ? anim.open : anim.closed;
    });
    registerInteractive(handle, 'Открыть дверцу', (obj) => {
      const anim = obj.userData.doorAnim;
      anim.openState = !anim.openState;
      anim.target = anim.openState ? anim.open : anim.closed;
    });
  }
  lCollider(cx, cz, w, d, 0, h, facing);
}

/* ★ КУХОННАЯ СЕКЦИЯ — дверцы открываются НАРУЖУ */
function buildBaseCabinet(cx, cz, len, depth, h, sections, facing) {
  const legH = 0.10;
  const W = len, D = depth;
  lbox(W - 0.04, legH, D - 0.04, 0, 0, 0, matWoodDeep, cx, cz, facing, false);
  lbox(W, h - legH, D, 0, legH, 0, matWood, cx, cz, facing, false);
  lbox(W + 0.05, 0.05, D + 0.05, 0, h, 0, matCountertop, cx, cz, facing, false);
  lbox(W + 0.02, 0.015, D + 0.02, 0, h - 0.015, 0, matDark, cx, cz, facing, false);

  const secW = W / sections;
  const doorH = h - legH - 0.06;
  const doorT = 0.022;
  const frontZ = D/2 + doorT/2 + 0.003;
  const angle = facingAngle(facing);

  for (let i = 0; i < sections; i++) {
    const sx = -W/2 + secW * (i + 0.5);
    const isDrawer = (i === 0);
    if (isDrawer) {
      for (let d = 0; d < 2; d++) {
        const dy = legH + 0.02 + d * (doorH / 2);
        const dh = doorH / 2 - 0.03;
        const p = localToWorld(cx, cz, sx, 0, frontZ, facing);
        const g = new THREE.Group();
        g.position.set(p.x, dy, p.z);
        g.rotation.y = angle;
        const facade = new THREE.Mesh(new THREE.BoxGeometry(secW - 0.05, dh - 0.02, doorT), matWoodOak);
        facade.position.set(0, dh/2, 0);
        facade.castShadow = true; facade.receiveShadow = true;
        g.add(facade);
        const handle = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.018, 0.026), matHandle);
        handle.position.set(0, dh/2, 0.018);
        handle.castShadow = true;
        g.add(handle);
        scene.add(g);
        const st = { group: g, axis: 'z', closed: 0, open: 0.22, current: 0, target: 0, speed: 3.5, openState: false };
        doorAnims.push(st);
        facade.userData.slideAnim = st;
        registerInteractive(facade, 'Открыть ящик', (obj) => {
          const anim = obj.userData.slideAnim;
          anim.openState = !anim.openState;
          anim.target = anim.openState ? anim.open : anim.closed;
        });
      }
    } else {
      const side = i === 1 ? -1 : 1;
      const hingeX = sx + side * (secW/2);
      const p = localToWorld(cx, cz, hingeX, 0, frontZ, facing);
      const pivot = new THREE.Group();
      pivot.position.set(p.x, legH + 0.02, p.z);
      pivot.rotation.y = angle;
      scene.add(pivot);
      const innerX = -side * (secW/2 - 0.01);
      const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(secW - 0.03, doorH, doorT), matWoodOak);
      doorMesh.position.set(innerX, doorH/2, 0);
      doorMesh.castShadow = true; doorMesh.receiveShadow = true;
      pivot.add(doorMesh);
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.12, 0.026), matHandle);
      handle.position.set(innerX + side * (secW/2 - 0.06), doorH/2, 0.02);
      handle.castShadow = true;
      pivot.add(handle);
      const closedAngle = 0;
      const openAngle = side * (Math.PI / 2.4);
      const st = { group: pivot, axis: 'rotY', closed: closedAngle, open: openAngle, current: closedAngle, target: closedAngle, speed: 3.5, openState: false };
      doorAnims.push(st);
      doorMesh.userData.doorAnim = st;
      handle.userData.doorAnim = st;
      registerInteractive(doorMesh, 'Открыть дверцу', (obj) => {
        const anim = obj.userData.doorAnim;
        anim.openState = !anim.openState;
        anim.target = anim.openState ? anim.open : anim.closed;
      });
      registerInteractive(handle, 'Открыть дверцу', (obj) => {
        const anim = obj.userData.doorAnim;
        anim.openState = !anim.openState;
        anim.target = anim.openState ? anim.open : anim.closed;
      });
    }
  }
  lCollider(cx, cz, W, D, 0, h + 0.05, facing);
}

/* ★ ХОЛОДИЛЬНИК — обе дверцы (петля слева) открываются НАРУЖУ */
function buildFridge(cx, cz, facing) {
  const w = 0.72, h = 1.85, d = 0.72;
  const freezH = 0.55;
  lbox(w, h, d, 0, 0, 0, matFridge, cx, cz, facing, false);

  const frontZ = d/2 + 0.012;
  const angle = facingAngle(facing);

  // Нижняя дверь
  {
    const hingeX = -w/2 + 0.02;
    const p = localToWorld(cx, cz, hingeX, 0, frontZ, facing);
    const pivot = new THREE.Group();
    pivot.position.set(p.x, 0.06, p.z);
    pivot.rotation.y = angle;
    scene.add(pivot);
    const doorH = h - freezH - 0.10;
    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(w - 0.02, doorH, 0.03), matFridge);

    doorAnims.push(st);
    doorMesh.userData.doorAnim = st;
    handle.userData.doorAnim = st;
    registerInteractive(doorMesh, 'Открыть холодильник', (obj) => {
      const anim = obj.userData.doorAnim;
      anim.openState = !anim.openState;
      anim.target = anim.openState ? anim.open : anim.closed;
    });
    registerInteractive(handle, 'Открыть холодильник', (obj) => {
      const anim = obj.userData.doorAnim;
      anim.openState = !anim.openState;
      anim.target = anim.openState ? anim.open : anim.closed;
    });
  }
  // Верхняя дверь (морозилка)
  {
    const hingeX = -w/2 + 0.02;
    const p = localToWorld(cx, cz, hingeX, 0, frontZ, facing);
    const pivot = new THREE.Group();
    pivot.position.set(p.x, h - freezH, p.z);
    pivot.rotation.y = angle;
    scene.add(pivot);
    const doorH = freezH - 0.04;
    const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(w - 0.02, doorH, 0.03), matFridge);
    doorMesh.position.set(w/2 - 0.01, doorH/2, 0);
    doorMesh.castShadow = true; doorMesh.receiveShadow = true;
    pivot.add(doorMesh);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.3, 0.035), matHandle);
    handle.position.set(w - 0.15, doorH/2, 0.03);
    handle.castShadow = true;
    pivot.add(handle);
    const st = { group: pivot, axis: 'rotY', closed: 0, open: -Math.PI/2.6, current: 0, target: 0, speed: 3.2, openState: false };
    doorAnims.push(st);
    doorMesh.userData.doorAnim = st;
    handle.userData.doorAnim = st;
    registerInteractive(doorMesh, 'Открыть морозилку', (obj) => {
      const anim = obj.userData.doorAnim;
      anim.openState = !anim.openState;
      anim.target = anim.openState ? anim.open : anim.closed;

      const anim = obj.userData.doorAnim;
      anim.openState = !anim.openState;
      anim.target = anim.openState ? anim.open : anim.closed;
    });
  }
  lCollider(cx, cz, w, d, 0, h, facing);
}

function buildStove(cx, cz, facing) {
  const w = 0.62, h = 0.90, d = 0.62;
  const frontZ = d/2 + 0.008;
  lbox(w, h - 0.06, d, 0, 0, 0, matStove, cx, cz, facing, false);
  lbox(w - 0.08, h - 0.32, 0.02, 0, 0.08, frontZ, matGlass, cx, cz, facing, false);
  lbox(w - 0.14, 0.03, 0.045, 0, h - 0.26, frontZ + 0.03, matChrome, cx, cz, facing, false);
  lbox(w, 0.10, 0.02, 0, h - 0.10, frontZ, matDark, cx, cz, facing, false);
  for (let i = 0; i < 4; i++) {
    const lx = -w/2 + 0.10 + i * (w - 0.20) / 3;
    const p = localToWorld(cx, cz, lx, 0, frontZ + 0.02, facing);
    const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.03, 12), matChrome);
    const horiz = (facing === 'x+' || facing === 'x-');
    if (horiz) knob.rotation.z = Math.PI / 2; else knob.rotation.x = Math.PI / 2;
    knob.position.set(p.x, h - 0.05, p.z);
    knob.castShadow = true;
    scene.add(knob);
  }
  lbox(w + 0.02, 0.02, d + 0.02, 0, h - 0.06, 0, matStove, cx, cz, facing, false);

function buildBathtub(cx, cy0, cz, w, d, facing = 'z+') {
  lbox(w, 0.58, d, 0, cy0, 0, matPorcelain, cx, cz, facing, false);

  const innerW = w - 0.14, innerD = d - 0.14;
  const edgeTopY = cy0 + 0.58;
  for (const [dx, dz, rot] of [
      [0, innerD/2, 0], [0, -innerD/2, 0], [innerW/2, 0, 1], [-innerW/2, 0, 1]]) {
    const p = localToWorld(cx, cz, dx, 0, dz, facing);
    const len = rot === 0 ? innerW : innerD;
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, len, 12), matPorcelain);
    bar.rotation.z = Math.PI/2;

  const sp = localToWorld(cx, cz, -w/2 + 0.18, 0, -d/2 + 0.08, facing);
  cyl(0.018, 0.018, 0.22, matChrome, sp.x, cy0 + 0.58, sp.z, 12);

  scene.add(drain);
  lCollider(cx, cz, w, d, cy0, 0.58, facing);
}

  const led = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.006, 8), matRemoteGreen);
  led.position.set(0, 0.012, 0.085);
  g.add(led);
  for (let i = 0; i < 3; i++) {
    const btn = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.006, 0.012), matRemoteBtn);
    btn.position.set(-0.02 + i * 0.02, 0.012, 0.02);
    g.add(btn);
  }
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const btn = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.005, 0.010), matRemoteBtn);
    btn.position.set(-0.022 + c * 0.022, 0.012, -0.02 - r * 0.022);
    g.add(btn);
  }
  scene.add(g);

  powerBtn.userData.onAction = (obj) => {
    if (tvViewMode) toggleTV();
    else enterTVView();
  };
  powerBtn.userData.interactive = true;
  powerBtn.userData.label = 'ПУЛЬТ: ВКЛ/ВЫКЛ';
  interactives.push(powerBtn);

  body.userData.onAction = (obj) => {
    if (tvViewMode) toggleTV();
    else enterTVView();
  };
  body.userData.interactive = true;
  body.userData.label = 'Взять пульт';
  interactives.push(body);

  tvRemoteMesh = g;
  return g;
}

function buildPlant(x, z, scale = 1, y0 = 0) {
  cyl(0.20 * scale, 0.15 * scale, 0.30 * scale, matPot, x, y0, z, 16);
  cyl(0.21 * scale, 0.21 * scale, 0.03 * scale, matPot, x, y0 + 0.30 * scale, z, 16);

  cyl(0.02 * scale, 0.02 * scale, 0.5 * scale, matPlant, x, y0 + 0.33 * scale, z, 8);
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const r = 0.14 * scale;
    const ly = y0 + (0.55 + Math.random() * 0.30) * scale;
    const lx = x + Math.cos(angle) * r;
    const lz = z + Math.sin(angle) * r;
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.13 * scale, 10, 8), matPlant);
    leaf.scale.set(1, 1.3, 1); leaf.position.set(lx, ly, lz); leaf.castShadow = true; scene.add(leaf);
  }
  const center = new THREE.Mesh(new THREE.SphereGeometry(0.15 * scale, 12, 10), matPlant);
  center.position.set(x, y0 + 0.75 * scale, z); center.castShadow = true; scene.add(center);
  addCollider(x - 0.20 * scale, x + 0.20 * scale, z - 0.20 * scale, z + 0.20 * scale, y0, y0 + 0.5 * scale);
}

function buildClock(cx, cy, cz, facing) {
  const radius = 0.18;
  const frontZ = 0.028;
  const pBody = localToWorld(cx, cz, 0, 0, 0, facing);
  const horiz = (facing === 'x+' || facing === 'x-');
  const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.06, 24), matDark);
  if (horiz) body.rotation.z = Math.PI / 2; else body.rotation.x = Math.PI / 2;
  body.position.set(pBody.x, cy, pBody.z); body.castShadow = true; scene.add(body);
  const face = new THREE.Mesh(new THREE.CircleGeometry(radius - 0.02, 24), matClockFace);
  const pFace = localToWorld(cx, cz, 0, 0, frontZ, facing);
  if (horiz) face.rotation.y = (facing === 'x+') ? Math.PI/2 : -Math.PI/2;
  face.position.set(pFace.x, cy, pFace.z); scene.add(face);
  const pHand = localToWorld(cx, cz, 0, 0, frontZ + 0.003, facing);
  const hh = new THREE.Mesh(new THREE.BoxGeometry(0.013, 0.09, 0.004), matDark);
  hh.position.set(pHand.x, cy + 0.035, pHand.z);
  if (horiz) hh.rotation.y = Math.PI/2;
  scene.add(hh);
  const mh = new THREE.Mesh(new THREE.BoxGeometry(0.009, 0.13, 0.004), matDark);
  mh.position.set(pHand.x, cy + 0.05, pHand.z);
  if (horiz) mh.rotation.y = Math.PI/2;
  scene.add(mh);
}

   ФИЗИКА
   ============================================================ */
function getGroundHeight(x, z, feetY) {
  let best = -Infinity;
  const limit = feetY + 0.62;
  for (let i = 0; i < floorRects.length; i++) {
    const r = floorRects[i];
    if (x >= r.minX && x <= r.maxX && z >= r.minZ && z <= r.maxZ) {
      if (r.y <= limit && r.y > best) best = r.y;
    }
  }
  if (x >= STAIR.x1 && x <= STAIR.x2 && z >= STAIR.z1 && z <= STAIR.z2) {
    const t = (z - STAIR.z1) / (STAIR.z2 - STAIR.z1);
    const y = Math.min(1, Math.max(0, t)) * STAIR.h;
    if (y <= limit && y > best) best = y;
  }
  return best === -Infinity ? 0 : best;
}
function resolveCollisions(pos, feetY) {
  const r = PLAYER_RADIUS;
  const pMinY = feetY + 0.22;
  const pMaxY = feetY + 1.72;
  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (pMaxY < c.minY || pMinY > c.maxY) continue;
    const cx = Math.max(c.minX, Math.min(pos.x, c.maxX));
    const cz = Math.max(c.minZ, Math.min(pos.z, c.maxZ));
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx*dx + dz*dz;
    if (d2 > r*r) continue;
    if (d2 > 1e-8) {
      const d = Math.sqrt(d2); const push = (r - d) / d;
      pos.x += dx * push; pos.z += dz * push;
    } else {
      const left = pos.x - c.minX, right = c.maxX - pos.x;
      const back = pos.z - c.minZ, front = c.maxZ - pos.z;
      const m = Math.min(left, right, back, front);
      if (m === left)       pos.x = c.minX - r;
      else if (m === right) pos.x = c.maxX + r;
      else if (m === back)  pos.z = c.minZ - r;
      else                  pos.z = c.maxZ + r;
    }
  }
}
function updatePlayer(dt) {
  const touchMag = Math.hypot(moveVec.x, moveVec.y);
  const sprint = keys['ShiftLeft'] || keys['ShiftRight'] || (isMobile && touchMag > 0.88);
  const speed = sprint ? 5.2 : 2.7;
  let fwd    = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0) - moveVec.y;
  let strafe = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0) + moveVec.x;
  let dx = 0, dz = 0;
  const mag = Math.hypot(fwd, strafe);
  if (mag > 0.001) {
    const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
    const nx = (-sy * fwd + cy * strafe) / mag;
    const nz = (-cy * fwd - sy * strafe) / mag;
    const speedMul = Math.min(1, mag);
    dx = nx * speedMul; dz = nz * speedMul;
  }
  const totalDist = speed * dt;
  const substeps = Math.max(1, Math.ceil(totalDist / 0.12));
  const stepDist = totalDist / substeps;
  for (let s = 0; s < substeps; s++) {
    player.pos.x += dx * stepDist;
    player.pos.z += dz * stepDist;
    resolveCollisions(player.pos, player.feetY);
  }
  player.vy -= GRAVITY * dt;
  player.feetY += player.vy * dt;
  const g = getGroundHeight(player.pos.x, player.pos.z, player.feetY);
  if (player.feetY <= g) { player.feetY = g; player.vy = 0; player.onGround = true; }
  else player.onGround = false;
  if (player.feetY < -5) {
    player.pos.set(2.0, 0, -5.0); player.feetY = 0; player.vy = 0;
  }
  const moving = (fwd !== 0 || strafe !== 0) && player.onGround;
  const targetBob = moving ? (sprint ? 1.5 : 1.0) : 0.0;
  player.bobAmount += (targetBob - player.bobAmount) * Math.min(1, dt * 8);
  if (moving) player.bobTime += dt * (sprint ? 13 : 9);
  const bobY = Math.sin(player.bobTime * 2) * 0.030 * player.bobAmount;
  const bobX = Math.cos(player.bobTime) * 0.018 * player.bobAmount;
  camera.position.set(
    player.pos.x + bobX * Math.cos(player.yaw),
    player.feetY + EYE_HEIGHT + bobY,
    player.pos.z - bobX * Math.sin(player.yaw)
  );
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
  camera.rotation.z = Math.cos(player.bobTime) * 0.006 * player.bobAmount;
}

function updateHUD() {
  const floor = player.feetY > F1 - 0.6 ? 2 : 1;
  hudEl.textContent = `ФОНАРИК: ${flashlightOn ? 'ВКЛ' : 'ВЫКЛ'}  |  ЭТАЖ: ${floor}`;
}

function updateDoors(dt) {
  for (let i = 0; i < doorAnims.length; i++) {
    const d = doorAnims[i];
    const diff = d.target - d.current;
    if (Math.abs(diff) < 0.001) { d.current = d.target; continue; }
    const step = Math.sign(diff) * Math.min(Math.abs(diff), d.speed * dt);
    d.current += step;
    if (d.axis === 'rotY') {
      d.group.rotation.y += step;
    } else if (d.axis === 'z') {
      const dx = Math.sin(d.group.rotation.y) * step;
      const dz = Math.cos(d.group.rotation.y) * step;
      d.group.position.x += dx;
      d.group.position.z += dz;
    }
  }
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;
let reachTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  let dt = clock.getDelta();
  if (dt > 0.05) dt = 0.05;
  elapsed += dt;

  updateDoors(dt);

  if (tvViewMode) {
    if (camTransition) {
      camTransition.t += dt / camTransition.dur;
      const t = Math.min(1, camTransition.t);
      const ease = t * t * (3 - 2 * t);
      let dy = camTransition.toYaw - camTransition.fromYaw;
      while (dy > Math.PI) dy -= Math.PI * 2;
      while (dy < -Math.PI) dy += Math.PI * 2;
      player.yaw = camTransition.fromYaw + dy * ease;
      player.pitch = camTransition.fromPitch + (camTransition.toPitch - camTransition.fromPitch) * ease;
      camera.position.lerpVectors(camTransition.fromPos, tvViewPos, ease);
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;
      if (t >= 1) camTransition = null;
    } else {
      camera.position.copy(tvViewPos);
      camera.rotation.y = 0;
      camera.rotation.x = -0.08;
      camera.lookAt(tvViewLook);
    }
  } else if (camTransition) {
    camTransition.t += dt / camTransition.dur;
    const t = Math.min(1, camTransition.t);
    const ease = t * t * (3 - 2 * t);
    let dy = camTransition.toYaw - camTransition.fromYaw;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    player.yaw = camTransition.fromYaw + dy * ease;
    player.pitch = camTransition.fromPitch + (camTransition.toPitch - camTransition.fromPitch) * ease;
    const targetPos = new THREE.Vector3(player.pos.x, player.feetY + EYE_HEIGHT, player.pos.z);
    camera.position.lerpVectors(camTransition.fromPos, targetPos, ease);
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
    if (t >= 1) camTransition = null;
  } else if (gameActive) {
    updatePlayer(dt);
  } else {
    camera.position.set(player.pos.x, player.feetY + EYE_HEIGHT, player.pos.z);
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
  }

  if (gameActive && !tvViewMode && !camTransition) {
    reachTimer += dt;
    if (reachTimer > 0.1) {
      reachTimer = 0;
      checkReach();
    }
  } else if (!currentHovered === null) {
    if (currentHovered === null && document.getElementById('crosshair').classList.contains('active')) {
      document.getElementById('crosshair').classList.remove('active');
      document.getElementById('interact-hint').classList.remove('show');
    }
  }

  // Мерцание лампочек
  for (let i = 0; i < flickerLights.length; i++) {
    const f = flickerLights[i];
    const t = elapsed * f.speed + f.phase;
    let n = 0.62 + 0.26*Math.sin(t*1.7) + 0.14*Math.sin(t*5.3 + 1.1) + 0.08*Math.sin(t*13.7);
    if (Math.sin(t*0.9 + f.phase) > 0.985) n *= 0.12;
    n = Math.max(0, n);
    f.light.intensity = f.base * n;
    if (f.bulb.material) f.bulb.material.color.setRGB(0.6 + 0.4*n, 0.5 + 0.4*n, 0.35 + 0.4*n);
  }

  if (flashlightOn) {
    const jitter = 0.012*Math.sin(elapsed*7.3) + 0.008*Math.sin(elapsed*17.1);
    flashlight.position.x = 0.18 + jitter;
    flashlight.position.y = -0.12 + jitter * 0.7;
    flFill.position.x = 0.25 + jitter;
  }

  const t = elapsed;
  if (flashlightOn) {
    ambient.intensity = 0.64;
    hemi.intensity    = 0.40;
    ambient.color.setHex(0x1a2234); hemi.color.setHex(0x1a2234);
    const hf = 0.92 + 0.05*Math.sin(t*3.1) + 0.03*Math.sin(t*9.7 + 1.4);
    playerHalo.intensity = 1.20 * hf;
    playerHalo.distance = 6.5;
    playerHalo.color.setHex(0x9aa4be);
  } else {
    let flick = 0.95 + 0.10*Math.sin(t*2.4) + 0.06*Math.sin(t*6.9 + 1.7) + 0.04*Math.sin(t*16.3 + 0.4);
    if (Math.sin(t*0.63 + 1.3) > 0.965) flick *= 0.62;
    flick = Math.max(0.55, flick);
    ambient.intensity = 1.44 * flick;
    hemi.intensity    = 1.04 * flick;
    ambient.color.setHex(0x243048); hemi.color.setHex(0x243048);
    const hf = 0.95 + 0.08*Math.sin(t*2.1) + 0.05*Math.sin(t*5.7 + 0.9);
    playerHalo.intensity = 1.76 * hf;
    playerHalo.distance = 7.0;
    playerHalo.color.setHex(0xa898b0);
    if (Math.sin(t*0.55 + 2.1) > 0.965) playerHalo.intensity *= 0.55;
  }

  updateHUD();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

if (isMobile) {
  document.getElementById('overlay-help').innerHTML = `
    <span class="key">ЛЕВАЯ ПОЛОВИНА</span> — стик движения<br>
    <span class="key">ПРАВАЯ ПОЛОВИНА</span> — осмотреться<br>
    <span class="key">КНОПКА «ДЕЙСТВИЕ»</span> — открыть / взаимодействовать<br>
    <span class="key">КНОПКА ↖</span> — фонарик
  `;
  document.getElementById('overlay-hint').textContent = 'КОСНИТЕСЬ ЭКРАНА, ЧТОБЫ ВОЙТИ';
}

setFlashlight(true);
updateHUD();
animate();
</script>
