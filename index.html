<script>
// ===== Константы и данные =====
const $=i=>document.getElementById(i),rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const touch='ontouchstart' in window||navigator.maxTouchPoints>0;
const S={diff:1,sound:true,low:touch,train:false};
const DIFF=[{n:'Лёгкая',t:1.3,ag:.3,bl:.1},{n:'Средняя',t:.9,ag:.5,bl:.3},{n:'Высокая',t:.55,ag:.7,bl:.55}];
// w=подготовка, a=активная фаза, r=восстановление (сек); c=расход выносливости; rng=дальность
const ATK={jab:{w:.08,a:.08,r:.12,dmg:4,c:5,rng:1.05},cross:{w:.14,a:.09,r:.24,dmg:8,c:9,rng:1.1},hook:{w:.18,a:.09,r:.3,dmg:11,c:12,rng:1},upper:{w:.2,a:.09,r:.32,dmg:12,c:13,rng:.9},kick:{w:.22,a:.1,r:.38,dmg:10,c:14,rng:1.35}};
const KEYA={KeyJ:'jab',KeyK:'cross',KeyL:'kick',KeyU:'hook',KeyI:'upper'};
const CFG=[{name:'ATLAS REED',skin:'#8b5a3c',shorts:'#b51f2a',glove:'#171717',sc:1,w:1.08,spd:.95,pow:1.1},
           {name:'MIRA VALE',skin:'#c58b68',shorts:'#1d4f91',glove:'#111111',sc:.96,w:.9,spd:1.1,pow:.95}];
const show=(id,v)=>$(id).classList.toggle('h',!v);

// ===== Аудио (Web Audio, без файлов) =====
const AU={c:null,
 init(){try{this.c=this.c||new(window.AudioContext||window.webkitAudioContext)();if(this.c.resume)this.c.resume()}catch(e){this.c=null}},
 tone(f,d,ty,v,to){if(!this.c||!S.sound)return;try{const c=this.c,o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d)}catch(e){}},
 noise(d,v){if(!this.c||!S.sound)return;try{const c=this.c,b=c.createBuffer(1,Math.floor(c.sampleRate*d),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(c.destination);s.start()}catch(e){}},
 hit(){this.noise(.12,.4);this.tone(130,.15,'sine',.4,50)},block(){this.tone(320,.08,'square',.1,150);this.noise(.05,.2)},whoosh(){this.noise(.1,.1)},
 bell(){this.tone(880,.9,'triangle',.25);this.tone(1320,.6,'triangle',.1)},crowd(){this.noise(1,.15)}};

// ===== Загрузка Babylon.js (CDN с запасными адресами) =====
const URLS=['https://cdn.jsdelivr.net/npm/babylonjs@6.49.0/babylon.js','https://cdn.babylonjs.com/babylon.js'];
(function L(i){if(window.BABYLON)return go();if(i>=URLS.length)return show('err',1);const s=document.createElement('script');s.src=URLS[i];s.onload=()=>window.BABYLON?go():L(i+1);s.onerror=()=>L(i+1);document.head.appendChild(s)})(0);

function go(){try{
const cv=$('c'),eng=new BABYLON.Engine(cv,true,{adaptToDeviceRatio:true}),sc=new BABYLON.Scene(eng),V=BABYLON.Vector3,col=h=>BABYLON.Color3.FromHexString(h);
sc.clearColor=new BABYLON.Color4(.02,.02,.03,1);sc.fogMode=BABYLON.Scene.FOGMODE_EXP2;sc.fogDensity=.012;sc.fogColor=new BABYLON.Color3(.02,.02,.03);
const cam=new BABYLON.FreeCamera('cam',new V(0,3,-8),sc);cam.fov=.85;cam.minZ=.1;cam.maxZ=80;
const hl=new BABYLON.HemisphericLight('h',new V(0,1,0),sc);hl.intensity=.6;hl.groundColor=new BABYLON.Color3(.15,.15,.2);
const sp=new BABYLON.SpotLight('s',new V(0,9,0),new V(0,-1,0),1.4,2,sc);sp.intensity=2.2;
const sg=new BABYLON.ShadowGenerator(1024,sp);sg.useBlurExponentialShadowMap=true;sg.blurKernel=12;
const pbr=(h,r,m)=>{const x=new BABYLON.PBRMaterial('m',sc);x.albedoColor=col(h);x.roughness=r;x.metallic=m||0;return x};
const emi=h=>{const x=new BABYLON.StandardMaterial('e',sc);x.emissiveColor=col(h);x.disableLighting=true;return x};
const nd=(p,x,y,z)=>{const n=new BABYLON.TransformNode('n',sc);n.parent=p;n.position.set(x,y,z);return n};
const mk=(t,o,m,p,pos,s)=>{const x=BABYLON.MeshBuilder['Create'+t]('m',o,sc);x.material=m;x.parent=p;if(pos)x.position.set(pos[0],pos[1],pos[2]);if(s)x.scaling.set(s[0],s[1],s[2]);sg.addShadowCaster(x);return x};

// ===== Арена: октагон, сетка, стойки, зрители =====
const A=4.6,R=A/Math.cos(Math.PI/8);
{const P=[0,0,0],N=[0,1,0],I=[];for(let k=0;k<8;k++){const a=k*Math.PI/4+Math.PI/8;P.push(Math.cos(a)*R,0,Math.sin(a)*R);N.push(0,1,0);I.push(0,1+k,1+(k+1)%8)}
 const f=new BABYLON.Mesh('floor',sc),vd=new BABYLON.VertexData();vd.positions=P;vd.normals=N;vd.indices=I;vd.applyToMesh(f);
 const fm=pbr('#1b1d24',.7);fm.backFaceCulling=false;f.material=fm;f.receiveShadows=true;
 const rg=BABYLON.MeshBuilder.CreateTorus('r',{diameter:5.6,thickness:.08,tessellation:48},sc);rg.position.y=.03;rg.material=emi('#c8202c');
 const gr=BABYLON.MeshBuilder.CreateDisc('g',{radius:40,tessellation:32},sc);gr.rotation.x=Math.PI/2;gr.position.y=-.02;gr.material=pbr('#0d0d12',.9);
 const ft=new BABYLON.DynamicTexture('ft',{width:256,height:128},sc,true),fc=ft.getContext();fc.strokeStyle='rgba(210,210,220,.6)';fc.lineWidth=2;
 for(let i=-8;i<24;i++){fc.beginPath();fc.moveTo(i*16,0);fc.lineTo(i*16+128,128);fc.moveTo(i*16+128,0);fc.lineTo(i*16,128);fc.stroke()}
 ft.update();ft.hasAlpha=true;
 const fn=new BABYLON.StandardMaterial('fn',sc);fn.diffuseTexture=ft;fn.useAlphaFromDiffuseTexture=true;fn.backFaceCulling=false;fn.emissiveColor=col('#666');
 const post=pbr('#8a8a90',.4,.8),pad=pbr('#b51f2a',.9);
 for(let k=0;k<8;k++){const th=k*Math.PI/4,pl=BABYLON.MeshBuilder.CreatePlane('f',{width:A*.8284,height:1.9},sc);pl.position.set(Math.cos(th)*A,1.35,Math.sin(th)*A);pl.rotation.y=-th-Math.PI/2;pl.material=fn;
  const a2=th+Math.PI/8,x=Math.cos(a2)*R,z=Math.sin(a2)*R,po=BABYLON.MeshBuilder.CreateCylinder('p',{height:2.4,diameter:.2},sc);po.position.set(x,1.2,z);po.material=post;
  const pd=BABYLON.MeshBuilder.CreateCylinder('pd',{height:1,diameter:.34},sc);pd.position.set(x,.5,z);pd.material=pad}
 const cm=['#5a2a2a','#2a3a5a','#4a4a4a','#6a5a2a'].map(h=>pbr(h,.9)),cb=cm.map(m=>{const b=BABYLON.MeshBuilder.CreateBox('b',{width:.5,height:.7,depth:.35},sc);b.material=m;b.position.y=-50;return b});
 for(let r=0;r<(S.low?2:4);r++){const n=28+r*6;for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=8+r*1.5,x=cb[(i+r)%4].createInstance('c');x.position.set(Math.cos(a)*rr,.9+r*.7,Math.sin(a)*rr);x.rotation.y=-a-Math.PI/2;x.scaling.y=rnd(.9,1.25)}}
 const st=BABYLON.MeshBuilder.CreateCylinder('st',{diameterTop:34,diameterBottom:20,height:5,tessellation:32,sideOrientation:BABYLON.Mesh.BACKSIDE},sc);st.position.y=2.5;st.material=pbr('#111118',1);
 const tr=BABYLON.MeshBuilder.CreateTorus('tl',{diameter:7,thickness:.2,tessellation:32},sc);tr.position.y=9;tr.material=emi('#ffffff')}

// ===== Процедурная модель бойца (иерархия суставов) =====
function build(g){
 const sk=pbr(g.skin,.55),sh=pbr(g.shorts,.9),gl=pbr(g.glove,.45,.1),dk=pbr('#15100e',.8),W=g.w;
 const root=nd(null,0,0,0),body=nd(root,0,0,0),pel=nd(body,0,.92,0),tor=nd(pel,0,.05,0),hd=nd(tor,0,.78,0),j={tor,hd,sh:[],el:[],hp:[],kn:[]};
 root.scaling.setAll(g.sc);
 mk('Capsule',{height:.64,radius:.16,tessellation:16},sk,tor,[0,.32,0],[1.25*W,1,.78]);
 mk('Capsule',{height:.4,radius:.14,tessellation:14},sk,tor,[0,.05,0],[1.1,1,.8]);
 mk('Sphere',{diameter:.34},sh,pel,[0,-.04,0],[1.05,.85,.8]);
 mk('Cylinder',{height:.3,diameterTop:.33,diameterBottom:.4,tessellation:16},sh,pel,[0,-.14,0],[W,1,.78]);
 mk('Capsule',{height:.2,radius:.055,tessellation:10},sk,tor,[0,.68,0]);
 mk('Sphere',{diameter:.23,segments:16},sk,hd,[0,.1,0],[1,1.18,1.05]);
 mk('Sphere',{diameter:.17,segments:12},sk,hd,[0,-.01,.015],[1,.7,.95]);
 mk('Sphere',{diameter:.24,segments:12},dk,hd,[0,.14,-.015],[1,.65,1.05]);
 mk('Sphere',{diameter:.045,segments:8},sk,hd,[0,.08,.12]);
 [-1,1].forEach((s,i)=>{
  mk('Sphere',{diameter:.04,segments:6},dk,hd,[s*.04,.13,.105]);
  mk('Sphere',{diameter:.05,segments:8},sk,hd,[s*.118,.1,0],[.4,1,.8]);
  const sd=nd(tor,s*.24*W,.52,0),el=nd(sd,0,-.3,0),hip=nd(pel,s*.1,-.02,0),kn=nd(hip,0,-.46,0);
  mk('Sphere',{diameter:.15*W,segments:10},sk,sd);
  mk('Capsule',{height:.34,radius:.055,tessellation:10},sk,sd,[0,-.15,0],[1.1,1,1.1]);
  mk('Capsule',{height:.3,radius:.045,tessellation:10},sk,el,[0,-.13,0]);
  mk('Sphere',{diameter:.17,segments:10},gl,el,[0,-.32,0],[1,1.1,1.15]);
  mk('Capsule',{height:.5,radius:.085,tessellation:12},sk,hip,[0,-.22,0]);
  mk('Capsule',{height:.3,radius:.1,tessellation:12},sh,hip,[0,-.12,0]);
  mk('Capsule',{height:.46,radius:.06,tessellation:10},sk,kn,[0,-.2,0]);
  mk('Sphere',{diameter:.12,segments:8},sk,kn,[0,-.44,.06],[.85,.6,2]);
  j.sh[i]=sd;j.el[i]=el;j.hp[i]=hip;j.kn[i]=kn});
 return{root,body,j}}

// ===== Боец: состояния, боевая система, процедурная анимация =====
const G={mode:'menu',prev:'fight',round:1,time:60,lock:0,brk:0,endT:0,mt:0,t:0};
const msg=(t,s)=>{$('msg').textContent=t;G.mt=s||1.5};
class F{
 constructor(g){this.cfg=g;this.b=build(g);this.c={};this.in={f:0,s:0,run:0,blk:0,atk:null};this.walk=0;this.sp=0;this.blk=false;this.d=2;this.ph=0;this.at=0;this.reset(0)}
 place(x){const r=this.b.root;r.position.set(x,0,0);r.rotation.y=x<0?Math.PI/2:-Math.PI/2;this.state='free';this.atk=null;this.tmr=0;this.fall=0;this.kx=0;this.kz=0}
 reset(x){this.hp=100;this.st=100;this.place(x)}
 start(n){const a=ATK[n];if(this.st<a.c*.4)return;this.st-=a.c;this.state='atk';this.atk={...a,n};this.ph=0;this.at=a.w*(this.st<20?1.3:1)}
 hit(o){const a=this.atk,reach=a.rng*this.cfg.sc+.4;
  if(this.d>reach||o.state==='down'||o.state==='getup'||o.state==='ko'||o.state==='win'||Math.random()<.1){AU.whoosh();return}
  let dmg=a.dmg*this.cfg.pow*(this.st<20?.7:1)*rnd(.85,1.15);
  if(o.state==='free'&&o.blk){dmg*=.15;o.hp-=dmg;o.st-=dmg*1.5+4;o.kx+=this.ax*1.5;o.kz+=this.az*1.5;AU.block()}
  else{if(o.state==='atk'&&o.ph===0)dmg*=1.3;o.hp-=dmg;AU.hit();o.state='hit';o.tmr=.22+dmg*.02;o.atk=null;o.kx+=this.ax*dmg*.35;o.kz+=this.az*dmg*.35;
   if(o.hp<=0){o.hp=0;o.state='ko'}
   else if(dmg>=9&&Math.random()<.15+(1-o.hp/100)*.45){o.state='down';o.tmr=2.6;msg('НОКДАУН!',1.2);AU.crowd()}}
  o.st=Math.max(0,o.st)}
 upd(dt,o){
  const p=this.b.root.position,q=o.b.root.position;let dx=q.x-p.x,dz=q.z-p.z;const d=Math.hypot(dx,dz)||.001;dx/=d;dz/=d;this.d=d;this.ax=dx;this.az=dz;
  const s=this.state,r=this.b.root;
  if(s==='free'||s==='atk'||s==='hit'){let da=Math.atan2(dx,dz)-r.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));r.rotation.y+=da*Math.min(1,dt*12)}
  this.tmr-=dt;let mx=0,mz=0,spd=0,sl=this.st<20?.75:1;
  if(s==='free'){
   this.blk=!!this.in.blk&&this.st>0;
   const f=this.in.f,sd=this.in.s;spd=(this.in.run?3.3:2.1)*this.cfg.spd*sl*(this.blk?.4:1);
   mx=dx*f-dz*sd;mz=dz*f+dx*sd;const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l}
   if(this.in.run&&l>.1)this.st-=6*dt;
   this.st+=(this.blk?-2:l>.1?6:11)*dt;
   if(this.in.atk&&!this.blk)this.start(this.in.atk);this.in.atk=null;if(l<.1)spd=0}
  else if(s==='atk'){
   this.at-=dt;
   if(this.ph===0&&this.at<=0){this.ph=1;this.at=this.atk.a;this.hit(o)}
   else if(this.ph===1&&this.at<=0){this.ph=2;this.at=this.atk.r*(this.st<20?1.4:1)}
   else if(this.ph===2&&this.at<=0){this.state='free';this.atk=null}
   if(this.ph<2){spd=.8;mx=dx;mz=dz}this.st+=4*dt}
  else{this.st+=4*dt;
   if(s==='hit'&&this.tmr<=0)this.state='free';
   else if(s==='down'&&this.tmr<=0&&this.hp>0){this.state='getup';this.tmr=.9}
   else if(s==='getup'&&this.tmr<=0){this.state='free';this.st=Math.max(this.st,30)}}
  this.sp=spd;if(spd>0){p.x+=mx*spd*dt;p.z+=mz*spd*dt;this.walk+=spd*dt*4}
  p.x+=this.kx*dt;p.z+=this.kz*dt;const dk=Math.pow(.003,dt);this.kx*=dk;this.kz*=dk;
  this.st=cl(this.st,0,100);
  const ft=(this.state==='down'||this.state==='ko')?1:0;this.fall+=(ft-this.fall)*Math.min(1,dt*(ft?9:2.5))}
 tg(){const s=this.state,a=this.atk,w=this.ph===0,t=G.t;
  const T={tX:Math.sin(t*2+this.cfg.sc*5)*.02+.05,tY:0,hX:.05,ls:-.9,la:.12,le:-1.6,rs:-.9,ra:.12,re:-1.7,hl:-.25,kl:.3,hr:.25,kr:.35};
  if(s==='free'&&this.blk){T.ls=T.rs=-1.25;T.le=T.re=-2.2;T.hX=.3;T.tX=.25}
  if(s==='free'&&this.sp>0){const m=Math.sin(this.walk);T.hl=-.25+m*.5;T.hr=.25-m*.5;T.kl=.3+Math.max(0,-m)*.5;T.kr=.35+Math.max(0,m)*.5}
  if(s==='atk'&&this.ph<2)switch(a.n){
   case'jab':T.ls=w?-.9:-1.5;T.le=w?-1.9:-.12;T.tY=w?-.05:.25;break;
   case'cross':T.rs=w?-.8:-1.5;T.re=w?-2.1:-.12;T.tY=w?.3:-.55;break;
   case'hook':T.la=1.45;T.ls=-.15;T.le=w?.7:-1.55;T.tY=w?-.3:.7;break;
   case'upper':T.rs=w?-.2:-.9;T.re=w?-1.2:-1.9;T.tX=w?.25:-.1;T.hl=-.4;T.kl=.6;break;
   case'kick':T.hr=w?.2:-1.5;T.kr=w?1.2:.15;T.tX=w?.1:-.25;break}
  if(s==='hit'){T.tX=-.35;T.hX=-.4;T.ls=T.rs=-.5;T.le=T.re=-1}
  if(s==='down'||s==='ko'||s==='getup'){T.ls=T.rs=-.3;T.le=T.re=-.3;T.la=T.ra=.7;T.hl=T.hr=-.1;T.kl=T.kr=.1;T.tX=0}
  if(s==='win'){T.ls=T.rs=-2.9;T.le=T.re=-.15;T.la=T.ra=.35}
  return T}
 ap(dt){const T=this.tg(),c=this.c,k=Math.min(1,dt*(this.state==='atk'?30:14)),j=this.b.j;
  for(const n in T){if(c[n]===undefined)c[n]=T[n];c[n]+=(T[n]-c[n])*k}
  j.tor.rotation.set(c.tX,c.tY,0);j.hd.rotation.x=c.hX;
  j.sh[0].rotation.set(c.ls,0,-c.la);j.sh[1].rotation.set(c.rs,0,c.ra);j.el[0].rotation.x=c.le;j.el[1].rotation.x=c.re;
  j.hp[0].rotation.x=c.hl;j.hp[1].rotation.x=c.hr;j.kn[0].rotation.x=c.kl;j.kn[1].rotation.x=c.kr;
  this.b.body.rotation.x=-this.fall*1.5;this.b.body.position.y=this.fall*.14}}

// ===== ИИ соперника =====
const AI={t:0,q:[],bk:0,cs:1,
 upd(f,o,dt){const D=DIFF[S.diff],i=f.in,d=f.d;i.f=0;i.s=0;i.blk=0;i.run=0;
  if(S.train||f.state!=='free')return;
  this.t-=dt;this.bk-=dt;const r=Math.hypot(f.b.root.position.x,f.b.root.position.z);
  if(this.bk>0){i.blk=1;return}
  if(o.state==='atk'&&o.ph<2&&d<1.6&&Math.random()<D.bl*dt*6){this.bk=rnd(.3,.7);return}
  if(r>3.5){i.s=this.cs;i.f=-.3}
  if(f.st<25){i.f=-1;return}
  if(this.q.length&&d<1.5){i.atk=this.q.shift();return}
  if(this.t>0){if(d>1.4)i.f=1;else if(d<.9)i.f=-.6;return}
  this.t=rnd(.6,1.4)*D.t;this.cs=Math.random()<.5?1:-1;
  if(d>1.3){i.f=1;return}
  if(Math.random()<D.ag+(o.hp<25?.2:0)){const N=['jab','cross','hook','upper','kick'],n=1+(Math.random()<D.ag?1:0)+(Math.random()<D.ag*.5?1:0);this.q=[];for(let k=0;k<n;k++)this.q.push(N[Math.random()*5|0]);i.atk=this.q.shift()}
  else if(Math.random()<.5)this.bk=rnd(.3,.8);else i.f=-1}};

// ===== Ввод: клавиатура и сенсор =====
const P=new F(CFG[0]),E=new F(CFG[1]);
const K={};let jx=0,jy=0,tb=0,jid=null;
addEventListener('keydown',e=>{K[e.code]=1;AU.init();if(e.code==='Escape')pause();if(e.code==='Space')e.preventDefault();if(KEYA[e.code]&&G.mode==='fight')P.in.atk=KEYA[e.code]},{passive:false});
addEventListener('keyup',e=>{K[e.code]=0});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
const js=$('js'),kn=$('kn');
const jm=e=>{const r=js.getBoundingClientRect(),dx=e.clientX-(r.left+65),dy=e.clientY-(r.top+65),l=Math.hypot(dx,dy)||1,m=Math.min(l,45);kn.style.transform='translate('+dx/l*m+'px,'+dy/l*m+'px)';jx=dx/l*m/45;jy=-dy/l*m/45};
js.addEventListener('pointerdown',e=>{jid=e.pointerId;js.setPointerCapture(jid);jm(e)});
js.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const jr=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;kn.style.transform=''}};js.addEventListener('pointerup',jr);js.addEventListener('pointercancel',jr);
document.querySelectorAll('.tb[data-a]').forEach(b=>{const a=b.dataset.a;
 b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);AU.init();if(a==='blk')tb=1;else P.in.atk=a});
 const u=()=>{if(a==='blk')tb=0};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u)});
$('bp').addEventListener('pointerdown',()=>pause());
const pin=()=>{const i=P.in;i.f=cl((K.KeyD?1:0)-(K.KeyA?1:0)+jx,-1,1);i.s=cl((K.KeyW?1:0)-(K.KeyS?1:0)+jy,-1,1);i.run=K.ShiftLeft||K.ShiftRight?1:0;i.blk=K.Space||tb?1:0};
const zero=f=>{f.in.f=f.in.s=f.in.run=f.in.blk=0;f.in.atk=null};

// ===== Состояния игры =====
function setMode(m){G.mode=m;show('menu',m==='menu');show('set',m==='set');show('pause',m==='pause');show('res',m==='result');
 show('hud',m==='fight'||m==='break'||m==='pause'||m==='result');document.body.classList.toggle('t',touch&&(m==='fight'||m==='break'))}
function pause(){if(G.mode==='fight'||G.mode==='break'){G.prev=G.mode;setMode('pause')}else if(G.mode==='pause')setMode(G.prev)}
function begin(tr){S.train=tr;P.reset(-1.3);E.reset(1.3);AI.q=[];G.round=1;G.time=60;G.lock=1.6;G.endT=0;setMode('fight');msg(tr?'ТРЕНИРОВКА':'РАУНД 1',1.4);AU.bell();
 try{if(touch&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
function menu(){P.reset(-1.3);E.reset(1.3);setMode('menu')}
function finish(w,how){setMode('result');if(w&&w.state!=='ko')w.state='win';
 $('rt').textContent=w?(w===P?'ПОБЕДА':'ПОРАЖЕНИЕ'):'НИЧЬЯ';$('rs').textContent=how+(w?' — '+w.cfg.name:'');AU.crowd();AU.bell()}
function newRound(){P.place(-1.3);E.place(1.3);P.hp=Math.min(100,P.hp+15);E.hp=Math.min(100,E.hp+15);P.st=E.st=100;AI.q=[];G.time=60;G.lock=1.2;G.endT=0;setMode('fight');msg('РАУНД '+G.round,1.4);AU.bell()}
const lab=()=>{$('sd').textContent='СЛОЖНОСТЬ: '+DIFF[S.diff].n;$('ss').textContent='ЗВУК: '+(S.sound?'ВКЛ':'ВЫКЛ');$('sq').textContent='ГРАФИКА: '+(S.low?'НИЗКАЯ':'ВЫСОКАЯ')};
const applyQ=()=>{eng.setHardwareScalingLevel(S.low?1.5:1);sp.shadowEnabled=!S.low;lab()};
$('bq').onclick=()=>{AU.init();begin(false)};$('bt').onclick=()=>{AU.init();begin(true)};$('bs').onclick=()=>{AU.init();setMode('set')};$('sb').onclick=()=>setMode('menu');
$('sd').onclick=()=>{S.diff=(S.diff+1)%3;lab()};$('ss').onclick=()=>{S.sound=!S.sound;lab()};$('sq').onclick=()=>{S.low=!S.low;applyQ()};
$('pr').onclick=pause;$('pm').onclick=menu;$('rr').onclick=()=>begin(S.train);$('rm').onclick=menu;
$('n1').textContent=CFG[0].name;$('n2').textContent=CFG[1].name;
$('hint').textContent=touch?'Джойстик — движение. Кнопки справа — удары и блок.':'WASD — движение (D — к сопернику) · J джеб · K кросс · L нога · U хук · I апперкот · Пробел — блок · Shift — бег · Esc — пауза';
applyQ();setMode('menu');

// ===== Камера и игровой цикл =====
let tg=new V(0,1.2,0);const cd={x:0,z:-1};
function camUpd(dt){const a=P.b.root.position,b=E.b.root.position,dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz)||1,k=Math.min(1,dt*2);
 cd.x+=(dz/d-cd.x)*k;cd.z+=(-dx/d-cd.z)*k;const l=Math.hypot(cd.x,cd.z)||1,dist=cl(3.4+d*.85,4.3,7.5),cx=(a.x+b.x)/2,cz=(a.z+b.z)/2;
 cam.position=V.Lerp(cam.position,new V(cx+cd.x/l*dist,1.7+d*.1,cz+cd.z/l*dist),Math.min(1,dt*3));tg=V.Lerp(tg,new V(cx,1.15,cz),Math.min(1,dt*4));cam.setTarget(tg)}
function sep(){const a=P.b.root.position,b=E.b.root.position,dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz)||.01;
 if(d<.75){const k=(.75-d)/2/d;a.x-=dx*k;a.z-=dz*k;b.x+=dx*k;b.z+=dz*k}
 for(const p of[a,b]){const r=Math.hypot(p.x,p.z);if(r>4){p.x*=4/r;p.z*=4/r}}}
function tick(dt){const m=G.mode;if(m==='pause')return;G.t+=dt;
 if(G.mt>0){G.mt-=dt;if(G.mt<=0)$('msg').textContent=''}
 if(m==='fight'&&G.lock<=0){pin();AI.upd(E,P,dt)}else{zero(P);zero(E);if(G.lock>0)G.lock-=dt}
 P.upd(dt,E);E.upd(dt,P);sep();P.ap(dt);E.ap(dt);
 if(m==='menu'||m==='set'){const a=G.t*.25;cam.position=V.Lerp(cam.position,new V(Math.sin(a)*7.5,2.6,Math.cos(a)*7.5),Math.min(1,dt*2));tg=V.Lerp(tg,new V(0,1.1,0),Math.min(1,dt*3));cam.setTarget(tg)}else camUpd(dt);
 if(m==='fight'&&G.lock<=0){
  if(!S.train){G.time-=dt;
   if(P.state==='ko'||E.state==='ko'){G.endT+=dt;if(G.endT>1.8)finish(P.state==='ko'?E:P,'НОКАУТ')}
   else if(G.time<=0){if(G.round<3){setMode('break');G.brk=4;msg('КОНЕЦ РАУНДА '+G.round,3.5);AU.bell()}else{const df=P.hp-E.hp;finish(df>0?P:df<0?E:null,'РЕШЕНИЕ СУДЕЙ')}}}
  else if(E.state==='ko'){G.endT+=dt;if(G.endT>1.5){E.reset(1.3);G.endT=0}}}
 if(m==='break'){G.brk-=dt;if(G.brk<=0){G.round++;newRound()}}
 $('hp1').style.width=P.hp+'%';$('hp2').style.width=E.hp+'%';$('st1').style.width=P.st+'%';$('st2').style.width=E.st+'%';
 const s=Math.max(0,Math.ceil(G.time));$('tm').textContent=S.train?'∞':(s/60|0)+':'+String(s%60).padStart(2,'0');$('rd').textContent=S.train?'ТРЕН.':'R'+G.round+'/3'}
eng.runRenderLoop(()=>{tick(Math.min(eng.getDeltaTime()/1000,.05));sc.render()});
addEventListener('resize',()=>eng.resize());
}catch(e){console.error(e);$('et').textContent='Не удалось запустить WebGL/Babylon.js: '+e.message;show('err',1)}}
</script></body></html>
