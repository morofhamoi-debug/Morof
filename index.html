    body.innerHTML=
      '<div class="mines">'+
        '<div class="mines-top">'+
          '<div class="info">💣 <b id="msMines">'+MINES+'</b></div>'+
          '<div class="info">🚩 <b id="msFlags">0</b></div>'+
          '<div class="info">⏱ <b id="msTime">0</b></div>'+
        '</div>'+
        '<div class="mines-grid" id="msGrid"></div>'+
        '<div class="mines-msg" id="msMsg"></div>'+
        '<button class="btn primary" id="msNew" type="button">Новая игра</button>'+
      '</div>';

    var gridEl=$('#msGrid',body);
    var msg=$('#msMsg',body);
    var minesEl=$('#msMines',body);
    var flagsEl=$('#msFlags',body);
    var timeEl=$('#msTime',body);
    var timer=null,seconds=0;

    function stopTimer(){if(timer){clearInterval(timer);timer=null}}

    function init(){
      stopTimer();seconds=0;timeEl.textContent='0';
      grid=[];revealed=[];flagged=[];started=false;dead=false;won=false;flags=0;moves=0;
      for(var y=0;y<H;y++){
        grid[y]=[];revealed[y]=[];flagged[y]=[];
        for(var x=0;x<W;x++){grid[y][x]=0;revealed[y][x]=false;flagged[y][x]=false}
      }
      msg.textContent='';
      render();
    }

    function placeMines(sx,sy){
      var placed=0;
      while(placed<MINES){
        var x=Math.floor(Math.random()*W);
        var y=Math.floor(Math.random()*H);
        if(grid[y][x]===-1) continue;
        if(Math.abs(x-sx)<=1&&Math.abs(y-sy)<=1) continue;
        grid[y][x]=-1;placed++;
      }
      for(var y=0;y<H;y++)for(var x=0;x<W;x++){
        if(grid[y][x]===-1) continue;
        var c=0;
        for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
          var ny=y+dy,nx=x+dx;
          if(ny>=0&&ny<H&&nx>=0&&nx<W&&grid[ny][nx]===-1) c++;
        }
        grid[y][x]=c;
      }
    }

    function reveal(x,y){
      if(x<0||x>=W||y<0||y>=H) return;
      if(revealed[y][x]||flagged[y][x]) return;
      revealed[y][x]=true;
      if(grid[y][x]===-1){dead=true;return}
      if(grid[y][x]===0){
        for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
          if(dx||dy) reveal(x+dx,y+dy);
        }
      }
    }

    function checkWin(){
      var cnt=0;
      for(var y=0;y<H;y++)for(var x=0;x<W;x++){
        if(revealed[y][x]) cnt++;
      }
      if(cnt===W*H-MINES){won=true}
    }

    function render(){
      gridEl.innerHTML='';
      gridEl.style.gridTemplateColumns='repeat('+W+',30px)';
      for(var y=0;y<H;y++)for(var x=0;x<W;x++){
        var cell=document.createElement('div');
        cell.className='ms-cell';
        if(revealed[y][x]){
          cell.classList.add('open');
          if(grid[y][x]===-1){cell.classList.add('mine','revealed');cell.textContent='💥'}
          else if(grid[y][x]>0){
            cell.textContent=grid[y][x];
            cell.classList.add('n'+grid[y][x]);
          }
        } else if(flagged[y][x]){
          cell.classList.add('flag');
          cell.textContent='🚩';
        }
        if(dead&&grid[y][x]===-1&&!revealed[y][x]){
          cell.classList.add('mine');
          if(!flagged[y][x]) cell.textContent='💣';
        }
        (function(x,y,cell){
          cell.addEventListener('click',function(){onClick(x,y)});
          cell.addEventListener('contextmenu',function(e){e.preventDefault();onFlag(x,y)});
        })(x,y,cell);
        gridEl.appendChild(cell);
      }
      minesEl.textContent=MINES-flags;
      flagsEl.textContent=flags;
    }

    function onClick(x,y){
      if(dead||won) return;
      if(flagged[y][x]) return;
      if(!started){
        started=true;
        placeMines(x,y);
        timer=setInterval(function(){seconds++;timeEl.textContent=seconds},1000);
      }
      reveal(x,y);
      checkWin();
      if(dead){
        stopTimer();
        msg.textContent='💥 Вы проиграли!';
        msg.style.color='var(--danger)';
      } else if(won){
        stopTimer();
        msg.textContent='🎉 Победа!';
        msg.style.color='var(--success)';
      }
      render();
    }

    function onFlag(x,y){
      if(dead||won||revealed[y][x]) return;
      flagged[y][x]=!flagged[y][x];
      flags+=flagged[y][x]?1:-1;
      render();
    }

    $('#msNew',body).addEventListener('click',init);
    init();
  }
};

/* ---------- МЕДИАПЛЕЕР (синтезатор) ---------- */
APPS.media={
  title:'Медиаплеер',icon:I.music,width:400,height:520,singleton:true,
  render:function(body){
    body.innerHTML=
      '<div class="media">'+
        '<div class="media-art" id="mediaArt">'+I.music+'</div>'+
        '<div style="text-align:center">'+
          '<div class="media-title" id="mediaTitle">Синтезатор</div>'+
          '<div class="media-artist" id="mediaArtist">Нажмите клавишу для воспроизведения</div>'+
        '</div>'+
        '<div class="media-keys">'+
          ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].map(function(n,i){
            var freq=[261.63,277.18,293.66,311.13,329.63,349.23,369.99,392.00,415.30,440.00,466.16,493.88][i];
            return '<button data-note="'+n+'" data-freq="'+freq+'">'+n+'</button>';
          }).join('')+
        '</div>'+
        '<div class="media-ctrl">'+
          '<button data-act="play" class="play">'+I.play+'</button>'+
          '<button data-act="stop">'+I.pause+'</button>'+
        '</div>'+
      '</div>';

    var audioCtx=null;
    var current=null;

    function getCtx(){
      if(!audioCtx){
        try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
      }
      return audioCtx;
    }

    function playNote(freq,btn){
      var ctx=getCtx();
      if(!ctx) return;
      if(ctx.state==='suspended') ctx.resume();
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.type='sine';
      osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.0001,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+1.0);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start();osc.stop(ctx.currentTime+1.05);
      if(current) current();
      var on=setTimeout(function(){if(btn)btn.classList.remove('on')},200);
      current=function(){clearTimeout(on)};
      if(btn){btn.classList.add('on');setTimeout(function(){btn.classList.remove('on')},180)}
      var art=$('#mediaArt',body);
      if(art){art.classList.add('playing');setTimeout(function(){art.classList.remove('playing')},400)}
    }

    body.querySelectorAll('[data-note]').forEach(function(b){
      b.addEventListener('click',function(){playNote(parseFloat(b.getAttribute('data-freq')),b)});
    });

    var playBtn=$('[data-act="play"]',body);
    var stopBtn=$('[data-act="stop"]',body);
    var autoplayTimer=null;
    playBtn.addEventListener('click',function(){
      if(autoplayTimer){
        clearInterval(autoplayTimer);autoplayTimer=null;
        playBtn.innerHTML=I.play;
        return;
      }
      playBtn.innerHTML=I.pause;
      var i=0;
      var seq=[261.63,293.66,329.63,349.23,392.00,349.23,329.63,293.66];
      autoplayTimer=setInterval(function(){
        playNote(seq[i%seq.length]);
        i++;
      },400);
      playNote(seq[0]);
    });
    stopBtn.addEventListener('click',function(){
      if(autoplayTimer){clearInterval(autoplayTimer);autoplayTimer=null}
      playBtn.innerHTML=I.play;
      if(audioCtx&&audioCtx.state==='running') audioCtx.suspend();
    });

    // Клавиатура
    var keyMap={'a':0,'w':1,'s':2,'e':3,'d':4,'f':5,'t':6,'g':7,'y':8,'h':9,'u':10,'j':11};
    var freqs=[261.63,277.18,293.66,311.13,329.63,349.23,369.99,392.00,415.30,440.00,466.16,493.88];
    function onKey(e){
      if(e.repeat) return;
      if(!document.body.contains(body)){document.removeEventListener('keydown',onKey);return}
      var k=e.key.toLowerCase();
      if(k in keyMap){
        playNote(freqs[keyMap[k]]);
        e.preventDefault();
      }
    }
    document.addEventListener('keydown',onKey);
  }
};

/* ============================================================
   ЧАСЫ И ТРЕЙ
   ============================================================ */
var clockEl=$('#clock');
var dateSmall=$('#dateSmall');
var lockTime=$('#lockTime');
var lockDate=$('#lockDate');

var WEEKDAYS=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function tick(){
  var d=new Date();
  var hh=String(d.getHours()).padStart(2,'0');
  var mm=String(d.getMinutes()).padStart(2,'0');
  var ss=String(d.getSeconds()).padStart(2,'0');
  clockEl.textContent=hh+':'+mm+':'+ss;
  dateSmall.textContent=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
  if(lockTime){
    lockTime.textContent=hh+':'+mm;
    lockDate.textContent=WEEKDAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()];
  }
}

/* Календарь */
var calPopup=$('#calPopup');
var calMonth=new Date();
function renderCal(){
  var y=calMonth.getFullYear(),m=calMonth.getMonth();
  var title=$('#calTitle');
  title.textContent=MONTHS[m].charAt(0).toUpperCase()+MONTHS[m].slice(1)+' '+y;
  var grid=$('#calGrid');
  grid.innerHTML='';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(function(d){
    var e=document.createElement('div');
    e.className='cd hd';e.textContent=d;
    grid.appendChild(e);
  });
  var first=new Date(y,m,1);
  var startDay=(first.getDay()+6)%7;
  var daysInMonth=new Date(y,m+1,0).getDate();
  var prevDays=new Date(y,m,0).getDate();
  var today=new Date();
  for(var i=0;i<startDay;i++){
    var e=document.createElement('div');
    e.className='cd other';e.textContent=prevDays-startDay+1+i;
    grid.appendChild(e);
  }
  for(var d=1;d<=daysInMonth;d++){
    var e=document.createElement('div');
    e.className='cd';
    if(d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear()) e.classList.add('today');
    e.textContent=d;
    grid.appendChild(e);
  }
  var total=startDay+daysInMonth;
  var remaining=(7-total%7)%7;
  for(var i=1;i<=remaining;i++){
    var e=document.createElement('div');
    e.className='cd other';e.textContent=i;
    grid.appendChild(e);
  }
}
$('#calPrev').addEventListener('click',function(e){e.stopPropagation();calMonth.setMonth(calMonth.getMonth()-1);renderCal()});
$('#calNext').addEventListener('click',function(e){e.stopPropagation();calMonth.setMonth(calMonth.getMonth()+1);renderCal()});
$('#clockBtn').addEventListener('click',function(e){
  e.stopPropagation();
  if(calPopup.classList.contains('open')) calPopup.classList.remove('open');
  else {renderCal();calPopup.classList.add('open')}
});
document.addEventListener('click',function(e){
  if(!calPopup.classList.contains('open')) return;
  if(e.target.closest('#calPopup')||e.target.closest('#clockBtn')) return;
  calPopup.classList.remove('open');
});

/* ============================================================
   ALT+TAB ПЕРЕКЛЮЧАТЕЛЬ
   ============================================================ */
var switcher=$('#switcher');
var swIdx=0;
var swOpen=false;

function openSwitcher(){
  if(wins.length===0) return;
  swOpen=true;
  swIdx=Math.min(swIdx,wins.length-1);
  renderSwitcher();
  switcher.classList.add('open');
}
function renderSwitcher(){
  switcher.innerHTML='';
  wins.forEach(function(w,i){
    var app=APPS[w.appId];
    var el=document.createElement('div');
    el.className='sw-item'+(i===swIdx?' on':'');
    el.innerHTML=(app.icon||'')+'<span>'+esc(w.title||app.title)+'</span>';
    el.addEventListener('click',function(){
      closeSwitcher();
      if(w.minimized){w.minimized=false;w.el.style.display=''}
      focusWin(w.id);
    });
    switcher.appendChild(el);
  });
}
function closeSwitcher(){
  swOpen=false;
  switcher.classList.remove('open');
  if(wins[swIdx]){
    var w=wins[swIdx];
    if(w.minimized){w.minimized=false;w.el.style.display=''}
    focusWin(w.id);
  }
}

document.addEventListener('keydown',function(e){
  if(e.altKey&&e.key==='Tab'){
    e.preventDefault();
    if(!swOpen){
      openSwitcher();
    } else {
      swIdx=(swIdx+1)%wins.length;
      renderSwitcher();
    }
  }
  if(e.key==='Escape'&&swOpen){closeSwitcher()}
});
document.addEventListener('keyup',function(e){
  if(e.key==='Alt'&&swOpen){closeSwitcher()}
});

/* Горячие клавиши */
document.addEventListener('keydown',function(e){
  // F2 — переименовать выделенную иконку
  if(e.key==='F2'){
    var sel=Object.keys(deskSelected)[0];
    if(sel) startIconRename(sel);
  }
  // Del — удалить выделенное
  if(e.key==='Delete'){
    var sel=Object.keys(deskSelected);
    if(sel.length){
      sel.forEach(function(n){
        fsDelete(DESKTOP_PATH+'/'+n);
        delete deskSelected[n];
        delete deskPositions[n];
      });
      saveDeskPositions();
      renderDesktop();
      toast('Удалено','Объектов: '+sel.length);
    }
  }
  // Ctrl+Shift+Esc — диспетчер задач
  if(e.ctrlKey&&e.shiftKey&&(e.key==='Escape'||e.key==='Esc')){
    e.preventDefault();
    openApp('taskmgr');
  }
  // Meta — старт
  if(e.key==='Meta'){
    e.preventDefault();
    if(startMenu.classList.contains('open')) hideStart();
    else showStart();
  }
});

function lockScreen(){

  lock.classList.remove('hidden');
  closeAllWins();
  hideStart();
}
function unlockScreen(){
  var lock=$('#lock');
  lock.classList.add('hidden');
}
$('#lockUser').addEventListener('click',unlockScreen);
document.addEventListener('keydown',function(e){
  if($('#lock').classList.contains('hidden')) return;
  if(e.key==='Enter'||e.key===' '||e.key==='Escape'){unlockScreen();e.preventDefault()}
});

/* ============================================================
   ПЕРЕЗАГРУЗКА
   ============================================================ */
function restart(){
  closeAllWins();
  hideStart();
  var lock=$('#lock');
  lock.classList.add('hidden');
  var boot=$('#boot');
  boot.classList.remove('hidden');
  var bar=$('.boot-bar span',boot);
  if(bar){bar.style.animation='none';void bar.offsetWidth;bar.style.animation=''}
  setTimeout(function(){
    boot.classList.add('hidden');
    lock.classList.remove('hidden');
  },settings.bootTime||2400);
}

/* ============================================================
   ЗАПУСК СИСТЕМЫ
   ============================================================ */
function boot(){
  var bootEl=$('#boot');
  var statusEl=$('#bootStatus');
  var messages=['Инициализация ядра…','Загрузка файловой системы…','Запуск служб…','Подготовка рабочего стола…','Почти готово…'];
  var i=0;
  var iv=setInterval(function(){
    i++;
    if(i<messages.length) statusEl.textContent=messages[i];
    else clearInterval(iv);
  },420);

  setTimeout(function(){
    bootEl.classList.add('hidden');
    var lock=$('#lock');
    lock.classList.remove('hidden');
    tick();
    applySettings();
    renderDesktop();
    setTimeout(function(){unlockScreen()},200);
  },settings.bootTime||2400);
}

applySettings();
tick();
setInterval(tick,1000);
renderDesktop();
renderTasks();

boot();
